[[bounds]]
text = '''DeploymentCAS checks two Deployments, two replicas and one representative scheduled occurrence through revision three; ClaimAndRunCommitAtomically requires the abstract claim and run sets to remain equal. DeploymentExecutionWorkflow separately checks one bounded occurrence from due scheduling through claim, run creation, launch and terminal state. Neither model implies a universal Rust-to-model refinement.'''

[[bounds]]
text = '''DeploymentApplication is the sole scheduling owner and DeploymentRepository::claim_scheduled_run is the sole durable claim port. The scheduler submits one stable deployment/instant claim identity, observed revision, complete successor Deployment, first DeploymentRun and lifecycle fact. It publishes and launches only after Claimed; AlreadyClaimed and StaleDeployment discard the speculative run and refresh from durable authority.'''

[[bounds]]
text = '''Both SQL adapters hold one database transaction across exact revision fencing, unique claim insertion, run insertion, complete Deployment revision update and lifecycle fact insertion. Any statement error rolls back the whole unit; a claim-id conflict returns AlreadyClaimed without publishing a successor. SQLite uses BEGIN IMMEDIATE and PostgreSQL locks the Deployment row FOR UPDATE.'''

[[bounds]]
text = '''The canonical cross-backend decision table first forces run insertion failure with a duplicate durable run id. It requires the complete Deployment and lifecycle outbox to remain unchanged, then reuses the same claim identity with a distinct run and requires Claimed plus the exact successor Deployment/run/fact tuple. It also rejects a stale replica's distinguishable Deployment/run/fact and proves that rejected claim identity remains reusable. SQLite executes through independent file connections and verifies the committed tuple plus failed-fact absence after every handle closes and a fresh connection reopens; configured PostgreSQL executes the identical table in pg_tests.sh.'''

[[bounds]]
text = '''These executions sample concrete failure points and adapter schedules; they do not prove arbitrary SQL errors, process crashes, response loss, all client counts or Tokio schedules. SQLite/PostgreSQL transaction, lock, uniqueness, rollback and durability semantics remain database TCB. A PostgreSQL test skipped because no endpoint is configured is not live PostgreSQL evidence.'''
