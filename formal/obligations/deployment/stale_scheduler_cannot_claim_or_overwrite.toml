[[bounds]]
text = '''DeploymentCAS checks two Deployments, two replicas, one representative occurrence per Deployment and revisions through three. StaleWrite and StaleClaim preserve the complete Deployment, claim and run frames; no Rust-to-model refinement is implied.'''

[[bounds]]
text = '''DeploymentApplication is the sole scheduler owner and DeploymentRepository::claim_scheduled_run is the sole durable claim port. The scheduler submits its observed revision with one complete successor Deployment, Run and lifecycle fact. Only Claimed publishes the successor working projection and launches; AlreadyClaimed or StaleDeployment removes the speculative run and refreshes from durable authority.'''

[[bounds]]
text = '''The canonical shared repository decision table executes through three distinguishable clients. After a current scheduler commits revision two, an independent stale client submits revision one with a distinct overwrite payload, run and outbox fact. Every client must retain the exact revision-two winner, and the stale run/fact must be absent. A third current client then reuses the rejected claim id and must commit revision three, proving the stale transaction did not reserve the claim identity. The former SQLite-only duplicate repository test in DeploymentApplication was removed; its winner-frame assertion now lives in this cross-backend owner.'''

[[bounds]]
text = '''SQLite uses three independently opened file connections, then closes every handle and reopens the database to require the exact revision-three frame and only the two valid runs. Configured PostgreSQL uses three repository clients against one migrated schema and executes the same table in the required pg_tests.sh database gate. The strict formal gate also runs the real two-DeploymentApplication scheduler race plus the SQLite repository table.'''

[[bounds]]
text = '''These are concrete adapter and executor schedules, not a universal database or async proof. SQLite locking, PostgreSQL row-lock semantics, transaction rollback/durability, arbitrary scheduler counts, process crash coordinates, Tokio scheduling and eventual retry remain executable or TCB boundaries. Direct Kani over revision arithmetic would not prove these SQL and async effects.'''
