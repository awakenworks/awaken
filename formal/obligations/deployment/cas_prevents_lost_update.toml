[[bounds]]
text = '''DeploymentCAS checks a finite two-Deployment/two-replica state space through revision three. Its Write transition advances only a replica observation equal to the current abstract revision. This is an abstract no-lost-update result; no Rust-to-model refinement is implied.'''

[[bounds]]
text = '''DeploymentApplication owns commands and a refreshable working projection, while DeploymentRepository is the sole durable write port. Every mutation submits the complete successor frame plus its observed revision. Applied publishes the new projection; Conflict preserves durable state and tells the caller to retry the command from a fresh read; ScheduledCapacityReached is a separate terminal admission result.'''

[[bounds]]
text = '''The production linearization owner is the conditional database mutation in awaken-session-store. SQLite executes capacity admission, INSERT-or-revision-UPDATE, and lifecycle outbox insertion in one BEGIN IMMEDIATE transaction. PostgreSQL retains its cooperative transaction advisory lock for capacity and a final deployment-id/revision predicate; business row and lifecycle fact commit together. Creation is primary-key insert-only in both adapters.'''

[[bounds]]
text = '''The shared conformance decision table drives three distinguishable writers through independent repository clients against revision zero, requires one Applied and two Conflict outcomes, verifies all clients read the exact winner frame and only its lifecycle fact, then exercises claim/run advancement. SQLite uses three independent file connections and verifies the advanced Deployment and one run after every handle closes and the database reopens. The PostgreSQL rule uses three repository clients when its configured live endpoint is reachable.'''

[[bounds]]
text = '''These executions sample concrete adapter/executor schedules; they are not a universal database proof. Direct Kani over is_exact_revision_step would prove only candidate arithmetic after a write has already been linearized. It would not execute transaction isolation, conditional SQL, unique keys, async scheduling, process failure, arbitrary replica counts, or database durability. A PostgreSQL test skipped because no endpoint is configured is not a live PostgreSQL pass.'''
