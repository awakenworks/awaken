[[bounds]]
text = '''The direct Kani harness exhausts all eight combinations of cancellation, model-journal failure and physical-quiescence acknowledgement by calling the sole production checkpoint-retirement admission kernel. It proves that retirement is admitted exactly for an unvetoed local return; it does not execute the asynchronous store delete.'''

[[bounds]]
text = '''The production inference owner awaits StreamCheckpointStore::delete for the exact current Run id before releasing its result. A delete error enters the existing InferStepOutcome::EvidenceUnavailable to Error::Commit path, bypassing model failover, inference-failure tolerance and terminal finish. The full Runtime failure-injection test cross-checks exact Run-id deletion, propagated storage error, retained checkpoint and absence of committed assistant output; two exact source mutants qualify both await-error propagation and the fail-closed mapping.'''

[[bounds]]
text = '''Existing Memory, fenced and PostgreSQL adapter tests provide executable delete/idempotency and fencing evidence. Kani does not prove async polling, store implementation truth, filesystem or database durability, crash timing, or universal Rust-to-TLA refinement. The scoped direct guarantee is that explicit delete failure cannot publish this terminal Runtime result; successful physical deletion and its persistence remain adapter/TCB boundaries.'''
