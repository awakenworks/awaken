[[bounds]]
text = '''CheckpointRecovery model checking is finite at MaxChunks=3. Its CrashPreservesDurableTruth invariant says only that the abstract committed durable prefix is unchanged by Crash; FlushCheckpoint is an atomic abstract action. It does not model filesystem calls, database transactions, write errors or a mechanical Rust-to-TLA refinement.'''

[[bounds]]
text = '''StreamCheckpointStore is the single Runtime port for the mutable uncommitted stream tail, while CommitCoordinator remains the authority for committed Thread truth. The filesystem adapter writes a unique sibling temp, fsyncs it, atomically renames it and fsyncs the directory; a shared CrashProcess test kills a separate process immediately after acknowledged overwrite and delete, then a fresh adapter observes exactly the acknowledged state. Exact source mutants removing the rename or deleting a different key fail the same test. Existing SQLite process-kill evidence preserves a committed prefix and rejects an uncommitted transaction after reopen.'''

[[bounds]]
text = '''PostgreSQL checkpoint and CommitCoordinator restart tests are executable adapter evidence and may skip when AWAKEN_TEST_DATABASE_URL is absent; they are not direct proof. Runtime deliberately warns and continues when a checkpoint put fails, so an unacknowledged stream partial is not durable truth and is not covered by this row. Kernel and filesystem rename/fsync semantics, storage hardware and caches, PostgreSQL transaction/WAL durability, driver behavior, crashes inside an unacknowledged operation, asynchronous scheduling and successful replacement recovery remain external or TCB boundaries.'''
