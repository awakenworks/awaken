[[bounds]]
text = '''CheckpointRecovery explores MaxChunks=3, five entry classes, four predecessor evidence classes, and pending, absent, exact, storage, fenced, Run/Thread mismatch, cancelled and expired reads. Unknown observations cannot execute, delete checkpoints or acknowledge physical return; reads including a pending store settle under fair local timer/scheduler progress. Fifteen semantic mutations and fourteen reachability witnesses qualify the finite model; physical control ACK must follow the complete control observation, not merely the backend cancel callback.'''

[[bounds]]
text = '''The canonical production chain is CommitCoordinator acknowledgement, a frozen CommittedThreadView state prefix, ActiveModelOperation::recorded reconstruction, recover_checkpoint observation, then the private RecoveryObservation::Ready branch before Native execution or resume effects. The existing model_execution_reentry_requires_positive_evidence Kani harness exhausts the production three-valued predecessor gate, checkpoint presence and every local phase; this is independent direct evidence for the scalar admission decision, not a proof that persistence supplied an authentic complete committed prefix or that every asynchronous caller consumes it.'''

[[bounds]]
text = '''The Runtime filesystem decision table persists an exact checkpoint and independently persists or omits the Terminated predecessor through FsCommitCoordinator, drops both owners, then reopens both production adapters. The missing-commit row returns Indeterminate with zero model calls and retains the partial; only the acknowledged and reopened predecessor row makes one continued request, commits the stitched response and retires the partial. Existing Runtime tables cross storage/fence/foreign identity/cancellation/deadline observations with predecessor evidence and cover tool handoff and control paths; an exact source mutant that acknowledges the predecessor only in memory is rejected by the reopen table and restored byte-for-byte.'''

[[bounds]]
text = '''Filesystem and database durability, complete committed-prefix authenticity, kernel fsync semantics, hardware caches, PostgreSQL transaction/WAL behavior, concurrent process ownership, Tokio polling/timer delivery, caller consumption of the private observation, remote termination and universal Rust-to-TLA refinement remain adapter, runtime or external TCB boundaries. The obligation therefore remains abstract_model_checked rather than being promoted from the narrower scalar Kani result.'''
