[[bounds]]
text = '''New/no-Run Worker, revision Worker and acknowledgment acquisition borrows the Session application's existing admission executor. The complete prepared activation has a separate command digest domain and prepared dispatch identity kind. A transient typed admission cause distinguishes the Session owner's durable refusal from undecided admission before controller display projection: only the durable refusal commits existing Errored(WorkerFailed) through the existing head CAS. The native controller table crosses the three acquisition phases with closed, deferred and same-text ordinary executor errors. This statement names executable source, not a receipt that those tests ran. Historical committed-Run reuse and the Grader's separate fresh Thread remain unchanged and do not acquire retroactive root-activity evidence. The abstract OutcomeLifecycle model does not model those receipts, Rust diagnostics, Dispatch transactions or SQL refinement.'''

[[bounds]]
text = '''OutcomeLifecycle checks MaxIterations=3 with finite phase/result/grade domains. StableRunIdentity constrains abstract Worker, Grader and evaluated iteration sets, while AcknowledgmentExactlyOnce constrains the capped acknowledgment phase and count to zero before acknowledgment and one at max_iterations_reached. ReplayOrStaleVersion is an abstract stutter. The model does not contain Rust identifiers, commit payloads, stores, executor responses or a Rust-to-model refinement.'''

[[bounds]]
text = '''awaken-ext-goal::Controller is the sole Outcome lifecycle and acknowledgment owner. ThreadOutcomeState projects the aggregate from one committed Thread prefix and writes through the existing CommitOperationCoordinator with Thread-version CAS. Its production worker_run_id, grader_thread_id, grader_run_id and acknowledgment_run_id functions derive the only role-separated logical identities; Runtime Host supplies locks, Run execution composition and projection without a second Outcome state machine or repository.'''

[[bounds]]
text = '''The existing Runtime Host outcome-state test executes the production identity functions twice for the same Outcome/role/iteration and across different Outcomes, iterations and Worker/Grader/acknowledgment roles, requiring byte-stable equality only in the exact partition and distinct identities in every changed partition.'''

[[bounds]]
text = '''The extension controller's deterministic native decision table drives the capped Grade into Acknowledging, commits the exact acknowledgment Run and its transcript, then loses the executor response before the Outcome head commit. A replacement controller must observe that same terminal Run, complete without a second execution or transcript pair, return the original preparation coordinate for an exact command replay, reject a changed definition without a commit, and make a duplicate completed continuation inert.'''

[[bounds]]
text = '''Outcome state commits reuse the contract-owned canonical payload hash, operation identity and replay/CAS decisions. The existing operation_identity_replays_only_the_same_run_and_payload Kani harness exhausts the scalar new/replay/run-mismatch/receipt-mismatch/payload-mismatch classes. The sole shared commit_operation_is_idempotent_and_cas conformance rule exercises exact receipt replay, changed payload rejection and stale-version stuttering through Memory, filesystem, SQLite and configured live PostgreSQL bindings; Outcome adds no adapter-specific copy.'''

[[bounds]]
text = '''The native acknowledgment schedule and backend conformance executions do not prove every crash point, arbitrary concurrent controller schedule, CommittedThreadView/RunRecoverySource freshness, executor or provider exactly-once behavior, filesystem or database durability, process termination, network delivery, or a universal implementation refinement. Exactly once here means one committed logical acknowledgment Run/transcript and one terminal Outcome transition under the named stable identities and commit fences; a physical provider call can remain indeterminate until committed Run truth is observable.'''
