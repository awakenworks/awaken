[[bounds]]
text = '''One finite Kani harness enumerates all 72 provider, bucket-shape, prefix-shape, region-shape and endpoint-presence combinations in the private production decision kernel. Three bounded harnesses verify production classifier functions directly: zero-to-two bytes over ASCII space/name for bucket and region blankness, zero-to-three bytes over ASCII slash/name for prefix shape, and five dot-segment prefix examples. Three further bounded harnesses call the production object_store_config_decision with borrowed raw representatives: empty/named bucket x missing/malformed/normalized prefix; absent/blank/named S3 region x endpoint presence; and absent/blank/named GCS region x endpoint presence. ObjectFileStoreConfig::validate delegates to that same shape classifier and decision kernel, then maps the decision to FileStoreError. Executable decision-table tests check the full 2-provider x 4-region x 2-endpoint cross-product, exact InvalidConfiguration outcomes including empty-but-present GCS endpoint and overlapping-error priority, exhaustive short ASCII bucket and prefix classification against the original string rules, and Unicode examples. Length is not an admission threshold: production classifies trim emptiness, slash-separated segment shape and Option presence. These proofs do not quantify arbitrary UTF-8 strings, longer repeated segments, the full Cartesian product of raw-input axes, or the error mapping itself. Provider SDK credential discovery, bucket policy and remote durability remain external.'''
