[[bounds]]
text = '''Kani directly invokes the actual logical-deletion read decision over every combination of root presence, exact Session id, exact owner, hidden disposition, terminal execution and positive owner-scoped tombstone presence. Current roots dominate tombstones; missing rows without a tombstone never prove deletion. Default checks retained; 0 of 3 failed.'''

[[bounds]]
text = '''The observer derives those values from the original Session repository under the existing bounded projection-read budget. Producer and observers use one deterministic immutable deletion-frame renderer; root cleanup timestamps are not fabricated as deletion completion observations. HTTP tests cover cache removal after subscription before body polling and another independent replica without local broadcast, reconnect or command resend.'''

[[bounds]]
text = '''The proof is scalar logical deletion, not physical quiescence or full async/storage refinement. Repository codec/owner-partition honesty, cross-read consistency, hashing and transport scheduling remain executable evidence or TCB. Native tests reject visible roots, wrong owners and bare absence.'''
