[[bounds]]
text = '''The sole async reducer now returns one typed Error, changed-prefix Retry, or Complete candidate to the canonical publication owner. Kani exhausts those variants with arbitrary warm and candidate result/checkpoint bytes: Error preserves the exact error and exposes no publish effect, Retry stutters, and only Complete transfers one owned pair. Production builds exclusively on a cloned SessionRecord and consumes this kernel before entering the existing cache CAS; the cause/effect regression compares the complete warm projection before and after a late correlation failure.'''

[[bounds]]
text = '''Repository and Runtime read consistency, async cancellation/unwind, serde and projection-helper correctness, Mutex behavior and broadcast delivery remain executable/runtime TCB. The proof establishes the production pre-publication effect boundary and whole-value install, not correctness of every async source read or external store.'''

[[bounds]]
text = '''The same obligation retains its existing elapsed-budget entrypoint, ManagedProjectionPublish model and full-frame native read-cut table. The 48 cut/writer schedules and stable/error/continuous-advance/stalled-I/O budget cases are complementary executable evidence; the timeout encloses refresh attempts after ensure_session_record, and neither the scheduler nor a strict end-to-end two-second deadline is proved by the candidate-publication kernels. Historical native mutation qualifications remain tied to their archived production source rather than being requalified by this ledger-link repair.'''
