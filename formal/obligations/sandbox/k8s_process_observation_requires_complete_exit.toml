[[bounds]]
text = '''Provider-only model: three Pod generations, two non-restarting containers and one original frozen binding per generation. Absorbing exact Registry closure is an interface premise, qualified separately by the Registry kernel and HTTP adapter tests, not a second Registry model. Separate authentication with immutable Pod-UID incarnation, binding-time retention, retention loss, exact conditional stop requests, complete exit, absence, controller-synthesized failure and name reuse are explored. Sixteen unsafe-evidence mutants and six positive observation/stop witnesses are checked. The stopper requires accepted exact deletion intent even when all processes exited before recovery; a subsequent read must establish both closure and complete exit. An accepted stop request alone is not an exit receipt. Authenticated API, UID/resourceVersion conditional deletion, kubelet/runtime status honesty, private PID confinement and Never-restart semantics remain trusted premises. Mock API tests cover before/after-acceptance response loss, caller disappearance, CAS conflicts, retention loss, legacy wire compatibility and exact identity/profile rejection; stop faults are crossed with exit-before-stop, and Completed/Error/OOMKilled cover the natural-exit regression. Earlier real k3d covers CRI hard crash, independent provider stop, same-name replacement and rejected stale deletion. On 2026-09-09 the full KPT1-KPT10 case passed on real rootful k3d at a62b3895b, including all-exited-before-stop. The CLI real TokenReview/HTTP/reopened-SQLite independent-stop case also passed while retaining the unknown-remote occupancy veto. The earlier disk-capacity and rootless cpuset bootstrap failures were resolved for this qualification by relocating only this worktree's Cargo intermediates; no admission threshold or provider assertion was weakened. Supported non-restarting Worker Pods must install retention before admission; the k3d crash fixture does so, and the application releases it only after an exact immutable Registry receipt; the production Registry admission kernel is exhaustively proved across 32 Boolean rows. SQL atomicity, Kubernetes API honesty, arbitrary Rust/SDK refinement, remote termination, missing-history reconstruction and complete Native crash recovery remain unproved.'''

[[bounds]]
text = '''Coordinator composition closes only the exact expired bound predecessor before independent process-stop IO. Real HTTP tests exercise Memory, SQLite and configured PostgreSQL Registry adapters, timeout/retry, concurrent observations and late replies without releasing physical occupancy. CLI mock-API tests exercise the selected authenticated provider, frozen coordinate validation and local-only exit classification. The gated CLI k3d case uses real Pod-bound TokenRequest/TokenReview and Worker HTTP clients, reopens SQLite Registry/Dispatch, removes the old token, and independently observes the original stopped process while preserving the remote veto. Its sleep Pods and HTTP task restart qualify only the independent stop boundary. The private stop command is not deserializable or constructible by wire callers. Production Native additionally supports the closed ModelOnlyV1 profile: a pre-effect Run marker excludes tools, authored or Session plugins, hooks, actions, guards, gates, constraints and dynamic tools; exact committed coordinates and terminal/not-dispatched evidence are required for every model operation after independently proven Pod exit. Kani exhausts the 16 scalar fact combinations. Runtime tests cover marker ordering, closed-surface eligibility and fail-closed widening. On 2026-09-10 the eleven-stage k3d suite hard-stopped a real Pod-bound Native Worker and settled the same committed result through a new Pod UID without replaying the provider request; that run also passed PostgreSQL primary promotion and 48/48 requests at concurrency 12. Tool/plugin/ACP/A2A surfaces, opaque provider cancellation, Kubernetes/container-runtime honesty and universal Rust-to-model refinement remain unproved.'''
