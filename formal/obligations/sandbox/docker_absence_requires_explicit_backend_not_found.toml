[[bounds]]
text = '''Direct Kani proof invokes the unchanged production docker_not_found classifier over every u16 HTTP status and the independent transport-timeout error variant. It passes 608 checks with zero failures and six unreachable checks under unwind 2. Only an explicit 404 is absence; no API-error message or transport timeout can stand in for it.'''

[[bounds]]
text = '''The actual Bollard/Axum decision table covers remove acknowledgment, exact-ID 404, 409 with Removing then absence, foreign identity, running/missing state, unauthorized/forbidden/backend outage, a bounded pending deadline, mutable-name-to-ID freezing and invalid identity with zero effects. Real Docker suites separately exercise disposal, retention, mounts, network denial, process and pool behavior.'''

[[bounds]]
text = '''The proof is solely the response classifier. Request addressing, async scheduling, timeout/cancellation wiring, daemon state honesty and physical deletion are executable or external boundaries. No whole Docker removal or Rust-to-model refinement claim is made.'''
