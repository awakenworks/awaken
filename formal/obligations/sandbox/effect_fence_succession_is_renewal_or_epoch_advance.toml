text = '''Kani exhausts the full-width u64 epoch/expiry coordinates and the exact-lease bit of the fence_succession kernel that FenceToken::succession and authorizes_successor call: a successor is a Reassignment only for a strictly higher epoch, a Renewal only for the exact lease with non-regressed expiry, and rejected otherwise. The proof does not establish that providers compare the persisted backend fence under their own CAS (marker lock, resourceVersion, labels) or that operation identity is checked by the owning effect; those are covered by the provider decision-table tests.'''
