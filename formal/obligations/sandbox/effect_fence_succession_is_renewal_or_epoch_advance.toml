[[bounds]]
text = '''Kani calls Lease::succession over two leases with symbolic u8 subjects and holders, full-width nonzero u64 epochs and full-width u64 millisecond expiries, so the subject, tenure and expiry comparisons are the ones production derives before the shared fence_succession kernel (also called by EffectFence and FenceToken::succession): a successor for another subject is never a succession, a Reassignment only for the same subject at a strictly higher epoch, a Renewal only for the exact tenure (subject, holder, epoch) with non-regressed expiry, and rejected otherwise. FenceToken implementors carry no subject coordinate on their persisted wire and pass same_subject=true: their subject is the record the token is read from. The proof does not establish that providers compare the persisted backend fence under their own CAS (marker lock, resourceVersion, labels) or that operation identity is checked by the owning effect; those are covered by the provider decision-table tests.'''
