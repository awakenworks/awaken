[[bounds]]
text = '''Kani exhausts the production DispatchTransition state, full u64 current/candidate epoch and attempt-count domains, owner equality, and all four physical-attempt slot classes without assumptions. Only an exact current Leased claim can transition; every applied Pending or Recovering result carries the unchanged retry budget.'''

[[bounds]]
text = '''Memory, SQLite, and PostgreSQL read attempt_count with the claim evidence under their existing aggregate lock or row transaction, consume the same reducer, and write back only its returned value. Mutex/row-lock exclusion, SQL compare-and-set execution, database durability, clocks, and adapter decoding remain native-conformance or TCB evidence rather than Kani claims.'''
