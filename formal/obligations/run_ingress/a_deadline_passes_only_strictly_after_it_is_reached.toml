[[bounds]]
text = '''Kani exhausts the production deadline_has_passed kernel over every Option<u64> deadline and u64 now. The comparison is exclusive, so a lease minted for a non-zero duration is never already expired, and an absent deadline never passes. The SQL query predicates that select expired rows in bulk restate this rule in SQL and are covered by the executable conformance suite, not by this proof.'''
