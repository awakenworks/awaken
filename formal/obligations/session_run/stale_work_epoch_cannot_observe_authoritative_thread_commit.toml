[[bounds]]
text = '''The canonical SessionRunProtocol retains its existing full three-Run, two-Worker, three-epoch model-checking evidence. A dedicated local action wrapper keeps that same constant domain and reuses ObserveCommittedRun verbatim over complete current commit-ready and stale-reclaimed Work source-state cuts. Its action property requires every first committed observation to use the exact current Dispatch owner/epoch and Work realization; removing only the observation's CurrentRealization guard must fail, while the stale cut must be reachable.'''

[[bounds]]
text = '''Pinned TLC 2.19 checked the dedicated baseline with 6 generated and 6 distinct states at depth 2, killed the exact realization-guard mutant through only CommittedObservationUsesExactCurrentRealization after 6 generated and 6 distinct states at depth 2, and reached the stale-cut witness in the initial states. Each case finished in under one second with 139460, 138660, and 133292 KiB maximum RSS respectively; the guarded sequence used 159188 KiB peak aggregate RSS and retained at least 46381348 KiB MemAvailable.'''

[[bounds]]
text = '''The production Session Work receipt is minted only from the canonical SessionWorkerLeaseAuthority acquisition and carries Session, registered-Worker incarnation, Work, Environment, and epoch coordinates. Claim transports that opaque assertion through realization and recovery. Each endpoint holds the exact Dispatch guard, re-reads canonical Work with RealizationRenewal, checks every stable coordinate, and rejects before Session realization or RunRecoverySource committed-Thread access. The HTTP decision table obtains the receipt through the real claim endpoint and observes zero recovery reads for missing authority, authority outage, foreign Session or incarnation, wrong Work or Environment, and same-owner epoch ABA.'''

[[bounds]]
text = '''Kani proves the production receipt's minting and cross-kind branches: the sole minting door checks four symbolic Session/owner rows, refuses unowned Work, and a leased receipt cannot match Work-free or unowned while a Work-free receipt matches only Work-free. The full symbolic String-bearing leased-tenure equality exceeded the 1800-second Kani batch limit; a single concrete mismatch exceeded a 120-second targeted limit, so no Kani claim is made for the five stable coordinates. The existing executable test calls the production matcher for all 64 combinations of Session, owner, Work id, Environment, epoch and expiry, including every cross-coordinate combination and both expiry states; other rows cover real identifier lengths and wire decoding. This is exhaustive over the stated finite representative table, not a universal string-equality proof.'''

[[bounds]]
text = '''This grade is limited to registered-Session recovery observation and realization admission. Work and Thread persistence do not share a transaction: database row-lock and transaction correctness, lease expiry and explicit revocation after validation, Tokio scheduling, the recovery source's committed snapshot consistency, authentication, and network delivery remain TCB. The model is bounded and there is no universal Rust-to-TLA or SQL refinement proof; eventual progress after external failure is outside this safety claim.'''
