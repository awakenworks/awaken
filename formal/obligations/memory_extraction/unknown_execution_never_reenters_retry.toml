[[bounds]]
text = '''One stable auxiliary Run and at most two extraction claims. Five semantic mutants and two reachability witnesses check that crash recovery re-observes the same Run and that a typed unknown becomes a non-recoverable terminal without fabricated mutations, receipts, Run replacement or later invocation.'''

[[bounds]]
text = '''The controller consumes one production failure-action owner before changing the intent: every typed execution-indeterminate failure selects the distinct attention terminal for every u32 attempt and maximum pair, while only an in-budget Retryable selects Retry. MemoryExtractionStatus is the sole terminal/recoverable and storage-name owner; claim admission and both SQLite/PostgreSQL recovery queries consume its fail-closed positive recoverable set.'''

[[bounds]]
text = '''Kani exhausts all three failure classes, every u32 attempts/max pair and all seven closed statuses with no user assumptions or stubs. The same production harness now also calls the binding-failure mapper for all nine typed MemoryExtractionError variants: unavailable/storage observations may enter only the existing bounded retry policy, while no binding observation can manufacture execution-indeterminate work. Diagnostic String inputs are fixed empty values; lease expiry ranges over every u64 and invalid-transition endpoints over all seven statuses. The reviewed Kani 0.67/CBMC CaDiCaL toolchain, run through scripts/ci/kani.sh with -j1 and RUSTC_WRAPPER empty, completes 2386 checks with zero failures (122 checks reported unreachable) in 66.93 seconds. Diagnostic payload generality and asynchronous binding observations are not proved by this harness.'''

[[bounds]]
text = '''Native controller and SQLite-reopen decision tables cover exact terminal diagnostics, one extractor call, durable stable Run identity and exclusion from recovery. Exact source mutants that route indeterminate to Retry or bind it into the SQL recoverable set fail those tests and are restored byte-for-byte.'''

[[bounds]]
text = '''Runtime observation honesty, controller Future scheduling, repository CAS/lease and SQL interpretation, transaction isolation, durability/crash behavior, provider effects, operator resolution and unconditional liveness remain outside the direct kernel proof.'''
