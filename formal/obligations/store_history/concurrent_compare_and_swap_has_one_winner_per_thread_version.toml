[[bounds]]
text = '''Finite constants and state constraints in the linked TLA+ model configuration; no Rust-to-model refinement is implied.'''

[[bounds]]
text = '''The contract-owned append admission used by every store accepts exactly the current Thread version and returns its single checked successor. Kani proves the full u64 version and run-ordinal domain. Concurrent contenders are serialized by the in-memory mutex, SQLite Immediate transaction, or PostgreSQL per-Thread advisory transaction lock, so after one accepted successor the other contender's same expected version is rejected. Lock and transaction linearizability, database behavior and process failure remain TCB; the conformance race executes the two-contender effect table.'''
