[[bounds]]
text = '''All commit adapters use the contract-owned RunState transition relation before appending a same-Run successor; the file store delegates to the in-memory implementation. Kani proves every lifecycle class, closed terminal cause, failure kind, and next-state class, establishing that Ended permits no successor. SQLite now rejects an undecodable durable state instead of treating it as absent, matching PostgreSQL typed decoding and the in-memory typed history. Backend transaction atomicity, database integrity, and readback remain executable or TCB evidence.'''
