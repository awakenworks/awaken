text = '''Finite constants and state constraints in the linked TLA+ model configuration; no Rust-to-model refinement is implied.'''

[[bounds]]
text = '''The contract-owned production kernels partition exact receipt replay from identity conflict, admit only an exact nonwrapping Thread/Run prefix, and construct an applied receipt from the one admitted successor. Kani proves those decisions over the complete scalar domains; all stores return before mutation on replay/rejection and place record/version/time/receipt writes under one existing lock or transaction. Mutex, filesystem append/fsync, SQL transaction atomicity, codec correctness and crash durability remain executable or TCB evidence.'''
