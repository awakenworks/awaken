text = '''All backends allocate the next commit as the exact checked successor of the current durable tail. PostgreSQL now holds the existing commit table's transaction lock across MAX(sequence), insert and every dependent write; a failed transaction releases the uncommitted candidate for reuse rather than advancing a separate sequence. Its V2 compatibility migration compacts historical commit, message, state, event and receipt keys in one locked transaction before dropping the retired sequence. Kani proves the production PostgreSQL successor over every i64 tail; shared conformance and the real-PostgreSQL later-write fault table cover ordering and rollback reuse.'''

