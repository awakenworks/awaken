[[bounds]]
text = '''The contract-owned kernels require exact Run and payload identity, admit only the exact nonwrapping Thread/Run prefix, and construct the nonduplicate receipt from the adapter-persisted identity, hash, sequence, and admitted successor without remapping. In-memory, SQLite, and PostgreSQL adapters use those kernels and persist the same sequence/version at their atomic append boundary; the file store delegates to the in-memory implementation. The claim-fenced default path rejects version overflow before its underlying durable commit. Kani proves the scalar identity, admission, successor, and receipt mappings. Lock and transaction durability, database/filesystem crash persistence, generated SQL behavior, and backend engines remain executable or TCB evidence.'''
