[[bounds]]
text = '''Kani exhaustively checks the production store decision over all fence-owner/reference predicates and the production pre-purge decision over all fence, indexed-reference and final guard-result predicates. It does not verify database transaction implementation, guard-source completeness, async scheduling or physical backend behavior; focused adapter/reclaimer tests cover the concrete call placement.'''

[[bounds]]
text = '''The existing finite reclamation model separates File intent, tombstone and ownership removal with one source File, two other references, two leases and three generations. Two premature-removal/fencing mutants fail, and three witnesses reach both crashed commit prefixes and completion. Sixteen SQLite fault/reopen cases share foreground and automatic recovery; fourteen command-identity cases reject drift and retain another same-Workspace File. This is bounded model/adapter evidence, not a Kani proof of the new preparation, SQL refinement, arbitrary concurrent schedules or deployed liveness. The original production fault E2E additionally crosses failed intent/tombstone/reference commits with actual SIGKILL and normal restart: only committed commands resume, another File preserves exact shared bytes, and independent final-owner deletion permits physical GC and stable receipts. This is one-host SQLite process recovery, not power-loss or cross-host storage proof.'''
