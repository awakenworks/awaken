[[bounds]]
text = '''Delegation.cfg finitely checks durable cancellation for one remote and three local/cycle/depth identities with two owners and child epochs through two. Mutants prove cancellation delivery cannot precede durable CancelRequested identity and that duplicate requests cannot change the relationship count; a negative remote-delivery invariant proves the configured remote cancellation schedule is reachable. The model records successful delivery as a Boolean and does not model network failure counts or universally refine Rust.'''

[[bounds]]
text = '''The production registry table proves EndParent projects the exact relationship, child, target and adapter execution reference; serde reconstruction and repeated pending_cancellations calls reproduce that command, while Completed clears the reference and is excluded. The runtime test crosses one committed parent terminal transaction, process-local delivery, cold Runtime reconstruction and redelivery from the same committed RunDelegations state.'''

[[bounds]]
text = '''The A2A fault test injects a failed cancel response and nonterminal exact observation, then constructs a fresh executor that reloads the committed Accepted task reference, sends no second message, retries cancellation against the same task id and requires an exact terminal observation. It proves this scripted failure window, not arbitrary peer behavior, store durability, Tokio schedules, transport fairness or eventual cancellation success.'''
