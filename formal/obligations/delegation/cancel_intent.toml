[[bounds]]
text = '''Kani exhausts all three production DelegationStatus values and both RelationshipTransition values. Only Open plus RequestCancel applies a CancelRequested successor and newly enables cancellation projection; a repeated request stutters without manufacturing another relationship effect, completion never enables cancellation, and crossed terminal transitions produce no successor.'''

[[bounds]]
text = '''The production Runtime finish path stages RunDelegations::end_parent in the same ThreadCommit as the terminal Run and finalized tool batch, awaits the commit result, and consumes the proved committed_cancellation_delivery_is_admitted gate before invoking any child cancellation. Kani exhausts commit-success and staged-intent booleans and proves that every missing or rejected durable boundary suppresses the external effect.'''

[[bounds]]
text = '''The native cause/effect table crosses one real Awaiting relationship through absent, rejecting, and successful commit boundaries. The first two preserve the committed Open relationship and deliver nothing; success atomically publishes CancelRequested with the same opaque reference and produces one exact cancellation, while cold reconstruction redelivers that committed identity.'''

[[bounds]]
text = '''The direct proof covers the heap-free relationship and post-commit effect-admission kernels and their production call sites. Rust String/BTreeMap/serde behavior, ThreadCommit encoding, database isolation and durability, arbitrary async schedules, remote adapter behavior, and eventual network delivery remain executable evidence or external TCB rather than universal refinement.'''
