[[bounds]]
text = '''Kani exhausts the neutral Allow, Await and Deny consensus classes against every combination of allow-once, allow-always, reject-once and reject-always offers. The production projection selects the least-persistent same-polarity option, cancels when none exists, and never turns Await or an opposite-polarity offer into authority.'''

