[[bounds]]
text = '''The precedence proofs run on `fold_matches` over at most three symbolic matches, each carrying an arbitrary deciding-policy label, so they cover the whole fold rather than one step: deny is absolute across it, an empty match set yields no decision, and a returned behavior and policy label are always ones a single authored rule carried (the label is inert cargo and never influences precedence). Pattern matching is excluded by construction and belongs to awaken-tool-pattern; see runtime.permission.rule_match_enumeration in formal/proof-boundaries.json.'''
