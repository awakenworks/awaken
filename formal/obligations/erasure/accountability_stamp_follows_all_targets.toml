[[bounds]]
text = '''Direct bounded Kani proof calls the sole production ErasureProgress::next_action and its existing pending_target selection. The shared action harness covers every 0..2-row Coordinator/Resources list (including empty, duplicate and reversed rows), all four current adapter-binding combinations, every u64 revision and x86_64 usize count, and all four accountability_stamped/complete flag combinations. Borrowed byte adapter tokens are the proved generic monomorphization; no assumptions exclude invalid loaded shapes.'''

[[bounds]]
text = '''erasure_checkpoint_action_requires_all_targets_and_accountability passes 966 checks (955 successful, 11 unreachable, zero failures) under erasure-progress-selection-v1, fixed default-equivalent CaDiCaL, global unwind 32, and actual two-slot collect/flatten/bool-array/find pins 3 plus contains/equality pins 4. All default safety checks, assertions, unwinding assertions, allocation and real Drop remain enabled. Existing selection (899 checks, 11 unreachable) and count (989 checks, 10 unreachable) are independently requalified on the same candidate using their existing exact profiles.'''

[[bounds]]
text = '''The action kernel rejects completion without accountability and any stamped/complete checkpoint missing a currently bound target before selecting replay or any effect, preserving the entire checkpoint frame. Only an unstamped, incomplete checkpoint with no missing bound target selects Stamp. New completion and successful terminal replay require accountability and no missing bound target; valid pending effects retain the exact fixed-order target and adapter.'''

[[bounds]]
text = '''The actual resolver consumes the one action decision before replay/effect/CAS and reports typed ErasureError for invalid shapes. Eight real-serde recovery rules, each called twice, cross-check invalid/replay zero eraser calls, subject reads/CAS and progress CAS; valid partial recovery performs one missing effect and three progress CAS, then replays the identical complete subject/checkpoint frame. Newly binding a target may reject an old terminal checkpoint; the resolver does not reopen or repair it.'''

[[bounds]]
text = '''Kani does not execute resolver futures, asynchronous eraser effects, CAS/reload or concurrent replica schedules, SQL/serde persistence, physical deletion or whole-saga Rust-to-TLA refinement. The directly proved guarantee concerns admitted actions relative to supplied checkpoint facts/current target bindings, not truth of externally corrupted stored facts or physical effects. The linked finite ErasureSaga model and native resolver tests provide complementary evidence.'''
