[[bounds]]
text = '''The shared bounded Kani action harness calls the sole production ErasureProgress::next_action and pending_target. Its complete input domain and generic adapter monomorphization are owned by erasure.accountability_stamp_follows_all_targets. This obligation reads the Complete/Replay branches of that same decision, including invalid loaded shapes; it adds no second action model.'''

[[bounds]]
text = '''The same 966-check Kani receipt covers Complete and Replay admission. The audited solver, global unwind and exact loop pins are recorded once under erasure.accountability_stamp_follows_all_targets; target selection and count successor boundaries are recorded under erasure.each_target_is_counted_once.'''

[[bounds]]
text = '''Complete and terminal Replay require accountability_stamped plus no missing currently bound target. A complete but unstamped checkpoint, or a stamped/complete checkpoint missing a bound target, becomes InvalidCheckpoint before replay or any effect; the complete checkpoint frame is preserved. Stamp and effect ordering are the separate accountability-stamp obligation, not a second completion rule.'''

[[bounds]]
text = '''The actual resolver consumes this one action decision before terminal replay or CAS. Real-serde recovery rules check invalid/replay paths make zero eraser calls, preserve the subject and checkpoint, and replay an identical complete terminal frame. Newly binding a target may invalidate an old terminal checkpoint; the resolver refuses it rather than reopening or repairing completion.'''

[[bounds]]
text = '''Kani proves the Complete/Replay decision relative to supplied checkpoint facts and current bindings, not their external truth. Resolver futures, asynchronous eraser effects, CAS/reload, concurrent replicas, SQL/serde persistence, physical deletion and whole-saga Rust-to-TLA refinement remain outside this kernel proof; the linked ErasureSaga model and native resolver tests are complementary evidence.'''
