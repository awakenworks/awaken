[[bounds]]
text = '''Direct bounded Kani proofs call the production ErasureProgress pending_target and record_target methods. The selection harness covers every 0..2-row Coordinator/Resources list, including empty, duplicate and reversed rows; all four adapter-binding combinations; arbitrary u64 revision/count and both independent accountability_stamped/complete flags. Count and frame proofs consume a previously selected target: one covers independent u16 count/receipt values, one covers independent u16 deficits below usize::MAX and u16 receipts, and one crosses either target with 0..2 other-target rows, arbitrary revision/flags, and fixed success/overflow boundary pairs. A fourth proof appends that target and checks it cannot be selected again even with three completed rows. The shared Rust cross table exercises the complete selection-to-record composition for every list/binding/flag combination and zero/MAX/overflow count pairs. Arbitrary independent full-width usize count and receipt together are not claimed Kani-proved; generic selection is proved with borrowed byte adapter tokens, not Arc/dynamic dispatch.'''

[[bounds]]
text = '''The existing erasure-progress-selection-v1 profile keeps its audited two-slot loop pins, default-equivalent CaDiCaL and global unwind 8. The four count/frame/reselection harnesses also use global unwind 8 and the same production methods without a second selection-loop profile. All safety checks, assertions, unwinding assertions, allocation and real Drop remain enabled; no input assumptions or stubs are added. Kani proves error/stutter on overflow, while the shared executable Rust table checks the exact 'erasure receipt overflow' text. The old count-specific profile and its digest pin were removed when its GOTO loop became unreachable from these partitioned proofs.'''

[[bounds]]
text = '''The local selected-target transition appends the previously uncompleted target once, adds a fitting receipt exactly, never selects that target again, and preserves the complete remaining checkpoint frame in the stated partitions. No pending target leaves the checkpoint unchanged in the selection proof and Rust cross table; overflow returns an error and preserves the entire checkpoint, with exact error text checked by Rust. The earlier global-only RSS-guard termination and the later full-product count query that exceeded the host's memory reserve were not proofs; the partitioned harnesses have independent completed Kani results.'''

[[bounds]]
text = '''Asynchronous eraser execution and physical effects, revision CAS, reload, concurrent replica schedules, accountability/terminal publication and complete ErasureSaga refinement are excluded. The linked finite TLA+ model and native resolver/repository tests remain complementary evidence; no Rust-to-model refinement or whole-saga claim is implied.'''
