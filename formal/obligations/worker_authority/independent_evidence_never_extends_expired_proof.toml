[[bounds]]
text = '''The Worker lifecycle now consumes one private production decision over the full u128 proof-age and proof-window domains and every due, proven, lost and unknown observation class. Kani proves that an at-or-beyond-window observation always closes and that refresh is possible only for a proven observation still inside the prior window. Both initial pool admission and the recurring provider monitor use this same boundary; a successful recurring probe anchors the next proof at request start.'''

[[bounds]]
text = '''WorkerAuthorityEvidence additionally checks two finite independent proof ages 0 through 4, request latency retained in evidence age, one single-flight probe, absorbing closure and eventual closure when either environment evidence or Registry renewal stops under its stated fairness. Paused-time unit tests cover before, exact and after-deadline response schedules; Worker lifecycle tests cover startup rejection, drift, stalls, transient recovery and continuing Registry heartbeats. The production-kernel proof does not establish Tokio scheduling, Instant or operating-system clock correctness, provider policy truth, Registry transport behavior, physical cleanup or universal async refinement.'''
