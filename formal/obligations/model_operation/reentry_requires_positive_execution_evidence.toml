[[bounds]]
text = '''Kani exhausts the production three-valued evidence gate and its composition with predecessor/checkpoint presence across all local phases. A retained checkpoint with no journal is denied; no journal and no checkpoint remains fresh-entry permission, not historical termination proof. Real Runtime tests cover returned-error retries, failover, tolerance and Run-scoped historical evidence before checkpoint salvage. HTTP fixtures cover selected production-adapter terminal, deadline, redirect and retry-status mappings. Adapter honesty, remote completion authenticity, arbitrary injected SDK clients, history with neither journal nor checkpoint and independent crash-stop recovery are not established by this scalar proof. The paired constructor proof exhausts every u8 selector over the three mintable pre-call stages (19 checks, zero failures on pinned Kani 0.67); the decoder-only Unrecorded tag has no public mint constructor. Neither proof establishes adapter honesty, transport quiescence, or async journal durability.'''
