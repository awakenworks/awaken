[[bounds]]
text = '''Kani exhausts the physical three-valued evidence gate. The extended reentry kernel crosses original scope, local phase and checkpoint presence: only an original ResponseOnly Returned observation may restart a model request without reusing uncertain output; it never changes Unknown into provider termination. A retained checkpoint with no journal is denied; no journal and no checkpoint remains fresh-entry permission, not historical termination proof. The extended production kernel was re-executed on pinned Kani 0.67: one harness, 205 checks, zero failures (four unreachable). This scalar proof does not establish async commit, adapter-scope honesty or transport behavior. Real Runtime tests cover returned-error retries, failover, tolerance and Run-scoped historical evidence before checkpoint salvage. HTTP fixtures cover selected production-adapter terminal, deadline, redirect and retry-status mappings. Adapter honesty, remote completion authenticity, arbitrary injected SDK clients, history with neither journal nor checkpoint and independent crash-stop recovery are not established by this scalar proof. The paired constructor proof exhausts every u8 selector over the three mintable pre-call stages (19 checks, zero failures on pinned Kani 0.67); the decoder-only Unrecorded tag has no public mint constructor. Neither proof establishes adapter honesty, transport quiescence, or async journal durability.'''
