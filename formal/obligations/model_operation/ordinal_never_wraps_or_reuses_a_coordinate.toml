[[bounds]]
text = '''Kani exhausts the production u64 ordinal successor kernel. Journal commit acknowledgement, Run-scoped hydration, provider termination and SDK-internal retries are not proved by this arithmetic harness; the linked Runtime tests cover selected persistence failure cuts.'''

[[bounds]]
text = '''The same full-width Kani harness additionally checks that the provider context retains the recorded ordinal instead of allocating a second sequence. Executable tests cover reconstruction, all identity tuple fields, task-local isolation, absent durable commit ownership, actual committed provider entry, lazy pinned executor replacement, both inference modes and grant response loss. Hash collision resistance, arbitrary string refinement, external grant idempotency, SDK internal requests and independent remote termination remain outside the kernel proof.'''

[[bounds]]
text = '''The recorded model-history observer reuses ThreadCommit and typed state decoding, retaining each ordinal with an immutable binding at one commit prefix. The production sorted fold is Kani-checked for two arbitrary nonzero u64 ordinals, equal/different fixed empty or one-byte bindings and all three evidence classes, unwind 4 and default checks, using Kissat. Decoding, cursor validation and 1026-record histories are executable tests, not covered by that bounded fold proof. Managed root/child warm/repeated/cold cancellation tests retain older Unknown despite a later terminal invocation. Empty/unowned legacy history is not complete enrollment or physical termination evidence; Native recovery now reuses this same fold before model/tool/delegation effects and control completion; tests cover hidden Unknown/corruption, foreign Runs, late lower-ordinal receipts and absent/current/stale context readers. The same Kani harness checks the all-records veto and maximum retained ordinal. Rebuilt state flows through resume without a second state read. No complete enrollment certificate, provider query or new Dispatch retirement transition is introduced.'''
