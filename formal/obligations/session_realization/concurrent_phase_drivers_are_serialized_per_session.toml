text = '''The same SessionExecutionBinding kernel includes pre-Environment Container fence-source projections with fixed direct/registered topology. Seventeen semantic/lock mutants include six provider-only bypasses; provider and pre-readiness witnesses exclude vacuity. Host decision tables and barriers cover capture before preparation, live receipts, exact operation/generation, both slot allocations, closure/ABA/renewal across Worker/cache/provider waits and unchanged Control coordinates. Model generation is abstract, expiry is a bit, and the callback result is only a synchronous projection. Operation bytes, receipt-clock refinement, provider-side absolute-time checks, post-return asynchronous mutation, real backend effects, unbounded/Rust refinement and complete cloud/platform qualification remain outside this proof. Provider source projection and synchronous callbacks now use the same SessionExecutionAuthority target enum as physical execution; the duplicate Host guard closure is removed. Executable tests cover weak Host ownership, both interfaces on the decision table, held original mutexes and mandatory Environment identity only for execution. The existing effect-bound authority port now gates Memory acknowledgement after async mount acquisition, including empty and cached replay paths, through the same shared ack kernel in all providers. The model adds wait/release/cancel and idempotent Copy acknowledgement with three additional semantic mutants and explicit ack/replay witnesses (20 mutants, 8 witnesses in total). Local/Container pending-future tests change authority after a real lock wait; Host tables exercise both topologies and unchanged Control coordinates. Preparation now reuses the same current-effect kernel after one admitted asynchronous wait/response; three additional mutants reject pending or stale/cached-authority bypass, with empty/cached preparation reachability (23 mutants, 10 witnesses total). Rust Local new/cached participant and Container lock