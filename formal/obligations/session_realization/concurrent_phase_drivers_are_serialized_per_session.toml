text = '''Session authority CAS is bounded to one detailed Session plus one peer, two revocation callers, two slot allocations, two Control-admitted generations and three expiry versions. Slot removal/recreation preserves identical closed lease bytes to check captured-lock allocation identity. Worker close atomically selects the current cohort before asynchronous drain; weak fairness of ready peer cleanup proves independent progress despite another held owner lock. Guard/temporal mutants and grant/cleanup reachability witnesses run in CI. New Session admission after close, OS execution, unknown physical cleanup liveness, unbounded generations and Rust refinement are excluded. Host barriers cover both owner locks, cancellation, failure isolation, same-lease ABA and both renewal delivery entrances. WorkerAuthorityExit composes this cohort boundary with ordinary or panicking heartbeat exit and explicit owner abort. It checks closure before revocation waits and completion after modeled cleanup; tests exercise the same supervisor wrapper and a real HTTP Worker provider-probe panic. Unwind handling is not a guarantee for process death, panic-abort builds, or an externally aborted task.'''

