vation/removal. The same selector adds restored disposal/replay (32 mutants, 16 witnesses total). Executable tables cover ten Local lock waits, thirty Container provider schedules, seven Host response/lease schedules and twenty-two scripted Podman response/identity rows. Podman rejects missing physical IDs and removes the observed immutable ID; Local unfenced restored-handle disposal is rejected. Kubernetes compound cleanup now forwards the same authority through immutable-incarnation removal and checks each response/next-mutation edge in the existing Pod/PVC/finalizer and projected-resource cleanup protocol. The adjacent HTTP decision table crosses every normal and finalizer-conflict response with renewal, revocation, replacement, expiry and cancellation, preserves committed prefixes and retries under a fresh successor over the original preparation and handle. Each adjacent pair maps to the existing two-effect wait/check model, not a new cleanup machine. Opaque mounter cancellation, failed ownerless compensation retention, UTC conversion, in-flight real backend commits, controller liveness and real platform/credential qualification remain unproved. These are two-effect admission checks, not full lock/remote-commit or Rust refinement. Terminal physical clock migration removes redundant Worker-UTC comparisons from Local/Namespace terminal preflight/takeover and RemovalGuard preparation/reconstruction/removal, and Container dispose_authorized; original current-effect callbacks and identity/order comparisons remain the sole owners. Adjacent tests cross past/future Control timestamps with current/revoked/exhausted proof across resident/cold/absent Local and Namespace participants, and double the existing Local 5x5 and Container 6x5 Pending matrices across those timestamp classes. The old sleep-until-UTC table is consolidated rather than retained as a competing authority oracle. FreshProviderEffectRemainsEnabled checks positive callback admission independently of Current