text = '''SessionExecutionReplacement composes the existing Worker/Session current-binding kernel for two execution objects, two callers, two generations and at most one cancellation per caller. Original and successor captures remain write-once; unknown/live predecessor evidence prevents replacement, cancellation retains the physical owner, and fresh successor execution remains enabled. Twelve semantic mutants and six reachability witnesses distinguish stale object reuse, missing retirement/quiescence, cancellation loss, over-denial, omitted Candidate retirement, forged readback, publication without readback and duplicate or stale root commits. SR1-SR5 execute real Linux scoped processes through complete Host projection installation, same-generation renewal, explicit revocation, warm replacement, foreign-binding rejection before physical stop and unknown-observer retry. Physical observer truth, Memory participant identity, distributed/cross-platform/vendor qualification and Rust refinement remain outside this bounded model; SC1-SC4 extend the same fixture and model with an original Store-read committed Candidate, renewal, foreign-generation preflight, unknown-observer retention, explicit revocation and exact retry. Adjacent lifecycle decision tables cross Create/Adopt, commitment evidence, exact selection and retirement cause. UC1-UC3 cancel actual context Futures before the delegated root commit and after commit before response, then cross replacement, unknown-observer retry and repeated explicit revocation. The same model now includes uncommitted and response-lost initial Candidates and separates successor root commit, readback and publication; post-commit cancellation retains the owner and exact idempotent receipt. Adjacent lifecycle tables reject wrong targets, stale owners, cleanup causes, invented commitment and unowned adoption. MC00/01/10/11 extend the same Host fixture across Resident or uncommitted initial owners and two successive Adopt cancellations before/after commit (eight Linux schedules), then require a fourth executable owner, exact root bytes, immutable Sandbox generation and distinct per-Adopt receipts. The same model has a four-generation configuration reusing the existing slot-install transition; its append-only capture history and invocation-specific readback are checked with five additional semantic mutants and five recovery witnesses. MC-M adds one complete Copy edit per execution generation, forbids replay from rewinding that local image, and checks exact successor writer attribution. The eight executable chains select filesystem delivery through a published bash descriptor, reuse the shared Copy MemoryMounter and Agent path renderer, preserve original materialization heads and final local bytes, and leave the source unchanged until terminal reconciliation. The larger Copy state space retains all prior authority and cancellation schedules with an explicit 4096 MiB, eight-worker, 1800-second per-case TLC budget; a timeout remains no proof. FUSE, partial file writes, terminal writeback and actual Worker death are not established by MC-M. Positive chain witnesses choose stable authority; neither safety nor semantic mutant configurations use that witness-only constraint. Defaults retain the two-generation boundary of upstream models. Real distributed CAS/dispatch faults, physical observer truth, unbounded generations and Rust refinement remain outside these rows.'''

