[[bounds]]
text = '''Production Rust type domain under the named bounded Kani harness assumptions.'''

[[bounds]]
text = '''ADR-0092: Kani exhausts the Session aggregate's realization-failure budget rule over every SessionExecutionState and the full u32 attempt and budget domains: a capacity report never absorbs and refunds exactly the attempt a Preparing/Activating assignment counted, an ordinary retryable report retries only below the budget, and a capacity flag on a non-retryable report is rejected. The failed-effect classification (Unavailable + capacity code -> NotReady deferral, other Unavailable -> Retryable, otherwise Terminal) and the SandboxError-disposition-to-code mapping are exhaustive decision-table tests over every RunErrorKind and stable code, not Kani claims; the Worker projection of NotReady/Retryable/Terminal reuses the existing proved control-disposition harness.'''

[[bounds]]
text = '''ADR-0015 provisioning deadline: Kani exhausts `provisioning_disposition` over every u16-bounded deadline and observation instant (the realization lease harnesses' domain for the same expiry law) with and without a provider deadline: it is NotReady exactly for a known deadline strictly after the observation (judged through the one expiry law), every other reading is Retryable and none is Terminal. A second harness exhausts the pool's deferral due time over every u64 backoff and optional hint: a deferral is due no later than the backoff and no later than the owner's hint, so a provision deferred before its deadline is observed again no later than that deadline. The deferral's hint (the wait left to that deadline), which providers give a deadline and its value (Pod creation + scheduler bound + start-up timeout) are decision-table tests, not Kani claims.'''
