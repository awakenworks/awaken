[[bounds]]
text = '''The existing phase-driver model bounds ActiveSessions by driver owner and clears that owner on ControlTimeout. Those invariants remain phase-driver abstractions, not a mapping of the distinct production request permit, completion permit and Session mutex.'''

[[bounds]]
text = '''The production failure-disposition Kani harness exhausts every typed Control failure and proves only explicit ownership loss selects immediate revocation; retryable failures retain the old lease. Tokio decision tables exercise 64 and 512 Sessions, the exact concurrency bound of eight, earliest-deadline ordering, stalled requests, two timeout waves, zero leaked active slots and retained per-Session projections.'''

[[bounds]]
text = '''The deadline adapter keeps each actual Tokio OwnedSemaphorePermit in the sole Option ownership fact. After acquire_owned returns Some, its constructor consumes Acquire and the typed planner requires the token remain owned; returned and elapsed-deadline branches request ReleaseOwned; cancellation, panic unwind and ordinary scope exit use the same ScopeEnded release. That plan drives the physical take/drop, while the destructor after explicit settlement sees None and stutters. There is no ownership enum or global shadow counter to diverge from the actual token.'''

[[bounds]]
text = '''Kani exhausts the bool derived directly from that sole Option across every event in the production-consumed planner. It proves exactly owned terminal rows request one release, owned acquisition retains the token, released destruction cannot double-release, and torn orderings reject. The fixed bound remains the literal eight permits passed to the one production Tokio semaphore, whose accounting and wake behavior are TCB rather than a scalar Rust proof.'''

[[bounds]]
text = '''SessionRuntimeSlot::realization remains the sole per-Session phase mutex and its current-Arc admission kernel remains independently proved. This change neither weakens that mutex nor adds a scheduler, state store or capacity authority.'''

[[bounds]]
text = '''The production deadline adapter owns one shared eight-permit scheduler per sweep, drops its request permit at return/deadline, then reacquires from that same scheduler for response application or exact-owner cleanup. This permits queued peer Control calls to advance without creating an unbounded completion lane. The executable composition table holds first-wave Session mutexes while a second timeout wave enters, then verifies cleanup remains bounded and still waits for those exact locks.'''

[[bounds]]
text = '''Tokio semaphore/mutex exclusion, owned-guard drop and wake behavior, virtual/real timer behavior, OS scheduling, eventual Control return and unbounded workload fairness remain external TCB or operational evidence; Kani does not prove those mechanisms.'''

[[bounds]]
text = '''Controlled single-thread Tokio polls execute the actual deadline adapter at the real capacity of eight, crossing successful/error/deadline return and cancellation while a request or completion is queued or held. Seven mandatory traces retain actual semaphore identity, available permits, owned reservation count, inner-future entry/destruction and ordered cuts; queue residence beyond the request timeout must not start that timeout. The same SessionRealizationMutex observation relation checks exact permit conservation and release/reacquisition deltas. No shadow production capacity state, replacement synchronization primitive or Kani proof of Tokio is introduced.'''

[[bounds]]
text = '''The existing sixteen-Session/two-deadline-wave Host table also cancels while first-wave completions wait on original Session mutexes and second-wave completions queue. Three mandatory held-mutex observations retain full closed-lease bytes, exact mutex allocation, lock-held state, peer entry count and peak concurrency; twelve actual-trace semantic mutants qualify both observations. Synchronous Live-to-Closed admission fencing is required before waiting; physical slot retirement must wait, cancellation cannot reopen authority, and the existing revocation selection owns retry. This is finite executed composition evidence for one scheduler per sweep; arbitrary concurrent sweeps, all schedules and unbounded fairness remain unproved.'''
