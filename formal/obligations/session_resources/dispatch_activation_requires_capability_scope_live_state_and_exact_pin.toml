[[bounds]]
text = '''Kani exhaustively checks the production per-capability admission predicate for both requirement-presence and offered-capability classes, the dispatch scope predicate for all nonempty/exact-match classes, and the shared MemoryStore/Repository live-binding predicate across every Workspace-match, lifecycle-state and frozen-config-presence combination. can_claim applies the capability predicate to every required capability, dispatch decoding consumes the scope predicate, and both live aggregate verifiers consume the binding predicate.'''

[[bounds]]
text = '''Decision-table, property and integration tests cover concrete BTreeSet traversal and MissingCapability identity, Worker manifest capability derivation, String trimming/equality and manifest decoding before sandbox creation, plus frozen Memory config reuse, missing pin rejection and later lifecycle revocation. The scalar proofs do not universally refine arbitrary collection iteration, String/JSON implementations, database reads, authenticated transport, filesystem/provider behavior, network delivery, Worker execution equivalence or all asynchronous schedules.'''
