text = '''Kani exhaustively checks the closed production manifest-settlement plan across commit, completed rollback and retryable rollback failure. Only commit can promote pending; rollback clears pending while preserving active, and retryable failure preserves both active and pending. SessionResourceState::commit, rollback and note_retryable_failure consume that one plan.'''

