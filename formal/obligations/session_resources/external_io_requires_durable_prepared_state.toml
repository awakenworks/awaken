[[bounds]]
text = '''Kani exhaustively checks the private production generation-slot kernel for all u64 active, pending and asserted revisions and both pending-presence classes, including deterministic Active precedence for an aliased corrupt or legacy row. SessionResourceState::retained_generation consumes that kernel directly, so an attempted watermark alone cannot select a manifest.'''

[[bounds]]
text = '''Application decision-table tests cover terminal roots, exact, renewed and forged leases, exact active and pending revision-manifest pairs across rollback and commit, and File, Memory and Skill targets. Resource HTTP adapters and Repository materialization reuse the same Control port; local reconciliation persists pending intent and its attempt before Runtime application. The scalar proof does not universally refine structural Vec/String equality, database CAS or durability, authenticated HTTP transport, external filesystem/object-store behavior, or all asynchronous schedules.'''
