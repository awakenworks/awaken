[[bounds]]
text = '''Kani exhaustively checks the production pending-retry selector for both durable pending states and every u64 generation watermark: retry authority exists exactly when pending exists and returns that persisted revision unchanged. SessionResourceState::start_attempt consumes this selector and increments only Prepared activation records at the selected revision.'''

[[bounds]]
text = '''A file-backed SQLite application test closes and reopens the Session authority after a retryable first attempt, exercises the canonical reconciliation scan and Runtime apply path, and checks that the same generation becomes active with one existing activation record and an incremented attempt count. The proof does not establish SQLite engine correctness, arbitrary heap or serialized-structure integrity, root CAS linearizability, Runtime effect idempotency, or all asynchronous crash schedules.'''
