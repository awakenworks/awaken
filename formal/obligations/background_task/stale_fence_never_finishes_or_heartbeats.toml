[[bounds]]
text = '''The named Kani harness directly invokes the sole production fenced_mutation_plan across all five phases, owner-mismatch and epoch-mismatch partitions, heartbeat and finish requests, both finish outcome classes, and all u64 epochs, revisions, clock values and lease values. Either mismatch returns StaleFence before command-specific validation and therefore produces no successor plan. The fixed Kani 0.67.0 run completed 514 checks with zero failures under one job, an empty RUSTC_WRAPPER, a 600-second deadline and a 12 GiB cgroup memory ceiling.'''

[[bounds]]
text = '''BackgroundTask::heartbeat and BackgroundTask::finish are the only production consumers of this shared plan and mutate the aggregate only after receiving its matching successor. Native cause/effect tables call both methods and require complete aggregate equality after stale owner and epoch inputs, including otherwise-invalid command values; no second lifecycle or fencing owner is introduced.'''

[[bounds]]
text = '''The proof uses two fixed distinct non-empty worker strings to exercise the actual Rust String equality path and proves every scalar value in the production plan. Arbitrary String allocation, durable Thread State transactions, database/codec/snapshot truth, async and cross-process scheduling, clock truth, Host read-to-external-effect revocation and external tool effects remain native evidence or declared TCB rather than claims of this scalar safety proof.'''

[[bounds]]
text = '''The linked finite TLA+ model and supervisor Loom suite remain complementary evidence; neither is claimed as universal Rust refinement or durable process truth.'''
