text = '''The stale-fence Kani harness directly invokes the sole production fenced_mutation_plan across all five phases, foreign task/holder/epoch partitions, relative heartbeat, fixed-target checkpoint and finish requests, both finish outcome classes, and all u64 epochs, revisions, clock, lease and target values. A mismatch returns StaleFence before command-specific validation, so there is no successor or historical ACK. The earlier fixed Kani 0.67.0 run completed 514 checks with zero failures under one job, an empty RUSTC_WRAPPER, a 600-second deadline and a 12 GiB cgroup memory ceiling; those historical checks covered the original heartbeat/finish harness and do not qualify the added checkpoint branch.'''

