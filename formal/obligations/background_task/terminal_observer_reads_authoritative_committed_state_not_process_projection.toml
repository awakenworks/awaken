[[bounds]]
text = '''The named Kani harness directly invokes HostCommit::committed_authority across both source variants and arbitrary boolean payloads: Local mints one CommittedAuthority and the sole Remote variant, whose only read source is RecoveryProjection, never does. The fixed Kani 0.67.0 run completed 21 checks with zero failures under one job, an empty RUSTC_WRAPPER, a 600-second deadline and a 12 GiB cgroup memory ceiling. The receipt constructor is private to the canonical HostCommit owner; no background-specific State, query, repository or registry is introduced.'''

[[bounds]]
text = '''BackgroundTaskTerminalObserver and its post-concurrency BackgroundTaskOwnership verifier accept only CommittedAuthority and call its sole committed_state method. The executor obtains that receipt through the proved HostCommit selector before installing the observer, so the production type graph contains no route from a Worker recovery projection into terminal reconciliation or its final ownership read.'''

[[bounds]]
text = '''The native cause/effect table keeps an in-memory LocalCommitAdapter compatibility projection empty while its existing LocalCommitQueries seam returns one exact Running BackgroundTask command. The production observer consumes that authority, launches once, and duplicate delivery produces one fenced completion and one attention Run. Missing, malformed, unavailable and Remote source classes fail before detached effects.'''

[[bounds]]
text = '''The required PostgreSQL gate supplies the shared-store counterpart: a peer commits one exact Thread state command after the compatibility projection is hydrated, the projection remains empty, and PostgresCommitCoordinator::authoritative_committed_state returns durable truth once in order through Coordinator's sole private PostgresQueries policy.'''

[[bounds]]
text = '''The kernel proves source exclusion and compile-time receipt routing, not database isolation or durability, arbitrary LocalCommit implementations, Tokio scheduling, observer delivery, process-local completion durability, final-read-to-third-party-effect atomicity or whole-driver Rust-to-TLA refinement. Database and async behavior remain declared TCB assumptions; these limits do not permit a recovery projection to satisfy the receipt type.'''
