[[bounds]]
text = '''The named Kani harness directly invokes the sole production completion_fold_plan across committed-attempt absence/presence, owner equality and every u64 candidate/committed epoch pair. Only an exact owner+epoch selects StageRetainingCandidate; every strictly older epoch selects RetireStale; absent, same-epoch different-owner and newer candidates select Preserve. Repeating the exact inputs returns the same retained staging plan. The fixed Kani 0.67.0 run completed 266 checks with zero failures for the named harness under one job, an empty RUSTC_WRAPPER, a 600-second deadline, a 12 GiB cgroup memory ceiling and a /tmp target/build directory.'''

[[bounds]]
text = '''BackgroundTaskSupervisor::completion_for_fold is the only production consumer of that plan and applies it under the existing single entries mutex: exact Completed evidence is cloned without removal for commit-loss retry, strictly stale evidence is removed atomically, and incomparable evidence remains untouched. ReconcileBackgroundTasks consumes only this typed receipt, reuses the aggregate's sole BackgroundTask::finish transition and stages its existing StateCell command. No second lifecycle, store or completion owner is introduced.'''

[[bounds]]
text = '''The native cause/effect tables require an exact completion to return repeatedly from the real supervisor slot, strictly older evidence alone to retire, same/newer/incomparable evidence to remain, and the StepStart hook to stage byte-equivalent State commands before and after simulated commit loss. A later durable Ended observation retires only the process guard. Five Loom checks retain selected one-task/two-thread coverage of replacement, stale callback/retirement, resumed-poll fencing, completion/wait acknowledgement, duplicate acknowledgements and completion-fold versus registration through the production mutex.'''

[[bounds]]
text = '''The kernel proves the process-local candidate admission, retention and stale retirement decision, not ThreadCommit application, database transaction isolation/durability, State serialization, Tokio mutex/runtime behavior, caller snapshot freshness, same-epoch adapter callback correctness, process survival, attention delivery, arbitrary external tool effects or whole-driver Rust-to-TLA refinement. The linked finite TLA+ model remains complementary evidence rather than a universal refinement proof.'''
