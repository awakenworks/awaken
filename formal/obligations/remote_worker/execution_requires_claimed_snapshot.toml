[[bounds]]
text = '''The Worker now obtains one private process-local authority only after selecting the committed reader or successfully installing the exact Run/Thread recovery snapshot. Every physical model, tool and Sandbox call site must pass that value, and the production admission rechecks its Run, Thread and epoch before entering the existing physical-attempt boundary. The named Kani harness exhausts all identity-match combinations.'''

[[bounds]]
text = '''Existing production Kani kernels additionally prove that exact claiming preserves the entire frozen RunDispatch, only a complete current owner/epoch obtains the commit guard, and a physical attempt slot installs or clears only under exact authority. Network response freshness, async call ordering outside the private typestate, transactional adapter behavior, executor behavior and Worker-host equivalence remain executable or external TCB evidence; this is not a universal process refinement.'''
