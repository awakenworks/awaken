text = '''The existing dispatch transition kernel is the sole executable lease transition and Kani exhausts every durable state and u64 epoch: each runnable claim advances exactly once to Leased, exhaustion fails closed, and reserved or terminal rows cannot reopen. The existing commit and physical-attempt kernels exhaust complete owner/epoch presence and equality, reject torn authority, and prevent another owner from installing or clearing the exact physical slot.'''

[[bounds]]
text = '''Memory, SQLite and PostgreSQL claim adapters already apply that same transition while holding their one row or aggregate lock and atomically persist one owner with the returned epoch; backend conformance covers competing claimers and stale epochs. Kani proves the shared production decisions, not database/mutex isolation, owner String equality, HTTP delivery, crash durability, or universal async scheduling; those remain executable evidence or TCB.'''
