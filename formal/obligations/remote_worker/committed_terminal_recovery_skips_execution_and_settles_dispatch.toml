[[bounds]]
text = '''The Runtime-contract production kernel classifies every Boolean combination of record presence, exact Run identity, exact Thread identity and Ended state. Kani proves that only all four facts admit the exact committed terminal projection, any present identity disagreement fails closed, and absent or exact nonterminal truth cannot enter terminal settlement. Ordinary reclaim, lost-commit races and the dedicated terminal scanner consume that same projection and converge on one Worker helper whose only mutation is the existing observer plus claim-fenced Done settlement; it accepts no executor dependency.'''

[[bounds]]
text = '''Memory and SQLite decision-table tests cover ordinary and dedicated terminal claims, cancellation and opaque ACP recovery, occupied predecessor slots, exact physical acknowledgement and zero repeated executor calls. The production-kernel proof does not establish CommittedThreadView or backend snapshot correctness, async scheduling, database isolation or durability, observer idempotency, physical quiescence, network delivery, or unconditional progress during a permanent outage.'''
