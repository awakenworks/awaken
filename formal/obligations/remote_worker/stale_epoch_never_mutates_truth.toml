[[bounds]]
text = '''Every memory, SQLite, and PostgreSQL commit-lock adapter uses the contract-owned admission kernel over one locked row snapshot. Kani proves that only a row in the required leased state with a complete exact owner and epoch yields a guard; absent, wrong-owner, and stale-epoch snapshots are fenced, while incomplete lease authority is rejected as corruption. Thread commits and ordinary Artifact publication both cross this same guard before their authoritative write and retain it until that write settles. The production commit path additionally observes explicit backend release before returning. Backend mutex/transaction isolation, durable row decoding, Resource and Thread store behavior, HTTP authentication, and process failure during an in-flight write remain executable or TCB evidence.'''
