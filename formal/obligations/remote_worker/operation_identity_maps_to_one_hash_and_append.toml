[[bounds]]
text = '''The contract-owned production admission kernel used by every commit-store adapter accepts replay only for the same Run identity and payload hash, and admits a new append only at the exact Thread version and Run ordinal with a nonwrapping successor version. Kani proves the complete scalar decision domains. Canonical serialization and hashing are executable contract evidence; backend locks, transaction durability, sequence allocation, transition validation, and readback remain executable backend evidence.'''

[[bounds]]
text = '''An auxiliary Kani proof checks the final SHA digest encoding used by commit_payload_hash -> canonical_json_sha256: every unconstrained [u8;32] becomes the exact sha256: prefix and sixty-four lowercase digits, decoded independently back to all original bytes. The actual safe byte buffer, encode_to_slice length check, String UTF-8 check and normal allocation/Drop remain in the proof. The checked fingerprint-sha256-hex-v1 profile fixes independently qualified CaDiCaL, global unwind 66 and UTF-8/align bounds 5/17/9/5; all default safety and unwinding assertions stay enabled. Native historical formatting and independent framed SHA vectors cross-check wire compatibility and retain serialization failure behavior. This proves only fixed-width digest encoding, not SHA-256, canonical JSON/framing over arbitrary values, collision resistance, complete commit identity or backend transaction refinement; the row grade is unchanged.'''
