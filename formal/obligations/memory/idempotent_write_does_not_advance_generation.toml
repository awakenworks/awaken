[[bounds]]
text = '''Kani exhausts all 32 materialized-path, immutable-id, monotone-version, content-hash and already-current observation classes through the single production admission owner used by the volatile, SQLite and PostgreSQL adapters. An already-current head returns Current only with an exact path and complete generation token; a stale same-content token conflicts, while an exact changed head alone can yield Apply. Equality and hash computation, lock and transaction correctness, SQL row selection, asynchronous cancellation and durable database effects remain implementation or external TCB; this is an admission-kernel proof rather than universal backend refinement.'''
