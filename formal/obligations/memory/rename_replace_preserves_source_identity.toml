text = '''Kani 0.67.0 with patched CBMC 6.8.0 and CaDiCaL proved the single memory_rename_replace_preserves_source_identity harness: 1 of 1 harness verified, 0 of 9 checks failed, 0.016249035 s verification time, 4.22 s guarded elapsed, 139128 KiB peak aggregate solver RSS and 53007988 KiB minimum MemAvailable under the 600 s, 12 GiB aggregate RSS and 12 GiB MemAvailable guards, with -j1 and RUSTC_WRAPPER cleared. It exhausts the full u64 source-identity domain and both absence/presence plus the full u64 displaced-identity domain without assumptions. The generic production implementation is representation agnostic; native decision tables exercise its String instantiation through pure move, same-path, missing-source and replace-different-id repository operations. Volatile and SQLite directly reject a displaced-id mutant, and PostgreSQL runs the same replacement/orphan check when its endpoint is explicitly available.'''

