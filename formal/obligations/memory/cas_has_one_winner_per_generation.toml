[[bounds]]
text = '''Finite constants and state constraints in the linked TLA+ model configuration; no Rust-to-model refinement is implied.'''

[[bounds]]
text = '''The shared production HeadUpdateAdmission kernel exhausts all 32 path, immutable-id, monotone-version, content-hash and already-current observation classes and proves how one already-linearized observation maps to Apply, Current or Conflict; it does not establish that two concurrent repository calls cannot both observe the same head. Volatile mutex exclusion, SQLite connection/transaction serialization and PostgreSQL row-lock/transaction isolation are the actual one-winner authorities and remain implementation or database TCB rather than a mirrored pure-state proof.'''

[[bounds]]
text = '''Backend-generic native concurrency cross-evidence releases eight distinct candidates from one observed immutable-id/version/content-hash token. It requires exactly one state-changing winner at generation +1, seven conflicts carrying that winner, one live winner and one appended Modified history row across Volatile, SQLite and an explicitly configured PostgreSQL endpoint. An unavailable implicit PostgreSQL endpoint is an honest skip, not cross-node proof.'''
