[[bounds]]
text = '''Kani exhausts absence and all eight id/version/hash match classes through the single production conditional-delete owner used by the volatile, SQLite and PostgreSQL adapters. An absent path returns Absent before delete/history effects and repeated absence follows the same result; only an exact present token authorizes Delete. Path selection, lock and transaction correctness, SQL execution, asynchronous cancellation and durable database effects remain implementation or external TCB; this is an admission-kernel proof rather than universal backend refinement.'''
