[[bounds]]
text = '''Kani exhausts absence and all eight id/version/hash match classes through the single production conditional-delete owner used by the volatile, SQLite and PostgreSQL adapters. Delete is authorized exactly for a present head whose id, version and hash all match; the adapters consume that decision inside their existing path-selected lock or transaction. Actual path selection, lock and transaction correctness, SQL deletion/history atomicity, asynchronous cancellation and durable database effects remain implementation or external TCB; this is an admission-kernel proof rather than universal backend refinement.'''
