[[bounds]]
text = '''Kani exhausts absence and all eight id/version/hash match classes through the single production conditional-delete owner used by the volatile, SQLite and PostgreSQL adapters. Any present id, version or hash mismatch returns Conflict before delete/history effects; only an exact token authorizes Delete. Path selection, identity/version/hash decoding, lock and transaction correctness, SQL execution, asynchronous cancellation and durable database effects remain implementation or external TCB; this is an admission-kernel proof rather than universal backend refinement.'''
