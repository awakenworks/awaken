[[bounds]]
text = '''ADR-0071 per-Agent publication and catalog lifecycle; one Agent/Workspace, authored/prepared/current revisions 0..3, durable and registered histories subsets of 1..3, current availability Boolean. Repeated/delayed registration and positive authored withdrawal commands are interleaved without fairness or delivery guarantees.'''

[[bounds]]
text = '''Source freshness is required at durable publication CAS, not at delayed catalog delivery. Independent accepted-source and rejected-durable-frame observations distinguish both outcomes; exact historical registrations never roll current back or revive an equal tombstone.'''

[[bounds]]
text = '''The sole production ConfigRegistry/ScopedConfigRegistry publication write accepts the StoredPublication without an independent expected revision; SQLite and PostgreSQL derive PublicationSourceAdmission from publication.source_revision inside their existing transaction. A dedicated PublicationWrite receipt is returned only after commit, and ConfigService calls the sole registrar only when that receipt exactly matches the same publication revision. The redundant unfenced production write was removed; test-support retains explicit history injection only for codec, migration and quarantine fixtures.'''

[[bounds]]
text = '''Installed generation is the legacy obligation name for the current Agent lifecycle revision, not the retired whole-catalog installation protocol. Durable projection cursor sequencing, crash recovery and full-replay replacement are outside this model; authoritative database history is assumed not to regress.'''

[[bounds]]
text = '''Direct Kani uses fixed Kani 0.67 and the qualified default-equivalent CaDiCaL backend with no user assumptions or stubs: publication_source_admission_requires_present_exact_revision exhausts Option<u64> current x u64 embedded source and passes 150 checks; publication_registration_requires_exact_commit_receipt exhausts committed/conflict kind, both full-width revisions and optional conflict observation and passes 105 checks. Native cross-checks cover 42 numeric boundary pairs, sixteen source-admission frames per real SQL adapter with empty/populated publication history, exact retry and zero rejected durable writes. The async ConfigService decision table separately observes zero registrar calls and an unchanged live catalog for both StaleRevision(8) and a malformed committed-revision receipt. ConfigActivation still supplies bounded delayed-delivery/history/withdrawal composition with 6/6 semantic mutants killed and 5/5 independent reachability witnesses. SQL isolation, locking, commit durability, serialization, async scheduling and transport remain declared TCB rather than Rust theorems.'''
