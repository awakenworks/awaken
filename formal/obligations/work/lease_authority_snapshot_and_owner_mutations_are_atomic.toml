[[bounds]]
text = '''Unbounded inductive invariant stated in the linked TLAPS proof; adapters remain outside the theorem.'''

[[bounds]]
text = '''The test-support in-memory WorkQueue now holds its existing Work rows, token digests and LeaseBook inside one aggregate mutex for complete commands and snapshots. Four real-port Loom scenarios with two competing threads and at most two preemptions cover release/wake/reacquire, token authentication/reclaim, owner teardown/reclaim and renewal/reclaim. The prior implementation fails both release and token-authentication scenarios. This is bounded reference-adapter concurrency evidence, not proof of SQL isolation, arbitrary schedules, token entropy or whole-queue implementation refinement; the abstract theorem grade is unchanged.'''

[[bounds]]
text = '''The unbounded TLAPS invariant remains abstract. Production durable claim/reclaim and exact Session release now read and mutate lease authority inside one SQLite Immediate transaction or one PostgreSQL environment-row/row lock transaction; the reference LeaseBook snapshots owner, epoch, and lease presence under its single authority mutex.'''

[[bounds]]
text = '''This remains below direct grade: the existing Kani kernels prove cutoff arithmetic, epoch arithmetic, mutation admission, and exact Session release admission, but no production-called kernel yet represents the complete claim, renew, reclaim, release authority tuple transition. Database and mutex linearizability remain TCB, not Kani proof.'''

[[bounds]]
text = '''The Work store's production-called tuple transition is the single decision owner for claim, renew, reclaim and exact release. Kani exhausts arbitrary u64 epochs, optional owner/refreshed/expiry fields, command classes and exact/mismatched authority: every applied result is either one complete authority tuple or one complete clear; claim advances exactly once without wrapping; renew preserves owner/epoch; reclaim and exact release clear without changing epoch; mismatched renew/release stutter.'''

[[bounds]]
text = '''SQLite Immediate transactions, PostgreSQL row/environment locks and the LeaseBook authority mutex are the linearization TCB. The kernel does not prove database engine behavior, clock truth, lock fairness, or physical durability.'''
