[[bounds]]
text = '''LiveInbox::next_message_id is the sole production identity issuer over the private State frontier. Kani exhausts every retired/current u64 pair without assumptions: whenever a retired id is at or below the frontier, the next accepted id is strictly greater; u64::MAX refuses issuance instead of wrapping.'''

[[bounds]]
text = '''The native cause/effect table retires ids through both remove and boundary drain, then cross-checks later accepted ids against both retired values. The exhaustion test, concurrent-offer uniqueness test and close admission table cover refusal, serialization and the absorbing terminal path.'''

[[bounds]]
text = '''The direct proof covers identity non-reissuance from the private monotonic frontier. It does not prove Mutex poisoning or scheduling, VecDeque allocation, durable delivery, process replacement, or the linked TLA model as a Rust refinement.'''
