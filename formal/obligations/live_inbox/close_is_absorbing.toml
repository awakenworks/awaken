text = '''InboxLifecycle is the sole production close/admission owner used by Offer, Wake, Remove, Replace, Reorder and Close while the existing State mutex is held. All six mutation paths share the same operation-independent admission fence. Kani exhausts the complete two-state lifecycle without user assumptions: Closed rejects mutation, Close always reaches Closed, and repeated Close remains Closed.'''

