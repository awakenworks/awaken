[[bounds]]
text = '''The production reservation-to-receipt plan is called only after reserve_session_run returns and Kani exhausts all five reservation classes, optional prior receipt and arbitrary u64 epochs. Reserved rows without a receipt select exactly one root activity commit; exact non-zero receipts are reused; zero fails closed; AlreadyActivated uses only its bound epoch; recovery/completed rows cannot open activity. The activity kernel independently proves every admitted epoch is non-zero and strictly advances the current fence.'''

[[bounds]]
text = '''Runtime reservation durability/order, receipt lookup, root idempotency/CAS, SQL transaction behavior and async cancellation remain TCB. The kernels directly constrain the post-reservation decision and distinguish reservation replay from activity-receipt replay; they do not prove a cross-store transaction or universal async refinement.'''
