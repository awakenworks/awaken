[[bounds]]
text = '''ToolResultProtocol exhausts the finite domains in its configuration, including an action property that a retained key fingerprint never changes. Three semantic model mutants and two accepted/closed reachability witnesses qualify append-at-most-once, replay retention and conflict stutter.'''

[[bounds]]
text = '''The existing actual Managed replay table also controls five SQLite schedules: initial key lookup Absent, Runtime recovery read already in flight, another replica commits exact/changed-body/changed-data-subject/closed identity or no winner, then that read returns Unavailable. The sole admission error reclassification returns the complete original wire receipt, idempotency conflict, closed-admission error, or original typed dependency error respectively. Full durable root and lifecycle outbox equality, canonical complete cache-content plus publication-revision equality, and no additional Runtime recovery reads are checked after the winner. Pre-win recovery I/O is explicitly permitted.'''

[[bounds]]
text = '''The five measured observations are checked against the same model retry decision and complete observed effect frames, with ten semantic trace mutants and twenty rule-coverage mutants. Existing application restart and root-CAS competition tests remain the actual at-most-once cross-check. This bounded trace relation is not a universal Rust/SQL/async refinement or a proof of fingerprint collision resistance; both obligations retain model_linked and abstract_model_checked.'''

[[bounds]]
text = '''Kani exhausts the production admission plan and proves that AppendAccepted or AppendClosed is selected exactly when the retry identity is absent; every accepted, closed, or conflicting retained identity is non-appending. The production resolver directly consumes that plan, commits through the sole Session root CAS, and reloads after a CAS conflict; Rust tests cover exact warm/cold retries, equal/conflicting concurrent calls, and a committed-but-reported-conflict reload with one retained batch and one revision advance. Trusted snapshot facts, root-CAS/transaction atomicity and durability, Vec semantics, and async cancellation remain outside the pure-kernel proof; no Rust-to-SQL refinement or transport guarantee is claimed.'''
