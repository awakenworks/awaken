[[bounds]]
text = '''Existing production kernels separately prove immutable first commit observation, exact activity removal/last-active closure and claim-fenced Dispatch settlement with an empty physical slot. Production sequencing observes committed Runtime truth, invokes the Session settlement observer, then performs the Dispatch CAS; Event reconciliation later persists its processed marker.'''

[[bounds]]
text = '''The sole User Event settlement plan is stored in the Session contract and consumed by the existing Session aggregate mutation. Kani exhausts command identity, arbitrary activity and commit coordinates, processed/activity state and absent/exact/successor/stale receipts: a matching User Event with no recorded receipt and an active epoch applies, including the supported legacy stored format whose input was already processed; a processed same-Run continuation with a recorded receipt applies only with an active strictly newer epoch and non-regressing non-zero commit observation; exact inactive post-state replays and every torn/stale state rejects. The latest settlement receipt advances across approvals while User/System input anchors and first processed times stay frozen. Apply persists the terminal/Awaiting commit observation, Event processed marker and exact activity removal in one Session-root replacement; an accompanying System input from the same Run is settled there too.'''

[[bounds]]
text = '''Local Worker and remote settle HTTP invoke this aggregate mutation only after the exact Dispatch CAS reports Applied; terminal Thread truth alone leaves the Event pending. Dispatch-store CAS, Thread recovery reads, Session repository CAS/durability, async callback scheduling, process crash after Dispatch commit and before Session callback, and external database/runtime behavior remain TCB. Such a crash fails safe as pending/Running and needs replay or reconciliation for liveness; this grade does not claim cross-store transactional atomicity.'''

[[bounds]]
text = '''The input-actionability fact that gates closure is now a named production kernel (session_inputs_allow_idle) whose per-Event rule and command classification are proved by retained_input_idling_is_exactly_settled_or_only_blocked_users: any processed Event is inert; a pending ordinary User is inert in every position; a pending System is inert exactly while the User whose reservation froze it is still pending; every other pending kind blocks. All five command variants are checked against the class each maps to, over values of the real type. What stays outside: the fold that applies the rule -- Iterator::all over one batch's entries and over a Session's batches, disjoined with all_events_processed -- because a non-empty Vec<SessionEventEntry> does not complete under Kani in this crate (one bare command verifies in 0.15s; the same command inside one Vec does not finish in 400s), the same wall terminal_batch_resolution_empty documents. The fold is covered by the executable decision tables in the module and in crate::tests::event_batches.'''
