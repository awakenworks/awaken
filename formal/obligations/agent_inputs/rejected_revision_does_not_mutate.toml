[[bounds]]
text = '''The existing private production revision decision is the sole revision admission consumed by the opaque borrowed write plan. Kani exhausts every Option<i64> current revision, every i64 attempted revision and both aggregate-equality classes: nonpositive, stale, skipped, changed same-revision, corrupt-current and exhausted attempts return their exact typed rejection and cannot yield a write decision. The same harness already owns exact successor and replay properties; it is reused here rather than duplicating that kernel or its proof.'''

[[bounds]]
text = '''This production-kernel proof establishes rejection before a write plan exists. It does not execute a SQL driver or prove database transaction refinement. SQLite IMMEDIATE and PostgreSQL advisory-lock transactions consume the closed Replay/Write admission, while trigger-failure, exact-replay, concurrent-writer and reopen tests check that rejected or aborted writes preserve durable content. SQL predicate interpretation, serialization, locking, rollback, durability and crash behavior remain executable evidence or external.database_engine_correctness TCB.'''
