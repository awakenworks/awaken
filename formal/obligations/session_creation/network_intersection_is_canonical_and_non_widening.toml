[[bounds]]
text = '''TLAPS proves canonical meet algebra over arbitrary host sets and six indexed-sequence selection properties: source membership, exact intersection, canonical hosts, exact canonical meet, order and uniqueness. Complete source-position selection, increasing positions and injectivity are explicit mathematical premises; three witnesses show that incomplete, reordered or duplicate selection breaks the corresponding result. This is not checked universal refinement of Rust library calls.'''

[[bounds]]
text = '''TLC explores three canonical host identities plus a non-host blank sentinel; an 84-case sequence oracle qualifies content binding, completeness, ordering and injectivity. Five model mutants and eight production mutants are rejected. Native normalization exhausts 16,515 policies with zero to two one-byte ASCII hosts; intersection covers 25,281 ordered pairs over twelve representative bytes. Unicode property tests and SQLite Session readback also exercise production normalization.'''

[[bounds]]
text = '''Direct Kani calls the actual normalization and safe_intersection kernels: five normalization partitions cover all 16,515 raw policies; 25 disjoint intersection partitions cover all 272,745,225 ordered pairs. Each raw policy is None, Unrestricted or an allowlist of zero to two one-byte ASCII strings, with every occupied byte independently ranging over 0..127. Real String/Vec sorting, deduplication, blank removal with retain, binary search, intersection filtering and owned Drop run with unwind 3 and default checks, without stubs or proof cuts. Exact result bitmap, enum representation, strict order and uniqueness are checked. Input construction is independently exhausted, 144 native size/order cases extend to 257 hosts, and actual Kani no-fold, no-dedup and widening mutants fail the intended semantic assertions. Empty-string host inputs, multi-byte strings, lists longer than two, arbitrary String/Vec refinement, DNS semantics, persistence and physical network enforcement are outside this bounded production-kernel grade.'''
