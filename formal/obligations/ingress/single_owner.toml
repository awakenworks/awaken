[[bounds]]
text = '''The assumption-free Kani harness exhausts every production DispatchState, cancellation bit and u64 epoch in the canonical DispatchTransition::claim reducer. An ordinary runnable row produces exactly one Leased transition at epoch+1; excluded reservation and closed states produce no claim, and u64::MAX fails closed. The proof covers this pure transition kernel, not adapter serialization or a universal Rust-to-TLA refinement.'''

[[bounds]]
text = '''RunIngress.cfg finitely checks the same one-row ownership invariants with two owners and MaxEpoch=4. The shared conformance table executes fresh, live-boundary and strictly expired claims through Memory, SQLite and live PostgreSQL; a separate PostgreSQL cross-connection race requires one winner for same-Thread pending work, and the required PostgreSQL gate runs the complete ingress suite.'''

[[bounds]]
text = '''The Memory mutex, SQLite immediate transaction, PostgreSQL row/advisory locks, SKIP LOCKED selection and unique constraints atomically install the owner, epoch, expiry and frozen bindings. Their database isolation, driver decoding, async scheduling and arbitrary cross-process interleavings remain TCB or executable evidence rather than production-kernel proof.'''
