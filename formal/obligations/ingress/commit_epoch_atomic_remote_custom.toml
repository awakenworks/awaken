[[bounds]]
text = '''The remote and embedded commit paths consume the same production CommitEpochGuard admission and release-completion kernels. Kani exhausts complete exact-claim admission and the Boolean release-completion decision; the production async release_after state machine is checked by its pending, success, and failure native decision table, not by Kani.'''

[[bounds]]
text = '''The real HTTP decision table covers missing Worker identity, a stale Dispatch epoch after same-incarnation reclaim, a current fresh commit, and exact replay. The existing Runtime Host child-commit table separately covers Run, Thread, operation, payload, and physical-parent partition binding.'''

[[bounds]]
text = '''The proof is limited to the shared repository-owned admission/release kernels. Database row/advisory-lock isolation and durability, async executor and driver behavior, HTTP authentication and delivery, and OperationCoordinator atomicity remain executable evidence or TCB; no universal whole-process refinement or exactly-once external effect is claimed.'''
