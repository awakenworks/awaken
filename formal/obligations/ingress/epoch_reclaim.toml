[[bounds]]
text = '''The assumption-free Kani harness exhausts every production DispatchState, cancellation bit and u64 epoch in the canonical DispatchTransition::claim reducer. Every incrementable Pending, Awaiting or Leased row becomes Leased at exactly epoch+1, while an exhausted epoch fails closed and no reserved or closed row is reopened. The proof covers epoch minting in this pure kernel; lease-expiry eligibility and adapter transactions remain outside it.'''

[[bounds]]
text = '''RunIngress.cfg finitely checks claim and reclaim with two owners and MaxEpoch=4. The canonical shared cause/effect table executes a fresh claim, live and exact-deadline rejection, strictly expired reclaim, frozen-request preservation, exact epoch+1, stale settlement fencing and current settlement through Memory, SQLite and live PostgreSQL. Its concurrent retry-exhaustion row additionally requires exactly one successor epoch; normalized Memory/SQLite/PostgreSQL crash histories cross-check the substrates.'''

[[bounds]]
text = '''Store clocks decide strict expiry, and each adapter applies eligibility, owner replacement, epoch advancement, expiry and frozen binding persistence under its existing mutex or SQL transaction. Clock correctness, database isolation and durability, SQL/driver behavior, asynchronous scheduling, arbitrary crashes and eventual worker progress remain TCB or executable evidence; no Rust-to-TLA refinement or exactly-once external execution is claimed.'''
