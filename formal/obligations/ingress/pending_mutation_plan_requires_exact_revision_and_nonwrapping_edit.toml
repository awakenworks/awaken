text = '''Memory invokes the planner under its state mutex; SQLite under BEGIN IMMEDIATE; PostgreSQL after its exact pending-row SELECT FOR UPDATE in the same transaction as UPDATE/DELETE. Concrete domain-boundary and shared race tests bind planner output to retained bytes and revision. The PostgreSQL fault case uses two independently observed blocked backend pids to force the old read/write window. These adapter schedules do not prove SQL/Tokio/driver refinement or arbitrary database isolation.'''
