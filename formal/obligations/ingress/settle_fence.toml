[[bounds]]
text = '''The named Kani harnesses exhaust the production DispatchTransition state, u64 epoch, logical outcome and physical-attempt-slot domains: every unequal epoch fences, and an exact current epoch removes only Done or transitions only to Awaiting when the physical slot is empty. Fixed Kani 0.67.0 with the qualified patched CBMC/CaDiCaL backend reverified the assumption-free stale harness with 161 checks and zero failures in 0.07831255 seconds of verification and 1.79 guarded seconds, at 352812 KiB maximum RSS and 50181888 KiB minimum MemAvailable under 600-second, 12-GiB RSS and 12-GiB available-memory guards with -j1 and RUSTC_WRAPPER empty.'''

[[bounds]]
text = '''RunIngress.cfg finitely model-checks the canonical RunIngressKernel with two owners and MaxEpoch=4; the abstract stale-settle action is a full state stutter, but no Rust-to-TLA refinement is implied.'''

[[bounds]]
text = '''One shared cause/effect table executes stale and current Awaiting/Done settlement through Memory, SQLite and live PostgreSQL adapters, observing dispatch state, exact pending-input consumption, completion tombstones and subsequent wake eligibility. The required PostgreSQL gate runs the complete ingress suite when configured.'''

[[bounds]]
text = '''Kani proves the shared reducer, not database transactions. Native conformance does not prove SQL engine isolation, WAL/fsync or power-loss durability, driver decoding, arbitrary cross-process schedules, clock correctness or eventual worker scheduling.'''
