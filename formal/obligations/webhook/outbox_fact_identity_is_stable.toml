[[bounds]]
text = '''The sole production WebhookOutboxNotifier consumer wraps each ManagedLifecycleFact returned by pending_lifecycle in one borrowed PendingLifecycleFact admission. The exact same borrow supplies delivery and, only after success, the complete_lifecycle identity; the notifier cannot mint or substitute an identity. Kani exhausts both delivery outcomes over an arbitrary u64 identity, including exact reference identity and repeated failure. Native end-to-end tests cover unchanged String identity through event projection and completion-failure replay. SQL row decoding/key consistency, transaction isolation, durability, process recovery, Tokio scheduling and receiver-side deduplication remain executable evidence or TCB, not universal Rust refinement.'''
