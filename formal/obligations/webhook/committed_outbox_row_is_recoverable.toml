[[bounds]]
text = '''The finite TLA+ crash/restart model preserves a committed pending fact, but has no Rust-to-model refinement. The strict formal gate runs a real SQLite process-crash decision table: it kills a child after create returns and before notification, then opens a fresh production adapter and observes the exact revision-one aggregate and pending fact before idempotent completion. The child marker selects the post-commit kill boundary but is not persistence evidence; recovery is read only from the reopened database after process termination. That executable witness does not prove power-loss/fsync behavior, arbitrary crash coordinates, PostgreSQL restart recovery, database correctness, scheduler progress or eventual external delivery.'''
