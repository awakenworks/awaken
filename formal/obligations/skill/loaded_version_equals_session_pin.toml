[[bounds]]
text = '''The linked SkillVersionPin TLA+ model remains finite independent cross-evidence and is not claimed as Rust refinement.'''

[[bounds]]
text = '''SkillExecutionPin::admits is the single Session-contract load-admission owner. It projects the concrete custom-kind, Workspace, Skill id, version and bundle-hash comparisons into skill_pin_facts_match; validate_skill_bundle consumes that decision before returning the same owned SkillVersion and separately recomputes the bundle digest. StoreSkillBundleSource fetches exactly binding.version and both local and HTTP Runtime Host paths reuse the same validator instead of consulting a current catalog.'''

[[bounds]]
text = '''Kani exhausts all 32 independent Boolean combinations of the five production admission facts without assumptions. skill_execution_pin_requires_exact_workspace_revision_and_hash completed its sole harness with zero failures using fixed Kani 0.67.0 e43ae2c, patched CBMC 6.8.0 cdee49/CaDiCaL, -j1 and RUSTC_WRAPPER empty in 12.05 guarded seconds at 655872 KiB maximum process RSS, 138984 KiB sampled peak aggregate tree RSS and 50805068 KiB minimum available memory under 600-second, 12582912-KiB RSS and available-memory guards.'''

[[bounds]]
text = '''The native Session-contract decision table covers exact acceptance, custom-kind/Workspace/version substitution and changed bytes. The Runtime Host test resolves v1, publishes v2, then loads the frozen v1; the real HTTP table adds claim, incarnation, binding and returned-byte substitution. Exact source mutants that omit the version comparison or fetch the successor ordinal are rejected by the respective decision-table and Runtime Host tests, then restored byte-for-byte.'''

[[bounds]]
text = '''This direct proof establishes exact load admission at the production kernel. It does not prove Rust String equality, SHA-256 collision resistance, repository lookup honesty, database/filesystem durability, HTTP authenticity or completeness, async cancellation/scheduling, Session manifest persistence, remote Worker behavior or arbitrary retirement and purge histories. Those remain native evidence, explicit external boundary or database/async TCB. skill.pinned_version_survives_retirement is covered separately by the Skill-store retirement kernel and its immutable-history frame; the two local proofs do not establish end-to-end composition across Session persistence, repository I/O or physical purge.'''
