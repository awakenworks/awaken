[[bounds]]
text = '''The linked SkillVersionPin TLA+ model remains finite independent cross-evidence and is not claimed as Rust refinement.'''

[[bounds]]
text = '''SkillExecutionPin::admits is the single Session-contract pin-admission owner. It projects concrete custom-kind, returned-Workspace, Skill-id, version and declared bundle-hash comparisons into skill_pin_facts_match. validate_skill_bundle rejects before returning the owned SkillVersion unless all five facts match, then independently recomputes the bundle digest. StoreSkillBundleSource and HttpSkillBundleSource both call that owner; repository production composition injects only those sources and has no current-catalog fallback.'''

[[bounds]]
text = '''The fresh Kani run already recorded for skill.loaded_version_equals_session_pin is reused rather than repeated: it exhausts all 32 independent Boolean combinations, including both workspace and declared-hash axes, without assumptions. skill_execution_pin_requires_exact_workspace_revision_and_hash completed its sole harness with zero failures using fixed Kani 0.67.0 e43ae2c, patched CBMC 6.8.0 cdee49/CaDiCaL, -j1 and RUSTC_WRAPPER empty in 12.05 guarded seconds at 655872 KiB maximum process RSS, 138984 KiB sampled peak aggregate tree RSS and 50805068 KiB minimum available memory under 600-second, 12582912-KiB RSS and available-memory guards.'''

[[bounds]]
text = '''The Session-contract cause/effect table rejects a foreign returned Workspace, a mismatched declared pin hash and changed bundle bytes. The real HTTP table uses schema-valid responses to reject both a foreign returned Workspace and bytes whose retained declared hash no longer matches their recomputed digest. Exact source mutants that omit the workspace comparison, omit the declared-hash comparison or skip digest recomputation are rejected by those tests, then restored byte-for-byte.'''

[[bounds]]
text = '''The direct proof establishes fail-closed admission for the concrete workspace-equality and declared-hash-equality facts at the shared production kernel. It does not prove Rust String equality, SHA-256 implementation or collision resistance, the later bundle digest recomputation, arbitrary injected SkillBundleSource honesty, repository lookup correctness, database/filesystem durability, HTTP authenticity/completeness, async cancellation/scheduling, Session manifest persistence or remote Worker behavior. Digest integrity and transport/store behavior remain native evidence, explicit adapter boundary or database/async TCB rather than consequences of the Boolean proof.'''
