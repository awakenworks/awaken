[[bounds]]
text = '''remove_version_from is the sole production Skill-version retirement owner used by the in-memory, filesystem, SQLite and PostgreSQL adapters. Its complete transition receives immutable version history only as a shared BTreeMap borrow, so Rust type checking prevents removal or mutation of pinned SkillVersion bytes while the owner may update only retired_versions and latest_version. The production decision kernel classifies deleted, absent, already-retired, only-visible and retire-visible states; corrupt zero-visible input fails closed.'''

[[bounds]]
text = '''Kani exhausts the complete Boolean fact domain and the full usize visible-count domain without assumptions. skill_version_retirement_is_visibility_only_and_total completed its sole harness with zero failures and 0/13 failed properties using fixed Kani 0.67.0 e43ae2c, patched CBMC 6.8.0 cdee49/CaDiCaL, -j1 and RUSTC_WRAPPER empty in 4.72 guarded seconds at 322912 KiB maximum process RSS, 116256 KiB sampled peak aggregate tree RSS and 52588848 KiB minimum available memory under 600-second, 12582912-KiB RSS and available-memory guards. The backend cause/effect table verifies successful, repeated, absent and only-visible retirement against exact SkillVersion equality. Filesystem and SQLite reopen checks cross serialization and confirm the retired ordinal stays hidden from listings but remains exactly addressable.'''

[[bounds]]
text = '''This direct proof covers only the version-retirement transition and its type-enforced immutable-history frame. It does not prove BTreeMap, Rust borrow-checker or compiler soundness, filesystem syscalls or crash durability, database locking/transactions/durability, async cancellation/scheduling, Session pin persistence/reference-index completeness, reclaimer composition, or whole-Skill tombstone and physical purge histories.'''
