[[bounds]]
text = '''The two durable adapters reuse the same contract-owned audit and effect kernels and keep the exact audit row lock, generation check, optional effect insert, immutable draft revision and audit committed-state update inside one backend transaction. Kani exhausts every signed audit-state and effect-revision value plus every presence/equality class: only an exact pending audit may write, an exact committed audit replays, an effect inserts only when absent and positive, and a stable effect identity cannot be replaced.'''

[[bounds]]
text = '''SQLite process-kill tests exercise both the pre-business-intent and post-transaction/pre-response crash boundaries; SQLite and PostgreSQL decision tables cover absent intent, exact apply/replay, generation conflict and one pending effect. ResourceBindingEffect remains the bounded concurrency model. Kani does not prove SQL statements, serialization, locks, transaction isolation, fsync or crash durability; those remain executable adapter evidence and external database-engine TCB.'''
