[[bounds]]
text = '''The Config Store's one typed ManagementEffect::requires_enqueue authority now consumes a closed production decision kernel. Kani exhausts revision validity, pending-row presence and complete-payload equality: an absent valid identity inserts, an exact retry stutters, changed content conflicts, and every nonpositive revision rejects. Both SQLite and PostgreSQL already delegate to this same method while holding their existing transaction, so no adapter owns a replay policy.'''

[[bounds]]
text = '''The existing confirmation and retirement kernels require positive exact readback and a still-present matching receipt before deletion. Domain and backend decision tables cover complete typed-payload changes, Workspace isolation, response loss, stale and ABA receipts, and successor preservation. Structural Rust equality, JSON and SQL decoding, transaction isolation and durability, process crashes, and all asynchronous schedules remain executable evidence or database TCB, not universal Kani refinement.'''
