[[bounds]]
text = '''Two production classifiers compose the deletion admission used by both SQLite and PostgreSQL. The Agent Config harness exhaustively proves every i64 revision and payload-equality class: a receipt matches only a positive exact effect. The Config Store harness exhaustively proves both current-row-presence and receipt-match classes: retirement is admitted exactly when the row remains present and matches that receipt.'''

[[bounds]]
text = '''Both adapters hold their existing transaction from current-row observation through deletion and consume the shared Config Store admission. Domain decision-table tests exercise typed payload equality, while SQLite and shared backend conformance tests cover absence, exact replay, Workspace isolation, stale or ABA receipts and successor preservation; control reconciler tests cover missing, changed and failed readback followed by retry convergence. Kani does not universally refine heap or JSON equality, database locking or durability, external AgentInput storage, process crashes or all asynchronous schedules.'''
