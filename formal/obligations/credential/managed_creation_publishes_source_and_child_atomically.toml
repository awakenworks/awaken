[[bounds]]
text = '''The shared production ManagedCredentialCommitPlan is the only value projection consumed by InMemory, SQLite and PostgreSQL commit paths. Its Kani harness calls the real plan for all four operations, full signed source revisions and unsigned child revisions, and proves every admitted plan contains the exact Source, exact child, the same mutation advanced only to Reclaiming, plus the operation-derived rollout. The InMemory lock and each SQL adapter transaction apply that complete plan as one boundary; process-crash and three-backend conformance remain executable composition evidence. Kani does not interpret SQL, prove database crash atomicity, affected-row truth or engine isolation; those properties remain under external.database_engine_correctness rather than being inferred from the value proof.'''
