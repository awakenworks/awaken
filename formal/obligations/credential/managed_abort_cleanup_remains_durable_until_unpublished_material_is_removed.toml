[[bounds]]
text = '''Finite constants and state constraints in the linked TLA+ model configuration; no Rust-to-model refinement is implied.'''

[[bounds]]
text = '''Kani checks all four cleanup phases and unconstrained exact-authority/published/unpublished boolean projections. Typed envelope equality is covered by decision-table tests, not proved universally; adapters must read and mutate under one transaction. External SecretStore completion and full recovery refinement remain outside this scalar proof.'''

[[bounds]]
text = '''Source creation projects the canonical material-attempt model (two intents, owner epochs 0..3); physical deletion and exact absence before WAL retirement are separate actions. Tracked material excludes unreachable late-writer orphans, which remain report-only. Kani proves phase/set-membership selection, not heap set construction, external readback truth, SQL/SecretStore atomicity or universal recovery refinement.'''

[[bounds]]
text = '''Ready recovery now shares one candidate-material read decision across Source and Managed: retained references are not reopened, missing new material selects abort, and unavailable reads preserve retry. Cause/effect tests cover all new-reference/presence/unavailability combinations and the 3x3 pair of candidate observations, including missing followed by unavailable; existing full recovery and three-backend suites check WAL outcomes. This is executable composition evidence, not a proof of external read truth or async refinement.'''

[[bounds]]
text = '''One production material_input_facts projection replaces four Source/Managed fresh/recovery computations. Preparation, admission and Ready recovery also share one borrowed candidate-delta iterator; the independent 5184-row executable oracle checks candidate order and repeated new aliases as well as membership. Material lifecycle sets use SecretRef byte-lexical identity order; cleanup consumes the unique sorted BTreeSet union directly instead of HashSet plus Vec sorting. The no-predecessor Kani harness calls the actual BTreeSet/BTreeMap/String projection with primary plus one auxiliary candidate slot, six reference classes and optional attempt (collection unwind 3, builtin memcmp unwind 16; all unwinding assertions enabled), without set/comparison stubs or a proof-only hasher path. The corresponding heap proof with a predecessor remains outstanding. A 5184-row executable oracle crosses both predecessor states; a separate executable table checks empty, UUID-shaped, separator-bearing and Unicode attempt ids against the physical namespace grammar for first and later refs. The cleanup table also checks the exact unique lexical delete sequence. Arbitrary strings/collections, enclosing command validation, SQL and external material IO remain outside these bounded proofs.'''

[[bounds]]
text = '''Kani checks all four production cleanup phases and unconstrained exact-authority/published/unpublished boolean projections. ReclaimingAbort completion is admitted only for the exact durable authority after the source/child pair remains unpublished, so the WAL cannot retire from a positive cleanup response alone. Typed envelope equality is covered by decision-table tests, not proved universally; adapters must read and mutate under one transaction. External SecretStore deletion/readback truth and full recovery refinement remain explicit boundaries.'''
