[[bounds]]
text = '''Finite constants and state constraints in the linked TLA+ model configuration; no Rust-to-model refinement is implied.'''

[[bounds]]
text = '''Source creation projects the canonical material-attempt model (two intents, owner epochs 0..3); physical deletion and exact absence before WAL retirement are separate actions. Tracked material excludes unreachable late-writer orphans, which remain report-only. Kani proves phase/set-membership selection, not heap set construction, external readback truth, SQL/SecretStore atomicity or universal recovery refinement.'''

[[bounds]]
text = '''Both production services durably begin one attempt-namespaced WAL before the first material write. The shared total planner has no untracked success transition: visible publication requires Ready plus complete material; failed/incomplete work enters durable abort cleanup; unknown material or cleanup observations retain responsibility; and only a terminal phase plus confirmed absence selects RetireIntent. Kani exhausts that plan and the existing attempt, cleanup and inventory kernels.'''

[[bounds]]
text = '''The guarantee covers references reachable from committed rows or durable intents. A fenced late writer can create an attempt-namespaced orphan after its WAL retires; the existing inventory owner reports and retains it, and this row does not claim universal physical absence. SecretStore enumeration/IO and SQL execution are integration/TCB boundaries, with database behavior under external.database_engine_correctness.'''
