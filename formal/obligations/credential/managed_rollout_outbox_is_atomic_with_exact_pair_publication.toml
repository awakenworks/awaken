[[bounds]]
text = '''The finite ManagedCredentialRollout model checks pair/outbox publication atomically. Kani calls the real managed_rollout_from_committed constructor for every operation, all i64 source revisions and u64 child revisions, and fixed distinct one-character identity fields (unwind 4). Create emits no event; other operations preserve the exact payload and existing invalid-signed-revision zero fallback. This proves value projection only, not the enclosing SQL/outbox atomic transaction; the prior cfg(kani)-only pair_committed predicate was removed. Shared real-backend witnesses cover two independently valid transactions racing one event id, complete rejected-pair/WAL rollback and an unrelated event frame, with both serial orders and concurrent join; these native cases do not establish universal transaction refinement.'''

[[bounds]]
text = '''The shared production ManagedCredentialCommitPlan makes Source, child, Reclaiming WAL and optional rollout one complete adapter input instead of four independently reconstructed values. Kani calls that plan for every operation, all i64 source revisions and u64 child revisions, with distinct fixed identity fields: Create has the exact pair and WAL with no rollout; Update, Archive and Delete add the exact event identity and committed revisions. All three adapters consume this same plan under their existing one lock/transaction and reject a colliding durable event before commit. The proof covers plan completeness and exact projection, not SQL interpretation, transaction-engine atomicity, crash recovery, affected-row behavior or external rollout delivery; database behavior remains an explicit TCB and delivery remains separately proved/modelled.'''
