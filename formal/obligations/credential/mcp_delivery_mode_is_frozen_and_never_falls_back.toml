[[bounds]]
text = '''The credential contract owns the only delivery selector and exact receipt predicate. Kani exhausts every current realization-authority and material-placement class plus all receipt equality gates; the ACP client gate additionally rejects gateway delivery and every non-HTTP transport instead of selecting a fallback.'''

[[bounds]]
text = '''Session persistence and runtime adapters consume the typed selected mode and exact receipt, but arbitrary String equality, serialization, subprocess behavior, HTTP behavior and external revocation propagation are executable or TCB evidence rather than universal Kani refinement.'''
