[[bounds]]
text = '''The production claim-delivery admission kernel is exhaustively checked over duplicate/nonduplicate delivery, present/absent binding, exact/foreign claim coordinates, matching/changed immutable publication authority and present/absent recipient envelope. Exact success is equivalent to one unique existing binding with matching credential/epoch, unchanged authority and an envelope. Native decision tables additionally cover publication-envelope expiry, Vault revision/status/workspace/target revalidation, response-local delivery, immutable authority comparison, HTTP response loss/failure relinquish and exact claim-epoch transport. The Kani proof does not establish Vault/SecretStore honesty, AEAD correctness, async delivery, HTTP authentication, database lease transitions, provider revocation propagation, or eventual retry; those remain executable or external TCB.'''
