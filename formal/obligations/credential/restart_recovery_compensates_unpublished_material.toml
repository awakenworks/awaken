[[bounds]]
text = '''Finite constants and state constraints in the linked TLA+ model configuration; no Rust-to-model refinement is implied.'''

[[bounds]]
text = '''Source creation projects the canonical material-attempt model (two intents, owner epochs 0..3); physical deletion and exact absence before WAL retirement are separate actions. Tracked material excludes unreachable late-writer orphans, which remain report-only. Kani proves phase/set-membership selection, not heap set construction, external readback truth, SQL/SecretStore atomicity or universal recovery refinement.'''

[[bounds]]
text = '''The source and Managed restart reconcilers consume the same production planner: live Writing retains responsibility; expired Writing is fenced to a successor that can only abort; Ready is inspected and publishes only when complete; incomplete Ready aborts; unknown inspection retains; terminal cleanup retires only after confirmed absence. Kani covers all phase/signal/time combinations plus takeover and exact cleanup authority; process-crash and failure-injection suites exercise the async composition.'''

[[bounds]]
text = '''Scheduling fairness, SecretStore IO/readback truth, arbitrary backend races and SQL engine semantics are not Kani-proved. Errors and unknown observations preserve the WAL rather than counting as compensation; SQL durability and locking remain under external.database_engine_correctness.'''
