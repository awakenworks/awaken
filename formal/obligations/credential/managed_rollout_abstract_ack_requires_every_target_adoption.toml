[[bounds]]
text = '''The credential repository exposes one closed Converged/Pending vocabulary and the production composition used by the CLI combines the local and injected target with its sole conjunctive kernel. Kani exhausts the complete two-target progress product and every u64 current/event revision: only two Converged results acknowledge and revision selection never regresses below either observation.'''

[[bounds]]
text = '''Session discovery, iteration over an arbitrary number of Sessions, real HTTP behavior, postcommit publication and retry liveness remain executable evidence rather than universal refinement. The proof covers the current two-target composition; adding another target requires composing through the same kernel and extending the production topology evidence. Eventual acknowledgement still assumes required targets eventually remain available.'''
