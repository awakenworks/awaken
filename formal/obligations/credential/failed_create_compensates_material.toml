[[bounds]]
text = '''Finite constants and state constraints in the linked TLA+ model configuration; no Rust-to-model refinement is implied.'''

[[bounds]]
text = '''Source creation projects the canonical material-attempt model (two intents, owner epochs 0..3); physical deletion and exact absence before WAL retirement are separate actions. Tracked material excludes unreachable late-writer orphans, which remain report-only. Kani proves phase/set-membership selection, not heap set construction, external readback truth, SQL/SecretStore atomicity or universal recovery refinement.'''

[[bounds]]
text = '''The production planner maps owner write failure and incomplete Ready observation only to AbortUnpublished. Source and Managed services consume that plan by first CAS-advancing the exact unpublished WAL to ReclaimingAbort, then selecting only candidate material, and retiring the WAL only after delete plus absence readback succeeds. Kani exhausts the planner and cleanup authority/membership kernels; native failure injection covers put, delete, readback and repository failures.'''

[[bounds]]
text = '''The proof guarantees retained responsibility, not guaranteed external deletion: an abort CAS failure, SecretStore error, unknown readback or completion failure leaves the durable WAL for recovery. SecretStore operation semantics and SQL transaction execution are outside Kani; SQL behavior remains under external.database_engine_correctness.'''
