[[bounds]]
text = '''Finite constants and state constraints in the linked TLA+ model configuration; no Rust-to-model refinement is implied.'''

[[bounds]]
text = '''Source creation projects the canonical material-attempt model (two intents, owner epochs 0..3); physical deletion and exact absence before WAL retirement are separate actions. Tracked material excludes unreachable late-writer orphans, which remain report-only. Kani proves phase/set-membership selection, not heap set construction, external readback truth, SQL/SecretStore atomicity or universal recovery refinement.'''

[[bounds]]
text = '''The shared production recovery plan is consumed by both source-only and Managed mutation services. Across all four phases, nine command/supervisor observations and full u64 clock/deadline values, Kani proves that publication is selected only for Ready plus owner-completed or observed-complete material; incomplete material selects exact unpublished abort and unknown observation retains the WAL. Direct creation durably begins the exact attempt before SecretStore writes and reaches Ready only after every persist_material_exact succeeds.'''

[[bounds]]
text = '''SecretStore success/readback truth, concurrent effects after observation, SQL/map execution and crash durability are not proved by the value planner. The repository transitions and process-crash/material lifecycle tests are composition evidence; SQL behavior remains under external.database_engine_correctness. Attempt-specific late-writer orphans are unreachable from visible rows and remain inventory responsibility rather than being claimed absent.'''
