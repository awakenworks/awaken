[[bounds]]
text = '''ManagedCredentialCreation Init includes empty storage plus legacy unowned Writing rows with absent/partial/complete material. The one lease-expiry action includes recovery owners. Canonical FairSpec checks safety and conditional abort liveness for every initial partition; three semantic mutants reject lost cleanup guard, zero-to-one recovery and denied legacy claim, and three legacy-partition witnesses reach takeover, repeated takeover and abort. A fresh-partition publication witness preserves the original command path. SQLite/PostgreSQL shared tests persist missing owner fields with both absent/retained attempt IDs for Source and Managed envelopes; InMemory legacy recovery and serde tests use the same production fence. A deterministic valid-UUID collision regression fails on the former epoch arithmetic. These remain bounded model/implementation checks, not entropy, arbitrary SQL scheduling, physical IO or universal Rust refinement.'''

[[bounds]]
text = '''Actual SQLite/PostgreSQL wire fixtures cover missing writer fields, missing/retained attempt IDs and Writing/Ready/ReclaimingAbort recovery. Root update witnesses vary explicit/omitted defaults and SQLite whitespace without changing decoded Source/Managed-child snapshots, then check publication, WAL completion and rollout acknowledgement. The existing lock plus full decoded-row admission is the sole snapshot CAS after removing redundant JSON encoding predicates; keyed ownership, insert conflict and affected-row checks remain. These executable witnesses do not establish universal SQL serializability or legacy-data correctness.'''

[[bounds]]
text = '''Kani calls the production material-fence phase methods with all four phases, full u64 epoch/deadline and u8 format values, and independent empty/a/b attempt and writer Strings (unwind 4). Successful phase changes preserve every other fence field and original-writer admission. The recovery-plan harness checks all four phases, nine signals and arbitrary u64 times for publication, retirement, unknown-result and owner-failure safety. Separate fixed-boundary Writing and Ready harnesses call the production phase methods and show successful selected actions reach abort or published cleanup. Random token generation, arbitrary-length String refinement, envelope CAS, SecretStore IO, scheduling fairness and end-to-end recovery remain outside these proofs.'''

[[bounds]]
text = '''The production claim transition accepts a lazy token factory; the public wrapper retains UUID generation. Kani partitions T1 non-Writing/live precedence, T2 invalid successor, T3 exhausted epoch, and T4 successful takeover, instead of multiplying those independent causes in one solver query. T4 retains a symbolic non-MAX u64 epoch, u8 format and independent empty/a/b attempt, old and replacement tokens; it proves one token call, exact successor epoch/deadline, complete remaining-field preservation, and abort-only continuation even on token collision. The existing executable takeover decision table covers zero, ordinary and u64::MAX time boundaries through the actual production method, including token-call order; arbitrary full-width time equivalence is not claimed Kani-proved. A separate valid-UUID collision regression covers that wire-shaped case. Six redundant adapter Writing checks are removed only after successful claim plus full locked snapshot equality. One shared Source/Managed x InMemory/SQLite/PostgreSQL table covers absent/live/non-Writing/error/stale snapshots including independently validated payload-only changes, competing claimants, two successive takeovers, stale Ready/abort rejection and terminal cleanup. These executable CAS witnesses do not prove SQL isolation, entropy, arbitrary strings, external IO or universal recovery refinement.'''
