[[bounds]]
text = '''Finite constants and state constraints in the linked TLA+ model configuration; no Rust-to-model refinement is implied.'''

[[bounds]]
text = '''Kani calls the production material-fence phase methods with all four phases, full u64 epoch/deadline and u8 format values, and independent empty/a/b attempt and writer Strings (unwind 4). Successful phase changes preserve every other fence field; original-writer admission, abort-only successors and exact expiry recovery dispatch are checked. The concrete takeover regression exercises UUID-bearing claim, invalid lease and epoch exhaustion. Random token generation, arbitrary-length String refinement, envelope CAS, SecretStore IO and end-to-end recovery remain outside these proofs.'''

[[bounds]]
text = '''ManagedCredentialCreation Init includes empty storage plus legacy unowned Writing rows with absent/partial/complete material. The one lease-expiry action includes recovery owners. Canonical FairSpec checks safety and conditional abort liveness for every initial partition; three semantic mutants reject lost cleanup guard, zero-to-one recovery and denied legacy claim, and three legacy-partition witnesses reach takeover, repeated takeover and abort. A fresh-partition publication witness preserves the original command path. SQLite/PostgreSQL shared tests persist missing owner fields with both absent/retained attempt IDs for Source and Managed envelopes; InMemory legacy recovery and serde tests use the same production fence. A deterministic valid-UUID collision regression fails on the former epoch arithmetic. These remain bounded model/implementation checks, not entropy, arbitrary SQL scheduling, physical IO or universal Rust refinement.'''

[[bounds]]
text = '''Actual SQLite/PostgreSQL wire fixtures cover missing writer fields, missing/retained attempt IDs and Writing/Ready/ReclaimingAbort recovery. Root update witnesses vary explicit/omitted defaults and SQLite whitespace without changing decoded Source/Managed-child snapshots, then check publication, WAL completion and rollout acknowledgement. The existing lock plus full decoded-row admission is the sole snapshot CAS after removing redundant JSON encoding predicates; keyed ownership, insert conflict and affected-row checks remain. These executable witnesses do not establish universal SQL serializability or legacy-data correctness.'''

[[bounds]]
text = '''Kani calls the production material-fence phase methods with all four phases, full u64 epoch/deadline and u8 format values, and independent empty/a/b attempt and writer Strings (unwind 4). Successful phase changes preserve every other fence field; original-writer admission, abort-only successors and exact expiry recovery dispatch are checked. The recovery-action harness additionally proves that, once Writing is expired and each selected repository/external action succeeds, Writing and Ready reach the corresponding cleanup action in one production phase transition. Random token generation, arbitrary-length String refinement, envelope CAS, SecretStore IO, scheduling fairness and end-to-end recovery remain outside these proofs.'''

[[bounds]]
text = '''The production claim transition accepts a lazy token factory; the public wrapper retains UUID generation. Kani checks all phases, full u64 time/epoch and u8 format, independent empty/two valid 32-byte UUID old/attempt/new tokens (unwind 36), None/error precedence, exactly one token call on eligible attempts, exact normalized successor epoch/deadline and complete remaining-field preservation. Zero and one both advance to two; higher epochs advance exactly once. Every successor is abort-only even with a repeated token. Six redundant adapter Writing checks are removed only after successful claim plus full locked snapshot equality. One shared Source/Managed x InMemory/SQLite/PostgreSQL table covers absent/live/non-Writing/error/stale snapshots including independently validated payload-only changes, competing claimants, two successive takeovers, stale Ready/abort rejection and terminal cleanup. These executable CAS witnesses do not prove SQL isolation, entropy, arbitrary strings, external IO or universal recovery refinement.'''
