[[bounds]]
text = '''ManagementAuditRecord now owns the sole production identity constructor and borrowed tuple projection. Its generic reducer preserves the two opaque coordinates without parsing, hashing or concatenation. Kani exhausts all u64 values for the original and candidate tool/call coordinates and proves that an exact replay is stable and another projection is equal exactly when both coordinates are equal, covering all four coordinate-equality classes without assumptions or stubs.'''

[[bounds]]
text = '''Fixed Kani 0.67.0 with the qualified CBMC/CaDiCaL backend completed the named harness with 14 checks, zero failures and 0.022919169 solver seconds in 7.636 guarded seconds, under one job, empty RUSTC_WRAPPER, a 600-second deadline and 12-GiB memory ceiling.'''

[[bounds]]
text = '''Admin Assistant constructs this record from the Runtime-owned operation id (or its direct-invocation fallback), the protected HTTP edge constructs it from the request identity, and both SQLite and PostgreSQL consume the same identity projection for begin, lookup and commit inside their existing transactions. Native decision tables cross clone and JSON round-trip, empty/Unicode/multi-colon coordinates, legacy-concatenation collisions, summary-only changes, scope isolation, exact replay and changed-content conflict; the V11 schema constrains indexed coordinates to the decoded record.'''

[[bounds]]
text = '''The direct proof establishes the production tuple construction/projection and equality-class decision only. Arbitrary String allocation/equality, task-local Runtime context, HTTP header provenance, Serde/JSON decoding, SQL parameter binding and selection, transaction isolation and durable storage remain executable evidence or async/database TCB; no universal Rust-to-SQL or Rust-to-TLA refinement is claimed.'''
