[[bounds]]
text = '''The canonical AdmissionState transition mints the private PoolDrainFence only after selecting the absorbing Draining state; Kani exhausts every closed state and command. SharedHost propagates that token without reconstructing it, and WorkerSupervisor's only Registry publication method requires and consumes it. The actual blocked-response trace checks local readiness closure and a stable claim-request count while the Registry response remains pending. This proves the production local prerequisite, not the remote mutation itself: Tokio RwLock behavior, HTTP request delivery/decoding, Registry transaction durability, acknowledgement authenticity and process survival between local fence and remote commit remain executable or TCB evidence.'''

[[bounds]]
text = '''WorkerDrain separately checks one incarnation, MaxClaims=3 and one withdrawal under fair owner/timer polling. Protocol compatibility is an abstract input; arbitrary caller abort, process death, panic-abort, kernel effects and unbounded network behavior remain excluded.'''
