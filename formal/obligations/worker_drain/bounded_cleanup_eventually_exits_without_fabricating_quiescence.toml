[[bounds]]
text = '''WorkerDrain checks bounded timer/cleanup progress under weak fairness and never equates cancellation or cleanup expiry with physical return. Production's single revocation owner shares one absolute 20-second deadline across local fencing/interruption, Runtime observation, Session retirement, and the following unused Environment-capacity shutdown; ProcessDispatch separately applies the caller's absolute Runtime-drain deadline to its initial pool-fence acquisition. WorkerNode aborts warmup/reconciliation producers before capacity shutdown, consumes the heartbeat owner's exact typed outcome, and publishes Registry quiescence only when the entire cleanup outcome is Completed and the actual process-local in-flight count is zero. Any timeout remains Unconfirmed and cannot publish quiescence. Native paused-time decision rules kill timeout-as-completion, unbounded-fence, unbounded-retirement, and unbounded-capacity behavior. This remains abstract_model_checked: Tokio timer/scheduler behavior, external provider termination, HTTP/deregistration progress, abrupt process death and physical-attempt recovery are outside the direct kernel proof. ProcessDispatch now also awaits its original pool and terminal-scanner task handles before auxiliary drain: unresolved claims and in-progress settlement observation remain control work even when the physical execution-capacity count is zero. The Kani harness exercises the same production completion fold over zero through six primitive task-return observations; native held-resolution and held-scan rules witness task ownership, timeout retention and late auxiliary registration. This does not prove Tokio scheduling or external physical termination.'''
