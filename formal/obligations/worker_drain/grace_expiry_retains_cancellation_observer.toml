[[bounds]]
text = '''WorkerDrain tracks up to three active attempts through grace expiry, cancellation, bounded observation and withdrawal; it does not assume opaque executor return. Production applies one absolute 20-second revocation deadline to local fencing/interruption, Runtime return observation, Session retirement, and the following unused Environment-capacity shutdown. ProcessDispatch also bounds its initial pool-fence acquisition by the caller's absolute Runtime-drain deadline. The native phase table proves a pending return observer remains owned until that deadline, and that false return or any stalled/failed phase yields typed Unconfirmed rather than completion. The heartbeat returns that exact outcome to WorkerNode; it is not revoked a second time. AllInOne continues polling both HTTP surfaces until the Worker cleanup future returns. This remains abstract_model_checked: Tokio scheduling/timer truth, cancellation delivery, HTTP service progress, external executor/provider termination and process death are not directly proved. ProcessDispatch now also awaits its original pool and terminal-scanner task handles before auxiliary drain: unresolved claims and in-progress settlement observation remain control work even when the physical execution-capacity count is zero. The Kani harness exercises the same production completion fold over zero through six primitive task-return observations; native held-resolution and held-scan rules witness task ownership, timeout retention and late auxiliary registration. This does not prove Tokio scheduling or external physical termination.'''
