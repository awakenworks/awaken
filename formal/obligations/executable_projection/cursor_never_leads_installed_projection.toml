[[bounds]]
text = '''The sole production ProjectionCursor transition now consumes the opaque ProjectionTarget issued by the shared durable loader for both executable domains. Kani uses no assumptions or stubs and exhausts every prior and captured-target u64 pair with both ordinary installer outcomes. A forward or equal target installs before the Release-store cursor advance; a lower complete-replay target lowers the private cursor before install and restores its prior value when installation returns an error. At installer entry, after successful publication, and at every returned terminal outcome, the cursor cannot exceed the modeled installed high-water. Fixed Kani 0.67.0 with the qualified patched CBMC/CaDiCaL backend verified the shared harness with 119 checks, zero failures and one compiler/library unreachable in 0.24571018 seconds of verification and 3.77 guarded seconds, at 290020 KiB peak process RSS; the guarded run remained below the 600-second and 12-GiB aggregate limits, with -j1, CARGO_BUILD_BUILD_DIR aligned to the isolated Kani target, and RUSTC_WRAPPER empty.'''

[[bounds]]
text = '''The native decision table cross-checks lower, equal and higher targets against success and error. Both PostgreSQL adapters consume the loader-issued target for incremental and complete replay. Each installer clones the refreshed catalog state before the target write, returning an error before assignment on either lock-poison path; exact native poison tests preserve the prior target. The proof relies on that installer contract: Ok means the exact target projection was published, while Err means no target publication occurred.'''

[[bounds]]
text = '''The linked TLAPS theorem remains the unbounded proof for the monotonic-authority concurrent refresh protocol. Authority rollback is an adapter recovery path covered by the direct sequential Rust kernel, not by the TLA+ Publish action. Kani treats the atomic load/stores sequentially, matching the kernel's required surrounding domain mutex; it does not prove the mutex. SQL range truth, database durability/isolation, RwLock behavior, Tokio mutex exclusion and scheduling, panic/abort during installation, and universal Rust-to-TLA refinement remain executable or runtime boundaries.'''
