[[bounds]]
text = '''AggregateCAS exhausts two writers and generations 0..3, including client-proposed absent/exact/stale revisions, exhaustion, and the actual generation/value frame on rejected writes. Five semantic model mutants challenge absent and stale admission, exhaustion, rejected payload overwrite and rejected generation overwrite. The abstract model treats exhaustion as non-application; concrete stores return a typed storage error.'''

[[bounds]]
text = '''ConfigRevisionWritePlan is the sole Config-owned admission and checked-successor owner consumed by unconditional, ordinary CAS and audited SQLite/PostgreSQL writes. Kani exhausts every Option<u64> observed row and independent u64 expectation without assumptions across both unconditional and CAS modes. An applied create is exactly absent generation zero to one, an applied update is exactly a positive current revision to its checked signed-storage successor, and present zero, invalid or exhausted revisions fail before SQL. The harness completed 193 checks with zero failures using fixed Kani 0.67.0 e43ae2c, patched CBMC 6.8.0 cdee49/CaDiCaL, -j1 and RUSTC_WRAPPER empty in 45.75 guarded seconds at 140212 KiB sampled peak aggregate tree RSS and 51624024 KiB minimum available memory under 600-second, 12582912-KiB RSS and 12582912-KiB available-memory guards.'''

[[bounds]]
text = '''All three write modes pass the admitted plan into one adapter statement seam. SQLite serializes observation and application with an IMMEDIATE transaction. PostgreSQL takes the same transaction-scoped advisory lock before observing the row and retains SELECT FOR UPDATE plus the expected-generation SQL predicate. Hash collisions may serialize unrelated keys but cannot merge separately predicated rows.'''

[[bounds]]
text = '''Shared adapter conformance covers absent, exact, stale, future, storage-boundary, scope, audit rollback, immutable history, reopen and independent-connection races. Mixed unconditional and same-token CAS writers cross-check absent and present starts: every unconditional write occupies one successor, at most one CAS occupies the base successor, and the final ordered history contains exactly all successful payloads. SQL predicate interpretation, advisory and row locks, RETURNING and trigger truth, JSON encoding/decoding, transaction isolation and atomicity, durability/crashes and arbitrary asynchronous schedules remain database TCB or finite executable evidence; no Rust-to-TLA or universal database-engine refinement is claimed.'''
