[[bounds]]
text = '''The linked TLA+ model remains a finite lifecycle check; it is independent cross-evidence and is not claimed as Rust refinement.'''

[[bounds]]
text = '''The private invoke_publication_resolution_once function is the production Config publication call seam for each authored model pool, including the separately authored advisor pool. Its FnOnce contract makes a second resolver entry unavailable inside that call. Kani exhausts both success and failure result classes without assumptions and proves exactly one callback plus exact result preservation. The fixed Kani 0.67.0 e43ae2c, patched CBMC 6.8.0 cdee49/CaDiCaL run completes one harness with 84 checks and zero failures in 12.54 guarded seconds at 606648 KiB process RSS, 147444 KiB sampled aggregate tree RSS and 49906456 KiB minimum available memory under 600-second, 12582912-KiB RSS and available-memory guards with -j1 and RUSTC_WRAPPER empty.'''

[[bounds]]
text = '''The ordinary SQLite-backed ConfigService publication test records the actual async resolver call and checks one invocation together with the exact Workspace credential pin in the persisted fingerprinted snapshot. Existing runtime-contract Kani harnesses independently prove that execution selection returns only an address-identical published primary/fallback and that all complete route identity axes participate. Exact source mutants that duplicate the production call site or weaken FnOnce into a double-invoked FnMut are both rejected by the corresponding async and pure decision-table tests, then restored byte-for-byte.'''

[[bounds]]
text = '''The architecture fitness check retains exactly one CatalogModelPublicationResolver in Control, one pinned candidate materializer outside Coordinator, and forbids Coordinator catalog or credential repository reads. Preview, validation and Session override are distinct commands that reuse the same injected resolver rather than alternate authorities.'''

[[bounds]]
text = '''This direct proof is per resolution call boundary. It does not prove that async resolver futures are polled exactly once, prevent cancellation and a later command retry, collapse the distinct advisor resolution into the ordinary model pool, or claim that ConfigService publish CAS retries perform only one resolution across attempts. Catalog/credential/database snapshot consistency, remote Provider and Agent Card observations, SQL persistence/fingerprinting, async dispatch, materialization and executor behavior remain native evidence or TCB.'''
