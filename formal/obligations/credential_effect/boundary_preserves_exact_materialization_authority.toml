[[bounds]]
text = '''Twelve opaque binding coordinates with two identities each (all 4096 initial match/mismatch combinations), independent one-step revision/generation/epoch advancement, three clock values with exact expiry at two, withdrawal and crash/restart. Observations retain effect-time authority; receipt negatives vary each coordinate independently. Thirty-three semantic mutants and six useful/rejection/history witnesses qualify the abstract relation, not universal Rust refinement or cryptographic/provider correctness.'''

[[bounds]]
text = '''The production classifier is exhaustively Kani-checked over terminal-repair and cancellation booleans: terminal repair dominates, cancellation selects the narrow cancel purpose, and ordinary execution is the only remaining class.'''

[[bounds]]
text = '''The Worker reuses the canonical compiler and requires complete ordered binding equality at the current claim epoch before model materialization; transport integrity, async scheduling, compiler internals and the remaining effect boundary stay outside this scalar proof.'''

[[bounds]]
text = '''The finite TLA+ model still supplies only abstract state exploration; it is not counted as Rust refinement. The production proof chain is instead composed from the named kernels used on the live path: operation classification; complete ordered claim-wire equality; current ownership; current Vault lifecycle; and exact realization receipt/persistence identity.'''

[[bounds]]
text = '''The claim revalidation harness calls the production slice comparator over a distinct two-binding set and rejects missing, widened, reordered and stale-epoch wire projections. Native compiler tests exercise the real candidate compiler and Worker invokes this same comparator immediately before model materialization. Arbitrary candidate counts and compiler fingerprint internals remain bounded/executable rather than universally proved.'''

[[bounds]]
text = '''The receipt harness crosses all 256 match/mismatch combinations of candidate fingerprint, credential id/revision, holder boundary/trust domain, mechanism, claim epoch and receipt fingerprint using actual production binding/receipt structs. It also proves the shared Insert/ExactReplay/Collision decision now consumed by all three Dispatch stores. SHA-256 correctness, arbitrary strings and database linearization remain outside the harness.'''

[[bounds]]
text = '''The existing ownership and Active-status kernels are called before Vault/external material access; the materializer then constructs the receipt from that exact binding and the claim-fenced stores verify it before persistence. Async scheduling, the interval after an ownership observation, SecretStore/external resolver truth, transport integrity, database-engine behavior and provider-side revocation propagation are explicit implementation or external boundaries, not consequences of these pure proofs.'''
