[[bounds]]
text = '''The finite ToolResultProtocol model remains independent transition evidence; no Rust-to-model refinement is implied.'''

[[bounds]]
text = '''answered_pending_commit_cursor folds every collected lifecycle fact through the single production advance_answered_pending_commit owner. A fact advances the selected coordinate exactly when Thread and Run match, kind is Awaiting, its source commit is nonzero and within the snapshot-store fence, and it is greater than the current selection. By one-step induction the fold returns the greatest qualified coordinate and admission stores that exact value in the canonical reply interval.'''

[[bounds]]
text = '''Kani symbolically proves the one-step induction relation for arbitrary prior Option<u64>, arbitrary source and fence u64 values, and every identity/kind observation without assumptions or heap bounds. The harness completed 40 checks with zero failures under fixed Kani 0.67.0 and patched CBMC 6.8.0/CaDiCaL, -j1 and empty RUSTC_WRAPPER; the guarded run observed 1230676 KiB maximum aggregate RSS and 52671820 KiB minimum available memory under 600-second and 12582912-KiB guards. The native table cross-checks actual Strings and lifecycle events across every zero-to-three-event adverse word, duplicate coordinates and ordering. Removing the same-Run guard makes that table fail and the source was restored byte-for-byte.'''

[[bounds]]
text = '''The proof covers the production fold once its Boolean identity/kind observations and lifecycle prefix are supplied. String equality, prefix collection completeness, snapshot fence provenance, Session-root CAS, database snapshot/transaction behavior, async cancellation and fairness, and Rust-to-TLA refinement remain executable evidence or database/async TCB; no unbounded repository or crash-history refinement is claimed.'''
