[[bounds]]
text = '''Finite constants and state constraints in the linked TLA+ model configuration; no Rust-to-model refinement is implied.'''

[[bounds]]
text = '''Production kernels prove the initial batch and wake epoch share the first root coordinate, only the final exact active epoch can select Idle, and Dispatch settlement requires the exact leased claim plus an empty physical slot. The bounded SessionStartProtocol composes the intended create-to-processed path.'''

[[bounds]]
text = '''The initial-plan kernel keeps the batch and wake activity in the fresh root. The extended production settlement kernel proves Running can close only when the exact post-Dispatch User receipt applies, its activity was removed, it was the final active epoch and every retained Event is processed. The aggregate consumes those facts after atomically marking the exact User plus its paired System input; multi-User tests prove an intermediate settled Run remains Running and the final fully settled root becomes Idle.'''

[[bounds]]
text = '''Kani proves the finite production decisions, not a universal Tokio or database refinement. Dispatch CAS/durability, Session CAS/serialization, Thread recovery consistency, wake delivery, process crash between stores, clocks and runtime scheduling remain TCB. Interrupted post-Dispatch publication fails safe by retaining Running/pending state; eventual retry/reconciliation remains a liveness obligation outside this repository-safety grade.'''

[[bounds]]
text = '''Legacy History=None activity/member proofs and the finite idling decisions do not establish complete retained Run membership. A fresh registered Event wake is anchored by its existing atomically retained batch rather than recorded as anonymous execution; User and exact Reply lowering retain raw named admissions before their effects. Native installer and activity-history tests cover the new wake/history distinction and reject known latest activity without a named or retained-batch anchor. Batch reachability, raw history serialization/CAS and complete execution/domain coverage remain outside the finite scalar proofs; no second Event relationship graph or historical backfill is claimed.'''

[[bounds]]
text = '''The input-actionability fact that gates closure is now a named production kernel (session_inputs_allow_idle) whose per-Event rule and command classification are proved by retained_input_idling_is_exactly_settled_or_only_blocked_users: any processed Event is inert; a pending ordinary User is inert in every position; a pending System is inert exactly while the User whose reservation froze it is still pending; every other pending kind blocks. All five command variants are checked against the class each maps to, over values of the real type. What stays outside: the fold that applies the rule -- Iterator::all over one batch's entries and over a Session's batches, disjoined with all_events_processed -- because a non-empty Vec<SessionEventEntry> does not complete under Kani in this crate (one bare command verifies in 0.15s; the same command inside one Vec does not finish in 400s), the same wall terminal_batch_resolution_empty documents. The fold is covered by the executable decision tables in the module and in crate::tests::event_batches.'''
