text = '''Kani exhaustively checks the production ownership admission classifier for every bound/unbound and current/rejected combination: once claim authority is bound, only a current observation admits the external effect. The credential materializer rejects missing ownership and routes both provider and remote realization through this shared gate after exact binding/mechanism selection and before Vault or external-resolver access. Its decision-table test covers missing, lost, unavailable, and current ownership and observes zero SecretStore reads for every rejection. Durable claim lookup, clock correctness, the interval after the current observation, external resolver behavior, secret-store behavior, and realization-receipt persistence remain executable or TCB evidence.'''
