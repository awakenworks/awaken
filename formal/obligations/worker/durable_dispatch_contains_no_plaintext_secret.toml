[[bounds]]
text = '''Credential plaintext is bounded to the repository's RedactedString, StructuredCredentialMaterial, OAuthCredentialMaterial, and CredentialMaterial types; arbitrary user-authored message, instruction, plugin, or resource strings are outside this claim. The named Kani harness exhausts every current CredentialMaterialSource variant through the production admission predicate and the predicate's exhaustive match makes any new source class require review. CredentialMaterial has no Serialize implementation and its compile-fail doctest rejects durable JSON encoding. The RunDispatch wire decision table holds live CredentialMaterial out of band while serializing a Control-plane primary and Worker-reference sealed-envelope fallback, locks each exact CredentialAccess key set, rejects the plaintext sentinel on the wire, and round-trips the request. Rust type composition, correct Serde derivations, the audited absence of expose_secret calls in dispatch construction and persistence, and SQLite/PostgreSQL driver correctness remain TCB.'''
