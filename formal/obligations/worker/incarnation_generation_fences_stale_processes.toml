[[bounds]]
text = '''Production exact-incarnation expiry, replacement and heartbeat admission across all Worker states and u64 deadlines; Kani proves the scalar admission kernel, Loom explores the three-command mutation-lock schedules, and shared Memory/SQLite/PostgreSQL tests exercise adapter serialization. This does not prove physical stop, external termination or Dispatch retirement.'''

[[bounds]]
text = '''Registration Kani exhausts the production seen-incarnation/complete-history decision. The existing RemoteWorkerProtocol model separates caller physical incarnations from allocated generations; its registration projection explores one Worker slot, three incarnations/generations and one imported lost predecessor. Three semantic mutants and two reachability witnesses check retained identity, non-overwriting history and fail-closed migration. Four production Rust mutants (ignored historical identity, ignored incomplete history, overwritten Memory history and oldest-row SQL selection) are rejected by the concrete H/M tests; the restored implementation passes again. The additional Loom schedule explores historical registration racing a fresh replacement through the actual Memory mutation lock. H1-H10 test comments own current/historical/fresh proposals across all five Worker states and expiry, independent database connections, projections and SQLite reopen; M1-M6 execute both published SQLite/PostgreSQL migration streams, including lost-history rejection and old-writer failure; T1-T5 execute the signed HTTP/client/Registry path. The original protocol configuration retains two Workers and one generation. No universal String/SQL/transaction/HTTP refinement, physical termination, finalizer lifecycle, unbounded-history storage bound or whole-Worker recovery is proved. Pre-upgrade identities already discarded cannot be reconstructed: such slots retain current authority but require a new Worker id for replacement.'''
