SPECIFICATION BoundarySpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Waiters = {waiter1, waiter2}
    NoLock = noLock
INVARIANTS
    BoundaryTypeOK
    BoundaryReceiptObservesInit
    BoundaryExitedHasNoMembers
    ScopeCloseExcludesLaunch
    ScopeReceiptRequiresEmpty
    ScopeReceiptRequiresAcceptedStop
    ScopeWorkloadRequiresGrant
    ScopeCancelNeverGrants
    ScopePendingJoinExcludesClose
    ScopeGrantWasAuthorized
PROPERTIES
    CrashPreservesOSProcesses
    BoundaryExecRequiresLiveCutoff
    BoundaryFailureEventuallyTerminates
