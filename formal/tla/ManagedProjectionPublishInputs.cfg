\* Full publisher input decision table, not a replacement for the concurrent
\* three-clock configuration. Two independent child keys distinguish a zero
\* version from absence and a same-version rename from exact identity.
CONSTANTS
    Writers = {"writer"}
    Components = {"session", "root", "child-a", "child-b"}
    OptionalComponents = {"child-a", "child-b"}
    Absent = 3
    MaxSourceVersion = 1
    MaxCacheRevision = 1
    NoWriter = "no-writer"
INIT DecisionInit
NEXT DecisionNext
CHECK_DEADLOCK FALSE
INVARIANTS Safety
