\* R1 one slot, three generations/nonces: A -> B -> delayed A plus fresh C.
\* R2 imported missing predecessor: current retry stutters, replacement denied.
\* Causal decision table and concrete adapters live in Registry conformance;
\* this checks finite authority histories, not SQL or authenticated delivery.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Workers = {workerA}
    Operations = {terminalCommit}
    Hashes = {hashA}
    AwaitOperations = {}
    TerminalOperations = {terminalCommit}
    NoWorker = noWorker
    NoOperation = noOperation
    NoHash = noHash
    Coordinator = coordinator
    MaxIncarnation = 3
    MaxEpoch = 1
    MaxVersion = 1
CONSTRAINT RegistrationOnly
INVARIANTS Safety
