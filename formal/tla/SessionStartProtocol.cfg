SPECIFICATION Spec

\* Cause/effect decision table:
\* R1 complete root + Work lease + realization + Dispatch claim -> an exact
\* current worker may observe ThreadCommit; R2 any missing/mismatched authority
\* -> no commit-observation action; R3 Work epoch replacement -> old effects are
\* fenced and realization is retryable; R4 commit before Session observation ->
\* Dispatch stays leased; R5 observation before exact Work release/Dispatch
\* settle -> crash replay is safe; R6 missing Work projection -> repair only,
\* never a second Session authority. Safety explores every bounded combination.

CONSTANTS
    SessionOwner = workspace_owner
    Workers = {worker_a, worker_b}
    NoActor = no_actor
    Payload = create_payload
    WorkItem = session_work
    EventOperation = initial_event_wake
    RunOperation = initial_user_run
    MaxRevision = 4
    MaxEpoch = 3
    MaxHeartbeat = 1
    MaxTime = 2

INVARIANTS Safety

CHECK_DEADLOCK FALSE
