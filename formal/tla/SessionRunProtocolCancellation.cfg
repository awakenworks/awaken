SPECIFICATION CancellationSpec

\* R1 cancellation revokes logical authority but leaves a physical invocation;
\* R2 a same-Thread successor can claim but must not execute before exact ACK;
\* R3 late returns/ACKs and two Workers cannot release another Run's slot.
\* This slice checks safety, not provider termination or recovery liveness.
CONSTANTS
    RootRun = root_run
    ChildRunA = child_run_a
    ChildRunB = child_run_b
    RootThread = root_thread
    ChildThread = child_thread
    WorkItem = session_work
    Workers = {worker_a, worker_b}
    NoWorker = no_worker
    MaxEpoch = 2
    MaxHeartbeat = 0
    MaxTime = 1
    ConflictedRuns = {}
CONSTRAINT CancellationSlice
INVARIANTS Safety
CHECK_DEADLOCK FALSE
