SPECIFICATION Spec
\* Native mapping: A1-A4 accepted active/settled x fast/repair; U1/U2 raise
\* without receipt; R1/R2 durable negative survives raise; E1-E4 outage/lost
\* reply; E5/E6 actual competing CAS; H1/H2 present-but-wrong payload fails
\* closed. Root/receipt reads, late refresh, CAS and ACK remain separate steps.
\* Safety only: finite TLA is not Rust/SQL refinement or recovery liveness.
CONSTANTS
    Operations = {operation_a, operation_b, operation_c}
    Callers = {fast, worker_repair}
    FastCaller = fast
    PolicyWriter = budget_writer
    SettlementWriter = settlement_writer
    NoWriter = no_writer
    NoOperation = no_operation
    InitialRootRevision = 1
    MaxRootChanges = 3
    MaxActivityEpoch = 4
    ReceiptFault = "None"
    FaultedOperation = operation_a
INVARIANTS Safety
PROPERTIES ActivityCommitUsesExactRootRevision NegativeReceiptIsAbsorbing RejectedCASPreservesDurableState NewRefusalWasBudgetRejected
CHECK_DEADLOCK FALSE
