SPECIFICATION Spec

\* Cause/effect rules: unknown operation opens one unique epoch; exact replay
\* stutters; exact active receipt settles once; unknown/stale settlement cannot
\* remove another activity; durable operation-to-epoch receipts are never reused.

CONSTANTS
    ActivityIds = {operation_a, operation_b, operation_c}
    MaxActivityEpoch = 3

INVARIANTS Safety

CHECK_DEADLOCK FALSE
