SPECIFICATION OwnershipSpec

\* Decision rules: absent reads empty; create publishes an owned root; same
\* intent replays; owner/payload conflict preserves root; realization uses exact
\* fences; tombstone hides the live row but permits an earlier coherent snapshot.
CONSTANTS
    Owners = {owner_a, owner_b}
    NoOwner = no_owner
    Payloads = {payload_a, payload_b}
    NoPayload = no_payload
    MaxRevision = 4
    MaxRealizationEpoch = 1

INVARIANTS OwnershipSafety
PROPERTIES ReadCapturesOneRootFact OwnerNeverRebinds
CHECK_DEADLOCK FALSE
