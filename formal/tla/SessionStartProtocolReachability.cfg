\* Cause/effect test design, R1: with no projection loss, lease expiry,
\* termination or retry, weak fairness must drive atomic create (C1), exact
\* Work ownership (C2), realization (C3), reservation/activity/activation (C4),
\* committed observation (C5), Session-before-Dispatch settlement (C6), and
\* final Work release (E1). The ordinary config covers all fault combinations;
\* this config is only the positive reachability witness.
SPECIFICATION HappySpec

CONSTANTS
    SessionOwner = workspace_owner
    Workers = {worker_a, worker_b}
    NoActor = no_actor
    Payload = create_payload
    WorkItem = session_work
    EventOperation = initial_event_wake
    RunOperation = initial_user_run
    MaxRevision = 4
    MaxEpoch = 3
    MaxHeartbeat = 1
    MaxTime = 2

INVARIANTS Safety
PROPERTIES EventuallyFullySettled

CHECK_DEADLOCK FALSE
