SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Calls = {call1, call2}
    PendingCommits = {commit1, commit2}
    Operations = {op1, op2}
    Keys = {key1, key2}
    Fingerprints = {fingerprint1, fingerprint2}
    None = no_operation
    MaxRejected = 3
    MaxConflicts = 3
INVARIANTS
    TypeOK
    OnlyMatchingResultIsAccepted
    EveryOperationIsConsumedAtMostOnce
    ReceiptExistsExactlyForConsumedOperation
    OneReceiptNeverNamesTwoCalls
    AwaitingTicketHasNoPriorReceipt
    TerminalRejectsLateResults
    BatchKeyExistsExactlyForOneAppend
    EveryBatchKeyAppendsAtMostOnce
