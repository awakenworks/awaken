SPECIFICATION Spec

\* Cause/effect rules: absent + complete compiled payload applies one complete
\* root; same owner/payload replays; either mismatch conflicts; tombstone never
\* replays success; exact realization owner/epoch advances effects; stale or
\* terminal input cannot; lost Work projection is repairable but non-authoritative.

CONSTANTS
    Owners = {owner_a, owner_b}
    NoOwner = no_owner
    Payloads = {payload_a, payload_b}
    NoPayload = no_payload
    MaxRevision = 4
    MaxRealizationEpoch = 2

INVARIANTS Safety

CHECK_DEADLOCK FALSE
