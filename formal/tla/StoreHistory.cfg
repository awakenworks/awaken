CONSTANTS
  Threads = {t1, t2}
  Runs = {r1, r2}
  Operations = {o1, o2}
  Payloads = {p1, p2}
  RunStates = {Running, Awaiting, Ended}
  TerminalStates = {Ended}
  NoReceipt = NoReceipt
  NoOperation = NoOperation
  NoPayload = NoPayload

SPECIFICATION Spec

CONSTRAINT StateConstraint

INVARIANTS
  TypeOK
  HistorySequenceIsDenseAndExact
  TerminalRunIsFinal
  ReceiptRefinesOneExactHistoryRecord
  OneCASWinnerPerThreadVersion
  ReceiptsNeverOutrunDurableHistory
