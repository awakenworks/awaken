SPECIFICATION Spec

\* Cause/effect rules: two Workers may race/reclaim the mutation claim, while a
\* separate exact physical slot stays with the predecessor until explicit
\* quiescence; same-Thread physical attempts never overlap, different Threads
\* may overlap; exact committed facts settle Session before Work/Dispatch;
\* stale release epochs cannot stop a successor lease. All three Dispatch rows
\* share RunIngressKernel.

CONSTANTS
    RootRun = root_run
    ChildRunA = child_run_a
    ChildRunB = child_run_b
    RootThread = root_thread
    ChildThread = child_thread
    WorkItem = session_work
    Workers = {worker_a, worker_b}
    NoWorker = no_worker
    MaxEpoch = 3
    MaxHeartbeat = 1
    MaxTime = 2

INVARIANTS
    Safety

CHECK_DEADLOCK FALSE
