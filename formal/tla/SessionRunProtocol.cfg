SPECIFICATION Spec

\* Cause/effect rules: same-Thread claims exclude one another only while both
\* are authoritative; different Threads may overlap; Work handoff may leave a
\* physical stale attempt but prevents its commit observation; exact committed
\* facts settle Session before Work/Dispatch; stale release epochs cannot stop a
\* successor lease. All three Dispatch rows share RunIngressKernel.

CONSTANTS
    RootRun = root_run
    ChildRunA = child_run_a
    ChildRunB = child_run_b
    RootThread = root_thread
    ChildThread = child_thread
    WorkItem = session_work
    Workers = {worker_a}
    NoWorker = no_worker
    MaxEpoch = 3
    MaxHeartbeat = 1
    MaxTime = 2

INVARIANTS
    Safety

CHECK_DEADLOCK FALSE
