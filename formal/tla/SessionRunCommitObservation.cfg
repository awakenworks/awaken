SPECIFICATION CommitObservationSpec

\* Full constant domain from SessionRunProtocol.cfg. Init enumerates both the
\* current commit-ready decision cut and the stale-reclaimed Work cut; Next
\* delegates only to the canonical ObserveCommittedRun action or stutters.
CONSTANTS
    RootRun = root_run
    ChildRunA = child_run_a
    ChildRunB = child_run_b
    RootThread = root_thread
    ChildThread = child_thread
    WorkItem = session_work
    Workers = {worker_a, worker_b}
    NoWorker = no_worker
    MaxEpoch = 3
    MaxHeartbeat = 1
    MaxTime = 2
    ConflictedRuns = {child_run_a}

PROPERTIES
    CommittedObservationUsesExactCurrentRealization

CHECK_DEADLOCK FALSE
