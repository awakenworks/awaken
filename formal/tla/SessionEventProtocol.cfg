SPECIFICATION Spec

\* Cause/effect rules: reserve without a Run activity receipt is
\* non-executable; an exact receipt enables activation; an exact Dispatch claim
\* plus observed ThreadCommit enables Session settlement; Dispatch settlement
\* before Run-activity settlement cannot mark the Event processed; rejection
\* keeps Dispatch removed and never creates execution authority.

CONSTANTS
    EventOperation = initial_event_wake
    RunOperation = initial_user_run
    Workers = {worker_a, worker_b}
    NoWorker = no_worker
    MaxEpoch = 3

INVARIANTS Safety

CHECK_DEADLOCK FALSE
