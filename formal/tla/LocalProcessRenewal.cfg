SPECIFICATION RenewalSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Waiters = {waiter1}
    NoLock = noLock
INVARIANTS
    RenewalTypeOK
    RenewalWritesRequireCurrentAuthority
    RenewalClockMatchesCutoff
    BoundaryReceiptObservesInit
    BoundaryExitedHasNoMembers
    ScopeGrantWasAuthorized
PROPERTIES
    RenewalCutoffNeverDecreases
    RenewalCannotResurrect
    RenewalCannotMintTransitTime
    RenewalPartialCannotStallClock
    BoundaryFailureEventuallyTerminates
