SPECIFICATION StopEvidenceSpec
CONSTANTS
    RootRun = root_run
    ChildRunA = child_run_a
    ChildRunB = child_run_b
    RootThread = root_thread
    ChildThread = child_thread
    WorkItem = session_work
    Workers = {worker_a, worker_b}
    NoWorker = no_worker
    MaxEpoch = 3
    MaxHeartbeat = 0
    MaxTime = 2
    ConflictedRuns = {}
CONSTRAINT StopEvidenceScope
INVARIANTS StopEvidenceSafety
CHECK_DEADLOCK FALSE
