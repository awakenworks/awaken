SPECIFICATION Spec
\* R1 a conflict never executes; R2 a failed commit does not settle; R3 a
\* committed conflict settles despite a lost reply under fair persistence
\* observation; R4 two owners/epochs may race. Resource equality classification
\* itself is checked at the real Host resolver, not duplicated in this model.
CONSTANTS
    RootRun = root_run
    ChildRunA = child_run_a
    ChildRunB = child_run_b
    RootThread = root_thread
    ChildThread = child_thread
    WorkItem = session_work
    Workers = {worker_a, worker_b}
    NoWorker = no_worker
    MaxEpoch = 2
    MaxHeartbeat = 0
    MaxTime = 1
    ConflictedRuns = {child_run_a}
INVARIANTS Safety ConflictedRunsNeverExecute
PROPERTIES ConflictedChildCommitEventuallySettles
CHECK_DEADLOCK FALSE
