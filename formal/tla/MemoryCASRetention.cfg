SPECIFICATION RetSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Writers = {a, b}
    NoWriter = none
    MaxGeneration = 1
    SourceId = source
    TargetId = target
INVARIANTS
    RetTypeOK
    OneWinnerPerGeneration
    RetAcknowledgementRequiresDurability
    RetDisposalRequiresDurability
PROPERTIES
    RetCommitPreservesHead
    RetCancellationPreservesRequest
    RetEventuallyDisposed
