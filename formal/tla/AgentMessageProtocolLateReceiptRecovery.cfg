\* Cause/effect witness L1. Causes: the source request and target admission are
\* durable, the parent crashes before committing its tool receipt, and the child
\* reaches a committed boundary and settles first. Effect: exact parent recovery
\* commits the receipt after the permanent dispatch completion without reopening
\* target execution or inventing a second Session activity.
SPECIFICATION LateReceiptRecoverySpec

CONSTANTS
    Owners = {worker_a}
    NoOwner = no_owner
    MessageActivity = agent_message
    MaxEpoch = 1

INVARIANTS Safety
PROPERTIES LateReceiptRecoveryCompletes

CHECK_DEADLOCK FALSE
