# Every suite of the service-backed groups, in the order the whole group runs it.
#
# pg_tests.sh and check-reliability.sh run these rows by id; service_test_plan.py
# reads them to decide what `--affected <base>` runs. A row is either
#   args   the literal words its runner receives (pg_required_test or
#          run_required_rust_tests, or `runner = "pg_test"` for a bare Cargo
#          command); its packages are the -p/--package/--test-package values; or
#   packages  a step its group script runs itself under this id (object store,
#          recovery drill, fuzz, sanitizers, mutants), with the packages it tests.
# `phase` names the shell step that runs the row; `env` adds literal variables.
#
# Editing a row runs that row in an affected run; editing pg_tests.sh,
# check-reliability.sh or their helpers runs the whole group. Rule check:
#   python3 scripts/ci/service_test_plan.py --self-test
# Why a row ran or not:
#   python3 scripts/ci/service_test_plan.py --group postgres --base <base> --explain

