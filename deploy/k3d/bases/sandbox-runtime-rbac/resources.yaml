apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: awaken-runtime-read-dispose
rules:
  # Worker and Coordinator share one read/UID-fenced disposal policy. Worker
  # collection POSTs cross the independently retained Coordinator Create ticket.
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["get", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: awaken-create-executor
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "persistentvolumeclaims", "secrets"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["create"]
