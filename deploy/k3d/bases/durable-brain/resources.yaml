# Canonical deterministic brain for Postgres-backed scenario-host clusters.
---
apiVersion: v1
kind: Service
metadata:
  name: brain
  labels: { app: brain }
spec:
  selector: { app: brain }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain
  labels: { app: brain }
spec:
  replicas: 1
  selector:
    matchLabels: { app: brain }
  template:
    metadata:
      labels: { app: brain }
    spec:
      containers:
        - name: brain
          image: awaken-topology:latest
          imagePullPolicy: Never
          env:
            - { name: AWAKEN_MODEL_MODE, value: echo }
            - { name: SESSION_DEPLOYMENT_INGRESS, value: durable }
            - { name: SESSION_DEPLOYMENT_DISPATCH_BACKEND, value: postgres }
            - { name: SESSION_DEPLOYMENT_STORE, value: postgres }
            - { name: SESSION_DEPLOYMENT_DATABASE_URL, value: "postgres://postgres:test@postgres:5432/awaken" } # awaken-allow: secret
            - { name: SESSION_DEPLOYMENT_WAKE, value: pg-notify }
            - { name: SESSION_DEPLOYMENT_POSTGRES_MAX_CONNECTIONS, value: "8" }
            - name: SESSION_DEPLOYMENT_DISPATCH_OWNER
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - { name: SESSION_DEPLOYMENT_STORAGE_DIR, value: "/tmp/awaken" }
            - { name: AWAKEN_HTTP_ADDR, value: "0.0.0.0:3000" }
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 2
            periodSeconds: 2
