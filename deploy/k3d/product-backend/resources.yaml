# Internal all-in-one product topology for Awaken-backed applications. The
# public product owns ingress; this Service deliberately has no external route.
---
apiVersion: v1
kind: Namespace
metadata:
  name: awaken-system
  labels:
    awaken.runtime/internal: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: awaken-product-config
data:
  config.toml: |
    data_dir = "/var/lib/awaken"
    bind = "0.0.0.0:8080"
    internal_bind = "0.0.0.0:8081"
    mode = "local"
    role = "all-in-one"
    run_local_pool = false
    no_browser = true
    identity_mode = "self-managed"
    credential_envelope_keys_file = "/etc/awaken-credential-envelope/keys.json"
    worker_kubernetes = { namespace = "awaken-system", service_account = "awaken-worker", audience = "awaken-worker", provider_id = "k3d-awaken-product", create_control_namespace = "awaken-create-control" }
    sandbox_tier = "k8s"
    sandbox_dir = "/var/lib/awaken/sandboxes"
    k8s_namespace = "awaken-system"
    k8s_continuation_volume = { storage_class_name = "local-path", size = "1Gi" }
    container_image = "__AWAKEN_SANDBOX_IMAGE__"
    container_hand_residency = "resident"
    package_image_registry = "k3d-awaken-registry.localhost:5000/environments"
    package_image_builder = "k8s"
    package_registry_insecure = true
    k8s_kaniko_image = "k3d-awaken-registry.localhost:5000/system/kaniko:v1.29.1-debug"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: awaken-worker-config
data:
  worker.toml: |
    data_dir = "/var/lib/awaken-worker"
    mode = "server"
    role = "worker"
    worker_server = "https://awaken-product:8443"
    worker_server_ca_certificate_file = "/etc/awaken-worker-tls/ca.crt"
    worker_kubernetes_identity_directory = "/var/run/awaken-worker-identity"
    credential_envelope_keys_file = "/etc/awaken-credential-envelope/keys.json"
    worker_admin_listen = "0.0.0.0:9090"
    worker_drain_grace_secs = 15
    worker_max_concurrent = 10
    sandbox_tier = "k8s"
    k8s_namespace = "awaken-system"
    k8s_continuation_volume = { storage_class_name = "local-path", size = "1Gi" }
    container_image = "__AWAKEN_SANDBOX_IMAGE__"
    sandbox_dir = "/var/lib/awaken-worker/sandboxes"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: awaken-worker-tls-route
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;
    events { worker_connections 1024; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8443 ssl;
        ssl_certificate /etc/awaken-worker-tls/tls.crt;
        ssl_certificate_key /etc/awaken-worker-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 16m;
        proxy_buffering off;
        proxy_request_buffering off;
        location / {
          proxy_pass http://127.0.0.1:8081;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header Connection "";
        }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: awaken-product
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: awaken-worker
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: awaken-runtime-read-dispose
subjects:
  - kind: ServiceAccount
    name: awaken-product
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: awaken-runtime-read-dispose
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: awaken-worker-runtime
subjects:
  - kind: ServiceAccount
    name: awaken-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: awaken-runtime-read-dispose
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: awaken-product-create
subjects:
  - kind: ServiceAccount
    name: awaken-product
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: awaken-create-executor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: awaken-product-token-review
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: awaken-product-token-review
subjects:
  - kind: ServiceAccount
    name: awaken-product
    namespace: awaken-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: awaken-product-token-review
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: awaken-product-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: awaken-product
  labels:
    app.kubernetes.io/name: awaken
    app.kubernetes.io/component: internal-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: awaken
    app.kubernetes.io/component: internal-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: worker-tls
      port: 8443
      targetPort: worker-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: awaken-product
  labels:
    app.kubernetes.io/name: awaken
    app.kubernetes.io/component: internal-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: awaken
      app.kubernetes.io/component: internal-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: awaken
        app.kubernetes.io/component: internal-backend
    spec:
      serviceAccountName: awaken-product
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: awaken
          image: awaken-product:latest
          imagePullPolicy: Never
          command: ["/usr/local/bin/awaken-server"]
          args: ["all-in-one", "--config", "/etc/awaken/config.toml", "--no-browser"]
          # Match the explicit CPU limit instead of inheriting the 32-core k3d
          # node topology and creating throttled Tokio scheduler workers.
          env:
            - name: TOKIO_WORKER_THREADS
              value: "2"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8080
            - name: internal
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: config
              mountPath: /etc/awaken
              readOnly: true
            - name: data
              mountPath: /var/lib/awaken
            - name: credential-envelope
              mountPath: /etc/awaken-credential-envelope
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: worker-tls
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-c", "/etc/nginx-worker/nginx.conf", "-g", "daemon off;"]
          ports:
            - name: worker-tls
              containerPort: 8443
          startupProbe:
            tcpSocket: { port: worker-tls }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: worker-tls }
            periodSeconds: 2
          livenessProbe:
            tcpSocket: { port: worker-tls }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: worker-tls-route, mountPath: /etc/nginx-worker, readOnly: true }
            - { name: worker-tls-identity, mountPath: /etc/awaken-worker-tls, readOnly: true }
      volumes:
        - name: config
          configMap:
            name: awaken-product-config
        - { name: worker-tls-route, configMap: { name: awaken-worker-tls-route } }
        - name: worker-tls-identity
          secret:
            secretName: awaken-worker-upstream-tls
            items:
              - { key: tls.crt, path: tls.crt }
              - { key: tls.key, path: tls.key }
        - name: credential-envelope
          secret:
            secretName: awaken-worker-credential-envelope
            defaultMode: 288
        - name: data
          persistentVolumeClaim:
            claimName: awaken-product-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: awaken-worker
  labels:
    app.kubernetes.io/name: awaken-worker
spec:
  backoffLimit: 100
  # A Worker is a persistent execution process. Losing its lease must fence and
  # exit, then the native controller creates a fresh Pod UID; it must not spend
  # a finite batch retry budget. Keep Never and retained process evidence so an
  # exited incarnation cannot reopen its own execution domain.
  podFailurePolicy:
    rules:
      - action: Ignore
        onExitCodes:
          containerName: worker
          operator: NotIn
          values: [0]
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
            status: "True"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: awaken-worker
      # No process-evidence finalizer here: the Coordinator adds it at
      # registration, once the Pod can bind, so a Pod that never registers
      # never keeps one (ADR-0078 amendment 2026-10-31).
    spec:
      serviceAccountName: awaken-worker
      restartPolicy: Never
      # The Worker may spend 15s draining and then up to 20s obtaining exact
      # cancellation/return evidence. Keep Kubernetes from hard-killing the
      # sole observer while it commits quiescence and deregisters.
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: worker
          image: awaken-product:latest
          imagePullPolicy: Never
          command: ["/usr/local/bin/awaken-worker"]
          args: ["--server", "https://awaken-product:8443", "--config", "/etc/awaken-worker/worker.toml"]
          ports:
            - { name: admin, containerPort: 9090 }
          lifecycle:
            preStop:
              exec:
                command:
                  - python3
                  - -c
                  - 'import urllib.request; urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:9090/admin/drain",method="POST"),timeout=5).read()'
          readinessProbe:
            httpGet: { path: /readyz, port: admin }
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 3Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: config, mountPath: /etc/awaken-worker, readOnly: true }
            - { name: upstream-tls, mountPath: /etc/awaken-worker-tls, readOnly: true }
            - { name: identity, mountPath: /var/run/awaken-worker-identity, readOnly: true }
            - { name: credential-envelope, mountPath: /etc/awaken-credential-envelope, readOnly: true }
            - { name: data, mountPath: /var/lib/awaken-worker }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: awaken-worker-config } }
        - name: upstream-tls
          configMap:
            name: awaken-worker-upstream-ca
            items: [{ key: ca.crt, path: ca.crt }]
        - name: identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: awaken-worker
                  expirationSeconds: 600
              - downwardAPI:
                  items:
                    - { path: namespace, fieldRef: { fieldPath: metadata.namespace } }
                    - { path: name, fieldRef: { fieldPath: metadata.name } }
                    - { path: uid, fieldRef: { fieldPath: metadata.uid } }
        - name: credential-envelope
          secret:
            secretName: awaken-worker-credential-envelope
            defaultMode: 288
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: { sizeLimit: 1Gi } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: awaken-product-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: awaken
      app.kubernetes.io/component: internal-backend
    matchExpressions:
      - { key: app, operator: NotIn, values: [awaken-sandbox] }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              awaken.design/backend-access: "true"
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: awaken-worker
      ports:
        - protocol: TCP
          port: 8443
