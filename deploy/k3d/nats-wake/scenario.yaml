# NATS is a best-effort cross-node wake provider. Postgres remains the queue and
# commit authority through the shared durable-brain base.
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels: { app: nats }
spec:
  selector: { app: nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: monitor, port: 8222, targetPort: 8222 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels: { app: nats }
spec:
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      containers:
        - name: nats
          image: nats:2
          imagePullPolicy: Never
          # Read-only evidence for this disposable test broker, via private
          # port-forward only. Queue authority remains in Postgres.
          args: ["-p", "4222", "-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          readinessProbe:
            tcpSocket: { port: 4222 }
            initialDelaySeconds: 1
            periodSeconds: 2
