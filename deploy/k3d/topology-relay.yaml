# Relay topology (ADR-0045): neither the brain nor the hand reaches the other
# directly — both DIAL OUT to a shared NATS BROKER and meet on a subject pair. The
# brain publishes each HandRequest via NATS request/reply; the hand subscribes and
# replies. This is the topology when both legs are outbound-only (each behind its
# own NAT) but share a reachable message bus.
#
#   [brain pod] --\                       /-- [hand pod]
#                  >-- nats:4222 (broker) --<
#              publish req            subscribe + reply
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels: { app: nats }
spec:
  selector: { app: nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels: { app: nats }
spec:
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      containers:
        - name: nats
          image: nats:2
          imagePullPolicy: Never
          args: ["-p", "4222"]
          ports:
            - containerPort: 4222
          readinessProbe:
            tcpSocket: { port: 4222 }
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hand
  labels: { app: hand }
spec:
  replicas: 1
  selector:
    matchLabels: { app: hand }
  template:
    metadata:
      labels: { app: hand }
    spec:
      containers:
        - name: hand
          image: awaken-topology:latest
          imagePullPolicy: Never
          env:
            # Hand over NATS: dial the broker (retrying until it's up) and serve
            # the executor channel on the shared subject.
            - { name: AWAKEN_HAND_NATS, value: "nats://nats:4222" }
---
apiVersion: v1
kind: Service
metadata:
  name: brain
  labels: { app: brain }
spec:
  selector: { app: brain }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain
  labels: { app: brain }
spec:
  replicas: 1
  selector:
    matchLabels: { app: brain }
  template:
    metadata:
      labels: { app: brain }
    spec:
      containers:
        - name: brain
          image: awaken-topology:latest
          imagePullPolicy: Never
          env:
            # Brain over NATS: route every tool call to the broker (request/reply).
            - { name: AWAKEN_MODEL_MODE, value: remote-hand }
            - { name: AWAKEN_REMOTE_HAND_NATS, value: "nats://nats:4222" }
            - { name: AWAKEN_HTTP_ADDR, value: "0.0.0.0:3000" }
          ports:
            - containerPort: 3000
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 2
            periodSeconds: 2
