# ADR-0071 production-role topology. Control and Coordinator use the shipped
# composition roots; only model execution is deterministic at the scenario edge.
---
apiVersion: v1
kind: ConfigMap
metadata: { name: adr71-database-init }
data:
  00-create-databases.sql: |
    SELECT 'CREATE ROLE awaken_control LOGIN PASSWORD ''adr71-control-db''' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'awaken_control')\gexec
    SELECT 'CREATE ROLE awaken_coordinator LOGIN PASSWORD ''adr71-coordinator-db''' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'awaken_coordinator')\gexec
    SELECT 'CREATE DATABASE control OWNER awaken_control' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'control')\gexec
    SELECT 'CREATE DATABASE credentials OWNER awaken_control' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'credentials')\gexec
    SELECT 'CREATE DATABASE runtime OWNER awaken_coordinator' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'runtime')\gexec
    SELECT 'CREATE DATABASE resources OWNER awaken_coordinator' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'resources')\gexec
---
apiVersion: v1
kind: ConfigMap
metadata: { name: adr71-installation }
data:
  platform-workspace-id: workspace-adr71
---
apiVersion: v1
kind: Secret
metadata: { name: adr71-control-auth }
type: Opaque
stringData:
  registration-token: "adr71-registration-token" # awaken-allow: secret
  control-service-token: "adr71-control-service-token" # awaken-allow: secret
  seal-key: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff" # awaken-allow: secret
---
apiVersion: v1
kind: Secret
metadata: { name: adr71-coordinator-auth }
type: Opaque
stringData:
  registration-token: "adr71-registration-token" # awaken-allow: secret
  control-service-token: "adr71-control-service-token" # awaken-allow: secret
  worker-trust.json: |
    [
      {"worker_id":"worker-0","key_id":"adr71-key-0","credential_id":"adr71-worker-0","secret_base64":"YWRyNzEtd29ya2VyLTA="},
      {"worker_id":"worker-1","key_id":"adr71-key-1","credential_id":"adr71-worker-1","secret_base64":"YWRyNzEtd29ya2VyLTE="}
    ]
---
apiVersion: v1
kind: Secret
metadata: { name: adr71-worker-auth }
type: Opaque
stringData:
  worker-0.json: |
    {"worker_id":"worker-0","key_id":"adr71-key-0","credential_id":"adr71-worker-0","secret_base64":"YWRyNzEtd29ya2VyLTA="}
  worker-1.json: |
    {"worker_id":"worker-1","key_id":"adr71-key-1","credential_id":"adr71-worker-1","secret_base64":"YWRyNzEtd29ya2VyLTE="}
---
apiVersion: v1
kind: Secret
metadata: { name: adr71-worker-material }
type: Opaque
stringData:
  provider-secret: "adr71-provider-secret" # awaken-allow: secret
  payload-fingerprint: "sha256:adr71-provider-payload"
---
apiVersion: v1
kind: Secret
metadata: { name: adr71-role-config }
type: Opaque
stringData:
  control.toml: |
    data_dir = "/var/lib/awaken/control"
    bind = "0.0.0.0:3000"
    mode = "server"
    role = "control"
    no_browser = true
    identity_mode = "no-login"
    coordinator_internal_url = "http://coordinator:3000"
    executable_agent_registration_token_file = "/etc/awaken-auth/registration-token"
    control_service_token_file = "/etc/awaken-auth/control-service-token"
    control_seal_key_file = "/etc/awaken-auth/seal-key"
    catalog_db = "postgres://awaken_control:adr71-control-db@postgres:5432/control" # awaken-allow: secret
    credential_db = "postgres://awaken_control:adr71-control-db@postgres:5432/credentials" # awaken-allow: secret
    config_db = "postgres://awaken_control:adr71-control-db@postgres:5432/control" # awaken-allow: secret
    admin_db = "postgres://awaken_control:adr71-control-db@postgres:5432/control" # awaken-allow: secret
    # Static Environment definitions and sandbox-policy versions are Control facts.
    environment_db = "postgres://awaken_control:adr71-control-db@postgres:5432/control" # awaken-allow: secret
  coordinator.toml: |
    data_dir = "/var/lib/awaken/coordinator"
    bind = "0.0.0.0:3000"
    mode = "server"
    role = "coordinator"
    no_browser = true
    identity_mode = "no-login"
    runtime_database_url = "postgres://awaken_coordinator:adr71-coordinator-db@postgres:5432/runtime" # awaken-allow: secret
    # Two Workers expose 16 concurrent claim slots. Keep claim traffic plus
    # foreground enqueue/commit/heartbeat headroom bounded per Coordinator;
    # database capacity is sized for every owner repository across all replicas.
    postgres_max_connections = 32
    resource_database_url = "postgres://awaken_coordinator:adr71-coordinator-db@postgres:5432/resources" # awaken-allow: secret
    sessions_db = "postgres://awaken_coordinator:adr71-coordinator-db@postgres:5432/runtime" # awaken-allow: secret
    executable_agent_registration_token_file = "/etc/awaken-auth/registration-token"
    control_internal_url = "http://control:3000"
    control_service_token_file = "/etc/awaken-auth/control-service-token"
    worker_trust_credentials_file = "/etc/awaken-auth/worker-trust.json"
    sandbox_tier = "namespace"
    dispatch_wake = "pg-notify"
    dispatch_owner = "adr71-coordinator"
  worker.toml: |
    data_dir = "/var/lib/awaken/worker"
    mode = "server"
    role = "worker"
    worker_id = "__WORKER_ID__"
    worker_request_credential_file = "/etc/awaken-worker-auth/__WORKER_ID__.json"
    worker_credential_material_root = "/var/run/awaken/credentials"
    worker_credential_trust_domain = "awaken.worker"
    worker_admin_listen = "0.0.0.0:9090"
    worker_drain_grace_secs = 15
    worker_max_concurrent = 8
    sandbox_tier = "namespace"
    sandbox_dir = "/var/lib/awaken/sandboxes"
---
apiVersion: batch/v1
kind: Job
metadata: { name: control-migrate }
spec:
  backoffLimit: 12
  template:
    metadata: { labels: { app: control-migrate } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: awaken-roles:latest
          imagePullPolicy: Never
          command: ["/usr/local/bin/awaken-control", "database", "migrate", "--config", "/etc/awaken/control.toml"]
          volumeMounts:
            - { name: config, mountPath: /etc/awaken, readOnly: true }
            - { name: auth, mountPath: /etc/awaken-auth, readOnly: true }
      volumes:
        - name: config
          secret: { secretName: adr71-role-config }
        - name: auth
          secret: { secretName: adr71-control-auth }
---
apiVersion: batch/v1
kind: Job
metadata: { name: coordinator-migrate }
spec:
  backoffLimit: 12
  template:
    metadata: { labels: { app: coordinator-migrate } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: awaken-roles:latest
          imagePullPolicy: Never
          command: ["/usr/local/bin/awaken-coordinator", "database", "migrate", "--config", "/etc/awaken/coordinator.toml"]
          volumeMounts:
            - { name: config, mountPath: /etc/awaken, readOnly: true }
            - { name: auth, mountPath: /etc/awaken-auth, readOnly: true }
      volumes:
        - name: config
          secret: { secretName: adr71-role-config }
        - name: auth
          secret: { secretName: adr71-coordinator-auth }
---
apiVersion: v1
kind: Service
metadata: { name: control, labels: { app: control } }
spec:
  selector: { app: control }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: control, labels: { app: control } }
spec:
  replicas: 2
  selector: { matchLabels: { app: control } }
  template:
    metadata: { labels: { app: control } }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: control } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: control
          image: awaken-roles:latest
          imagePullPolicy: Never
          command: ["/usr/local/bin/awaken-server"]
          env:
            - { name: AWAKEN_MODEL_MODE, value: distributed-control }
            - { name: AWAKEN_HTTP_ADDR, value: "0.0.0.0:3000" }
            - { name: HOME, value: "/etc/awaken-home" }
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - { name: home, mountPath: /etc/awaken-home/.awaken, readOnly: true }
            - { name: auth, mountPath: /etc/awaken-auth, readOnly: true }
            - { name: workspace, mountPath: /var/lib/awaken/control/platform-workspace-id, subPath: platform-workspace-id, readOnly: true }
      volumes:
        - name: home
          secret:
            secretName: adr71-role-config
            items: [{ key: control.toml, path: config.toml }]
        - name: auth
          secret: { secretName: adr71-control-auth }
        - name: workspace
          configMap: { name: adr71-installation }
---
apiVersion: v1
kind: Service
metadata: { name: coordinator, labels: { app: coordinator } }
spec:
  selector: { app: coordinator }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: coordinator, labels: { app: coordinator } }
spec:
  replicas: 2
  selector: { matchLabels: { app: coordinator } }
  template:
    metadata: { labels: { app: coordinator } }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: coordinator } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: coordinator
          image: awaken-roles:latest
          imagePullPolicy: Never
          command: ["/usr/local/bin/awaken-coordinator", "--config", "/etc/awaken/coordinator.toml"]
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - { name: config, mountPath: /etc/awaken, readOnly: true }
            - { name: auth, mountPath: /etc/awaken-auth, readOnly: true }
            - { name: workspace, mountPath: /var/lib/awaken/coordinator/platform-workspace-id, subPath: platform-workspace-id, readOnly: true }
      volumes:
        - name: config
          secret: { secretName: adr71-role-config }
        - name: auth
          secret: { secretName: adr71-coordinator-auth }
        - name: workspace
          configMap: { name: adr71-installation }
---
apiVersion: v1
kind: Service
metadata: { name: worker, labels: { app: worker } }
spec:
  clusterIP: None
  selector: { app: worker }
  ports: [{ name: admin, port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: worker, labels: { app: worker } }
spec:
  serviceName: worker
  replicas: 2
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      terminationGracePeriodSeconds: 20
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: worker } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: worker
          image: awaken-roles:latest
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: true
            seccompProfile: { type: Unconfined }
          command: ["/bin/sh", "-ec"]
          args:
            - |
              sed "s/__WORKER_ID__/${HOSTNAME}/g" /etc/awaken-template/worker.toml > /tmp/worker.toml
              exec /usr/local/bin/awaken-worker --server http://coordinator:3000 --config /tmp/worker.toml
          ports: [{ containerPort: 9090 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 9090 }
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - { name: template, mountPath: /etc/awaken-template, readOnly: true }
            - { name: auth, mountPath: /etc/awaken-worker-auth, readOnly: true }
            - { name: material, mountPath: /var/run/awaken/credentials, readOnly: true }
            - { name: data, mountPath: /var/lib/awaken }
      volumes:
        - name: template
          secret:
            secretName: adr71-role-config
            items: [{ key: worker.toml, path: worker.toml }]
        - name: auth
          secret: { secretName: adr71-worker-auth }
        - name: material
          secret:
            secretName: adr71-worker-material
            items:
              - key: provider-secret
                path: envelopes/61647237312d656e76656c6f7065/7368613235363a61647237312d70726f76696465722d7061796c6f6164/61647237312d70726f76696465722d63726564656e7469616c/1/776f726b73706163652d6164723731/666e76316136343a37616138653836326333363034333234/secret
              - key: payload-fingerprint
                path: envelopes/61647237312d656e76656c6f7065/7368613235363a61647237312d70726f76696465722d7061796c6f6164/61647237312d70726f76696465722d63726564656e7469616c/1/776f726b73706163652d6164723731/666e76316136343a37616138653836326333363034333234/payload_fingerprint
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: provider, labels: { app: provider } }
spec:
  selector: { app: provider }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: provider, labels: { app: provider } }
spec:
  replicas: 2
  selector: { matchLabels: { app: provider } }
  template:
    metadata: { labels: { app: provider } }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: provider } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: provider
          image: awaken-roles:latest
          imagePullPolicy: Never
          command: ["/usr/local/bin/awaken-server"]
          env:
            - { name: AWAKEN_MODEL_MODE, value: distributed-provider }
            - { name: AWAKEN_HTTP_ADDR, value: "0.0.0.0:3000" }
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: ConfigMap
metadata: { name: awaken-api-route-map }
data:
  default.conf: |
    upstream control_api { server control:3000; }
    upstream coordinator_api { server coordinator:3000; }
    server {
      listen 8080;
      client_max_body_size 16m;
      proxy_buffering off;
      # Cause/effect rule E1: a selected Pod can disappear before EndpointSlice
      # convergence. Bound connection establishment so an idempotent client read
      # can reach the surviving replica within the public recovery budget. This
      # does not replay an accepted request body or weaken application fencing.
      proxy_connect_timeout 2s;
      # The Runtime owns a 60-second terminal wait. Keep the edge above that
      # boundary so callers receive the application's typed outcome instead of an
      # earlier ambiguous gateway timeout for a non-idempotent command.
      proxy_read_timeout 70s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 5s;
      location ^~ /internal/ { return 404; }
      location ^~ /v1/worker/ { return 404; }
      # Cause/effect route table: Environment definitions are Control-owned;
      # only the lease/ack work subresource is Coordinator-owned. The specific
      # work match must precede the general fallthrough so authoring and queue
      # state never gain parallel owners.
      location ~ ^/v1/environments/[^/]+/work(/|$) {
        proxy_pass http://coordinator_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
      }
      location ~ ^/v1/(sessions|deployments|deployment_runs|files|memory_stores|skills|models|dreams|ai-sdk|ag-ui|a2a|message|capabilities)(/|$) {
        proxy_pass http://coordinator_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
      }
      location / {
        proxy_pass http://control_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
      }
    }
---
apiVersion: v1
kind: Service
metadata: { name: awaken-api, labels: { app: awaken-api } }
spec:
  selector: { app: awaken-api }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: awaken-api, labels: { app: awaken-api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: awaken-api } }
  template:
    metadata: { labels: { app: awaken-api } }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector: { matchLabels: { app: awaken-api } }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: nginx:1.27-alpine
          imagePullPolicy: Never
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 1
            periodSeconds: 2
          volumeMounts:
            - { name: routes, mountPath: /etc/nginx/conf.d, readOnly: true }
      volumes:
        - name: routes
          configMap: { name: awaken-api-route-map }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: awaken-api }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: awaken-api } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: control }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: control } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: coordinator }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: coordinator } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: worker }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: worker } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: provider }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: provider } }
