apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - database-ha.yaml
  - resources.yaml
patches:
  # Bound the black-hole window for replicated stateless roles and Workers.
  # PostgreSQL is excluded because its primary/standby promotion is explicitly
  # fenced by the database-failover stage instead of automatic Pod relocation.
  - target:
      kind: Deployment|StatefulSet
      name: control|coordinator|worker|provider|awaken-api
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node.kubernetes.io/not-ready
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 15
          - key: node.kubernetes.io/unreachable
            operator: Exists
            effect: NoExecute
            tolerationSeconds: 15
