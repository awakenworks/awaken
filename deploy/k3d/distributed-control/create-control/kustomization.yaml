apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../product-backend/create-control
patches:
  - target:
      kind: RoleBinding
      name: awaken-create-ledger
    patch: |-
      - op: replace
        path: /subjects
        value:
          - kind: ServiceAccount
            name: coordinator-runtime
            namespace: awaken-adr71
  - target:
      kind: ClusterRoleBinding
      name: awaken-create-isolation-read
    patch: |-
      - op: replace
        path: /subjects
        value:
          - kind: ServiceAccount
            name: coordinator-runtime
            namespace: awaken-adr71
          - kind: ServiceAccount
            name: worker-runtime
            namespace: awaken-adr71
