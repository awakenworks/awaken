[package]
name = "awaken-resource-application"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "resources"
layer = "application"
authority = "resource"

[dependencies]
async-trait.workspace = true
awaken-resource-contract.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
awaken-file-store = { workspace = true, features = ["test-support"] }
awaken-memory-store = { workspace = true, features = ["test-support"] }
awaken-resource-store = { workspace = true, features = ["test-support"] }
awaken-skill-store = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
