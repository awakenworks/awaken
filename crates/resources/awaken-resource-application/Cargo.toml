[package]
name = "awaken-resource-application"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "resources"
product = "platform"
bounded_context = "resources"
layer = "application"
authority = "resource"
separation = "isolation"
isolates = ["zip"]

[dependencies]
async-trait.workspace = true
awaken-agent-contract.workspace = true
awaken-time.workspace = true
awaken-resource-contract.workspace = true
awaken-session-configuration-contract.workspace = true
uuid = { version = "1", features = ["v4"] }
url.workspace = true
# Skill import is an application trust-boundary operation, not persistence.
zip.workspace = true

[dev-dependencies]
awaken-lease-testkit.workspace = true
awaken-resource-reclaimer.workspace = true
awaken-file-store = { workspace = true, features = ["test-support", "sqlite"] }
awaken-memory-store = { workspace = true, features = ["test-support"] }
awaken-resource-store = { workspace = true, features = ["test-support"] }
awaken-skill-store = { workspace = true, features = ["test-support"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }

[lints]
workspace = true
