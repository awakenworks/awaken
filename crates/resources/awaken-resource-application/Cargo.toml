[package]
name = "awaken-resource-application"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "resources"
layer = "application"
authority = "resource"

[dependencies]
async-trait.workspace = true
awaken-agent-contract.workspace = true
awaken-resource-contract.workspace = true
awaken-session-configuration-contract.workspace = true
awaken-session-resource-contract.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
url.workspace = true
# Skill import is an application trust-boundary operation, not persistence.
zip = { version = "8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
awaken-resource-reclaimer.workspace = true
awaken-file-store = { workspace = true, features = ["test-support", "sqlite"] }
awaken-memory-store = { workspace = true, features = ["test-support"] }
awaken-resource-store = { workspace = true, features = ["test-support"] }
awaken-skill-store = { workspace = true, features = ["test-support"] }
rusqlite.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
