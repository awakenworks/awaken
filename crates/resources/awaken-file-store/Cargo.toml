[package]
name = "awaken-file-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Port-only contract: the FileStore trait + FileStoreError live here; this crate
# implements them and re-exports for backward-compatible paths.
awaken-resource-contract.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# Content id = a stable, collision-resistant hash (not the old 64-bit DefaultHasher),
# so the same bytes get the same id on every backend (fs / postgres / s3).
blake3 = "1"
tokio = { workspace = true, features = ["fs", "io-util"] }
# Network / durable relational backends over the same trait. Optional: default
# build stays fs/in-mem only.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
# Feature `sqlite`: embedded BLOB backend over the same `file_store` migration scope.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# Versioned schema via the foundation's scoped migration (never a raw CREATE TABLE):
# the `file_store_blob` table is migration 1 of the `awaken.file_store` bundle. The
# core migrator (schema) is shared; each backend pulls its own runner.
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9", features = ["postgres"], optional = true }
awaken-scoped-migration-sqlite = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9", optional = true }
object_store = { version = "0.12", features = ["aws"], optional = true }
futures = { version = "0.3", optional = true }

[features]
# Postgres bytea backend (idempotent INSERT ... ON CONFLICT). Compile-verified;
# running needs a database.
postgres = ["dep:sqlx", "dep:awaken-scoped-migration"]
# SQLite BLOB backend (`sqlite::SqliteFileStore`) over the same `file_store` scope.
sqlite = ["dep:rusqlite", "dep:awaken-scoped-migration", "dep:awaken-scoped-migration-sqlite"]
# Object-store backend (S3/MinIO/GCS/Azure via `object_store`; key = content id).
# Unit-tested against the in-memory object store; real S3 needs credentials.
s3 = ["dep:object_store", "dep:futures"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "fs"] }
tempfile = "3"
