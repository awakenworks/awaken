[package]
name = "awaken-memory-store"
version.workspace = true
edition.workspace = true
license.workspace = true

# Durable path-addressed memory persistence for the resources plane, with in-memory,
# filesystem, SQLite, and Postgres backends. The adapter receives only opaque store
# ids; ownership and authorization stay in their respective outer planes.

[dependencies]
# Port-only contract: MemoryRepository + Memory/MemoryEntry/MemErr live here; this crate
# implements them and re-exports the contract types.
awaken-resource-contract.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "fs"] }
# ADR-0053 path-addressed MemoryRepository: content-sha256 (Anthropic wire uses sha256) +
# a durable JSON record per memory.
sha2 = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
# Feature `sqlite`: embedded durable MemoryRepository over the crate's migration scope.
rusqlite = { workspace = true, optional = true }
# Feature `postgres`: network-DB MemoryRepository over the same scope (multi-node).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9", features = ["postgres"], optional = true }
awaken-scoped-migration-sqlite = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }

[features]
default = []
sqlite = ["dep:rusqlite", "dep:awaken-scoped-migration", "dep:awaken-scoped-migration-sqlite"]
postgres = ["dep:sqlx", "dep:awaken-scoped-migration"]

[lints]
workspace = true
