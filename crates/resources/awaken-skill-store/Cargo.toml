[package]
name = "awaken-skill-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "resources"
layer = "infrastructure"
authority = "skill"

# Durable skill catalog for the resources plane: the `SkillStore` port (mirroring
# awaken-file-store's `FileStore`) with pluggable backends — in-memory / filesystem /
# sqlite / postgres over one portable bundle — so a delivered skill survives a
# restart and, on postgres, is shared across nodes. It names no runtime/host/ext
# type; the host serves delivered skills from it while awaken-ext-skills stays
# store-unaware (it only sees SkillFile data via its SkillSource port).

[dependencies]
# Port-only contract: the SkillStore trait + SkillStoreError live here; this crate
# implements them and re-exports for backward-compatible paths.
awaken-resource-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
# Canonical bundle ingestion decodes ZIP in memory before the repository write.
# Only the ubiquitous deflate codec is enabled; paths and expanded sizes are
# validated by `canonicalize_skill_bundle`.
zip = { version = "8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "fs"] }
# Feature `sqlite`: embedded durable SkillStore over the crate's own `skill_store`
# migration scope.
rusqlite = { workspace = true, optional = true }
# Feature `postgres`: network-DB SkillStore over the same scope, for multi-node SaaS.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
awaken-scoped-migration = { workspace = true, features = ["postgres"], optional = true }
awaken-scoped-migration-sqlite = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }

[features]
default = []
# Process-local Skill authority and private SQLite databases for tests/scenarios.
test-support = []
sqlite = ["dep:rusqlite", "dep:awaken-scoped-migration", "dep:awaken-scoped-migration-sqlite"]
postgres = ["dep:sqlx", "dep:awaken-scoped-migration"]

[lints]
workspace = true
