[package]
name = "awaken-plugin-composition"
description = "One platform plugin declaration for process discovery and configuration admission"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "apps"
product = "apps"
layer = "bootstrap"
authority = "plugin-composition"
separation = "process"

[dependencies]
awaken-executable-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-ext-background-task.workspace = true
awaken-ext-state-machine = { workspace = true, features = ["schema"] }
awaken-ext-memory.workspace = true
awaken-ext-compact.workspace = true
awaken-ext-builtin-tools.workspace = true
serde_json.workspace = true

[dev-dependencies]
jsonschema.workspace = true

[lints]
workspace = true
