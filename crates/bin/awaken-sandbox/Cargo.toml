[package]
name = "awaken-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "apps"
product = "apps"
layer = "bootstrap"
authority = "sandbox"
separation = "process"

[lib]
name = "awaken_sandbox"
path = "src/lib.rs"

# The EXECUTION-plane binary (the sandbox side, opposite the control plane `awaken`).
# One binary, roles chosen by the first arg:
#   - acp     : a stdio<->TCP bridge that spawns the process-as-container ACP CLI and
#               bridges its stdio to a dialed socket (the image ENTRYPOINT; the CLI argv
#               arrives as the container Cmd = `command_of(spec)`).
#   - hand    : the neutral tool-execution endpoint (ADR-0044/0045).
#   - repository-publish-noreplace: internal atomic filesystem effect consumed by
#               the container Repository adapter through the configured Hand binary.
#   - read-tree-nofollow: descriptor-relative regular-file snapshot consumed by
#               the container terminal participant adapter.
[[bin]]
name = "awaken-sandbox"
path = "src/main.rs"

[features]
# The `hand` role (ADR-0044/0045 tool executor). FAT: it pulls the tool implementations
# + the executor channel + the connection transport, so it is OFF by default — the acp
# image builds thin (bridge only), the hand image builds `--features hand`.
hand = [
    "dep:awaken-tool-relay",
    "dep:awaken-ext-builtin-tools",
    "dep:awaken-connection-plan",
    "dep:awaken-tool-contract",
    "dep:async-nats",
    "dep:futures",
    "dep:serde_json",
    "dep:rustix",
]

[dependencies]
awaken-tool-contract = { workspace = true, optional = true }
# The one wall-clock port: chosen by `main`, handed to the Hand and the Git
# credential helper.
awaken-time.workspace = true
awaken-local-process.workspace = true
awaken-provisioning-contract.workspace = true
awaken-sandbox-control.workspace = true
awaken-sandbox-control-transport.workspace = true
awaken-fs-durability = { workspace = true, features = ["native-fs"] }
tar = "0.4"
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "process",
    "signal",
    "sync",
    "time",
] }
# `hand` role only (optional): serve_hand + the executable hand tools over a unix / TCP
# (listen or reverse-dial) / NATS channel — the transports a sandboxed hand reaches its
# brain over (unix crosses a `--network none` boundary; reverse-dial an egress-fenced
# k8s Pod; NATS a relay fleet). Supersedes awaken-coordinator's hand_server.rs.
awaken-tool-relay = { workspace = true, optional = true }
awaken-ext-builtin-tools = { workspace = true, optional = true }
awaken-connection-plan = { workspace = true, optional = true }
async-nats = { version = "0.50", optional = true }
futures = { version = "0.3", optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["stdio"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
awaken-sandbox-local.workspace = true

[dev-dependencies]
awaken-resource-application.workspace = true
awaken-runtime-contract.workspace = true
awaken-lease-testkit.workspace = true
async-trait.workspace = true
awaken-agent-channel.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "test-util"] }
awaken-tool-relay = { workspace = true, features = ["test-support"] }
# Hand/scoped tests consume the shared explicit authority fixture. Declare it
# here so isolated thin/fat package tests do not borrow workspace feature union.
awaken-provisioning-contract = { workspace = true, features = ["test-support"] }
# Real scoped Git fixtures use local bare endpoints; production still requires
# admitted HTTPS/Gateway transport (this feature is dev-only).
awaken-sandbox-local = { workspace = true, features = ["test-support"] }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
awaken-resource-contract.workspace = true
# Strict substrate qualification composes the real scoped owner with durable
# Memory and FUSE. These are test adapters, not new binary runtime dependencies.
awaken-memory-store = { workspace = true, features = ["sqlite"] }
awaken-sandbox-memoryd.workspace = true

[lints]
workspace = true
