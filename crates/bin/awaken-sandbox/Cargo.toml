[package]
name = "awaken-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "awaken_sandbox"
path = "src/lib.rs"

# The EXECUTION-plane binary (the sandbox side, opposite the control plane `awaken`).
# One binary, roles chosen by the first arg:
#   - acp     : a stdio<->TCP bridge that spawns the process-as-container ACP CLI and
#               bridges its stdio to a dialed socket (the image ENTRYPOINT; the CLI argv
#               arrives as the container Cmd = `command_of(spec)`).
#   - hand    : the neutral tool-execution endpoint (ADR-0044/0045).
#   - memoryd : the memory FUSE/copy sidecar (ADR-0053) that projects a durable
#               memory store into a shared pod volume, FUSE-first with a copy fallback.
[[bin]]
name = "awaken-sandbox"
path = "src/main.rs"

[features]
# The `hand` role (ADR-0044/0045 tool executor). FAT: it pulls the tool implementations
# + the executor channel + the connection transport, so it is OFF by default — the acp
# image builds thin (bridge only), the hand image builds `--features hand`.
hand = [
    "dep:awaken-tool-relay",
    "dep:awaken-ext-builtin-tools",
    "dep:awaken-connection-plan",
    "dep:async-nats",
    "dep:futures",
    "dep:serde_json",
]
# The `memoryd` role (ADR-0053 memory sidecar). FAT + Linux-only: it pulls the
# write-through FUSE server (fuser/libc, needs /dev/fuse) + the durable sqlite store,
# so it is OFF by default — the acp image builds thin, the memoryd image builds
# `--features memoryd`. The copy fallback within works without /dev/fuse.
memoryd = [
    "dep:awaken-sandbox-memoryd",
    "dep:awaken-memory-store",
    # The store-owned sqlite backing database (SqliteMemoryRepository + the memory-store
    # scoped migrations); the FUSE server projects it as files.
    "awaken-memory-store/sqlite",
]

[dependencies]
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "process",
    "signal",
] }
# `hand` role only (optional): serve_hand + the executable hand tools over a unix / TCP
# (listen or reverse-dial) / NATS channel — the transports a sandboxed hand reaches its
# brain over (unix crosses a `--network none` boundary; reverse-dial an egress-fenced
# k8s Pod; NATS a relay fleet). Supersedes awaken-server's hand_server.rs.
awaken-tool-relay = { workspace = true, optional = true }
awaken-ext-builtin-tools = { workspace = true, optional = true }
awaken-connection-plan = { workspace = true, optional = true }
async-nats = { version = "0.38", optional = true }
futures = { version = "0.3", optional = true }
serde_json = { workspace = true, optional = true }
# `memoryd` role only (optional): the write-through FUSE server that projects a durable
# memory store as files (FUSE-first, copy fallback), over a store-owned sqlite database.
awaken-sandbox-memoryd = { workspace = true, optional = true }
awaken-memory-store = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
# hand-role integration test: drive the real hand with a real ToolCall over a socket.
awaken-runtime-contract = { workspace = true }
# memoryd-role integration test: seed + assert a sqlite-backed store across a copy cycle.
awaken-memory-store = { workspace = true, features = ["sqlite"] }

[lints]
workspace = true
