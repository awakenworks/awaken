[package]
name = "awaken-standalone"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "awaken-standalone"
path = "src/main.rs"

[dependencies]
# The open single-machine assembly: it composes ONLY open crates — no
# admin-config-api write plane, no iam-server, no distributed store. This minimal open set
# is kept lean in CI (check_crate_boundaries.py).
awaken-runtime-host.workspace = true
# Cross-cutting telemetry (open leaf): tracing subscriber + OTLP /
# AWAKEN_TRACE_FILE span export + W3C traceparent propagator + ingress middleware.
awaken-observability.workspace = true
awaken-protocol-managed.workspace = true
# The sibling protocol adapters over the same host — the standalone serves the
# whole open protocol surface (Managed + AI SDK + AG-UI + A2A), all behind the guard.
awaken-protocol-ai-sdk.workspace = true
awaken-protocol-ag-ui.workspace = true
awaken-protocol-a2a.workspace = true
awaken-protocol-transport.workspace = true
awaken-authz-enforce.workspace = true
# Webhook plane (ADR-0048 / S10): env-gated by AWAKEN_WEBHOOK_DIR; the guarded
# session surface fans a signed webhook out to the workspace on session lifecycle.
awaken-webhook-managed.workspace = true
awaken-config-resolver.workspace = true
# Open ports for the (in-memory) webhook plane: the WebhookStore lives in
# config-resolver, the SecretStore the whsec_ key is sealed behind in the vault.
awaken-credential-vault.workspace = true
awaken-runtime-contract.workspace = true
axum = "0.8"
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
