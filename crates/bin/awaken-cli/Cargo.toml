[package]
name = "awaken-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "awaken"

[package.metadata.awaken]
context = "apps"
product = "apps"
layer = "bootstrap"
authority = "cli"
separation = "process"

[lib]
name = "awaken_cli"
path = "src/lib.rs"

[[bin]]
name = "awaken"
path = "src/main.rs"

# The operator launcher and the AllInOne process. Every service role is the
# process startup's; this package adds only the Worker an AllInOne process
# co-locates with its Coordinator. The Coordinator executable is declared by
# awaken-coordinator-process, whose closure links no Worker-side crate.
[dependencies]
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-dispatch.workspace = true
awaken-dispatch-execution.workspace = true
awaken-session-application.workspace = true
awaken-session-application-contract.workspace = true
awaken-session-execution-contract.workspace = true
awaken-session-run-delivery.workspace = true
awaken-protocol-a2a.workspace = true
awaken-run-executor-a2a.workspace = true
awaken-ext-builtin-tools.workspace = true
awaken-inference-endpoint = { workspace = true, features = ["brokered"] }
thiserror.workspace = true

awaken-process-startup.workspace = true
# The scenario root must join the selected startup lifecycle explicitly.
awaken-service-lifecycle = { workspace = true, optional = true }
# The co-located Worker of an AllInOne process.
awaken-worker = { workspace = true }
awaken-worker-contract.workspace = true
awaken-worker-transport-security.workspace = true
awaken-acp-application = { workspace = true }
awaken-acp-contract.workspace = true
awaken-control = { workspace = true }
awaken-coordinator = { workspace = true }
awaken-credential-contract.workspace = true
awaken-credential-materializer = { workspace = true, features = ["authority", "brokered"] }
awaken-credential-vault.workspace = true
awaken-deployment-config.workspace = true
awaken-protocol-acp = { workspace = true, features = ["real-acp"] }
awaken-run-executor-acp = { workspace = true, features = ["execution", "host-preparation", "real-acp"] }
awaken-tool-contract.workspace = true
awaken-tool-relay.workspace = true
# The Session execution a local claim pool co-locates: the deployment's
# Session environment, the Memory mount data plane over the Resources source
# and invalidation bus, and the executor they are installed into.
awaken-execution-composition.workspace = true
awaken-sandbox-memoryd.workspace = true
awaken-resource-contract.workspace = true
awaken-session-executor.workspace = true
awaken-time.workspace = true
async-trait.workspace = true
axum = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync"] }

[features]
# Volatile startup helpers used by integration/scenario harnesses.
test-support = ["awaken-process-startup/test-support", "dep:awaken-service-lifecycle"]
# Container ACP tiers (AWAKEN_SANDBOX_TIER=docker/podman/k8s): enable the backend a
# deployment runs its agents on. Off by default — the namespace tier needs no feature.
container-docker = ["awaken-process-startup/container-docker", "awaken-execution-composition/docker"]
container-podman = ["awaken-process-startup/container-podman", "awaken-execution-composition/podman"]
container-k8s = ["awaken-process-startup/container-k8s", "awaken-execution-composition/k8s", "awaken-worker/container-k8s", "awaken-worker-transport-security/kubernetes"]

[dev-dependencies]

awaken-installation-workspace.workspace = true
awaken-process-startup = { workspace = true, features = ["test-support"] }
# The off-Linux Memory copy fallback row reads a real Resources Memory store.
awaken-resource-persistence = { workspace = true, features = ["test-support"] }
awaken-provisioning-contract.workspace = true
awaken-credential-vault = { workspace = true, features = ["test-support"] }
awaken-observability.workspace = true
tempfile = "3"

[lints]
workspace = true
