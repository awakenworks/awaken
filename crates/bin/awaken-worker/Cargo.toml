[package]
name = "awaken-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "awaken_worker"
path = "src/lib.rs"

# The PRODUCTION database-less worker (Stage C): a peer of the control / data planes.
# It drains runs over the dispatch transport and resolves EACH run's model_ref (from
# its activation snapshot) to the real DB-configured provider via
# snapshot-pinned model candidates over the SAME credential store `awaken-cli`
# opens — no catalog re-resolution and no mocks. `NoModelConfiguredExecutor` is
# only an inert host-construction placeholder; installed materialization makes a
# missing or stale publication pin fail closed before it can run. A worker
# explicitly configured for shared resources additionally opens data-plane clients
# plus the narrow ResourceBindingValidator; it still owns no authoring/Session store.
[features]
# Container sandbox tiers (AWAKEN_SANDBOX_TIER=docker|podman|k8s), passed through to
# the shared host via awaken-server so a database-less worker can realize its ACP
# sessions inside containers/Pods. Off by default (bwrap namespace tier).
container-docker = ["awaken-server/container-docker"]
container-podman = ["awaken-server/container-podman"]
container-k8s = ["awaken-server/container-k8s"]

[dependencies]
# The neutral host substrate: SharedHost, the dispatch pool, and the worker dispatch
# store that routes the drain over HTTP to the cell server.
awaken-runtime-host = { workspace = true }
awaken-runtime-contract = { workspace = true }
# The data plane: the inert NoModelConfiguredExecutor placeholder + the
# CredentialInferenceMaterializer that opens a pinned credential for an executor.
awaken-server = { workspace = true }
# Reuse the composition's credential-vault + secret-store opening and seal-key
# resolution. The worker does not open catalog/config/admin/session stores.
awaken-control = { workspace = true }
awaken-credential-vault = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util"] }
# The cloud-native admin surface (readyz / livez / metrics / drain) on a separate
# port, so an orchestrator can gate routing and drain the worker gracefully.
axum = { workspace = true }
# The admin `/metrics` scrape renders the process's OTel metrics (via the Prometheus
# exporter installed by `awaken_observability::init`).
awaken-observability = { workspace = true }
awaken-worker-contract = { workspace = true }
awaken-acp-contract = { workspace = true }
awaken-provisioning-contract = { workspace = true }
getrandom = "0.2"

[dev-dependencies]
# The admin router tests drive the axum router directly (oneshot).
tower = { version = "0.5", features = ["util"] }
# The materialization test builds a CredentialInferenceMaterializer over in-memory
# stores and asserts exact published access materializes a real executor.
awaken-agent-contract = { workspace = true }
async-trait = { workspace = true }

[lints]
workspace = true
