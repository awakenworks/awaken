[package]
name = "awaken-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
layer = "bootstrap"
authority = "worker"

[lib]
name = "awaken_worker"
path = "src/lib.rs"

[[bin]]
name = "awaken-worker"
path = "src/main.rs"

# The production authority-store-isolated executor crate: a peer of the control/data planes.
# It drains runs over the dispatch transport and resolves EACH run's model_ref (from
# its activation snapshot) to the real DB-configured provider via
# snapshot-pinned model candidates through an exact Worker-private resolver — no
# authority database, catalog re-resolution, or mocks. `NoModelConfiguredExecutor` is
# only an inert host-construction placeholder; installed materialization makes a
# missing or stale publication pin fail closed before it can run. A worker
# configured for Resources installs registration-bound per-kind data-plane
# clients; it never opens an authority store.
[features]
# Container sandbox tiers (AWAKEN_SANDBOX_TIER=docker|podman|k8s), passed directly
# to the shared host so a remote execution worker can realize its ACP
# sessions inside containers/Pods. Off by default (bwrap namespace tier).
container-docker = ["awaken-runtime-host/container-docker"]
container-podman = ["awaken-runtime-host/container-podman"]
container-k8s = ["awaken-runtime-host/container-k8s"]

[dependencies]
# The neutral host substrate: SharedHost, the dispatch pool, and the worker dispatch
# store that routes the drain over HTTP to the cell server.
awaken-runtime-host = { workspace = true, default-features = false }
awaken-resource-worker-http.workspace = true
awaken-sandbox-memoryd.workspace = true
awaken-worker-runtime.workspace = true
awaken-runtime-contract = { workspace = true }
awaken-credential-materializer.workspace = true
awaken-ext-builtin-tools.workspace = true
awaken-sandbox-container.workspace = true
awaken-tool-relay.workspace = true
awaken-session-contract.workspace = true
awaken-worker-transport-security.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "fs"] }
# The cloud-native admin surface (readyz / livez / metrics / drain) on a separate
# port, so an orchestrator can gate routing and drain the worker gracefully.
axum = { workspace = true }
# The admin `/metrics` scrape renders the process's OTel metrics (via the Prometheus
# exporter installed by `awaken_observability::init`).
awaken-observability = { workspace = true }
awaken-worker-contract = { workspace = true }
awaken-acp-contract = { workspace = true }
awaken-protocol-acp = { workspace = true }
awaken-run-executor-acp = { workspace = true }
awaken-provisioning-contract = { workspace = true }
async-trait = { workspace = true }
getrandom = "0.2"
serde.workspace = true
toml.workspace = true
tracing = "0.1"

[dev-dependencies]
# The admin router tests drive the axum router directly (oneshot).
tower = { version = "0.5", features = ["util"] }
# Bare in-memory Host construction exists only for explicit test startup;
# production Worker builds keep the runtime-host test backend unlinked.
awaken-runtime-host = { workspace = true, features = ["test-support"] }
awaken-tool-relay = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true
