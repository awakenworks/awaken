[package]
name = "awaken-sandbox-fs"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
product = "platform"
bounded_context = "sandbox"
layer = "infrastructure"
authority = "sandbox-filesystem"
separation = "isolation"
isolates = ["cap-std", "rustix", "windows-sys"]

[dependencies]
awaken-fs-durability.workspace = true
cap-std = "4"
rustix = { version = "1", features = ["fs"] }

[target.'cfg(not(any(target_os = "linux", target_os = "macos")))'.dependencies]
same-file = "1.0.6"

[target.'cfg(windows)'.dependencies]
awaken-fs-win32 = { path = "../../shared/awaken-fs-win32" }
cap-primitives = "4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
