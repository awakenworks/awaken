[package]
name = "awaken-execution-composition"
description = "Worker-plane composition of Session execution environments for Awaken processes"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
product = "platform"
bounded_context = "worker"
layer = "bootstrap"
authority = "execution-composition"

[dependencies]
# The Session owner whose container-tier provider this crate selects and installs.
awaken-session-executor.workspace = true
# The frozen backend/tool vocabulary and the neutral ACP policy port.
awaken-runtime-contract.workspace = true
awaken-acp-contract.workspace = true
awaken-credential-contract.workspace = true
# The exact claim-fenced materializer consumed by the sole ACP launch resolver.
awaken-credential-materializer.workspace = true
# The one authoritative ACP adapter catalog queried by that policy.
awaken-run-executor-acp.workspace = true
# The backend-erased container ports the Session owner holds.
awaken-container-contract.workspace = true
awaken-provisioning-contract.workspace = true
awaken-connection-plan.workspace = true
awaken-time.workspace = true
# The container tier (podman/docker/k8s) this composition realizes; each backend
# is enabled by the matching feature below.
awaken-sandbox-container.workspace = true
# The Workdir sandboxes auxiliary Agent Runs use on every process root.
awaken-sandbox-local.workspace = true
awaken-session-environment-contract.workspace = true
# The sandbox-backed Session environment adapters this composition selects.
awaken-session-environment.workspace = true
async-trait.workspace = true
# The Namespace companion check and tier probe run at startup.
tokio = { workspace = true, features = ["process", "time", "io-util", "sync"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[features]
# Container Session tiers (AWAKEN_SANDBOX_TIER=docker|podman|k8s). Off by default:
# a build without them fails closed when the deployment names a container backend.
docker = ["awaken-sandbox-container/docker"]
podman = ["awaken-sandbox-container/podman"]
k8s = ["awaken-sandbox-container/k8s"]

[dev-dependencies]
# Test access to the adapters behind the installed role handles (`at_root`).
awaken-session-environment = { workspace = true, features = ["test-support"] }
# Hosts over a chosen Deployment for the startup rows.
awaken-runtime-host-testkit.workspace = true
awaken-agent-contract.workspace = true
awaken-credential-vault = { workspace = true, features = ["test-support"] }
awaken-credential-materializer = { workspace = true, features = ["authority"] }
tempfile = "3"
serde_json.workspace = true

[lints]
workspace = true
