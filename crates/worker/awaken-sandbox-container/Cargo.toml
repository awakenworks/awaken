[package]
name = "awaken-sandbox-container"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[package.metadata.awaken]
context = "worker"
product = "platform"
bounded_context = "sandbox"
layer = "infrastructure"
authority = "sandbox-container"
separation = "isolation"
isolates = ["bollard", "tar"]

[dependencies]
awaken-environment-contract.workspace = true
# The backend-erased container ports this provider implements.
awaken-container-contract.workspace = true
awaken-time.workspace = true
awaken-provisioning-contract.workspace = true
awaken-local-process.workspace = true
awaken-resource-contract.workspace = true
awaken-agent-channel.workspace = true
awaken-sandbox-control.workspace = true
awaken-sandbox-control-transport.workspace = true
async-trait.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
# BLAKE3 content id: the tier resolves mount bytes through the injected BlobSource
# port (A-G17, no durable store linked) and verifies the declared content hash itself —
# the same id the content-addressed store assigns (parity with awaken-sandbox-local).
blake3 = "1"
tar = "0.4"
# Container channels reuse the one topology factory; provider lifecycle and
# authenticated Pod forwarding remain in their respective adapters.
awaken-connection-plan = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "rt", "io-util", "time"] }
tokio-util.workspace = true
# Real Docker backend (Docker Engine API via the SDK, not the CLI). Optional.
bollard = { version = "0.18", optional = true }
futures-util = { version = "0.3", optional = true }
base64 = "0.22"
# A process-incarnation nonce: uniqueness, not time.
uuid = { version = "1", features = ["v4"] }

[features]
# Real remote transport (TCP dial + reverse-dial pairing) producing an AgentChannel.
# Enable to build/test the network path; default off.
connection = ["dep:awaken-connection-plan", "tokio/net", "tokio/io-util", "tokio/rt", "tokio/time"]
# Real Docker ContainerRuntime (bollard). Dials the published agent port via the
# `connection` transport. Compile-verified; running needs a Docker daemon.
docker = ["dep:bollard", "dep:futures-util", "connection"]
# Lets a caller outside this crate admit an exec that no environment ledger
# records. Only a harness driving the runtime port directly needs it — a
# Session environment always has a ledger — so it stays off for dependants.
unrecorded-exec = []
# Shared Session fixtures for the tests of the engine crates building on this
# provider (awaken-sandbox-kubernetes). Never enabled by a production dependant.
test-support = []
# Rootless Podman ContainerRuntime (daemonless CLI fork-exec). Honors the rootfs
# plan (Image / IsolatedRoot). Compile-verified; running needs the `podman` binary.
podman = ["connection", "tokio/process"]

[dev-dependencies]
awaken-agent-contract.workspace = true
awaken-tool-contract.workspace = true
awaken-lease-testkit.workspace = true
axum.workspace = true
# Self dev-dependency so the integration suites — which drive the runtime port
# directly and own their containers — can admit an exec no environment ledger
# records. Dependants never see this feature.
awaken-sandbox-container = { path = ".", features = ["unrecorded-exec"] }
awaken-provisioning-contract = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "net", "time", "test-util"] }
awaken-tool-relay.workspace = true
awaken-memory-store = { workspace = true, features = ["test-support"] }
awaken-sandbox-memoryd.workspace = true
tempfile = "3"
