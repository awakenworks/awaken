[package]
name = "awaken-sandbox-container"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
layer = "infrastructure"
authority = "sandbox-container"

[dependencies]
awaken-provisioning-contract.workspace = true
awaken-resource-contract.workspace = true
awaken-agent-channel.workspace = true
async-trait.workspace = true
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
# BLAKE3 content id: the tier resolves mount bytes through the injected BlobSource
# port (A-G17, no durable store linked) and verifies the declared content hash itself —
# the same id the content-addressed store assigns (parity with awaken-sandbox-local).
blake3 = "1"
tar = "0.4"
# Slice-5 remote transport: awaken-connection (core-only, same foundation rev as
# awaken-scoped-migration) establishes the container-tier AgentChannel. Optional so
# the default build stays dependency-light and daemon-free.
awaken-connection = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }
# Real Docker backend (Docker Engine API via the SDK, not the CLI). Optional.
bollard = { version = "0.18", optional = true }
futures-util = { version = "0.3", optional = true }
base64 = { version = "0.22", optional = true }
# Real Kubernetes backend (kube-apiserver via the SDK, not kubectl). Optional.
kube = { version = "1", default-features = false, features = ["client", "http-proxy", "rustls-tls", "ws"], optional = true }
k8s-openapi = { version = "0.25", features = ["v1_30"], optional = true }
# kube's rustls client needs a process-level CryptoProvider selected explicitly.
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

[features]
# Real remote transport (TCP dial + reverse-dial pairing) producing an AgentChannel.
# Enable to build/test the network path; default off.
connection = ["dep:awaken-connection", "tokio/net", "tokio/io-util", "tokio/rt", "tokio/time"]
# Real Docker ContainerRuntime (bollard). Dials the published agent port via the
# `connection` transport. Compile-verified; running needs a Docker daemon.
docker = ["dep:bollard", "dep:futures-util", "dep:base64", "connection"]
# Real Kubernetes ContainerRuntime (kube). Process-as-container Pod + native-GC.
# Compile-verified; running needs a cluster.
k8s = ["dep:kube", "dep:k8s-openapi", "dep:rustls", "connection"]
# Rootless Podman ContainerRuntime (daemonless CLI fork-exec). Honors the rootfs
# plan (Image / IsolatedRoot). Compile-verified; running needs the `podman` binary.
podman = ["connection", "tokio/process"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "net", "time", "test-util"] }
awaken-runtime-contract.workspace = true
awaken-tool-relay.workspace = true
tempfile = "3"
