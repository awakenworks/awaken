[package]
name = "awaken-local-process"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
layer = "infrastructure"
authority = "local-process"

[dependencies]
async-trait.workspace = true
awaken-provisioning-contract.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["process", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Scoped cutoffs read the same BOOTTIME the authority proof samples.
awaken-authority-clock.workspace = true
rustix = { version = "1", features = ["fs", "net", "process", "event"] }
tokio = { workspace = true, features = ["net", "io-util"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
