[package]
name = "awaken-config-resolver"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-model-catalog.workspace = true
awaken-credential-vault.workspace = true
serde.workspace = true
thiserror.workspace = true
schemars = { version = "1", optional = true }

[features]
default = []
# Emit JSON Schema for the authored DTOs (e.g. `InferenceProfile`) so the admin
# API can include them in the generated TS contract.
schema = ["dep:schemars", "awaken-credential-vault/schema"]

[dev-dependencies]
tokio.workspace = true
serde_json.workspace = true
# P0/E2E acceptance: full chain through the production APIs (admin repos →
# credential entry → managed model-decode → resolve → provider seam). Real model
# call is env-gated.
awaken-provider-genai.workspace = true
awaken-managed-bridge.workspace = true

[lints]
workspace = true
