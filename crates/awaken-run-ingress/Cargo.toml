[package]
name = "awaken-run-ingress"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-run-ingress-contract = { path = "../awaken-run-ingress-contract" }
awaken-runtime = { path = "../awaken-runtime" }
awaken-ext-builtin-tools = { path = "../awaken-ext-builtin-tools" }
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "d98b40c90fdac65c329eb279bf5052818906a1de", features = ["postgres", "sqlite"] }
async-nats = { version = "0.38", optional = true }
futures-lite = { version = "2", optional = true }

[features]
# Optional cross-node wake signal over NATS. Off by default — the default build
# and test suite stay free of the NATS driver; enable for a multi-node fleet.
nats = ["dep:async-nats", "dep:futures-lite"]

[dev-dependencies]
awaken-store-postgres = { path = "../awaken-store-postgres" }
awaken-store-sqlite = { path = "../awaken-store-sqlite" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
