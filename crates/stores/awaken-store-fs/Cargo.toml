[package]
name = "awaken-store-fs"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
product = "platform"
bounded_context = "committed-truth"
layer = "infrastructure"
authority = "store-fs"

[dependencies]
awaken-sync.workspace = true
awaken-agent-contract.workspace = true
awaken-fs-durability = { workspace = true, features = ["native-fs"] }
awaken-store-inmem.workspace = true
async-trait.workspace = true
awaken-time.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
awaken-reliability-testkit.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
awaken-store-conformance.workspace = true

[lints]
workspace = true
