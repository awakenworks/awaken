[package]
name = "awaken-work-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
layer = "infrastructure"
authority = "work"

[features]
# Volatile executable specifications and fixtures are opt-in. Product builds have
# no process-local WorkQueue implementation to select accidentally.
test-support = []
# Replace the lease-authority mutex with Loom's scheduler-aware mutex in the
# dedicated concurrency proof build.
loom = []

[dependencies]
# The WorkQueue port + its neutral vocabulary this crate implements a durable backend
# for (SQLite embedded / Postgres distributed, at parity).
awaken-session-contract = { workspace = true }
awaken-agent-contract.workspace = true
awaken-sqlite-runtime.workspace = true
# Reuse the platform's canonical OS CSPRNG seam; WorkStore owns no parallel
# token directory or IAM policy, only one lease-bound opaque secret digest.
awaken-iam-core.workspace = true
async-trait.workspace = true
serde_json.workspace = true
base64 = "0.22"
sha2 = "0.10"
rusqlite = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
# The portable scoped-migration bundle (one `work_queue` schema, both backends).
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
awaken-scoped-migration-sqlite.workspace = true

[dev-dependencies]
# Property-based verification of the shared lease/reclaim + poll-window algorithm (ADR-0059).
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
loom = "0.7"

[[test]]
name = "work_queue_conformance"
required-features = ["test-support"]

[[test]]
name = "work_queue_properties"
required-features = ["test-support"]

[lints]
workspace = true
