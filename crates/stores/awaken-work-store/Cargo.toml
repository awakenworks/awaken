[package]
name = "awaken-work-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The WorkQueue port + its neutral vocabulary this crate implements a durable backend
# for (SQLite embedded / Postgres distributed, at parity).
awaken-session-contract = { workspace = true }
async-trait.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
# The portable scoped-migration bundle (one `work_queue` schema, both backends).
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9", features = ["postgres"] }
awaken-scoped-migration-sqlite = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
