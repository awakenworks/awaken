[package]
name = "awaken-store-schema"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9" }

# Dev-only: prove the portable bundle actually APPLIES on both real backends it
# drives. The schema crate itself names no SQL driver; these harness deps (the two
# migration runners and their drivers) live only in the test build.
[dev-dependencies]
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9", features = ["postgres"] }
awaken-scoped-migration-sqlite = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9" }
rusqlite = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
