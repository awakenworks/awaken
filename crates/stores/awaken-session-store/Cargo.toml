[package]
name = "awaken-session-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The ManagedSessionRepository port + PersistedSession this crate implements a durable
# backend for (SQLite embedded / Postgres distributed, at parity).
awaken-session-contract = { workspace = true }
awaken-credential-contract = { workspace = true }
awaken-ext-memory = { workspace = true }
# The opaque tenancy `ScopeId` the in-memory scoped-session store keys its isolation
# fence by (the durable backends bind it as an opaque column).
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
# The portable scoped-migration bundle (one `managed_session` schema, both backends).
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "111aaf8a22e0ade4f02548732fd852057180a174", features = ["postgres"] }
awaken-scoped-migration-sqlite = { git = "https://github.com/awakenworks/awaken-foundation", rev = "111aaf8a22e0ade4f02548732fd852057180a174" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# The sqlite backend tests open a temp on-disk database.
tempfile = "3"
# Property-based verification of the tenant-isolation fence (ADR-0059).
proptest = { workspace = true }

[lints]
workspace = true
