[package]
name = "awaken-session-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
layer = "infrastructure"
authority = "session"

[dependencies]
awaken-agent-contract.workspace = true
# The SessionRepository port + PersistedSession this crate implements a durable
# backend for (SQLite embedded / Postgres distributed, at parity).
awaken-session-application-contract.workspace = true
awaken-session-configuration-contract.workspace = true
awaken-session-error-contract.workspace = true
awaken-session-repository-contract.workspace = true
awaken-session-state-contract.workspace = true
awaken-session-budget-contract.workspace = true
awaken-session-dream-contract.workspace = true
awaken-session-event-contract.workspace = true
awaken-session-mcp-contract.workspace = true
awaken-session-resource-contract.workspace = true
awaken-session-types.workspace = true
awaken-environment-contract.workspace = true
awaken-resource-contract.workspace = true
awaken-sql-storage.workspace = true
awaken-sqlite-pool.workspace = true
awaken-deployment-contract = { workspace = true }
awaken-credential-contract = { workspace = true }
awaken-ext-memory = { workspace = true }
# The opaque tenancy `ScopeId` the in-memory scoped-session store keys its isolation
# fence by (the durable backends bind it as an opaque column).
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio.workspace = true
tracing = "0.1"
tempfile = "3"
# The portable scoped-migration bundle (one `managed_session` schema, both backends).
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
awaken-scoped-migration-sqlite.workspace = true

[dev-dependencies]
awaken-store-conformance.workspace = true
awaken-provisioning-contract.workspace = true
awaken-reliability-testkit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Property-based verification of the tenant-isolation fence (ADR-0059).
proptest = { workspace = true }

[features]
# Private SQLite Session authority for unit/integration/scenario fixtures.
test-support = []

[[test]]
name = "session_repo_conformance"
required-features = ["test-support"]

[lints]
workspace = true
