[package]
name = "awaken-store-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
product = "platform"
bounded_context = "committed-truth"
layer = "infrastructure"
authority = "store-postgres"
separation = "isolation"
isolates = ["sqlx"]

[dependencies]
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-store-schema = { workspace = true }
awaken-sql-storage = { workspace = true, features = ["postgres"] }
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
async-trait.workspace = true
serde_json.workspace = true
serde.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
thiserror.workspace = true
tokio.workspace = true
tracing = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
awaken-store-conformance.workspace = true

[lints]
workspace = true
