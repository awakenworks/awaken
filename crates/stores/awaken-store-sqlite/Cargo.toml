[package]
name = "awaken-store-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
product = "platform"
bounded_context = "committed-truth"
layer = "infrastructure"
authority = "store-sqlite"

[dependencies]
awaken-agent-contract.workspace = true
awaken-store-schema = { workspace = true }
awaken-sqlite-pool.workspace = true
awaken-scoped-migration = { workspace = true, features = ["sqlite"] }
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror.workspace = true
tokio.workspace = true
tracing = "0.1"

[dev-dependencies]
awaken-reliability-testkit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
awaken-store-conformance.workspace = true
tempfile = "3"

[features]
# Private SQLite commit authority for unit and integration fixtures.
test-support = []

[[test]]
name = "checkpoint_reader"
required-features = ["test-support"]

[[test]]
name = "scope_isolation"
required-features = ["test-support"]

[[test]]
name = "sqlite_commit"
required-features = ["test-support"]

[[test]]
name = "failure_atomicity"
required-features = ["test-support"]

[lints]
workspace = true
