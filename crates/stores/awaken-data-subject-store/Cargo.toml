[package]
name = "awaken-data-subject-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
product = "platform"
bounded_context = "governance"
layer = "infrastructure"
authority = "data-subject-store"
separation = "isolation"
isolates = ["sqlx"]

# SQLite/PostgreSQL adapters for the Data Subject application ports. Volatile
# storage is compiled only for tests or the explicit `test-support` feature.

[dependencies]
awaken-sync.workspace = true
awaken-sql-storage = { workspace = true, optional = true }
awaken-data-subject-application.workspace = true
async-trait.workspace = true
serde_json = { workspace = true }
thiserror = { workspace = true }
# SQLite adapter; feature `postgres` adds the network-DB Control DataSubjectRepo adapter.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
awaken-scoped-migration = { workspace = true, features = ["postgres", "sqlite"] }
awaken-sqlite-pool.workspace = true

[dev-dependencies]
awaken-reliability-testkit = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = "3"
# The live Postgres conformance test (feature `postgres`) isolates each suite in
# its own schema via `SET search_path`.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }

[features]
default = []
# Volatile consent/erasure authority used only by tests and scenario fixtures.
test-support = []
# Postgres-backed Control DataSubjectRepo (ADR-0050 D7, Org-partitioned).
postgres = ["sqlx/postgres", "sqlx/json", "dep:awaken-sql-storage", "awaken-sql-storage/postgres"]

[[test]]
name = "repo_conformance"
required-features = ["test-support"]

[lints]
workspace = true
