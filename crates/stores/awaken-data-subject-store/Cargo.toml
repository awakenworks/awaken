[package]
name = "awaken-data-subject-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
layer = "infrastructure"
authority = "data-subject-store"

# SQLite/PostgreSQL adapters for the Data Subject application ports. Volatile
# storage is compiled only for tests or the explicit `test-support` feature.

[dependencies]
awaken-data-subject-application.workspace = true
async-trait.workspace = true
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
# `spawn_blocking` for the sqlite adapter's off-thread connection work.
tokio = { workspace = true, features = ["rt"] }
# Feature `postgres`: network-DB Control DataSubjectRepo adapter.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"], optional = true }
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
awaken-scoped-migration-sqlite.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = "3"
awaken-runtime-contract.workspace = true
# The live Postgres conformance test (feature `postgres`) isolates each suite in
# its own schema via `SET search_path`.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }

[features]
default = []
# Volatile consent/erasure authority used only by tests and scenario fixtures.
test-support = []
# Postgres-backed Control DataSubjectRepo (ADR-0050 D7, Org-partitioned).
postgres = ["dep:sqlx"]

[[test]]
name = "repo_conformance"
required-features = ["test-support"]

[lints]
workspace = true
