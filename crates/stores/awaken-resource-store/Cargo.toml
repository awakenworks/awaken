[package]
name = "awaken-resource-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
awaken-resource-contract.workspace = true
async-trait.workspace = true
parking_lot = "0.12"
rusqlite = { workspace = true, optional = true }
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9", features = ["postgres"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }
proptest.workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]
postgres = ["dep:sqlx", "dep:awaken-scoped-migration"]

[lints]
workspace = true
