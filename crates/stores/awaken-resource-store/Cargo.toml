[package]
name = "awaken-resource-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "resources"
layer = "infrastructure"
authority = "resource"

[dependencies]
awaken-resource-contract.workspace = true
awaken-store-runtime = { workspace = true, optional = true }
awaken-sqlite-runtime = { workspace = true, optional = true }
async-trait.workspace = true
parking_lot = "0.12"
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }
awaken-scoped-migration = { workspace = true, features = ["postgres"], optional = true }
awaken-scoped-migration-sqlite = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }
proptest.workspace = true

[features]
default = ["sqlite"]
# Private in-memory SQLite authority used only by tests and scenario fixtures.
test-support = []
sqlite = ["dep:rusqlite", "dep:awaken-sqlite-runtime", "dep:awaken-scoped-migration", "dep:awaken-scoped-migration-sqlite"]
postgres = ["dep:sqlx", "dep:tokio", "dep:awaken-scoped-migration", "dep:awaken-store-runtime"]

[lints]
workspace = true
