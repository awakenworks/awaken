[package]
name = "awaken-resource-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
awaken-resource-contract.workspace = true
async-trait.workspace = true
parking_lot = "0.12"
rusqlite = { workspace = true, optional = true }
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "111aaf8a22e0ade4f02548732fd852057180a174", features = ["postgres"], optional = true }
awaken-scoped-migration-sqlite = { git = "https://github.com/awakenworks/awaken-foundation", rev = "111aaf8a22e0ade4f02548732fd852057180a174", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }
proptest.workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite", "dep:awaken-scoped-migration", "dep:awaken-scoped-migration-sqlite"]
postgres = ["dep:sqlx", "dep:awaken-scoped-migration"]

[lints]
workspace = true
