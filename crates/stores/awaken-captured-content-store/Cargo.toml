[package]
name = "awaken-captured-content-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
product = "platform"
bounded_context = "governance"
layer = "infrastructure"
authority = "captured-content"

[dependencies]
awaken-runtime-contract.workspace = true
# The one wall-clock port: capture and erasure-fence stamps.
awaken-time.workspace = true
awaken-scoped-migration = { workspace = true, features = ["postgres", "sqlite"] }
awaken-sqlite-pool.workspace = true
async-trait.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror.workspace = true

[dev-dependencies]
awaken-reliability-testkit.workspace = true
awaken-lease-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[features]
default = []
# Volatile privacy-state authority used only by tests and scenario fixtures.
test-support = []
postgres = ["sqlx/postgres"]

[[test]]
name = "repo_conformance"
required-features = ["test-support"]

[lints]
workspace = true
