[package]
name = "awaken-captured-content-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
layer = "infrastructure"
authority = "captured-content"

[dependencies]
awaken-runtime-contract.workspace = true
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
awaken-scoped-migration-sqlite.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile = "3"

[features]
default = []
# Volatile privacy-state authority used only by tests and scenario fixtures.
test-support = []
postgres = ["dep:sqlx"]

[[test]]
name = "repo_conformance"
required-features = ["test-support"]

[lints]
workspace = true
