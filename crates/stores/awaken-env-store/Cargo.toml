[package]
name = "awaken-env-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The EnvRegistry port + neutral EnvItem this crate implements a durable backend for
# (SQLite embedded / Postgres distributed, at parity).
awaken-session-contract = { workspace = true }
async-trait.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
# The portable scoped-migration bundle (one `env_registry` schema, both backends).
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
awaken-scoped-migration-sqlite.workspace = true

[dev-dependencies]
# Property-based verification of the archive-vs-delete + fail-closed semantics (ADR-0059).
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# The sqlite backend tests open a temp on-disk database.
tempfile = "3"

[lints]
workspace = true
