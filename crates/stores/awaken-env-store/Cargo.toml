[package]
name = "awaken-env-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
product = "platform"
bounded_context = "environment"
layer = "infrastructure"
authority = "env"
separation = "isolation"
isolates = ["sqlx"]

[dependencies]
awaken-sql-storage = { workspace = true, features = ["postgres"] }
# The Environment definition roles and neutral EnvItem implemented by this backend
# (SQLite embedded / Postgres distributed, at parity).
awaken-environment-contract.workspace = true
# The shared wall-clock port: every observation timestamp this store writes is a
# reading of an injected `Clock`, rendered by the port's own UTC codec.
async-trait.workspace = true
awaken-time.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite"] }
# The portable scoped-migration bundle (one `env_registry` schema, both backends).
awaken-scoped-migration = { workspace = true, features = ["postgres", "sqlite"] }
awaken-sqlite-pool.workspace = true

[dev-dependencies]
awaken-reliability-testkit.workspace = true
awaken-lease-testkit.workspace = true
awaken-store-conformance.workspace = true
# Property-based verification of the archive-vs-delete + fail-closed semantics (ADR-0059).
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# The sqlite backend tests open a temp on-disk database.
tempfile = "3"

[features]
# Process-local reference registry and private SQLite databases for fixtures.
test-support = []

[[test]]
name = "env_registry_conformance"
required-features = ["test-support"]

[[test]]
name = "env_registry_properties"
required-features = ["test-support"]

[[test]]
name = "env_registry_parity"
required-features = ["test-support"]

[lints]
workspace = true
