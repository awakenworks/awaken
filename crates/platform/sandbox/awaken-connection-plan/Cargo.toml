[package]
name = "awaken-connection-plan"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
# Transport plumbing (yamux multiplexing, dial policy) over the agent-channel
# contract. It holds no worker authority: the control plane dials the same
# channel, so it sits in the shared ring both planes may use. Its readers are
# the container sandboxes and the roots that compose them, so it belongs to
# sandbox.
context = "shared"
product = "platform"
bounded_context = "sandbox"
layer = "infrastructure"
authority = "connection-plan"
separation = "isolation"
isolates = ["yamux"]

[dependencies]
awaken-agent-channel.workspace = true
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
yamux.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
tokio = { workspace = true, features = ["io-util", "net", "time", "macros", "sync", "rt"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "net", "test-util"] }

[lints]
workspace = true
