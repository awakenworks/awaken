[package]
name = "awaken-sandbox-local"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
product = "platform"
bounded_context = "sandbox"
layer = "infrastructure"
authority = "sandbox-local"
separation = "isolation"
isolates = ["tar"]

[features]
default = []
# Allows deterministic local Git fixtures in downstream integration tests.
# Product builds never enable this transport exception.
test-support = []

[dependencies]
awaken-sync.workspace = true
awaken-agent-contract.workspace = true
awaken-tool-contract.workspace = true
# The auxiliary-run sandbox port this Workdir provider implements.
awaken-session-environment-contract.workspace = true
awaken-provisioning-contract.workspace = true
awaken-resource-contract.workspace = true
awaken-local-process.workspace = true
awaken-fs-durability = { workspace = true, features = ["native-fs"] }
awaken-agent-channel.workspace = true
awaken-sandbox-control.workspace = true
awaken-sandbox-control-transport.workspace = true
# BLAKE3 content id for the mount pin (was awaken_file_store::content_id) — kept a
# leaf dep so this worker-tier crate links no durable store (A-G17).
blake3 = "1"
getrandom = "0.2"
awaken-ext-builtin-tools = { workspace = true }
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "rt", "sync", "io-util", "net", "time"] }
tokio-util.workspace = true
tempfile = "3"
tar = "0.4"
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
command-fds = "0.3.3"

[dev-dependencies]
# Only the cfg(test) checkpoint fixture consumes these Session values.
awaken-session-contract.workspace = true
awaken-session-types.workspace = true
awaken-lease-contract.workspace = true
awaken-resource-application.workspace = true
awaken-time.workspace = true
awaken-provisioning-contract = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
# Tests wire a real content-addressed store behind the `BlobSource` port via a small
# adapter — the store stays a dev-only dependency (dev-deps are boundary-exempt).
awaken-file-store = { workspace = true, features = ["test-support"] }
# The memory-store realizer (FUSE / copy) is injected via the `MemoryMounter` port;
# tests wire the real worker-tier mounter over an in-memory store to prove item 1
# end-to-end. Dev-only.
awaken-sandbox-memoryd.workspace = true
awaken-memory-store = { workspace = true, features = ["test-support"] }
async-trait.workspace = true
# Syscall numbers for the differential seccomp probe (tests/syscall_boundary.rs).
libc = "0.2"

[lints]
workspace = true
