[package]
name = "awaken-credential-materializer"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "shared"
product = "platform"
bounded_context = "execution"
layer = "infrastructure"
authority = "credential-materializer"
separation = "isolation"
isolates = ["awaken-provider-genai"]

[dependencies]
awaken-sync.workspace = true
awaken-agent-contract.workspace = true
awaken-acp-contract.workspace = true
awaken-credential-contract.workspace = true
awaken-time.workspace = true
awaken-provisioning-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-provider-genai.workspace = true
# Provider executors for the endpoints this crate materializes, and the
# brokered grant port. Every consumer that links this crate already links the
# brokered transport's dependencies, so the port is not feature-selected.
awaken-inference-endpoint = { workspace = true, features = ["brokered"] }
awaken-worker-contract.workspace = true
async-trait.workspace = true
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
awaken-credential-envelope.workspace = true
tempfile = "3"
awaken-credential-vault = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
