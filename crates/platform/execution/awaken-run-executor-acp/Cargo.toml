[package]
name = "awaken-run-executor-acp"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
product = "platform"
bounded_context = "execution"
layer = "infrastructure"
authority = "run-executor-acp"
separation = "protocol"
protocol = "acp"

[dependencies]
awaken-sync.workspace = true
awaken-tool-contract = { workspace = true, optional = true }
awaken-data-governance-contract.workspace = true
awaken-acp-contract.workspace = true
awaken-session-environment-contract = { workspace = true, optional = true }
awaken-credential-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-time = { workspace = true, optional = true }
awaken-provisioning-contract.workspace = true
awaken-local-process = { workspace = true, optional = true }
awaken-agent-channel = { workspace = true, optional = true }
awaken-protocol-acp = { workspace = true, optional = true }
async-trait.workspace = true
# `McpServerConfig` rides the config plane into `plugin_config` (derive Serde).
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "macros", "time", "process", "io-util", "fs"], optional = true }
tracing = { version = "0.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[features]
loom = []
# Preserve the existing concrete adapter for ordinary package consumers. Product
# compositions select roles explicitly through the workspace dependency below.
default = ["execution", "host-preparation", "real-acp"]
# New compilation boundaries over existing code, not new runtime authorities.
# Coordinator/Control metadata and blob custody need neither role.
execution = [
    "dep:awaken-tool-contract",
    "dep:awaken-session-environment-contract",
    "dep:awaken-local-process",
    "dep:awaken-agent-channel",
    "dep:awaken-protocol-acp",
    "dep:awaken-time",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
    "dep:libc",
]
host-preparation = ["execution"]
# Off still selects the existing newline fixture wire; real production consumers
# retain the official protocol feature exactly as before.
real-acp = ["execution", "awaken-protocol-acp/real-acp"]

[dev-dependencies]
awaken-store-inmem.workspace = true
awaken-lease-testkit.workspace = true
awaken-session-configuration-contract.workspace = true
loom = "0.7"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "time", "sync"] }
serde_json.workspace = true
# dev-only: the session-home reference impl's recovery tests use temp dirs.
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
winsafe = { version = "=0.0.19", features = ["kernel"] }

[lints]
workspace = true
