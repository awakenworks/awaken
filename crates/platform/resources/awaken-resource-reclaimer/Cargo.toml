[package]
name = "awaken-resource-reclaimer"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "resources"
product = "platform"
bounded_context = "resources"
layer = "application"
authority = "resource-reclaimer"

[dependencies]
awaken-resource-contract.workspace = true

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
# T26-C02: the reclaimer driven over real SQL lifecycle stores, with a real
# child-process crash between claim/fence and the physical receipt.
awaken-resource-store = { workspace = true, features = ["sqlite", "postgres"] }
awaken-reliability-testkit = { workspace = true, features = ["postgres"] }

[lints]
workspace = true
