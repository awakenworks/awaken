[package]
name = "awaken-memory-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "resources"
product = "platform"
bounded_context = "resources"
layer = "infrastructure"
authority = "memory"
separation = "isolation"
isolates = ["sqlx"]

# Durable path-addressed memory persistence for the resources plane, with ephemeral,
# SQLite, and Postgres backends. The adapter receives only opaque store
# ids; ownership and authorization stay in their respective outer planes.

[dependencies]
awaken-sync.workspace = true
# Port-only contract: MemoryRepository + Memory/MemoryEntry/MemErr live here; this crate
# implements them and re-exports the contract types.
awaken-resource-contract.workspace = true
awaken-time.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "fs"] }
# ADR-0053 path-addressed MemoryRepository: content-sha256 (Anthropic wire uses sha256) +
# a durable JSON record per memory.
serde_json = { workspace = true }
# Feature `sqlite`: embedded durable MemoryRepository over the crate's migration scope.
# Feature `postgres`: network-DB MemoryRepository over the same scope (multi-node).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite"], optional = true }
awaken-scoped-migration = { workspace = true, features = ["postgres", "sqlite"], optional = true }
awaken-sqlite-pool = { workspace = true, optional = true }
awaken-sql-storage.workspace = true

[dev-dependencies]
awaken-reliability-testkit = { workspace = true, features = ["postgres"] }
proptest.workspace = true
awaken-lease-testkit.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync"] }
tempfile = "3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite"] }

[features]
default = []
# Process-local Memory authority and private SQLite databases for tests/scenarios.
test-support = []
sqlite = ["dep:sqlx", "dep:awaken-scoped-migration", "dep:awaken-sqlite-pool"]
postgres = ["dep:sqlx", "dep:awaken-scoped-migration", "awaken-sql-storage/postgres"]

[lints]
workspace = true
