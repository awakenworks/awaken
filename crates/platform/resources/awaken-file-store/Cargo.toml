[package]
name = "awaken-file-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[package.metadata.awaken]
context = "resources"
product = "platform"
bounded_context = "resources"
layer = "infrastructure"
authority = "file"
separation = "isolation"
isolates = ["object_store", "sqlx"]

[dependencies]
# Port-only contract: the FileStore trait + FileStoreError live here; this crate
# implements them and re-exports for backward-compatible paths.
awaken-resource-contract.workspace = true
awaken-fs-durability.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }

# Network / durable relational backends over the same trait. Optional: the
# default product build retains only the durable filesystem backend.
# Feature `sqlite` uses the same driver for the embedded BLOB backend over the
# same `file_store` migration scope.
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio", "postgres", "sqlite"], optional = true }
# Versioned schema via the foundation's scoped migration (never a raw CREATE TABLE):
# the `file_store_blob` table is migration 1 of the `awaken.file_store` bundle. The
# core migrator (schema) is shared; each backend pulls its own runner.
awaken-scoped-migration = { workspace = true, features = ["postgres", "sqlite"], optional = true }
awaken-sqlite-pool = { workspace = true, optional = true }
awaken-sql-storage.workspace = true
object_store = { version = "0.14", features = ["aws", "gcp"], optional = true }
futures = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[features]
# Process-local File authority used only by unit/integration/scenario fixtures.
test-support = []
# Postgres bytea backend (idempotent INSERT ... ON CONFLICT). Compile-verified;
# running needs a database.
postgres = ["dep:sqlx", "dep:awaken-scoped-migration", "awaken-sql-storage/postgres"]
# SQLite BLOB backend (`sqlite::SqliteFileStore`) over the same `file_store` scope.
sqlite = ["dep:sqlx", "dep:awaken-scoped-migration", "dep:awaken-sqlite-pool"]
# Object-store backend (S3-compatible/GCS via `object_store`; key = content id).
object-store = ["dep:object_store", "dep:futures", "dep:uuid"]

[dev-dependencies]
proptest.workspace = true
awaken-reliability-testkit = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "fs"] }
tempfile = "3"
