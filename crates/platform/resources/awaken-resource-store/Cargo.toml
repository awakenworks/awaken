[package]
name = "awaken-resource-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "resources"
product = "platform"
bounded_context = "resources"
layer = "infrastructure"
authority = "resource"
separation = "isolation"
isolates = ["sqlx"]

[dependencies]
awaken-sql-storage = { workspace = true, optional = true }
awaken-resource-contract.workspace = true
awaken-sqlite-pool = { workspace = true, optional = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite"], optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }
awaken-scoped-migration = { workspace = true, features = ["postgres", "sqlite"], optional = true }

[dev-dependencies]
awaken-reliability-testkit = { workspace = true, features = ["postgres"] }
awaken-store-conformance.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
proptest.workspace = true

[features]
default = ["sqlite"]
# Private in-memory SQLite authority used only by tests and scenario fixtures.
test-support = []
sqlite = ["dep:sqlx", "dep:awaken-sqlite-pool", "dep:awaken-scoped-migration"]
postgres = ["dep:sqlx", "dep:tokio", "dep:awaken-scoped-migration", "dep:awaken-sql-storage", "awaken-sql-storage/postgres"]

[lints]
workspace = true
