[package]
name = "awaken-credential-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
product = "platform"
bounded_context = "credentials"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types", "spi"]
authority = "credential"
separation = "contract"

[dependencies]
awaken-lease-contract.workspace = true
awaken-agent-contract = { workspace = true, features = ["schema"] }
awaken-runtime-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
schemars = "1"
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
