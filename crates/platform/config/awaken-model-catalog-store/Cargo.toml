[package]
name = "awaken-model-catalog-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
product = "platform"
bounded_context = "config"
layer = "infrastructure"
authority = "model-catalog"
separation = "isolation"
isolates = ["sqlx"]

[dependencies]
awaken-sql-storage = { workspace = true, optional = true }
awaken-model-catalog.workspace = true
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio"], optional = true }
awaken-scoped-migration = { workspace = true, features = ["postgres", "sqlite"] }
awaken-sqlite-pool = { workspace = true, optional = true }

[dev-dependencies]
awaken-reliability-testkit = { workspace = true, features = ["postgres"] }
tokio.workspace = true
tempfile = "3"
serde_json.workspace = true
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio", "postgres"] }

[features]
default = []
test-support = ["awaken-model-catalog/test-support"]
sqlite = ["dep:sqlx", "sqlx/sqlite", "dep:awaken-sqlite-pool"]
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/json", "dep:awaken-sql-storage", "awaken-sql-storage/postgres"]

[[test]]
name = "repo_conformance"
required-features = ["test-support"]

[lints]
workspace = true
