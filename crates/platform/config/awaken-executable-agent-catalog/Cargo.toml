[package]
name = "awaken-executable-agent-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
product = "platform"
bounded_context = "config"
layer = "infrastructure"
authority = "executable-agent-catalog"
separation = "isolation"
isolates = ["axum", "sqlx"]

[dependencies]
awaken-sync.workspace = true
awaken-sql-storage = { workspace = true, features = ["postgres"] }
awaken-executable-agent-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-durable-projection.workspace = true
awaken-runtime-contract.workspace = true
awaken-resource-contract.workspace = true
awaken-service-auth-contract.workspace = true
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
async-trait.workspace = true
axum.workspace = true
awaken-outbound-http = { workspace = true }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
awaken-reliability-testkit = { workspace = true, features = ["postgres"] }
awaken-resource-store = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros", "net", "time"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
