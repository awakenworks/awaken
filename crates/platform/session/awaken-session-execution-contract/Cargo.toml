[package]
name = "awaken-session-execution-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
product = "platform"
bounded_context = "session"
layer = "contract"
kinds = ["types", "spi", "api", "remote"]
authority = "session-execution"
separation = "contract"

[dependencies]
# Shared continuation dispatch enforces the frozen duration; no executor is selected here.
tokio = { version = "1", default-features = false, features = ["time"] }
awaken-provisioning-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-resource-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-lease-contract.workspace = true
awaken-session-contract.workspace = true
awaken-session-application-contract.workspace = true
awaken-session-configuration-contract.workspace = true
awaken-session-types.workspace = true
awaken-time.workspace = true
awaken-worker-contract.workspace = true
async-trait.workspace = true
# The digest that binds a Worker-reported retention fact to its exact subject.
blake3 = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
test-support = []

[dev-dependencies]
awaken-provisioning-contract = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros"] }
proptest.workspace = true
awaken-credential-contract.workspace = true
awaken-environment-contract.workspace = true

[lints]
workspace = true
