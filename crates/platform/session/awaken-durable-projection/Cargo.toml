[package]
name = "awaken-durable-projection"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
product = "platform"
# Agent/Environment-neutral high-water mechanics for durable projections: the
# shared storage kernel the config and environment catalogs both build on.
bounded_context = "storage"
layer = "application"
authority = "coordinator-projection"

[dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
