[package]
name = "awaken-session-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
product = "platform"
bounded_context = "session"
layer = "infrastructure"
authority = "session"
separation = "isolation"
isolates = ["sqlx"]

[dependencies]
awaken-session-configuration-contract.workspace = true
# The repository port and persisted state implemented by both SQL backends.
awaken-session-contract.workspace = true
awaken-session-dream-contract.workspace = true
awaken-session-types.workspace = true
awaken-sql-storage = { workspace = true, features = ["postgres"] }
awaken-sqlite-pool.workspace = true
awaken-deployment-contract = { workspace = true }
awaken-credential-contract = { workspace = true }
awaken-ext-memory = { workspace = true }
# The opaque tenancy `ScopeId` the in-memory scoped-session store keys its isolation
# fence by (the durable backends bind it as an opaque column).
async-trait.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite"] }
tokio.workspace = true
tempfile = "3"
# The portable scoped-migration bundle (one `managed_session` schema, both backends).
awaken-scoped-migration = { workspace = true, features = ["postgres", "sqlite"] }

[dev-dependencies]
awaken-session-application.workspace = true
awaken-environment-contract.workspace = true
awaken-session-application-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
uuid = { version = "1", features = ["v4"] }
awaken-store-conformance.workspace = true
awaken-provisioning-contract.workspace = true
awaken-reliability-testkit = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
# Property-based verification of the tenant-isolation fence (ADR-0059).
proptest = { workspace = true }
awaken-resource-contract.workspace = true

[features]
# Private SQLite Session authority for unit/integration/scenario fixtures.
test-support = []

[[test]]
name = "session_repo_conformance"
required-features = ["test-support"]

[[test]]
name = "independent_clients"
required-features = ["test-support"]

[[test]]
name = "session_store_parity"
required-features = ["test-support"]

[lints]
workspace = true
