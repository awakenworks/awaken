[package]
name = "awaken-worker-registry"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
product = "platform"
bounded_context = "dispatch"
layer = "infrastructure"
authority = "worker-registry"
separation = "isolation"
isolates = ["sqlx"]

[features]
loom = []
# Private SQLite Worker directory for unit/integration fixtures.
test-support = []

[dependencies]
awaken-sqlite-pool.workspace = true
awaken-worker-contract.workspace = true
awaken-sql-storage = { workspace = true, features = ["postgres"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite"] }
awaken-scoped-migration = { workspace = true, features = ["postgres", "sqlite"] }

[dev-dependencies]
awaken-reliability-testkit = { workspace = true, features = ["postgres"] }
awaken-store-conformance.workspace = true
awaken-agent-contract.workspace = true
awaken-credential-contract.workspace = true
loom = "0.7"
proptest.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
