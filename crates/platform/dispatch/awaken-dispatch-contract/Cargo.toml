[package]
name = "awaken-dispatch-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
product = "platform"
bounded_context = "dispatch"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types", "spi", "remote"]
authority = "durable-dispatch"
separation = "contract"

[dependencies]
awaken-session-application-contract.workspace = true
awaken-credential-contract.workspace = true
awaken-time.workspace = true
awaken-lease-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-provisioning-contract.workspace = true
awaken-runtime-contract.workspace = true
# Legacy-only: claim admission decodes the Session runtime projection of rows
# written before the Session published `PlacementRequirements::
# session_mcp_credentials`, failing closed. Remove this dependency (and that
# fallback in dispatch/credential_admission.rs) once those rows have drained.
awaken-session-configuration-contract.workspace = true
awaken-session-types.workspace = true
awaken-worker-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Drive the async port default methods (enqueue → enqueue_with, bind_sandbox) in unit tests.
tokio = { workspace = true, features = ["rt", "macros"] }
awaken-environment-contract.workspace = true
awaken-session-execution-contract.workspace = true
awaken-session-contract.workspace = true
awaken-tenancy.workspace = true

[lints]
workspace = true
