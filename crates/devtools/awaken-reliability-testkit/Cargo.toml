[package]
name = "awaken-reliability-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.awaken]
context = "devtools"
product = "devtools"
layer = "tooling"
authority = "reliability-test-evidence"
description = "Test-only fixture admission and shared process-crash evidence primitives"
separation = "test-support"

[features]
tracing = ["dep:tracing"]
postgres = ["dep:sqlx", "dep:awaken-sql-storage", "dep:tokio"]

[dependencies]
awaken-sync.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true, features = ["time"] }
tracing = { version = "0.1", optional = true }
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio", "postgres"], optional = true }
awaken-sql-storage = { workspace = true, features = ["postgres"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
