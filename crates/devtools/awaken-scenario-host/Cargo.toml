[package]
name = "awaken-scenario-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "devtools"
layer = "tooling"
authority = "scenario-host"

[[bin]]
name = "awaken-scenario-host"
path = "src/main.rs"

[dependencies]
# The extracted service layer: SharedHost / ManagedHost / RunApplicationHost and all
# host modules live here; this binary only selects and serves scenario modes.
awaken-runtime-host = { workspace = true, features = ["test-support"] }
awaken-run-ingress-http.workspace = true
awaken-config-service.workspace = true
awaken-ext-permission.workspace = true
awaken-ext-builtin-tools.workspace = true
awaken-ext-memory.workspace = true
awaken-ext-skills.workspace = true
awaken-run-ingress = { workspace = true, features = ["durable"] }
awaken-sandbox-local.workspace = true
awaken-worker-transport-security.workspace = true
awaken-admin-assistant = { workspace = true }
awaken-tenancy = { workspace = true }
# Cross-cutting telemetry: the tracing subscriber + OTLP/AWAKEN_TRACE_FILE span
# export + W3C traceparent propagator + ingress span middleware (not an ext).
awaken-observability = { workspace = true }
# Open enforcement (S1): the session-axis guard + RequestTenancy the project
# ingress stamps. The standalone wraps the session router with it.
awaken-authz-enforce = { workspace = true }
awaken-protocol-managed = { workspace = true, features = ["test-support"] }
awaken-protocol-awaken = { workspace = true }
awaken-protocol-ai-sdk = { workspace = true }
awaken-protocol-ag-ui = { workspace = true }
awaken-protocol-a2a = { workspace = true }
# The ordinary A2A Run-attempt adapter used by the remote delegation scenario.
awaken-run-executor-a2a = { workspace = true }
awaken-agent-config.workspace = true
awaken-config-store = { workspace = true, features = ["test-support"] }
# Canonical Memory data plane used by API, mount, recall, extraction, history, and
# redaction. Scenario startup selects its durable or ephemeral adapter once.
awaken-memory-store = { workspace = true }
# Scenario resource modes also install the canonical
# in-memory lifecycle adapter explicitly instead of relying on Host-local truth.
awaken-resource-store = { workspace = true, features = ["test-support"] }
# ACP runtime (R3/R4): drive an external ACP CLI as a peer RunExecutor when a
# session selects `runtime: "acp:*"`.
awaken-run-executor-acp = { workspace = true }
awaken-acp-application.workspace = true
# Management plane (ADR-0043): process startup resolves a run's inference
# (adapter_kind + base_url + already-resolved credential) and builds the host's
# model executor from it — the runtime never sees the credential binding (D6/D9).
awaken-config-resolver = { workspace = true, features = ["test-support"] }
awaken-provider-genai = { workspace = true }
# The management-plane HTTP surfaces this binary mounts: admin config CRUD and the
# Managed vault/credential front door, over shared stores — in-memory by default,
# SQLite-backed when typed data_dir selects durable persistence (`sqlite` features).
awaken-admin-config-api = { workspace = true, features = ["sqlite", "postgres", "test-support"] }
awaken-model-catalog = { workspace = true, features = ["test-support"] }
awaken-model-catalog-store = { workspace = true, features = ["sqlite", "postgres", "test-support"] }
# `oauth-command`: refresh a Google OAuth2 token (gcloud) for the `real-gemini` mode.
# `sqlite` + `sealed-aead`: the durable management plane persists secret-free rows in
# SQLite and secrets only as AEAD-sealed blobs under typed control_seal_key.
awaken-credential-vault = { workspace = true, features = ["oauth-command", "test-support"] }
awaken-credential-store = { workspace = true, features = ["sqlite", "sealed-aead", "postgres", "test-support"] }
awaken-credential-contract.workspace = true
awaken-credential-materializer = { workspace = true, features = ["authority"] }
# Embedded IAM (ADR-0042/0043 P1): typed self-managed identity gates management
# plane behind bearer ApiTokens. contract = ids/scopes/requests, core = token
# directory + minter + the default-deny PolicySet evaluator, preset = the seeded
# Anthropic role catalog + the iam-server store (rusqlite range is links-safe
# since iam adopted foundation ADR-0005).
awaken-iam-contract = { workspace = true }
awaken-iam-server = { workspace = true }
awaken-iam-core = { workspace = true }
awaken-iam-preset = { workspace = true }
# The IAM assembly layer (ADR-0048): IamGate (single authn/authz PDP) built over
# our own LocalIamState, driving the management guard.
awaken-iam-host = { workspace = true }
# The embedded IAM token/binding rows persist under typed data_dir/iam.sqlite;
# same rusqlite generation as every other sqlite store in the workspace.
rusqlite = { version = "0.32", features = ["bundled"] }
awaken-agent-contract.workspace = true
awaken-executable-agent-contract.workspace = true
awaken-resource-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-executable-agent-catalog.workspace = true
awaken-runtime = { workspace = true }
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "io-std", "io-util"] }
axum = { version = "0.8", features = ["multipart"] }
# oneshot-forwarding for the /projects/{id} prefix-stripping ingress proxy
# (also used by the integration tests).
tower = { version = "0.5", features = ["util"] }

awaken-resource-persistence = { workspace = true, features = ["test-support"] }
awaken-resource-application.workspace = true
awaken-session-contract.workspace = true
awaken-dream-application.workspace = true
awaken-coordinator = { workspace = true, features = ["test-support"] }
# Reuse the production worker lifecycle/registration/heartbeat/dispatch wiring in
# the worker-failover scenario; only its deterministic executor provider differs.
awaken-worker = { workspace = true }
# The `management` scenario mode + the brain-admin surface moved
# to awaken-cli's library (Stage B2). Dev-dep cycle-free: awaken-cli dev-depends back
# on this crate for the mock models its moved integration tests drive.
awaken-cli = { workspace = true, features = ["test-support"] }
# The authoring plane (Stage B2): the config-router scenario mode seeds the admin
# assistant + builds its tool executables through awaken-control's ports.
awaken-control = { workspace = true }

[features]
# Cross-node dispatch wake over NATS (AWAKEN_DISPATCH_WAKE=nats), passed through to
# the served binary via awaken-coordinator → awaken-runtime-host. Used by the k3d
# nats_wake e2e, which builds the scenario-host bin with `--features nats`.
nats = ["awaken-coordinator/nats"]
# Container sandbox tiers, passed through to the served binary via awaken-coordinator →
# awaken-runtime-host → awaken-sandbox-container. The k3d managed-protocol e2e builds
# the scenario-host bin with `--features container-k8s` to realize ACP sessions in Pods.
container-docker = ["awaken-coordinator/container-docker"]
container-podman = ["awaken-coordinator/container-podman"]
container-k8s = ["awaken-coordinator/container-k8s"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
