[package]
name = "awaken-eval"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "devtools"
layer = "tooling"
authority = "eval"

# Fixture-driven evaluation harness (#4): replays recorded cases through the REAL
# runtime (a scripted `LlmExecutor` feeds the recorded model responses back into
# the engine via the `RunExecutor` port) and scores the committed output against a
# small typed set of expectations. The harness owns no execution logic — replay is
# the runtime itself, so a scored case exercises the true engine path.

[[bin]]
name = "awaken-eval"
path = "src/main.rs"

[dependencies]
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-runtime = { workspace = true }
awaken-store-inmem.workspace = true
awaken-ext-goal = { workspace = true }
awaken-ext-compact = { workspace = true }
awaken-ext-memory = { workspace = true }
awaken-run-executor-acp = { workspace = true }
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
thiserror.workspace = true
rusqlite.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
