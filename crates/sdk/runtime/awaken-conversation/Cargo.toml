[package]
name = "awaken-conversation"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
api_snapshot = true
context = "runtime"
product = "sdk"
bounded_context = "agent-runtime"
layer = "application"
authority = "conversation-runs"
separation = "publish"

[dependencies]
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-runtime.workspace = true
awaken-time.workspace = true
awaken-tool-contract.workspace = true
awaken-sync.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
awaken-store-inmem.workspace = true
awaken-protocol-ag-ui.workspace = true
awaken-protocol-ai-sdk.workspace = true
awaken-protocol-a2a.workspace = true
awaken-protocol-mcp.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
axum = "0.8"

[lints]
workspace = true
