[package]
name = "awaken-tool-contract"
version = "2.0.0"
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
# Reviewed public API snapshot (public-api/awaken-tool-contract.txt): the extension tool SPI implemented by plugins.
api_snapshot = true
context = "runtime"
product = "sdk"
bounded_context = "agent-runtime"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types", "spi", "ext"]
authority = "runtime"
separation = "publish"

[dependencies]
awaken-lease-contract.workspace = true
awaken-agent-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
schemars = "1"

[lints]
workspace = true
