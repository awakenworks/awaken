[package]
name = "awaken-agent-contract"
version = "2.0.0"
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
# Reviewed public API snapshot (public-api/awaken-agent-contract.txt): INVARIANTS G31 run module; the fuzz workspace links it.
api_snapshot = true
context = "runtime"
product = "sdk"
bounded_context = "agent-runtime"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types", "spi"]
authority = "agent"
separation = "publish"

[dependencies]
async-trait.workspace = true
blake3 = "1"
hex = "0.4.3"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
zeroize = "1"
http = "1"
uuid = { version = "1", features = ["v4"] }
schemars = { version = "1", optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
default = []
schema = ["dep:schemars"]

[lints]
workspace = true
