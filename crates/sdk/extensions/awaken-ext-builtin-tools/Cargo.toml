[package]
name = "awaken-ext-builtin-tools"
version = "2.0.0"
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
# SDK publishing preparation: builtin tool definitions and construction are public API.
api_snapshot = true
context = "runtime"
product = "sdk"
bounded_context = "agent-runtime"
layer = "infrastructure"
authority = "ext-builtin-tools"
separation = "publish"

[dependencies]
awaken-web-policy-contract.workspace = true
awaken-tool-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
async-trait.workspace = true
base64 = "0.22"
cap-std = "4"
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ignore = "0.4"
regex = "1"
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
awaken-sync.workspace = true
awaken-process-win32.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["net", "io-util"] }

[target.'cfg(windows)'.dev-dependencies]
winsafe = { version = "=0.0.19", features = ["kernel"] }

[lints]
workspace = true
