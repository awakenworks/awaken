[package]
name = "awaken-time"
description = "The one wall-clock port, the persisted-expiry law and the monotonic read point"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
# SDK publishing preparation: clock ports, time values and expiry laws are public API.
api_snapshot = true
context = "runtime"
product = "sdk"
bounded_context = "agent-runtime"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types", "spi"]
authority = "wall-clock"
separation = "publish"

# A depth-0 contract leaf: no awaken dependency may be added here. Every
# contract that stamps or judges time depends on it directly.
[dependencies]
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[lints]
workspace = true
