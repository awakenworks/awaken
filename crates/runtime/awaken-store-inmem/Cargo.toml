context = "runtime"
product = "sdk"
bounded_context = "agent-runtime"
layer = "infrastructure"
authority = "store-inmem"
separation = "publish"

[dependencies]
awaken-sync.workspace = true
awaken-agent-contract.workspace = true
async-trait.workspace = true
awaken-time.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json.workspace = true
awaken-store-conformance.workspace = true

[lints]
workspace = true
