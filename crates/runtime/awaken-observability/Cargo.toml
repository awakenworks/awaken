[package]
name = "awaken-observability"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cross-cutting telemetry infrastructure (NOT a runtime `ext-*`): the process-global
# `tracing` subscriber, optional OTLP / `AWAKEN_TRACE_FILE` span export, the W3C
# `traceparent` propagator, and the axum ingress middleware that roots each request
# span. Service binaries call `init()` / `shutdown()`; the spans themselves are emitted
# by `#[instrument]` woven into the real call path, so this crate owns the exporter
# wiring and nothing about any domain capability.

[dependencies]
serde_json = { workspace = true }
axum = { workspace = true }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "metrics", "experimental_trace_batch_span_processor_with_async_runtime", "experimental_metrics_periodicreader_with_async_runtime"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-client", "metrics"] }
# The OSS OpenTelemetry→Prometheus bridge, so a role's admin `/metrics` scrape
# surface exposes OTel instruments (not hand-formatted text). `prometheus` is the
# registry + text encoder opentelemetry-prometheus writes through.
opentelemetry-prometheus = "0.32"
prometheus = { version = "0.14", default-features = false }
awaken-runtime-contract = { workspace = true }

[dev-dependencies]
# Repo-standard helpers for driving an assembled axum `Router` through its
# `tower::Service` impl (`ServiceExt::oneshot`) so the real `trace_http` ingress
# middleware can be exercised end-to-end in-process. A current-thread `tokio`
# runtime drives the request (the SDK's simple span exporter flushes via its own
# `futures` executor, which would panic if nested inside `futures::block_on`).
# Both are already in the workspace lock.
tokio = { workspace = true, features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
