[package]
name = "awaken-ext-state-machine"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Stateful tool-call ordering constraints (loadable FSM DSL) for Awaken"

[dependencies]
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-tool-pattern.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
async-trait.workspace = true
thiserror.workspace = true
url = "2.5"
schemars = { version = "1", optional = true }

[features]
# Derive a JSON Schema for the config (for a config frontend). Off by the runtime
# hot path; the composition/admin side turns it on to advertise the schema.
schema = ["dep:schemars"]

[dev-dependencies]
awaken-runtime = { workspace = true }
tokio.workspace = true

[lints]
workspace = true
