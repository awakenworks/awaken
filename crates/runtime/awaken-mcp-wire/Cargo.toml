[package]
name = "awaken-mcp-wire"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared MCP wire layer (JSON-RPC peer, SSE, progress) for the MCP client and server crates"

[dependencies]
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "rt", "macros", "time"] }
tokio-util.workspace = true
# `client` matches awaken-ext-mcp: the SDK does not build feature-less (its
# transport_factory names the gated client module unconditionally).
mcp = { package = "model-context-protocol", version = "0.2", default-features = false, features = ["client"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }

[lints]
workspace = true
