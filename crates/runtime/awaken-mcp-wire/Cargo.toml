[package]
name = "awaken-mcp-wire"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared MCP wire layer (JSON-RPC peer, SSE, progress) for the MCP client and server crates"

[dependencies]
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "rt", "macros", "time"] }
tokio-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }

[lints]
workspace = true
