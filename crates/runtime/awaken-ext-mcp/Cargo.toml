[package]
name = "awaken-ext-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Model Context Protocol (MCP) client extension for Awaken"

[dependencies]
awaken-credential.workspace = true
awaken-mcp-wire.workspace = true
awaken-runtime-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "rt", "macros", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }

[lints]
workspace = true
