[package]
name = "awaken-outbound-http"
version = "1.1.0"
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
# SDK publishing preparation: outbound transport construction and policy are public API.
api_snapshot = true
context = "shared"
product = "sdk"
bounded_context = "agent-runtime"
layer = "infrastructure"
authority = "outbound-http"
separation = "publish"

[dependencies]
async-trait.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
kube = { workspace = true, features = ["client", "rustls-tls", "http-proxy"], optional = true }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
serde_json = { workspace = true, optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
axum.workspace = true
k8s-openapi.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time"] }

[features]
default = []
blocking = ["reqwest/blocking"]
kubernetes = ["dep:kube", "dep:http", "dep:http-body-util", "dep:serde_json", "dep:tower"]
# A bounded permissive sender exists only for loopback integration tests.
test-support = []

# The workspace lints, except that unsafe code is denied rather than forbidden:
# one single-threaded integration test sets the proxy environment variables,
# which is `unsafe` since edition 2024, and allows it in its own file.
[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unreachable_pub = "warn"

[lints.clippy]
wildcard_imports = "warn"
disallowed_methods = "warn"
disallowed_types = "warn"
