[package]
name = "awaken-provider-genai"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "runtime"
product = "sdk"
bounded_context = "agent-runtime"
layer = "infrastructure"
authority = "provider-genai"

[dependencies]
awaken-lease-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
async-trait.workspace = true
base64 = "0.22"
futures = "0.3"
genai.workspace = true
# Parses the RFC 9110 HTTP-date form of a provider's Retry-After.
httpdate = "1"
# Match the pinned genai transport so both dialects use one explicit retry policy.
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
awaken-ext-builtin-tools.workspace = true
schemars = "1"
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "net",
    "io-util",
    "test-util",
] }

[lints]
workspace = true
