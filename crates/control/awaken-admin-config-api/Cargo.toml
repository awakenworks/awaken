[package]
name = "awaken-admin-config-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
product = "platform"
bounded_context = "config"
layer = "interface"
authority = "admin-config"
separation = "isolation"
isolates = ["axum", "sqlx"]

[dependencies]
awaken-sql-storage = { workspace = true, optional = true }
awaken-model-catalog.workspace = true
awaken-credential-vault.workspace = true
awaken-credential-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-api-contract.workspace = true
# The read/resolution face: the admin `inference/resolve` route dry-runs a binding
# against the authored catalog through the resolver (secret-free result).
awaken-config-resolver.workspace = true
# Shared provider-neutral Repository mount-path admission.
awaken-provisioning-contract.workspace = true
awaken-agent-config.workspace = true
awaken-tenancy.workspace = true
# The one wall-clock port: availability, manual attribute and discovery stamps.
awaken-time.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
axum.workspace = true
async-trait.workspace = true
schemars = { version = "1", optional = true }
# Feature `sqlite`: embedded durable admin aggregate backend over sqlx
# (ADR-0087) and the crate's own `admin` migration scope (ADR-0043 sqlite-repos).
awaken-sqlite-pool = { workspace = true, optional = true }
# Features `sqlite` and `postgres`: the async admin stores over the same `admin`
# migration scope (ADR-0043).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "json"], optional = true }
awaken-scoped-migration = { workspace = true, features = ["postgres", "sqlite"] }

[dev-dependencies]
# The telemetry storage fixtures use the SDK's ContentCapture value.
awaken-runtime-contract.workspace = true
awaken-reliability-testkit = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
# The live Postgres store test (feature `postgres`) isolates itself in its own
# schema via `SET search_path`; the SQLite admission test drives a second control
# pool on the same database file.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite"] }

[features]
default = []
test-support = [
    "awaken-config-resolver/test-support",
    "awaken-credential-vault/test-support",
    "awaken-model-catalog/test-support",
]
# SQLite-backed admin stores (`sqlite::SqliteAdminStore`), ADR-0043 sqlite-repos.
sqlite = ["dep:awaken-sqlite-pool", "dep:sqlx"]
# Postgres-backed admin store (`postgres::PostgresAdminStore`), ADR-0043.
postgres = ["dep:sqlx", "dep:awaken-sql-storage", "awaken-sql-storage/postgres"]
# Emit JSON Schema for the admin config DTOs (drives TS-contract generation,
# ADR-0043). Enables the domains' own `schema` features.
schema = [
    "dep:schemars",
    "awaken-model-catalog/schema",
    "awaken-credential-vault/schema",
    "awaken-config-resolver/schema",
    "awaken-agent-config/schema",
]

[[example]]
name = "export_admin_schemas"
path = "examples/export_schemas.rs"
required-features = ["schema"]

[[example]]
name = "export_openapi"
required-features = ["schema"]

[[test]]
name = "openapi_contract"
required-features = ["schema", "test-support"]

[[test]]
name = "crud_to_resolve"
required-features = ["test-support"]

[[test]]
name = "model_discovery"
required-features = ["test-support"]

[[test]]
name = "resolve_handler_routes"
required-features = ["test-support"]

[[test]]
name = "router_cases"
required-features = ["test-support"]

[[test]]
name = "router_depth"
required-features = ["test-support"]

[lints]
workspace = true
