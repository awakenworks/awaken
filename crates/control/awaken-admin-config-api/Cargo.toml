[package]
name = "awaken-admin-config-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
layer = "interface"
authority = "admin-config"

[dependencies]
awaken-model-catalog.workspace = true
awaken-credential-vault.workspace = true
awaken-credential-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-api-contract.workspace = true
# The read/resolution face: the admin `inference/resolve` route dry-runs a binding
# against the authored catalog through the resolver (secret-free result).
awaken-config-resolver.workspace = true
# Shared provider-neutral Repository mount-path admission.
awaken-provisioning-contract.workspace = true
awaken-agent-config = { workspace = true, optional = true }
# Failure disposition (Disposition) for the credential-cooldown ops route.
awaken-runtime-contract.workspace = true
awaken-store-runtime.workspace = true
awaken-tenancy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
axum.workspace = true
async-trait.workspace = true
schemars = { version = "1", optional = true }
# Feature `sqlite`: embedded durable admin aggregate backend
# over the crate's own `admin` migration scope (ADR-0043 sqlite-repos).
rusqlite = { workspace = true, optional = true }
awaken-sqlite-runtime = { workspace = true, optional = true }
# Feature `postgres`: network-DB admin store over the same `admin` migration
# scope (ADR-0043). The sync store ports are bridged onto a dedicated runtime the
# store owns, so `tokio` (multi-thread) is a hard dep of this feature.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"], optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "rt-multi-thread"] }
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
awaken-scoped-migration-sqlite.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
# The live Postgres store test (feature `postgres`) isolates itself in its own
# schema via `SET search_path`.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }

[features]
default = []
test-support = [
    "awaken-config-resolver/test-support",
    "awaken-credential-vault/test-support",
    "awaken-model-catalog/test-support",
]
# SQLite-backed admin stores (`sqlite::SqliteAdminStore`), ADR-0043 sqlite-repos.
sqlite = ["dep:rusqlite", "dep:awaken-sqlite-runtime"]
# Postgres-backed admin store (`postgres::PostgresAdminStore`), ADR-0043.
postgres = ["dep:sqlx", "dep:tokio"]
# Emit JSON Schema for the admin config DTOs (drives TS-contract generation,
# ADR-0043). Enables the domains' own `schema` features.
schema = [
    "dep:schemars",
    "awaken-model-catalog/schema",
    "awaken-credential-vault/schema",
    "awaken-config-resolver/schema",
    "dep:awaken-agent-config",
    "awaken-agent-config/schema",
]

[[example]]
name = "export_schemas"
required-features = ["schema"]

[[example]]
name = "export_openapi"
required-features = ["schema"]

[[test]]
name = "openapi_contract"
required-features = ["schema", "test-support"]

[[test]]
name = "crud_to_resolve"
required-features = ["test-support"]

[[test]]
name = "model_discovery"
required-features = ["test-support"]

[[test]]
name = "resolve_handler_routes"
required-features = ["test-support"]

[[test]]
name = "router_cases"
required-features = ["test-support"]

[[test]]
name = "router_depth"
required-features = ["test-support"]

[lints]
workspace = true
