[package]
name = "awaken-admin-config-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
awaken-model-catalog.workspace = true
awaken-credential-vault.workspace = true
awaken-agent-contract.workspace = true
awaken-api-contract.workspace = true
# The read/resolution face: the admin `inference/resolve` route dry-runs a binding
# against the authored catalog through the resolver (secret-free result).
awaken-config-resolver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
axum.workspace = true
async-trait.workspace = true
schemars = { version = "1", optional = true }
# Feature `sqlite`: embedded durable InferenceProfileStore + McpStore backend
# over the crate's own `admin` migration scope (ADR-0043 sqlite-repos).
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9", features = ["postgres"] }
awaken-scoped-migration-sqlite = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[features]
default = []
# SQLite-backed admin stores (`sqlite::SqliteAdminStore`), ADR-0043 sqlite-repos.
sqlite = ["dep:rusqlite"]
# Emit JSON Schema for the admin config DTOs (drives TS-contract generation,
# ADR-0043). Enables the domains' own `schema` features.
schema = [
    "dep:schemars",
    "awaken-model-catalog/schema",
    "awaken-credential-vault/schema",
    "awaken-config-resolver/schema",
]

[[example]]
name = "export_schemas"
required-features = ["schema"]

[lints]
workspace = true
