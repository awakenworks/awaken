[package]
name = "awaken-credential-vault"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
product = "platform"
bounded_context = "credentials"
layer = "application"
authority = "credential-vault"
separation = "sole-in-layer"

[dependencies]
awaken-time.workspace = true
awaken-lease-contract.workspace = true
tracing = "0.1"
awaken-agent-contract.workspace = true
awaken-credential-contract.workspace = true
awaken-provisioning-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
url.workspace = true
uuid = { version = "1", features = ["v4", "v7"] }
# Length-framed identities of application Vaults, sources and idempotent credentials.
sha2 = "0.10"
schemars = { version = "1", optional = true }
serde_json.workspace = true
# Feature `oauth-command`: refresh OAuth access tokens by running a helper
# (e.g. `gcloud auth print-access-token`) — needs tokio's process API.
tokio = { workspace = true, optional = true, features = ["process"] }

[dev-dependencies]
awaken-runtime-contract.workspace = true
awaken-lease-testkit.workspace = true
awaken-reliability-testkit = { workspace = true, features = ["tracing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process"] }

[features]
default = []
test-support = []
schema = ["dep:schemars"]
oauth-command = ["dep:tokio"]

[[test]]
name = "material_set_lifecycle"
required-features = ["test-support"]

[lints]
workspace = true
