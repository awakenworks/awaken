[package]
name = "awaken-credential-vault"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
awaken-agent-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
schemars = { version = "1", optional = true }
serde_json = { workspace = true, optional = true }
# Encryption-at-rest adapter (feature `sealed-aead`): AEAD-seal secrets so a disk
# or DB dump is inert without the separately-held key (ADR-0043).
chacha20poly1305 = { version = "0.10", optional = true }
# Feature `sqlite`: embedded durable CredentialRepo/SealedBlobStore backends over
# the crate's own `credential` migration scope (ADR-0043).
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# Feature `oauth-command`: refresh OAuth access tokens by running a helper
# (e.g. `gcloud auth print-access-token`) — needs tokio's process API.
tokio = { workspace = true, optional = true, features = ["process"] }
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9", features = ["postgres"] }
awaken-scoped-migration-sqlite = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9" }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process"] }
tempfile = "3"

[features]
default = []
schema = ["dep:schemars"]
sealed-aead = ["dep:chacha20poly1305"]
# SQLite-backed CredentialRepo + SealedBlobStore (`sqlite::*`); the durable secret
# path stays sealed-only — compose with `sealed-aead` (no plaintext SecretStore).
sqlite = ["dep:rusqlite", "dep:serde_json", "dep:tokio"]
oauth-command = ["dep:tokio"]

[lints]
workspace = true
