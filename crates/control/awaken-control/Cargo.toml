[package]
name = "awaken-control"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
layer = "bootstrap"
authority = "control"

# The authoring / authz plane (Stage B2): the management CRUD surfaces (admin
# config, vault front door, webhook subscriptions, user profiles, config authoring,
# and capabilities) plus the embedded IAM guard. Deployment/Session application
# composition belongs to awaken-coordinator's Coordinator component.
# It knows nothing of the single-machine composition root (awaken-cli) and does
# NOT depend on the awaken-coordinator data-plane bin — the two planes are siblings the
# composition root (awaken-cli) weaves together.
[dependencies]
# The config-authoring plane (config service + routers + resolver + tool catalog).
# Control depends on this shared crate, NOT on the awaken-runtime-host execution host —
# the authoring/authz plane stays a sibling of the data plane (control ⊥ execution).
awaken-config-service = { workspace = true }
awaken-environment-application = { workspace = true }
awaken-admin-assistant = { workspace = true }
awaken-executable-agent-contract = { workspace = true }
awaken-tenancy = { workspace = true }
awaken-authz-enforce = { workspace = true }
awaken-protocol-managed = { workspace = true }
awaken-resource-contract.workspace = true
awaken-session-contract.workspace = true
awaken-config-store = { workspace = true }
awaken-config-resolver = { workspace = true }
awaken-admin-config-api = { workspace = true, features = ["sqlite", "postgres"] }
awaken-model-catalog = { workspace = true, features = ["sqlite", "postgres"] }
awaken-credential-vault = { workspace = true, features = ["oauth-command", "sqlite", "sealed-aead", "postgres"] }
awaken-data-subject = { workspace = true }
# Embedded IAM (ADR-0042/0043 P1): the authorizer, the argon2id token directory +
# minter + default-deny PolicySet evaluator, the seeded Anthropic role catalog, the
# iam-server SqlStore rows, and the IamGate PDP the management guard drives.
awaken-iam-contract = { workspace = true }
awaken-iam-server = { workspace = true }
awaken-iam-core = { workspace = true }
awaken-iam-preset = { workspace = true }
awaken-iam-host = { workspace = true }
# Webhook plane (ADR-0048 / S10): the CRUD router + lifecycle sink over the neutral
# dispatcher/store; the sink is handed back to the composition root for the data plane.
awaken-webhook-managed = { workspace = true }
awaken-agent-contract = { workspace = true }
awaken-runtime-contract = { workspace = true }
# The embedded IAM token/binding rows persist under typed <data_dir>/iam.sqlite.
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"
axum = { version = "0.8", features = ["multipart"] }

[dev-dependencies]
awaken-config-resolver = { workspace = true, features = ["test-support"] }
awaken-config-store = { workspace = true, features = ["test-support"] }
awaken-credential-vault = { workspace = true, features = ["test-support"] }
awaken-data-subject = { workspace = true, features = ["test-support"] }
awaken-environment-contract.workspace = true
awaken-executable-environment-contract.workspace = true
awaken-resource-store = { workspace = true, features = ["test-support"] }
awaken-skill-store = { workspace = true, features = ["test-support"] }
awaken-executable-agent-catalog.workspace = true
awaken-env-store = { workspace = true, features = ["test-support"] }
awaken-model-catalog = { workspace = true, features = ["test-support"] }
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
