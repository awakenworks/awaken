[package]
name = "awaken-control"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
product = "apps"
layer = "bootstrap"
authority = "control"

# The authoring / authz plane (Stage B2): the management CRUD surfaces (admin
# config, vault front door, webhook subscriptions, user profiles, config authoring,
# and capabilities) plus the embedded IAM guard. Deployment/Session application
# composition belongs to awaken-coordinator's Coordinator component.
# It knows nothing of the single-machine composition root (awaken-cli) and does
# NOT depend on the awaken-coordinator data-plane bin — the two planes are siblings the
# composition root (awaken-cli) weaves together.
[dependencies]
awaken-service-lifecycle.workspace = true
awaken-outbound-http.workspace = true
awaken-acp-contract.workspace = true
awaken-deployment-contract.workspace = true
# The config-authoring plane (config service + routers + resolver + tool catalog).
# Control depends on this shared crate, NOT on the awaken-session-executor execution host —
# the authoring/authz plane stays a sibling of the data plane (control ⊥ execution).
awaken-config-service = { workspace = true }
awaken-environment-application = { workspace = true }
awaken-environment-contract.workspace = true
awaken-admin-assistant = { workspace = true }
awaken-executable-agent-contract = { workspace = true }
awaken-tenancy = { workspace = true }
awaken-authz-enforce = { workspace = true }
awaken-protocol-managed = { workspace = true }
awaken-protocol-a2a.workspace = true
awaken-resource-contract.workspace = true
awaken-provisioning-contract.workspace = true
awaken-session-application-contract.workspace = true
awaken-session-configuration-contract.workspace = true
awaken-session-resource-contract.workspace = true
awaken-session-work-contract.workspace = true
awaken-agent-config.workspace = true
awaken-config-store = { workspace = true }
awaken-config-resolver = { workspace = true }
awaken-admin-config-api = { workspace = true, features = ["sqlite", "postgres"] }
awaken-model-catalog.workspace = true
awaken-model-catalog-store = { workspace = true, features = ["sqlite", "postgres"] }
awaken-credential-vault = { workspace = true, features = ["oauth-command"] }
awaken-credential-materializer.workspace = true
awaken-credential.workspace = true
awaken-credential-store = { workspace = true, features = ["sqlite", "sealed-aead", "postgres"] }
awaken-credential-contract.workspace = true
awaken-data-subject-application.workspace = true
# Embedded IAM (ADR-0042/0043 P1): the authorizer, the argon2id token directory +
# minter + default-deny PolicySet evaluator, the seeded Anthropic role catalog, the
# iam-server SqlStore rows, and the IamGate PDP the management guard drives.
awaken-iam-contract = { workspace = true }
awaken-iam-server = { workspace = true }
awaken-iam-core = { workspace = true }
awaken-iam-preset = { workspace = true }
awaken-iam-host = { workspace = true }
# Webhook plane (ADR-0048 / S10): the CRUD router + lifecycle sink over the neutral
# dispatcher/store; the sink is handed back to the composition root for the data plane.
awaken-webhook.workspace = true
awaken-agent-contract = { workspace = true }
awaken-runtime-contract = { workspace = true }
awaken-worker-contract.workspace = true
awaken-provider-genai.workspace = true
async-trait.workspace = true
awaken-time.workspace = true
awaken-lease-contract.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
form_urlencoded = "1"
tracing = "0.1"
url.workspace = true
schemars = { version = "1", optional = true }
axum = { version = "0.8", features = ["multipart"] }

[dev-dependencies]
# The webhook plane test drives lifecycle delivery through the Session outbox relay.
awaken-session-application.workspace = true
awaken-session-repository-contract.workspace = true
awaken-session-state-contract.workspace = true
awaken-resource-application.workspace = true
awaken-config-resolver = { workspace = true, features = ["test-support"] }
awaken-config-store = { workspace = true, features = ["test-support"] }
awaken-credential-vault = { workspace = true, features = ["test-support"] }
awaken-data-subject-store = { workspace = true, features = ["test-support"] }
awaken-executable-environment-contract.workspace = true
awaken-resource-store = { workspace = true, features = ["test-support"] }
awaken-skill-store = { workspace = true, features = ["test-support"] }
awaken-executable-agent-catalog.workspace = true
awaken-env-store = { workspace = true, features = ["test-support"] }
awaken-model-catalog = { workspace = true, features = ["test-support"] }
awaken-run-executor-acp.workspace = true
awaken-worker-registry = { workspace = true, features = ["test-support"] }
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[features]
schema = ["dep:schemars", "awaken-agent-config/schema", "awaken-protocol-managed/schema"]
test-support = ["awaken-webhook/test-support"]

[[test]]
name = "webhook_plane"
required-features = ["test-support"]

[[example]]
name = "export_mcp_schemas"
required-features = ["schema"]
