[package]
name = "awaken-config-service"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
layer = "application"
authority = "config"

# The config-authoring plane (ADR-0036/slice A), extracted from the data-plane host
# so BOTH planes can share it without the authoring/authz plane (awaken-control)
# depending on the execution host: the config service + its CRUD router, the
# advertised-capabilities router, the model-binding resolver, and the scoped tool
# catalog. It is pure config-plane logic — it knows nothing of SharedHost or run
# execution (the control ⊥ execution invariant). Every composition root depends
# on this authoritative owner directly.
[dependencies]
awaken-agent-contract.workspace = true
awaken-executable-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-agent-config.workspace = true
awaken-tenancy = { workspace = true }
awaken-config-resolver = { workspace = true }
# Shared typed File/Memory/Repository binding vocabulary; contains no policy.
awaken-resource-contract = { workspace = true }
# Read-only projection of the provider-neutral Resource input mount defaults.
awaken-provisioning-contract = { workspace = true }
# Managed authoring normalization still consumes the Session tool policy helpers;
# executable publication profiles live in awaken-executable-agent-contract.
awaken-session-contract = { workspace = true }
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
axum = { version = "0.8", features = ["multipart"] }

[dev-dependencies]
awaken-config-resolver = { workspace = true, features = ["test-support"] }
awaken-config-store = { workspace = true, features = ["test-support"] }
awaken-executable-agent-catalog.workspace = true
proptest.workspace = true

[lints]
workspace = true
