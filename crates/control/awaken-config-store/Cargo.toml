[package]
name = "awaken-config-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
layer = "infrastructure"
authority = "config"

[dependencies]
awaken-agent-config.workspace = true
awaken-tenancy.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
rusqlite = { workspace = true }
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
awaken-scoped-migration-sqlite.workspace = true
awaken-sqlite-runtime.workspace = true
awaken-store-runtime.workspace = true

[dev-dependencies]
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-runtime = { workspace = true }
awaken-store-inmem.workspace = true
awaken-store-sqlite = { workspace = true }

[features]
default = []
test-support = []
schema = ["awaken-agent-config/schema"]

[[test]]
name = "integration"
required-features = ["test-support"]
