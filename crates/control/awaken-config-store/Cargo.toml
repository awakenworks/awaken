[package]
name = "awaken-config-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
awaken-runtime-contract.workspace = true
# Tenancy edge aspect (ADR-0051 D4): the opaque `ScopeId` the `ScopedConfig`
# decorator binds so the authoring aggregate is tenant-isolable.
awaken-tenancy.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
rusqlite = { workspace = true }
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9", features = ["postgres"] }
awaken-scoped-migration-sqlite = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9" }

[dev-dependencies]
awaken-runtime = { workspace = true }
awaken-agent-contract.workspace = true
awaken-store-sqlite = { workspace = true }
