[package]
name = "awaken-authz-enforce"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The shared authz engine (in-memory ApiTokenDirectory + PolicySet + preset role
# catalog). This crate is the open "judgment" half — authenticate + authorize; it
# never touches the durable iam-server store (that is the authoring half).
awaken-iam-contract.workspace = true
awaken-iam-core.workspace = true
awaken-iam-preset.workspace = true
# Tenancy edge aspect (ADR-0051 D4): the opaque `ScopeId` + the pure ingress
# reconciliation (`resolve_scope`) the guard runs to collapse token authority and
# a path/domain selection into one authorized scope before the policy engine.
awaken-tenancy.workspace = true
# The guard is an axum middleware over the session/protocol router.
axum = "0.8"
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
