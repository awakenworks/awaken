[package]
name = "awaken-model-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
layer = "domain"
authority = "model-catalog"

[dependencies]
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
async-trait.workspace = true
schemars = { version = "1", optional = true }

[dev-dependencies]
tokio.workspace = true
# Wire-shape unit tests (serde round-trips of the catalog DTOs) — available even
# without the `sqlite`/`postgres` features that pull `serde_json` as a lib dep.
serde_json = { workspace = true }

[features]
default = []
test-support = []
# TS-contract generation (ADR-0043): derive JsonSchema on wire DTOs.
schema = ["dep:schemars"]

[lints]
workspace = true
