[package]
name = "awaken-session-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types", "spi", "api", "remote"]
authority = "session"

[dependencies]
# Agent-domain vocabulary in the port signatures (e.g. `RedactedString` on the MCP
# probe). A contract/ leaf itself — dependencies point inward.
awaken-agent-contract.workspace = true
awaken-credential-contract.workspace = true
# Static Environment identity/version values are published by Control and frozen
# into the dynamic Session baseline through this narrow contract.
awaken-environment-contract.workspace = true
awaken-provisioning-contract.workspace = true
# Secret-free resources-plane identity/configuration port used once while a
# Session freezes its effective inputs. It contains no IAM policy or principal.
awaken-resource-contract.workspace = true
# Neutral activation and ownership-verifier vocabulary used by the Session
# application provisioning port. No dispatch claim or transport type crosses it.
awaken-runtime-contract.workspace = true
awaken-session-types.workspace = true
awaken-session-mcp-contract.workspace = true
awaken-session-resource-contract.workspace = true
awaken-session-budget-contract.workspace = true
awaken-session-dream-contract.workspace = true
awaken-session-event-contract.workspace = true
awaken-session-work-contract.workspace = true
# The opaque tenancy `ScopeId` bound on the scoped session-repository decorator.
async-trait.workspace = true
serde.workspace = true
# `serde_json::Value` types the free-form tool input/schema on the neutral vocab
# (Pending.input, CustomTool.input_schema); thiserror derives the port error enums.
serde_json.workspace = true
thiserror.workspace = true
http = "1"
schemars = { version = "1", optional = true }

[features]
schema = ["dep:schemars"]
# Process observation is installed only by the executable scenario harness.
test-support = []

[dev-dependencies]
awaken-provisioning-contract = { workspace = true, features = ["test-support"] }
awaken-reliability-testkit.workspace = true
# The work-queue port's in-memory impl is exercised by `#[tokio::test]`s.
tokio = { workspace = true, features = ["rt", "macros"] }
# Property-based (formal) verification of the WorkState wire bijection (ADR-0059, issue C).
proptest = { workspace = true }

[lints]
workspace = true
