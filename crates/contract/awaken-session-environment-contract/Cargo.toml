[package]
name = "awaken-session-environment-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
product = "platform"
bounded_context = "environment"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["spi"]
authority = "session-environment"

[dependencies]
# Sandboxes are realized from the provisioning vocabulary.
awaken-provisioning-contract.workspace = true
# A rooted sandbox exposes its in-process tools as runtime tools.
awaken-tool-contract.workspace = true
# The Hand and ACP processes speak over the neutral Agent channel.
awaken-agent-channel.workspace = true
awaken-acp-contract.workspace = true
awaken-runtime-contract.workspace = true
async-trait.workspace = true
tokio.workspace = true

[dev-dependencies]
# The tool-export decision table derives a JSON schema for its fixture arguments.
schemars = "1"

[lints]
workspace = true
