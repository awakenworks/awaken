[package]
name = "awaken-acp-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
product = "platform"
bounded_context = "execution"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types", "spi"]
authority = "acp-capability"
separation = "contract"

[dependencies]
awaken-agent-channel.workspace = true
awaken-credential-contract.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10"

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
