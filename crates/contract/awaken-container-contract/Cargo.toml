[package]
name = "awaken-container-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
product = "platform"
bounded_context = "environment"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types", "spi"]
authority = "container-environment"

[dependencies]
# The container ports are the container projection of the provisioning ports:
# they speak its Sandbox, handle, fence, and restore vocabulary.
awaken-provisioning-contract.workspace = true
# `ContainerEnvironment::open_agent_channel` and `RuntimeAgentProcess` carry the
# agent's byte channel opened inside the container.
awaken-agent-channel.workspace = true
# `ContainerEnvironment` publishes Sandbox control services.
awaken-sandbox-control.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
