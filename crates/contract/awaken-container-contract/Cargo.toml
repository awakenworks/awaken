[package]
name = "awaken-container-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
product = "platform"
bounded_context = "environment"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types"]
authority = "container-environment"
separation = "contract"

[dependencies]
# Pure container wire and capacity values share provisioning vocabulary.
awaken-provisioning-contract.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[lints]
workspace = true
