[package]
name = "awaken-runtime-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "runtime"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types", "spi", "api", "ext"]
authority = "runtime"

[dependencies]
awaken-agent-contract.workspace = true
awaken-credential-contract.workspace = true
awaken-tool-contract.workspace = true
awaken-tenancy.workspace = true
async-trait.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
url.workspace = true
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
schemars = "1"

[features]
default = []
schema = []

[dev-dependencies]
proptest = { workspace = true }
tokio.workspace = true

[lints]
workspace = true
