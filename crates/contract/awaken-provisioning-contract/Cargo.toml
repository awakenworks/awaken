[package]
name = "awaken-provisioning-contract"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types", "spi"]
authority = "sandbox-provisioning"

[features]
test-support = []

[dependencies]
awaken-agent-contract.workspace = true
awaken-lease-contract.workspace = true
# `resilience::Classify` is the one neutral retry/terminal projection; SandboxError opts in.
awaken-sandbox-control.workspace = true
# Typed File/Memory/Repository input identity. Dependency direction is one-way:
# Resources names logical inputs; Provisioning owns their sandbox layout.
awaken-resource-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Exercise the async ports through a trivial fake in unit tests (object-safety +
# the reattach/poll/lease lifecycle). Dev-only; the contract itself needs no runtime.
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
