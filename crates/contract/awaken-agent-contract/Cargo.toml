[package]
name = "awaken-agent-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "runtime"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types", "spi"]
authority = "agent"

[dependencies]
async-trait.workspace = true
blake3 = "1"
hex = "0.4.3"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
zeroize = "1"
http = "1"
schemars = { version = "1", optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
default = []
schema = ["dep:schemars"]

[lints]
workspace = true
