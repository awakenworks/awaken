[package]
name = "awaken-session-configuration-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
product = "platform"
bounded_context = "session"
layer = "contract"
kinds = ["types", "spi"]
authority = "session-configuration"
separation = "contract"

[dependencies]
awaken-session-types.workspace = true
awaken-lease-contract.workspace = true
awaken-time.workspace = true
awaken-web-policy-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-credential-contract.workspace = true
awaken-environment-contract.workspace = true
awaken-provisioning-contract.workspace = true
awaken-resource-contract.workspace = true
awaken-runtime-contract.workspace = true
async-trait.workspace = true
http = "1"
serde.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
thiserror.workspace = true
schemars = { version = "1", optional = true }

[features]
schema = ["dep:schemars"]

[dev-dependencies]
awaken-provisioning-contract = { workspace = true, features = ["test-support"] }
proptest.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
