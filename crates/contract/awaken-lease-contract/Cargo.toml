[package]
name = "awaken-lease-contract"
version = "1.1.0"
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
# SDK publishing preparation: the shared fence types and ownership laws are public API.
api_snapshot = true
# The fence law (epoch, tenure, lease, slot) is generic time-bounded ownership
# with no platform dependency; the SDK's own background-task extension fences
# its attempts with it, so it belongs to the Runtime SDK.
context = "runtime"
product = "sdk"
bounded_context = "agent-runtime"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types", "spi"]
authority = "time-bounded-ownership"
separation = "publish"

# The fence kernel's only awaken dependency is awaken-time, whose Expiry and
# UtcTime carry the lease boundary law; no other awaken dependency may be added.
[dependencies]
awaken-time.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
