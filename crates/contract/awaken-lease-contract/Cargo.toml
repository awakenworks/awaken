[package]
name = "awaken-lease-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "shared"
product = "platform"
bounded_context = "fencing"
layer = "contract"
# ADR-0081 §1 interface kinds this crate may hold (types | spi | api | remote | ext).
kinds = ["types", "spi"]
authority = "time-bounded-ownership"

# The fence kernel's only awaken dependency is awaken-time, whose Expiry and
# UtcTime carry the lease boundary law; no other awaken dependency may be added.
[dependencies]
awaken-time.workspace = true
serde.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }

[lints]
workspace = true
