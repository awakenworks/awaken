[package]
name = "awaken-web-policy-contract"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
# SDK publishing preparation: Web policy vocabulary is a public compatibility promise.
api_snapshot = true
context = "runtime"
product = "sdk"
bounded_context = "agent-runtime"
layer = "contract"
kinds = ["types"]
authority = "web-policy"
# Protocol adapters consume this pure kernel without linking providers or
# credentials; general Session authoring retains opaque tool settings.
separation = "contract"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = "0.1"
url.workspace = true

[lints]
workspace = true
