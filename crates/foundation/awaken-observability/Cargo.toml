[package]
name = "awaken-observability"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cross-cutting telemetry infrastructure (NOT a runtime `ext-*`): the process-global
# `tracing` subscriber, optional OTLP / `AWAKEN_TRACE_FILE` span export, the W3C
# `traceparent` propagator, and the axum ingress middleware that roots each request
# span. Service binaries call `init()` / `shutdown()`; the spans themselves are emitted
# by `#[instrument]` woven into the real call path, so this crate owns the exporter
# wiring and nothing about any domain capability.

[dependencies]
serde_json = { workspace = true }
axum = { workspace = true }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry", "json"] }
tracing-opentelemetry = "0.29"
opentelemetry = { version = "0.28", features = ["metrics"] }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio", "metrics", "experimental_trace_batch_span_processor_with_async_runtime"] }
opentelemetry-otlp = { version = "0.28", default-features = false, features = ["http-proto", "reqwest-client", "metrics"] }
awaken-runtime-contract = { workspace = true }

[lints]
workspace = true
