[package]
name = "awaken-worker-registry"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
layer = "infrastructure"
authority = "worker-registry"

[features]
loom = []
# Private SQLite Worker directory for unit/integration fixtures.
test-support = []

[dependencies]
awaken-sqlite-runtime.workspace = true
awaken-worker-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
rusqlite.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
awaken-scoped-migration-sqlite.workspace = true

[dev-dependencies]
loom = "0.7"
proptest.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
