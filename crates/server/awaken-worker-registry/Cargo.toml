tokio.workspace = true
rusqlite.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "111aaf8a22e0ade4f02548732fd852057180a174", features = ["postgres"] }
