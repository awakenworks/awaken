[package]
name = "awaken-protocol-managed"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[package.metadata.awaken]
context = "protocol"
product = "platform"
bounded_context = "protocols"
layer = "interface"
authority = "protocol-managed"
separation = "protocol"
protocol = "managed-agents"

[features]
schema = ["dep:schemars", "awaken-session-configuration-contract/schema"]
# Ephemeral convenience constructors are intentionally absent from product builds.
# Store fixtures live in awaken-protocol-managed-testkit and reach this adapter
# behind their ports; enabling this feature pulls in no concrete store.
test-support = [
    "awaken-deployment-application/test-support",
    "awaken-dream-application/test-support",
    "awaken-credential-vault/test-support",
    "awaken-model-catalog/test-support",
]

[dependencies]
awaken-tool-contract.workspace = true
awaken-data-subject-application.workspace = true
awaken-agent-contract.workspace = true
awaken-executable-agent-contract.workspace = true
awaken-executable-environment-contract.workspace = true
# The neutral session-runtime ports + vocab (extracted contract/ leaf). This adapter
# owns the wire DTOs + the neutral→wire encoder and re-exports each moved port via a
# shim so consumers stay unchanged until flipped to the contract directly.
awaken-session-application-contract.workspace = true
awaken-session-configuration-contract.workspace = true
awaken-session-realization-contract.workspace = true
awaken-session-repository-contract.workspace = true
awaken-session-execution-contract.workspace = true
awaken-session-state-contract.workspace = true
awaken-session-budget-contract.workspace = true
awaken-session-dream-contract.workspace = true
awaken-session-event-contract.workspace = true
awaken-session-mcp-contract.workspace = true
awaken-session-resource-contract.workspace = true
awaken-session-types.workspace = true
awaken-session-work-contract.workspace = true
awaken-session-application.workspace = true
# The pure timeline domain: fact identity, canonical order, interval selection.
awaken-managed-session-events.workspace = true
awaken-environment-contract.workspace = true
awaken-environment-application.workspace = true
awaken-environment-execution-application.workspace = true
awaken-deployment-contract.workspace = true
awaken-deployment-application.workspace = true
awaken-dream-application.workspace = true
awaken-credential-contract.workspace = true
# Typed resource ids/bindings plus the Resource Catalog port used by the Managed
# ACL to lower wire resources before Session resolution. No IAM policy lives here.
awaken-resource-contract.workspace = true
awaken-dispatch-contract.workspace = true
awaken-resource-application.workspace = true
# Tenancy as an edge aspect (ADR-0051): the opaque `ScopeId` the `ScopedRepo`
# decorator binds so session persistence is tenant-isolable while the core stays
# tenancy-agnostic (the engine never reads a scope).
awaken-tenancy.workspace = true
# Managed vault/credential front door (ADR-0043): the neutral credential domain
# and the ACL that maps its rows ⇄ the Anthropic Managed wire tags.
awaken-credential-vault.workspace = true
awaken-service-auth-contract.workspace = true
# Neutral sandbox egress vocabulary (`NetworkPolicy`): the environments ACL maps
# the Anthropic `BetaEnvironment.networking` wire config onto this typed policy, so
# the egress decision is a shared neutral fact rather than an inline string match.
awaken-provisioning-contract.workspace = true
awaken-protocol-awaken.workspace = true
awaken-runtime-contract.workspace = true
awaken-observability.workspace = true
awaken-ext-skills.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
chrono-tz = "0.10"
async-trait.workspace = true
thiserror.workspace = true
awaken-outbound-http = { workspace = true }
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v7"] }
# `sync` for the per-session live-SSE broadcast the preview sink and committed
# events publish to; `rt`/`macros` come from the workspace default.
tokio = { workspace = true, features = ["sync"] }
axum = { version = "0.8", features = ["multipart"] }
tokio-stream = "0.1"
# The live-SSE endpoint yields a snapshot backfill then live broadcast frames from
# one `async` generator (`stream!`).
async-stream = "0.3"
awaken-time.workspace = true
awaken-lease-contract.workspace = true
# Decode the `event_deltas[]` query param (keys/values may be percent-encoded).
form_urlencoded = "1"
serde_urlencoded = "0.7"
# Managed operation span (`#[instrument]`) exported through the global subscriber the
# service binary installs; this crate emits spans, never wires an exporter.
tracing = "0.1"
tar = "0.4"

[[test]]
name = "adapter"
required-features = ["test-support"]

[[test]]
name = "dreams"
required-features = ["test-support"]

[[test]]
name = "environments"
required-features = ["test-support"]

[[test]]
name = "deployments"
required-features = ["test-support"]

[[test]]
name = "mcp_sessions"
required-features = ["test-support"]

[[test]]
name = "projection"
required-features = ["test-support"]

[[test]]
name = "session_egress"
required-features = ["test-support"]

[[test]]
name = "session_environment"
required-features = ["test-support"]

[[test]]
name = "session_resources"
required-features = ["test-support"]

[[test]]
name = "streaming"
required-features = ["test-support"]

[[test]]
name = "tenancy_required"
required-features = ["test-support"]

[dev-dependencies]
# Draws long committed histories for the timeline's schedule-independence property.
proptest.workspace = true
async-trait.workspace = true
# Pins the timeline's coordination-send id to the tool that owns it.
awaken-ext-builtin-tools.workspace = true
# Store fixtures behind their ports; also re-exported for integration tests.
awaken-protocol-managed-testkit.workspace = true
tempfile = "3"
awaken-reliability-testkit = { workspace = true, features = ["tracing"] }
awaken-service-lifecycle = { workspace = true, features = ["test-support"] }
awaken-data-subject-store = { workspace = true, features = ["test-support"] }
awaken-executable-environment-catalog.workspace = true
awaken-work-store = { workspace = true, features = ["test-support"] }
awaken-env-store = { workspace = true, features = ["test-support"] }
awaken-session-store = { workspace = true, features = ["test-support"] }
awaken-credential-vault = { workspace = true, features = ["test-support"] }
awaken-model-catalog = { workspace = true, features = ["test-support"] }
awaken-sandbox-policy-store = { workspace = true, features = ["test-support"] }
awaken-resource-store = { workspace = true, features = ["sqlite", "test-support"] }
awaken-file-store = { workspace = true, features = ["test-support"] }
awaken-memory-store = { workspace = true, features = ["test-support"] }
awaken-skill-store = { workspace = true, features = ["test-support"] }
# Test-only ZIP construction drives the canonical Skill bundle ingestor.
zip = { version = "8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Vault E2E: prove a vault credential resolves an inference end to end.
awaken-config-resolver.workspace = true
awaken-lease-testkit.workspace = true

[[example]]
name = "export_schemas"
required-features = ["schema"]
