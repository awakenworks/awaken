axum.workspace = true
serde.workspace = true

[dev-dependencies]
awaken-env-store = { workspace = true, features = ["test-support"] }
awaken-executable-environment-catalog.workspace = true
awaken-sandbox-policy-store = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
