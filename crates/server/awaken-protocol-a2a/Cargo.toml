[package]
name = "awaken-protocol-a2a"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
awaken-agent-contract.workspace = true
awaken-credential.workspace = true
awaken-protocol-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum = "0.7"
# Outbound client transport (the inbound router uses axum; the outbound client
# calls a remote A2A agent over HTTP).
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
