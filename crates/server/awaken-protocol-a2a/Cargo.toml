[package]
name = "awaken-protocol-a2a"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[package.metadata.awaken]
context = "shared"
product = "platform"
bounded_context = "protocols"
layer = "interface"
authority = "protocol-a2a"
separation = "protocol"
protocol = "a2a"

[dependencies]
awaken-agent-contract.workspace = true
awaken-credential-contract.workspace = true
awaken-session-application-contract.workspace = true
awaken-session-types.workspace = true
# The Org admission vocabulary this adapter classifies and encodes.
awaken-tenancy.workspace = true
awaken-outbound-http.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
awaken-time.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum = "0.8"
tokio-stream = "0.1"
# Outbound client transport (the inbound router uses axum; the outbound client
# calls a remote A2A agent over HTTP).
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
awaken-outbound-http = { workspace = true, features = ["test-support"] }
awaken-lease-testkit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
