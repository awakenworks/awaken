[package]
name = "awaken-run-executor-a2a"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
layer = "infrastructure"
authority = "run-executor-a2a"

[dependencies]
awaken-runtime-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-protocol-a2a.workspace = true
async-trait.workspace = true
# The Run-attempt adapter polls an A2A task to a lifecycle boundary.
tokio = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tracing = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net"] }
axum = "0.8"
