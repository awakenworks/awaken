[package]
name = "awaken-run-executor-a2a"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
awaken-runtime-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-protocol-a2a.workspace = true
async-trait.workspace = true
# The RemoteDelegate adapter polls an A2A task to a terminal state (tokio time/select,
# cancellation-aware) and serializes the discovery card to neutral JSON.
tokio = { workspace = true }
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net"] }
axum = "0.8"
