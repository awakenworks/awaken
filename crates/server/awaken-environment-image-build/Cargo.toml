[package]
name = "awaken-environment-image-build"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
product = "platform"
bounded_context = "environment"
layer = "infrastructure"
authority = "environment-image"

[dependencies]
awaken-time.workspace = true
async-trait.workspace = true
awaken-environment-contract.workspace = true
awaken-executable-environment-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-sqlite-pool.workspace = true
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
awaken-scoped-migration-sqlite.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
awaken-reliability-testkit.workspace = true
awaken-lease-testkit.workspace = true
awaken-env-store = { workspace = true, features = ["test-support"] }
awaken-environment-application.workspace = true
awaken-environment-execution-application.workspace = true
awaken-executable-environment-catalog.workspace = true
awaken-work-store = { workspace = true, features = ["test-support"] }
tempfile = "3"

[features]
# Process-local build state and private SQLite databases for fixtures.
test-support = []

[lints]
workspace = true
