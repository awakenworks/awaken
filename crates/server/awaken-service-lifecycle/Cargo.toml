[package]
name = "awaken-service-lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "shared"
layer = "infrastructure"
authority = "service-lifecycle"

[features]
standalone-release-admission = []
test-support = []

[dependencies]
awaken-lease-contract.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true

[lints]
workspace = true

[[bin]]
name = "awaken-verification-admission"
path = "src/release_admission_main.rs"
