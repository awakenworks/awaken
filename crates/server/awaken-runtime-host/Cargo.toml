[package]
name = "awaken-runtime-host"
description = "Authority-free shared execution host infrastructure for Awaken Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "shared"
layer = "infrastructure"
authority = "runtime-host"

[dependencies]
# The neutral session substrate (SharedHost) and the two port adapters
# (ManagedHost / RunApplicationHost) live here; the assembly bin mounts them.
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-session-contract.workspace = true
awaken-resource-contract.workspace = true
awaken-resource-application = { workspace = true, optional = true }
awaken-runtime = { workspace = true }
# Volatile commit/checkpoint reference adapters are available only to explicit
# test/scenario deployments. Product builds do not link this backend.
awaken-store-inmem = { workspace = true, optional = true }
awaken-observability = { workspace = true }
awaken-ext-builtin-tools = { workspace = true }
awaken-ext-memory = { workspace = true }
awaken-ext-compact = { workspace = true }
awaken-ext-permission = { workspace = true }
awaken-ext-skills = { workspace = true }
awaken-ext-mcp = { workspace = true }
awaken-ext-goal = { workspace = true }
awaken-ext-state-machine = { workspace = true, features = ["schema"] }
awaken-ext-background-task.workspace = true
# Resource implementations are available only to test-support fixture builders;
# product Runtime Host consumes the contract traits injected by startup.
awaken-memory-store = { workspace = true, optional = true }
awaken-skill-store = { workspace = true, optional = true }
awaken-sandbox-local = { workspace = true }
awaken-sandbox-fs = { workspace = true }
# The container tier (podman/docker/k8s), for realizing the session-scoped execution
# environment selected by worker configuration.
awaken-sandbox-container = { workspace = true }
# The content-addressed store the host serves files/artifacts from + adapts behind
# the sandbox providers' BlobSource port (was re-exported via awaken-sandbox-local,
# now a direct dependency since that worker-tier crate no longer links it).
awaken-file-store = { workspace = true, optional = true }
# The neutral sandbox vocabulary the sandboxed ACP channel source speaks
# (SandboxSpec/Command/NetworkPolicy) when realizing the namespace tier.
awaken-provisioning-contract = { workspace = true }
awaken-session-store = { workspace = true, optional = true }
awaken-tenancy = { workspace = true }
awaken-run-ingress = { workspace = true, default-features = false }
awaken-run-ingress-contract.workspace = true
awaken-worker-transport-security = { workspace = true }
awaken-worker-runtime.workspace = true
awaken-run-executor-acp = { workspace = true }
awaken-acp-contract = { workspace = true }
awaken-credential-vault = { workspace = true, optional = true }
awaken-credential-contract.workspace = true
awaken-credential.workspace = true
awaken-credential-materializer = { workspace = true }
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync"] }
axum = { version = "0.8", features = ["multipart"] }
# Runtime MCP relay transport; exact OAuth refresh remains in credential
# materialization and is injected through CredentialRefreshFactory.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
# Content SHA-256 for the memory_stores memories/versions API (`content_sha256`).
sha2 = "0.10"
# Text-level PII scrubbing for the content-capture redactor (ADR-0050 D6).
regex = "1"
schemars = "1"
# Host Run span (`#[instrument]`) exported through the global subscriber the service
# binary installs; this crate emits spans, never wires an exporter.
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
[features]
# The reusable Host is authority-free by default. Coordinator injects the
# RuntimeAuthority value directly; there is no feature-selected compatibility
# assembly that can acquire a Store implicitly.
default = []
# Post-construction persistence overrides are restricted to tests. Product
# startup selects every authority before constructing SharedHost.
test-support = [
    "dep:awaken-store-inmem",
    "dep:awaken-file-store",
    "dep:awaken-memory-store",
    "dep:awaken-skill-store",
    "dep:awaken-session-store",
    "dep:awaken-resource-application",
    "dep:awaken-credential-vault",
    "awaken-credential-materializer/authority",
    "awaken-file-store/test-support",
    "awaken-credential-vault/test-support",
    "awaken-memory-store/sqlite",
    "awaken-memory-store/test-support",
    "awaken-run-ingress/test-support",
    "awaken-session-store/test-support",
]
# Container ACP tiers: enable the backend a worker is configured for
# (AWAKEN_SANDBOX_TIER). Each forwards to the matching awaken-sandbox-container
# runtime; off by default so the namespace-only host stays light.
container-docker = ["awaken-sandbox-container/docker"]
container-podman = ["awaken-sandbox-container/podman"]
container-k8s = ["awaken-sandbox-container/k8s"]

[dev-dependencies]
awaken-service-lifecycle.workspace = true
awaken-sandbox-local = { workspace = true, features = ["test-support"] }
awaken-resource-application.workspace = true
awaken-credential-vault = { workspace = true, features = ["test-support"] }
awaken-file-store = { workspace = true, features = ["test-support"] }
awaken-memory-store = { workspace = true, features = ["sqlite", "test-support"] }
awaken-run-ingress = { workspace = true, features = ["test-support"] }
awaken-session-store = { workspace = true, features = ["test-support"] }
awaken-skill-store = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
awaken-resource-store = { workspace = true, features = ["sqlite", "test-support"] }
awaken-run-ingress-testkit = { workspace = true }
# The durable session-store round-trip test opens a real sessions.db under a temp dir.
tempfile = "3"
# The sandboxed-channel-source integration test observes what the bwrap-confined
# agent said through the in-memory commit boundary.
awaken-store-inmem = { workspace = true }
awaken-store-sqlite.workspace = true
awaken-credential-materializer = { workspace = true, features = ["authority"] }
# Drives Worker transport routers in-process through `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "durable_child_run"
required-features = ["test-support"]

[lints]
workspace = true
