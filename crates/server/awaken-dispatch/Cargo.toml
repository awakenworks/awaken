[package]
name = "awaken-dispatch"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
product = "platform"
bounded_context = "dispatch"
layer = "infrastructure"
authority = "run-ingress"
separation = "isolation"
isolates = ["async-nats", "sqlx"]

[dependencies]
awaken-credential-contract.workspace = true
awaken-tool-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-dispatch-contract = { workspace = true }
awaken-dispatch-execution.workspace = true
awaken-session-execution-contract.workspace = true
awaken-session-types.workspace = true
awaken-runtime = { workspace = true }
# W3C traceparent capture (submit) + `wake.dispatch` span (worker) so a durably
# dispatched run continues the admitting request's trace across the queue boundary.
awaken-observability = { workspace = true }
tracing = "0.1"
futures-util = "0.3"
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite", "json"], optional = true }
awaken-scoped-migration.workspace = true
awaken-sqlite-pool = { workspace = true, optional = true }
awaken-sql-storage = { workspace = true, optional = true, features = ["postgres"] }
async-nats = { version = "0.50", optional = true }
awaken-time.workspace = true
futures-lite = { version = "2", optional = true }

[features]
default = ["durable"]
# Coordinator-owned SQLite/Postgres queue adapters. A database-less Worker uses
# `AnyDispatchStore::from_dispatch` over its claim-fenced HTTP transport and
# therefore must compile this crate without these authority drivers.
durable = [
    "dep:sqlx",
    "awaken-scoped-migration/postgres",
    "awaken-scoped-migration/sqlite",
    "dep:awaken-sqlite-pool",
    "dep:awaken-sql-storage",
]
# Private SQLite dispatch authority for unit/integration/scenario fixtures.
test-support = ["durable", "awaken-dispatch-execution/test-support"]
# Optional cross-node wake signal over NATS. Off by default — the default build
# and test suite stay free of the NATS driver; enable for a multi-node fleet.
nats = ["durable", "dep:async-nats", "dep:futures-lite"]

[dev-dependencies]
awaken-worker-contract.workspace = true
awaken-lease-testkit.workspace = true
awaken-store-conformance.workspace = true
awaken-reliability-testkit.workspace = true
awaken-dispatch-testkit = { workspace = true }
awaken-store-inmem.workspace = true
awaken-store-postgres = { workspace = true }
awaken-store-sqlite = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "test-util"] }
tempfile = "3"

[[test]]
name = "any_store"
required-features = ["test-support"]

[[test]]
name = "crash_before_settle"
required-features = ["test-support"]

[[test]]
name = "checkpoint_fence"
required-features = ["test-support"]

[[test]]
name = "dispatch_conformance"
required-features = ["test-support"]

# Compile-surface cause/effect table for the bounded-query and reconciliation
# targets: C1 both import the private MemoryDispatchStore/open_in_memory fixture;
# C2 test-support is absent/present. R1 C1+C2(absent) skips both targets without
# widening the default product API; R2 C1+C2(present) compiles and executes both.
[[test]]
name = "dispatch_queries"
required-features = ["test-support"]

[[test]]
name = "reconciliation_scan"
required-features = ["test-support"]

[[test]]
name = "durable_memory"
required-features = ["test-support"]

# Compile-surface decision table: C1 the PostgreSQL fixture imports the private
# DispatchTestHarness -> require test-support; C2 production/default package
# tests do not expose that fixture -> Cargo skips this target; C3 test-support
# is explicit -> compile and run the real-PostgreSQL test normally.
[[test]]
name = "durable_postgres"
required-features = ["test-support"]

[[test]]
name = "dispatch_claim_perf"
required-features = ["test-support"]

[[test]]
name = "lease_semantics"
required-features = ["test-support"]

[[test]]
name = "pool_memory"
required-features = ["test-support"]

[[test]]
name = "resilience_and_metrics"
required-features = ["test-support"]

[[test]]
name = "sandbox_binding"
required-features = ["test-support"]

[[test]]
name = "service_memory"
required-features = ["test-support"]

[[test]]
name = "sqlite_dispatch"
required-features = ["test-support"]

[[test]]
name = "units"
required-features = ["test-support"]

[[test]]
name = "worker_edge_cases"
required-features = ["test-support"]

[[test]]
name = "worker_error_paths"
required-features = ["test-support"]

[lints]
workspace = true
