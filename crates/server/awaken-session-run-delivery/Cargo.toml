[package]
name = "awaken-session-run-delivery"
description = "How a Coordinator delivers a Session's Runs to their Workers and observes them settle"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "shared"
product = "platform"
bounded_context = "execution"
layer = "infrastructure"
authority = "session-run-delivery"
separation = "coordinator-side"

# The Coordinator half of Run delivery that needs no execution machinery. It
# links no Session realization, Sandbox or credential realization, so the
# Coordinator process composes it without the Worker-side executor.
[dependencies]
awaken-agent-contract.workspace = true
awaken-dispatch-contract.workspace = true
awaken-dispatch-erasure.workspace = true
awaken-dispatch-execution.workspace = true
awaken-session-application-contract.workspace = true
awaken-session-budget-contract.workspace = true
awaken-session-event-contract.workspace = true
awaken-session-execution-contract.workspace = true
awaken-session-configuration-contract.workspace = true
awaken-session-realization-contract.workspace = true
awaken-credential-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-observability.workspace = true
awaken-tenancy.workspace = true
awaken-time.workspace = true
awaken-session-state-contract.workspace = true
awaken-ext-goal.workspace = true
awaken-ext-builtin-tools.workspace = true
awaken-ext-compact.workspace = true
awaken-ext-memory.workspace = true
awaken-ext-skills.workspace = true
awaken-resource-contract.workspace = true
awaken-tool-contract.workspace = true
serde_json.workspace = true
awaken-session-types.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
awaken-memory-store = { workspace = true, features = ["test-support"] }
awaken-deployment-config.workspace = true
awaken-dispatch = { workspace = true, features = ["test-support"] }
awaken-environment-contract.workspace = true
awaken-store-inmem.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }

[lints]
workspace = true
