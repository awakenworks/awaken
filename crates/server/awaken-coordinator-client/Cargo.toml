[package]
name = "awaken-coordinator-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
product = "platform"
bounded_context = "dispatch"
layer = "infrastructure"
authority = "worker-runtime-transport"
separation = "isolation"
isolates = ["reqwest"]

[dependencies]
awaken-credential-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-dispatch-contract.workspace = true
awaken-dispatch-execution.workspace = true
awaken-runtime-contract.workspace = true
awaken-session-configuration-contract.workspace = true
awaken-session-realization-contract.workspace = true
awaken-session-execution-contract.workspace = true
awaken-session-state-contract.workspace = true
awaken-session-resource-contract.workspace = true
awaken-session-types.workspace = true
awaken-session-work-contract.workspace = true
awaken-outbound-http = { workspace = true }
awaken-worker-transport-security.workspace = true
async-trait.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing = "0.1"

[dev-dependencies]
awaken-store-inmem.workspace = true
awaken-dispatch = { workspace = true, features = ["test-support"] }
awaken-worker-transport-security.workspace = true
async-trait.workspace = true
awaken-time.workspace = true
awaken-lease-testkit.workspace = true
axum.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

[lints]
workspace = true
