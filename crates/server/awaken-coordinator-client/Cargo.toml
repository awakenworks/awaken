[package]
name = "awaken-coordinator-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "worker"
layer = "infrastructure"
authority = "worker-runtime-transport"

[dependencies]
awaken-dispatch-contract.workspace = true
awaken-session-contract.workspace = true
awaken-worker-transport-security.workspace = true
async-trait.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
awaken-agent-contract.workspace = true
awaken-dispatch = { workspace = true, features = ["test-support"] }
awaken-runtime-contract.workspace = true
# Integration fixtures mount the Coordinator-side Host router; product Worker
# code has no dependency on the Host implementation.
awaken-session-executor = { workspace = true, features = ["test-support"] }
awaken-session-contract.workspace = true
awaken-worker-transport-security.workspace = true
async-trait.workspace = true
axum.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

[lints]
workspace = true
