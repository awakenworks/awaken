[package]
name = "awaken-dream-application"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
product = "platform"
bounded_context = "session"
layer = "application"
authority = "dream"

[features]
# Process-local Dream process authority is an executable test fixture only.
test-support = []

[dependencies]
awaken-sync.workspace = true
awaken-runtime-contract.workspace = true
awaken-time.workspace = true
awaken-session-dream-contract.workspace = true
awaken-session-types.workspace = true
async-trait.workspace = true
chrono = { version = "0.4", default-features = false, features = ["serde"] }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing = "0.1"

[lints]
workspace = true

[dev-dependencies]
awaken-store-conformance.workspace = true
