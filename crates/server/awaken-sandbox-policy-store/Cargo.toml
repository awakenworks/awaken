[package]
name = "awaken-sandbox-policy-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
layer = "infrastructure"
authority = "sandbox-policy"

[dependencies]
awaken-provisioning-contract.workspace = true
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
awaken-scoped-migration-sqlite.workspace = true
awaken-sqlite-runtime.workspace = true
async-trait.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[features]
# Process-local policy authority for unit, integration, and scenario fixtures.
test-support = []

[lints]
workspace = true
