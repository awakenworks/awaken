[package]
name = "awaken-sandbox-policy-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "control"
product = "platform"
bounded_context = "config"
layer = "infrastructure"
authority = "sandbox-policy"

[dependencies]
awaken-sql-storage = { workspace = true, features = ["postgres"] }
awaken-provisioning-contract.workspace = true
awaken-scoped-migration = { workspace = true, features = ["postgres", "sqlite"] }
awaken-sqlite-pool.workspace = true
async-trait.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "sqlite"] }

[dev-dependencies]
awaken-reliability-testkit.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"

[features]
# Process-local policy authority for unit, integration, and scenario fixtures.
test-support = []

[lints]
workspace = true
