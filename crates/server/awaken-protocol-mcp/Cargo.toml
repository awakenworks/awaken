[package]
name = "awaken-protocol-mcp"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "MCP protocol adapter (server side): exposes awaken runtime tools to external MCP clients"

[dependencies]
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-mcp-wire.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "rt", "macros", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
# `client` matches awaken-ext-mcp: the SDK does not build feature-less (its
# transport_factory names the gated client module unconditionally). Only wire
# *types* are used here.
mcp = { package = "model-context-protocol", version = "0.2", default-features = false, features = ["client"] }

[dev-dependencies]
awaken-ext-mcp.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "time", "process"] }

[lints]
workspace = true
