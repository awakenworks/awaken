[package]
name = "awaken-worker-transport-security"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "shared"
product = "platform"
bounded_context = "dispatch"
layer = "infrastructure"
authority = "worker-transport-security"
separation = "isolation"
isolates = ["axum", "k8s-openapi", "kube", "reqwest"]

[dependencies]
awaken-sync.workspace = true
awaken-time.workspace = true
awaken-dispatch-contract.workspace = true
awaken-outbound-http.workspace = true
awaken-worker-contract.workspace = true
# The self-hosted Worker trust domain a resolved bootstrap defaults to.
awaken-agent-contract.workspace = true
async-trait.workspace = true
axum.workspace = true
base64 = "0.22"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tracing = "0.1"
kube = { workspace = true, features = ["client", "rustls-tls", "http-proxy"], optional = true }
k8s-openapi = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time"], optional = true }

[features]
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:tokio", "awaken-outbound-http/kubernetes"]

[dev-dependencies]
awaken-lease-testkit.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "net", "time"] }
tempfile = "3"

[lints]
workspace = true
