[package]
name = "awaken-session-realization-driver"
description = "The topology-neutral, stateless executors of the actions the Session aggregate projects for realization and terminal cleanup"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "shared"
product = "platform"
bounded_context = "session"
layer = "domain"
authority = "session-realization"
separation = "sole-in-layer"

[dependencies]
awaken-session-configuration-contract.workspace = true
async-trait.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror.workspace = true
awaken-time.workspace = true
tokio = { workspace = true, features = ["macros", "sync", "time"] }
awaken-agent-contract.workspace = true
awaken-lease-contract.workspace = true
awaken-session-execution-contract.workspace = true
awaken-session-contract.workspace = true
awaken-session-types.workspace = true
serde_json.workspace = true
tracing = "0.1"

[features]
# The realization observation checkpoints scenario tests read.
test-support = ["awaken-session-execution-contract/test-support"]

[dev-dependencies]
awaken-reliability-testkit.workspace = true
awaken-credential-contract.workspace = true
awaken-environment-contract.workspace = true
awaken-provisioning-contract.workspace = true
awaken-session-application-contract.workspace = true
awaken-session-configuration-contract.workspace = true
awaken-session-execution-contract = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
