[package]
name = "awaken-credential-materializer"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "shared"
product = "platform"
bounded_context = "credentials"
layer = "infrastructure"
authority = "credential-materializer"

[dependencies]
awaken-agent-contract.workspace = true
awaken-acp-contract.workspace = true
awaken-credential.workspace = true
awaken-credential-contract.workspace = true
awaken-time.workspace = true
awaken-provisioning-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-provider-genai.workspace = true
awaken-ext-builtin-tools = { workspace = true, optional = true }
awaken-worker-contract.workspace = true
async-trait.workspace = true
base64 = "0.22"
chacha20poly1305 = "0.10"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
awaken-outbound-http = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
uuid = { version = "1", features = ["v4"] }

[features]
default = ["authority"]
authority = []
brokered = [
    "dep:awaken-ext-builtin-tools",
    "dep:awaken-outbound-http",
    "dep:reqwest",
    "dep:tokio",
]

[dev-dependencies]
tempfile = "3"
awaken-credential-vault = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
