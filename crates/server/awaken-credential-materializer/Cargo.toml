[package]
name = "awaken-credential-materializer"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "shared"
layer = "infrastructure"
authority = "credential-materializer"

[dependencies]
awaken-agent-contract.workspace = true
awaken-admin-config-api = { workspace = true, optional = true }
awaken-credential.workspace = true
awaken-credential-vault = { workspace = true, optional = true }
awaken-credential-contract.workspace = true
awaken-provisioning-contract.workspace = true
awaken-run-executor-acp.workspace = true
awaken-runtime-contract.workspace = true
awaken-provider-genai.workspace = true
awaken-model-catalog = { workspace = true, optional = true }
awaken-worker-contract.workspace = true
async-trait.workspace = true
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
form_urlencoded = { version = "1", optional = true }
tokio = { workspace = true, features = ["time"], optional = true }
uuid = { version = "1", features = ["v4"] }

[features]
default = ["authority"]
authority = [
    "dep:awaken-credential-vault",
    "dep:form_urlencoded",
    "dep:reqwest",
    "dep:tokio",
]
brokered = [
    "dep:awaken-admin-config-api",
    "dep:awaken-model-catalog",
    "dep:reqwest",
    "dep:tokio",
]

[dev-dependencies]
awaken-credential-vault = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
