[package]
name = "awaken-coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
layer = "bootstrap"
authority = "coordinator"


[dependencies]
awaken-service-lifecycle.workspace = true
# The extracted service layer: SharedHost / ManagedHost / RunApplicationHost and all
# host modules live here; Coordinator startup selects the served router modes.
awaken-runtime-host.workspace = true
awaken-run-ingress-http.workspace = true
awaken-resource-worker-http.workspace = true
awaken-worker-runtime.workspace = true
awaken-config-service.workspace = true
awaken-credential-materializer.workspace = true
awaken-ext-skills.workspace = true
awaken-provisioning-contract.workspace = true
awaken-run-ingress = { workspace = true, features = ["durable"] }
awaken-sandbox-local.workspace = true
awaken-worker-transport-security.workspace = true
awaken-executable-agent-contract.workspace = true
awaken-service-auth-contract.workspace = true
awaken-deployment-contract.workspace = true
awaken-environment-contract.workspace = true
awaken-deployment-application.workspace = true
awaken-environment-execution-application.workspace = true
awaken-worker-registry = { workspace = true }
awaken-worker-contract.workspace = true
awaken-acp-contract = { workspace = true }
awaken-admin-assistant = { workspace = true }
awaken-tenancy = { workspace = true }
# Cross-cutting telemetry: the tracing subscriber + OTLP/AWAKEN_TRACE_FILE span
# export + W3C traceparent propagator + ingress span middleware (not an ext).
awaken-observability = { workspace = true }
# Open enforcement (S1): the session-axis guard + RequestTenancy the project
# ingress stamps. The standalone wraps the session router with it.
awaken-authz-enforce = { workspace = true }
awaken-protocol-managed = { workspace = true }
awaken-protocol-awaken = { workspace = true }
awaken-dream-application = { workspace = true }
awaken-protocol-ai-sdk = { workspace = true }
awaken-protocol-ag-ui = { workspace = true }
awaken-protocol-a2a = { workspace = true }
awaken-protocol-mcp = { workspace = true }
awaken-agent-config.workspace = true
awaken-config-store = { workspace = true }
awaken-resource-persistence = { workspace = true, optional = true }
awaken-session-store = { workspace = true }
# Concrete worker adapter is assembled here, outside runtime-host, behind the
# neutral MemoryMounter port (FUSE where available, copy/harvest otherwise).
awaken-sandbox-memoryd = { workspace = true }
# ACP runtime (R3/R4): drive an external ACP CLI as a peer RunExecutor when a
# session selects `runtime: "acp:*"`.
awaken-run-executor-acp = { workspace = true }
awaken-acp-application.workspace = true
awaken-protocol-acp.workspace = true
# A2A attempt adapter is selected here, at the data-plane process boundary,
# and injected into the neutral runtime host through `RunAttemptExecutor`.
awaken-run-executor-a2a = { workspace = true }
# Volatile scenario wiring is available only through `test-support`; production
# Coordinator receives exact credential contracts and never opens Vault.
awaken-credential-vault = { workspace = true, features = ["oauth-command"], optional = true }
awaken-credential-contract.workspace = true
# Data-subject consent/erasure store (ADR-0050): backs the /v1/user_profiles/:id/erasure endpoint.
# Embedded IAM (ADR-0042/0043 P1): typed self-managed identity gates management
# plane behind bearer ApiTokens. contract = ids/scopes/requests, core = token
# directory + minter + the default-deny PolicySet evaluator, preset = the seeded
# Anthropic role catalog + the iam-server store (rusqlite range is links-safe
# since iam adopted foundation ADR-0005).
awaken-iam-contract = { workspace = true }
awaken-iam-server = { workspace = true }
awaken-iam-core = { workspace = true }
awaken-iam-preset = { workspace = true }
# The IAM assembly layer (ADR-0048): IamGate (single authn/authz PDP) built over
# our own LocalIamState, driving the management guard.
awaken-iam-host = { workspace = true }
# The embedded IAM token/binding rows persist under typed data_dir/iam.sqlite;
# same rusqlite generation as every other sqlite store in the workspace.
rusqlite = { workspace = true }
awaken-scoped-migration.workspace = true
awaken-scoped-migration-sqlite.workspace = true
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-ext-mcp.workspace = true
awaken-session-contract.workspace = true
awaken-session-application.workspace = true
awaken-ext-memory.workspace = true
awaken-resource-contract.workspace = true
awaken-resource-application.workspace = true
awaken-store-fs.workspace = true
awaken-store-sqlite.workspace = true
awaken-sqlite-runtime.workspace = true
awaken-store-runtime.workspace = true
awaken-store-postgres.workspace = true
awaken-store-inmem = { workspace = true, optional = true }
awaken-connection-plan.workspace = true
# Webhook plane (ADR-0048 / S10): the WebhookLifecycleFactSink bridges the managed
# session lifecycle to the neutral dispatcher; the CRUD router manages
# workspace-scoped subscriptions over the injected durable admin store/vault.
awaken-webhook = { workspace = true }
awaken-webhook-managed = { workspace = true }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64 = "0.22"
uuid = { version = "1", features = ["v7"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
axum = { version = "0.8", features = ["multipart"] }
# oneshot-forwarding for the /projects/{id} prefix-stripping ingress proxy
# (also used by the integration tests).
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
url.workspace = true

[features]
# Volatile embedded/scenario assembly is excluded from product builds.
test-support = [
    "awaken-webhook-managed/test-support",
    "dep:awaken-store-inmem",
    "dep:awaken-resource-persistence",
    "dep:awaken-credential-vault",
    "awaken-resource-persistence/test-support",
    "awaken-deployment-application/test-support",
    "awaken-captured-content-store/test-support",
    "awaken-run-ingress-http/test-support",
    "awaken-resource-worker-http/test-support",
    "awaken-config-store/test-support",
    "awaken-credential-vault/test-support",
    "awaken-model-catalog/test-support",
    "awaken-session-store/test-support",
    "awaken-protocol-managed/test-support",
    "awaken-dream-application/test-support",
    "awaken-runtime-host/test-support",
    "awaken-worker-registry/test-support",
    "awaken-webhook/test-support",
]
# Cross-node dispatch wake over NATS (AWAKEN_DISPATCH_WAKE=nats). Passes through to
# awaken-runtime-host → awaken-run-ingress so the built binary carries a NATS-capable
# wake selector. This is the *wake* channel only and is independent of the crate's
# non-optional `async-nats` used for the ADR-0045 hand relay — do not conflate them.
nats = ["awaken-run-ingress/nats"]
# Container sandbox tiers (AWAKEN_SANDBOX_TIER=docker|podman|k8s). Each passes through
# to awaken-runtime-host → awaken-sandbox-container so the served binary can realize an
# ACP session inside a container/Pod instead of a bwrap namespace. Off by default: a
# build without them fails closed if AWAKEN_SANDBOX_TIER names a container backend.
container-docker = ["awaken-runtime-host/container-docker"]
container-podman = ["awaken-runtime-host/container-podman"]
container-k8s = ["awaken-runtime-host/container-k8s"]

[dev-dependencies]
awaken-service-lifecycle = { workspace = true, features = ["test-support"] }
awaken-control.workspace = true
awaken-executable-agent-catalog.workspace = true
awaken-credential-materializer = { workspace = true, features = ["authority", "brokered"] }
awaken-deployment-application = { workspace = true, features = ["test-support"] }
awaken-webhook = { workspace = true, features = ["test-support"] }
awaken-webhook-managed = { workspace = true, features = ["test-support"] }
awaken-worker-registry = { workspace = true, features = ["test-support"] }
awaken-captured-content-store = { workspace = true, features = ["test-support"] }
awaken-config-resolver = { workspace = true, features = ["test-support"] }
awaken-config-store = { workspace = true, features = ["test-support"] }
awaken-credential-vault = { workspace = true, features = ["test-support"] }
awaken-model-catalog = { workspace = true, features = ["test-support"] }
awaken-provider-genai.workspace = true
awaken-session-store = { workspace = true, features = ["test-support"] }
awaken-resource-store = { workspace = true, features = ["test-support"] }
awaken-scenario-host = { workspace = true }
awaken-run-ingress = { workspace = true }
awaken-store-inmem.workspace = true
http-body-util = "0.1"
awaken-agent-contract = { workspace = true }
awaken-ext-background-task.workspace = true
# Restart-persistence test: a management router rebuilt over the same tempdir.
tempfile = "3"
