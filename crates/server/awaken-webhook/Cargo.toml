[package]
name = "awaken-webhook"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The webhook wire event, signing, and JSON.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Standard Webhooks signing: HMAC-SHA256 over `{id}.{timestamp}.{payload}`,
# base64-encoded, so a stock `standardwebhooks` verifier (TS e2e) accepts it.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
# Delivery: HTTPS POST of the signed payload; async port + reqwest impl.
async-trait.workspace = true
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
# Durable subscription store over a versioned scoped-migration bundle (ADR-0043),
# same pattern as the managed session store.
rusqlite = { version = "0.32", features = ["bundled"] }
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9" }
awaken-scoped-migration-sqlite = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9" }

[dev-dependencies]
# e2e: a real axum receiver on an ephemeral port verifies the delivered signature.
axum = { version = "0.7", features = [] }
tempfile = "3"
hyper = "1"
