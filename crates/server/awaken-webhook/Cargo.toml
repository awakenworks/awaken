[package]
name = "awaken-webhook"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
layer = "infrastructure"
authority = "webhook"

[dependencies]
# The webhook wire event, signing, and JSON.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Standard Webhooks signing: HMAC-SHA256 over `{id}.{timestamp}.{payload}`,
# base64-encoded, so a stock `standardwebhooks` verifier (TS e2e) accepts it.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
# Generate a `whsec_` signing secret from OS entropy at subscription-create time.
getrandom = "0.2"
# Delivery: HTTPS POST of the signed payload; async port + reqwest impl.
async-trait.workspace = true
awaken-outbound-http.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

[dev-dependencies]
# e2e: a real axum receiver on an ephemeral port verifies the delivered signature.
axum = { version = "0.8", features = [] }

[features]
default = []
# Permissive loopback sender constructors exist only for real-HTTP integration
# tests. Product builds expose only `ReqwestSender::guarded`.
test-support = ["awaken-outbound-http/test-support"]

[[test]]
name = "webhook_e2e"
required-features = ["test-support"]
