[package]
name = "awaken-run-executor-acp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
awaken-runtime-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-provisioning-contract.workspace = true
awaken-agent-channel.workspace = true
awaken-protocol-acp.workspace = true
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "time", "process", "io-util"] }

[features]
# Speak the official agent-client-protocol JSON-RPC wire to a real CLI (the
# default): a projected-launch (`ProjectingChannelSource`) run selects it. Off
# reverts every wire to the newline stand-in (fixtures only).
default = ["real-acp"]
real-acp = ["awaken-protocol-acp/real-acp"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "time", "sync"] }
serde_json.workspace = true
# dev-only: the session-home reference impl's recovery tests use temp dirs.
tempfile = "3"
