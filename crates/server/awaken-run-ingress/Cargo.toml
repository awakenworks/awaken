[package]
name = "awaken-run-ingress"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "coordinator"
layer = "infrastructure"
authority = "run-ingress"

[dependencies]
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-run-ingress-contract = { workspace = true }
awaken-runtime = { workspace = true }
awaken-ext-builtin-tools = { workspace = true }
# W3C traceparent capture (submit) + `wake.dispatch` span (worker) so a durably
# dispatched run continues the admitting request's trace across the queue boundary.
awaken-observability = { workspace = true }
tracing = "0.1"
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
rusqlite = { workspace = true }
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
awaken-scoped-migration-sqlite.workspace = true
async-nats = { version = "0.38", optional = true }
futures-lite = { version = "2", optional = true }

[features]
# Private SQLite dispatch authority for unit/integration/scenario fixtures.
test-support = []
# Optional cross-node wake signal over NATS. Off by default — the default build
# and test suite stay free of the NATS driver; enable for a multi-node fleet.
nats = ["dep:async-nats", "dep:futures-lite"]

[dev-dependencies]
awaken-run-ingress-testkit = { workspace = true }
awaken-store-inmem.workspace = true
awaken-store-postgres = { workspace = true }
awaken-store-sqlite = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

[[test]]
name = "any_store"
required-features = ["test-support"]

[[test]]
name = "crash_before_settle"
required-features = ["test-support"]

[[test]]
name = "checkpoint_fence"
required-features = ["test-support"]

[[test]]
name = "dispatch_conformance"
required-features = ["test-support"]

[[test]]
name = "durable_memory"
required-features = ["test-support"]

[[test]]
name = "lease_semantics"
required-features = ["test-support"]

[[test]]
name = "pool_memory"
required-features = ["test-support"]

[[test]]
name = "resilience_and_metrics"
required-features = ["test-support"]

[[test]]
name = "sandbox_binding"
required-features = ["test-support"]

[[test]]
name = "service_memory"
required-features = ["test-support"]

[[test]]
name = "sqlite_dispatch"
required-features = ["test-support"]

[[test]]
name = "units"
required-features = ["test-support"]

[[test]]
name = "worker_edge_cases"
required-features = ["test-support"]

[[test]]
name = "worker_error_paths"
required-features = ["test-support"]

[lints]
workspace = true
