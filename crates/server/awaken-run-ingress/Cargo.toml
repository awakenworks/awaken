[package]
name = "awaken-run-ingress"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-run-ingress-contract = { workspace = true }
awaken-runtime = { workspace = true }
awaken-ext-builtin-tools = { workspace = true }
# W3C traceparent capture (submit) + `wake.dispatch` span (worker) so a durably
# dispatched run continues the admitting request's trace across the queue boundary.
awaken-observability = { workspace = true }
tracing = "0.1"
async-trait.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# The database-less worker's HTTP dispatch client (`HttpDispatchQueue`) posts
# claim/settle over the wire to a cell server's dispatch_transport_router.
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
rusqlite = { workspace = true }
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9", features = ["postgres"] }
awaken-scoped-migration-sqlite = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9" }
async-nats = { version = "0.38", optional = true }
futures-lite = { version = "2", optional = true }

[features]
# Optional cross-node wake signal over NATS. Off by default — the default build
# and test suite stay free of the NATS driver; enable for a multi-node fleet.
nats = ["dep:async-nats", "dep:futures-lite"]

[dev-dependencies]
awaken-store-postgres = { workspace = true }
awaken-store-sqlite = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
# dev-only: the transport_client e2e stands up a real axum server mirroring a cell
# server's dispatch_transport_router on an ephemeral port, so the `HttpDispatchQueue`
# client's claim/settle cross a real socket (no mock transport).
axum = { workspace = true }

[lints]
workspace = true
