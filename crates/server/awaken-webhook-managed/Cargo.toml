[package]
name = "awaken-webhook-managed"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "shared"
layer = "infrastructure"
authority = "webhook-managed"

[dependencies]
awaken-service-lifecycle.workspace = true
awaken-session-contract.workspace = true
awaken-tenancy.workspace = true
awaken-authz-enforce.workspace = true
awaken-webhook.workspace = true
awaken-config-resolver.workspace = true
awaken-credential-vault.workspace = true
awaken-agent-contract.workspace = true
async-trait.workspace = true
axum = { version = "0.8", features = [] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
awaken-config-resolver = { workspace = true, features = ["test-support"] }
awaken-credential-contract.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
default = []
test-support = ["awaken-webhook/test-support"]

[[test]]
name = "crud"
required-features = ["test-support"]

[lints]
workspace = true
