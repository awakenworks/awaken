[package]
name = "awaken-webhook-managed"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The bridge between the managed session lifecycle (protocol-managed's
# SessionLifecycleSink port) and the neutral webhook dispatcher — plus the
# subscription CRUD surface and the guard→WorkspaceScope mapping. All open
# crates (no admin-config-api / iam-server), so the standalone can use it too.
awaken-protocol-managed = { workspace = true }
awaken-authz-enforce = { workspace = true }
awaken-webhook = { workspace = true }
# Subscriptions are a config resource: the read-side WebhookStore port + the
# secret-free WebhookEndpointDef, and the vault SecretStore/SecretRef the whsec_
# key is sealed behind (RedactedString at the seam). All open, port-only — the
# durable admin backend is injected by the assembly, never named here.
awaken-config-resolver = { workspace = true }
awaken-credential-vault = { workspace = true }
awaken-agent-contract = { workspace = true }
async-trait.workspace = true
axum = { version = "0.8", features = [] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
