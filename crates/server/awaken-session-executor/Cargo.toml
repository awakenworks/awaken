[package]
name = "awaken-session-executor"
description = "Authority-free shared execution host infrastructure for Awaken Runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "shared"
product = "platform"
bounded_context = "session"
layer = "infrastructure"
authority = "runtime-host"

[dependencies]
# The backend-erased container environment ports the Session owner holds.
awaken-container-contract.workspace = true
# The auxiliary-run sandbox ports the process composition injects.
awaken-session-environment-contract.workspace = true
# The neutral Agent channel the Session environment launches Agents over.
awaken-agent-channel.workspace = true
# The neutral session substrate (SharedHost) and the two port adapters
# (ManagedHost / RunApplicationHost) live here; the assembly bin mounts them.
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-authority-clock.workspace = true
awaken-session-application-contract.workspace = true
awaken-session-configuration-contract.workspace = true
awaken-session-error-contract.workspace = true
awaken-session-realization-contract.workspace = true
awaken-session-execution-contract.workspace = true
awaken-session-state-contract.workspace = true
awaken-session-budget-contract.workspace = true
awaken-session-event-contract.workspace = true
awaken-session-mcp-contract.workspace = true
awaken-session-resource-contract.workspace = true
awaken-session-types.workspace = true
awaken-session-work-contract.workspace = true
awaken-environment-contract.workspace = true
# The topology-neutral Session realization and terminal-cleanup drivers over
# contract ports; the Session application and this Host's Workers both call them.
awaken-session-realization-driver.workspace = true
awaken-resource-contract.workspace = true
awaken-runtime = { workspace = true }
# Volatile commit/checkpoint reference adapters are available only to explicit
# test/scenario deployments. Product builds do not link this backend.
awaken-store-inmem = { workspace = true, optional = true }
awaken-observability = { workspace = true }
awaken-ext-builtin-tools = { workspace = true }
awaken-ext-memory = { workspace = true }
awaken-ext-compact = { workspace = true }
awaken-ext-permission = { workspace = true }
awaken-ext-skills = { workspace = true }
awaken-ext-mcp = { workspace = true }
awaken-mcp-wire.workspace = true
awaken-ext-goal = { workspace = true }
awaken-ext-state-machine = { workspace = true, features = ["schema"] }
awaken-ext-background-task.workspace = true
awaken-sandbox-control.workspace = true
# The neutral sandbox vocabulary the sandboxed ACP channel source speaks
# (SandboxSpec/Command/NetworkPolicy) when realizing the namespace tier.
awaken-provisioning-contract = { workspace = true }
awaken-tenancy = { workspace = true }
awaken-dispatch-contract.workspace = true
awaken-run-ingress-application-contract.workspace = true
awaken-dispatch-erasure.workspace = true
awaken-dispatch-execution.workspace = true
awaken-acp-contract = { workspace = true }
awaken-credential-contract.workspace = true
awaken-credential.workspace = true
awaken-credential-materializer = { workspace = true }
async-trait.workspace = true
awaken-time.workspace = true
awaken-lease-contract.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync"] }
axum = { version = "0.8", features = ["multipart"] }
# Runtime MCP relay transport; exact OAuth refresh remains in credential
# materialization and is injected through CredentialRefreshFactory.
awaken-outbound-http = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
# Content SHA-256 for the memory_stores memories/versions API (`content_sha256`).
sha2 = "0.10"
schemars = "1"
# Host Run span (`#[instrument]`) exported through the global subscriber the service
# binary installs; this crate emits spans, never wires an exporter.
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
url.workspace = true
[features]
# The reusable Host is authority-free by default. Coordinator injects the
# RuntimeAuthority value directly; there is no feature-selected compatibility
# assembly that can acquire a Store implicitly.
default = []
# Post-construction persistence overrides are restricted to tests. Product
# startup selects every authority before constructing SharedHost.
test-support = [
    "dep:awaken-store-inmem",
]
# Live-backend tests only. The container tiers themselves are assembled by
# `awaken-execution-composition`; these features enable a real backend in the
# test-only container dependency for the Host tests that drive one.
k8s-tests = ["awaken-sandbox-container/k8s"]

[dev-dependencies]
awaken-run-executor-acp = { workspace = true }
awaken-worker-registry = { workspace = true, features = ["test-support"] }
awaken-reliability-testkit.workspace = true
# Test doubles decode real container handles through the container provider's
# codec; the live-backend tests build a real provider.
awaken-sandbox-container.workspace = true
# `AcpCapabilityHandshake::negotiate` takes `&mut dyn AgentChannel`, which the
# ACP contract re-uses but does not re-export, so a test handshake has to name
# the trait itself. Dev-only: production code only ever consumes the port.
awaken-provisioning-contract = { workspace = true, features = ["test-support"] }
awaken-service-lifecycle.workspace = true
awaken-sandbox-local = { workspace = true, features = ["test-support"] }
# The sandbox-backed Session environment the process composition installs;
# this crate's own tests realize environments through it.
awaken-session-environment = { workspace = true, features = ["test-support"] }
awaken-resource-application.workspace = true
awaken-credential-vault = { workspace = true, features = ["test-support"] }
awaken-file-store = { workspace = true, features = ["test-support"] }
awaken-memory-store = { workspace = true, features = ["sqlite", "test-support"] }
awaken-dispatch = { workspace = true, features = ["test-support"] }
awaken-session-store = { workspace = true, features = ["test-support"] }
awaken-skill-store = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
awaken-resource-store = { workspace = true, features = ["sqlite", "test-support"] }
awaken-dispatch-testkit = { workspace = true }
# The durable session-store round-trip test opens a real sessions.db under a temp dir.
# Test fixtures cut an exact physical Environment root by inode.
awaken-sandbox-fs = { workspace = true }
tempfile = "3"
# The sandboxed-channel-source integration test observes what the bwrap-confined
# agent said through the in-memory commit boundary.
awaken-store-inmem = { workspace = true }
awaken-store-sqlite.workspace = true
awaken-credential-materializer = { workspace = true, features = ["authority"] }
awaken-lease-testkit.workspace = true
# Drives Worker transport routers in-process through `ServiceExt::oneshot`.
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
