[package]
name = "awaken-executable-environment-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
package-class = "application-adapter"
authority = "coordinator"

[dependencies]
awaken-executable-environment-contract.workspace = true
awaken-durable-projection.workspace = true
awaken-environment-contract.workspace = true
awaken-scoped-migration = { workspace = true, features = ["postgres"] }
awaken-service-auth-contract.workspace = true
async-trait.workspace = true
axum.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
awaken-provisioning-contract.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
