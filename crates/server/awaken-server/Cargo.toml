[package]
name = "awaken-server"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "awaken-server"
path = "src/main.rs"

[dependencies]
awaken-protocol-managed = { path = "../awaken-protocol-managed" }
awaken-protocol-ai-sdk = { path = "../awaken-protocol-ai-sdk" }
awaken-protocol-ag-ui = { path = "../awaken-protocol-ag-ui" }
awaken-sandbox-local = { path = "../../worker/awaken-sandbox-local" }
awaken-ext-goal = { path = "../../runtime/awaken-ext-goal" }
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-runtime = { path = "../../runtime/awaken-runtime" }
awaken-ext-builtin-tools = { path = "../../runtime/awaken-ext-builtin-tools" }
awaken-ext-permission = { path = "../../runtime/awaken-ext-permission" }
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
axum = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
