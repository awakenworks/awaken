[package]
name = "awaken-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "awaken-server"
path = "src/main.rs"

[dependencies]
awaken-protocol-managed = { path = "../awaken-protocol-managed" }
awaken-protocol-ai-sdk = { path = "../awaken-protocol-ai-sdk" }
awaken-protocol-ag-ui = { path = "../awaken-protocol-ag-ui" }
awaken-protocol-a2a = { path = "../awaken-protocol-a2a" }
awaken-sandbox-local = { path = "../../worker/awaken-sandbox-local" }
awaken-store-sqlite = { path = "../../stores/awaken-store-sqlite" }
awaken-ext-goal = { path = "../../runtime/awaken-ext-goal" }
awaken-ext-state-machine = { path = "../../runtime/awaken-ext-state-machine", features = ["schema"] }
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-runtime = { path = "../../runtime/awaken-runtime" }
awaken-ext-builtin-tools = { path = "../../runtime/awaken-ext-builtin-tools" }
awaken-ext-permission = { path = "../../runtime/awaken-ext-permission" }
awaken-ext-skills = { path = "../../runtime/awaken-ext-skills" }
async-trait.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
axum = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Real-model integration test only (gated, `--ignored`): drive an adapter over a
# live Anthropic-compatible endpoint through the genai provider.
awaken-provider-genai = { path = "../../runtime/awaken-provider-genai" }
awaken-agent-contract = { path = "../../contract/awaken-agent-contract" }
