[package]
name = "awaken-acp-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "shared"
product = "platform"
bounded_context = "execution"
layer = "infrastructure"
authority = "acp-catalog"
# Coordinator and Control read the catalog and erase session blobs without
# linking the ACP executor that launches these adapters.
separation = "coordinator-side"

[dependencies]
awaken-acp-contract.workspace = true
awaken-agent-contract.workspace = true
awaken-credential-contract.workspace = true
awaken-data-governance-contract.workspace = true
awaken-runtime-contract.workspace = true
async-trait.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
tempfile = "3"

[lints]
workspace = true
