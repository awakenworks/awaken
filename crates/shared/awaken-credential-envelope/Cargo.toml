[package]
name = "awaken-credential-envelope"
description = "Self-hosted recipient-key transport for the Credential envelope Control issues and the Worker resolves"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.awaken]
context = "shared"
product = "platform"
bounded_context = "credentials"
layer = "infrastructure"
authority = "credential-envelope"
separation = "isolation"
isolates = ["chacha20poly1305"]

[dependencies]
awaken-agent-contract.workspace = true
awaken-credential-contract.workspace = true
awaken-time.workspace = true
async-trait.workspace = true
base64 = "0.22"
chacha20poly1305 = "0.10"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
