[package]
name = "awaken-standalone"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "awaken-standalone"
path = "src/main.rs"

[dependencies]
# The open single-machine assembly: it composes ONLY open crates — no
# admin-config-api write plane, no iam-server, no distributed store. The zero-BuSL
# invariant is asserted in CI (check_crate_boundaries.py, license tier).
awaken-runtime-host.workspace = true
# Cross-cutting telemetry (open-tier, zero-BuSL leaf): tracing subscriber + OTLP /
# AWAKEN_TRACE_FILE span export + W3C traceparent propagator + ingress middleware.
awaken-observability.workspace = true
awaken-protocol-managed.workspace = true
# The sibling protocol adapters over the same host — the standalone serves the
# whole open protocol surface (Managed + AI SDK + AG-UI + A2A), all behind the guard.
awaken-protocol-ai-sdk.workspace = true
awaken-protocol-ag-ui.workspace = true
awaken-protocol-a2a.workspace = true
awaken-protocol-transport.workspace = true
awaken-authz-enforce.workspace = true
awaken-config-resolver.workspace = true
awaken-runtime-contract.workspace = true
axum = "0.7"
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
