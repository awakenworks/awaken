[package]
name = "awaken-server-local"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "awaken-server-local"
path = "src/main.rs"

[dependencies]
awaken-protocol-managed = { workspace = true }
awaken-protocol-ai-sdk = { workspace = true }
awaken-protocol-ag-ui = { workspace = true }
awaken-protocol-a2a = { workspace = true }
awaken-protocol-transport = { workspace = true }
awaken-sandbox-local = { workspace = true }
awaken-store-sqlite = { workspace = true }
awaken-store-fs = { workspace = true }
awaken-config-store = { workspace = true }
awaken-run-ingress = { workspace = true }
# Management plane (ADR-0043): the composition root resolves a run's inference
# (adapter_kind + base_url + already-resolved credential) and builds the host's
# model executor from it — the runtime never sees the credential binding (D6/D9).
awaken-config-resolver = { workspace = true }
awaken-provider-genai = { workspace = true }
# The management-plane HTTP surfaces this binary mounts: admin config CRUD and the
# Managed vault/credential front door, over shared in-memory stores.
awaken-admin-config-api = { workspace = true }
awaken-model-catalog = { workspace = true }
# `oauth-command`: refresh a Google OAuth2 token (gcloud) for the `real-gemini` mode.
awaken-credential-vault = { workspace = true, features = ["oauth-command"] }
awaken-ext-goal = { workspace = true }
awaken-ext-state-machine = { workspace = true, features = ["schema"] }
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-runtime = { workspace = true }
awaken-ext-builtin-tools = { workspace = true }
awaken-ext-memory = { workspace = true }
awaken-ext-compact = { workspace = true }
awaken-ext-permission = { workspace = true }
awaken-ext-skills = { workspace = true }
# MCP client (ADR-0043 Phase 3): a managed session's configured MCP servers are
# connected per thread and their tools registered on the runtime.
awaken-ext-mcp = { workspace = true }
async-trait.workspace = true
# OAuth refresh-token exchange (ADR-0043): `VaultRefresher` POSTs the RFC 6749
# refresh grant to the credential's token endpoint. Same client + feature set as
# awaken-ext-mcp's own transport, so no second HTTP stack enters the tree.
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
axum = "0.7"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
awaken-agent-contract = { workspace = true }
