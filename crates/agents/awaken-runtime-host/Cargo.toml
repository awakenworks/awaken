[package]
name = "awaken-runtime-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The neutral session substrate (SharedHost) and the two port adapters
# (ManagedHost / ProtocolHost) live here; the assembly bin mounts them.
awaken-agent-contract.workspace = true
awaken-runtime-contract.workspace = true
awaken-runtime = { workspace = true }
awaken-ext-builtin-tools = { workspace = true }
awaken-ext-memory = { workspace = true }
awaken-ext-compact = { workspace = true }
awaken-ext-permission = { workspace = true }
awaken-ext-skills = { workspace = true }
awaken-ext-mcp = { workspace = true }
awaken-ext-goal = { workspace = true }
awaken-ext-state-machine = { workspace = true, features = ["schema"] }
# Durable memory persistence (resources plane): backs the ADR-0038 memory_store
# family so a harvested write-back survives a process restart.
awaken-memory-store = { workspace = true }
# Durable skill catalog (resources plane): backs the delivered-skill source so a
# skill added via /v1/skills survives a restart; awaken-ext-skills stays store-unaware.
awaken-skill-store = { workspace = true }
awaken-sandbox-local = { workspace = true }
# The neutral sandbox vocabulary the sandboxed ACP channel source speaks
# (SandboxSpec/Command/NetworkPolicy) when realizing the namespace tier.
awaken-provisioning-contract = { workspace = true }
awaken-store-sqlite = { workspace = true }
awaken-store-fs = { workspace = true }
awaken-config-store = { workspace = true }
awaken-run-ingress = { workspace = true }
awaken-run-executor-acp = { workspace = true }
awaken-config-resolver = { workspace = true }
awaken-credential-vault = { workspace = true }
awaken-protocol-managed = { workspace = true }
awaken-protocol-transport = { workspace = true }
awaken-protocol-a2a = { workspace = true }
async-trait.workspace = true
serde_json.workspace = true
# Durable Managed-session repository (sessions.db) — the open home for
# the sqlite + postgres ManagedSessionRepository backends, moved here so any bin
# (standalone/enterprise) gets restart-surviving sessions without the BuSL
# authoring plane. Both back the same `managed` scoped-migration bundle.
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9", features = ["postgres"] }
awaken-scoped-migration-sqlite = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9" }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
axum = { version = "0.7", features = ["multipart"] }
# OAuth refresh-token exchange (ADR-0043): `VaultRefresher` POSTs the RFC 6749
# refresh grant to the credential's token endpoint.
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
form_urlencoded = "1"
# Content SHA-256 for the memory_stores memories/versions API (`content_sha256`).
sha2 = "0.10"
# Text-level PII scrubbing for the content-capture redactor (ADR-0050 D6).
regex = "1"
# Host turn span (`#[instrument]`) exported through the global subscriber the service
# binary installs; this crate emits spans, never wires an exporter.
tracing = "0.1"

[dev-dependencies]
# The durable session-store round-trip test opens a real sessions.db under a temp dir.
tempfile = "3"
# The sandboxed-channel-source integration test observes what the bwrap-confined
# agent said through the in-memory commit boundary.
awaken-store-inmem = { workspace = true }
