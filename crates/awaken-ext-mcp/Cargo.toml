[package]
name = "awaken-ext-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Model Context Protocol (MCP) client extension for Awaken"

[dependencies]
awaken-runtime-contract.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "rt", "macros", "time", "process"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
mcp = { package = "model-context-protocol", version = "0.2", default-features = false, features = ["client"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }

[lints]
workspace = true
