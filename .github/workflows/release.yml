# The sole tag-driven Awaken product release. Binary archives, the Management
# image, and the Sandbox image remain separate artifacts under one release
# identity instead of competing tag workflows.
name: release-awaken

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-awaken-${{ github.ref }}
  cancel-in-progress: false

env:
  MANAGEMENT_IMAGE_REPOSITORY: ghcr.io/awakenworks/awaken
  IMAGE_REPOSITORY: ghcr.io/awakenworks/awaken-sandbox
  SOURCE_REPOSITORY: https://github.com/awakenworks/awaken
  PREDICATE_TYPE: https://awakenworks.com/attestations/awaken-sandbox-image-provenance/v1
  SIGSTORE_OIDC_ISSUER: https://token.actions.githubusercontent.com
  WORKFLOW_PATH: .github/workflows/release.yml
  CONTAINER_ENGINE: docker

jobs:
  quality:
    if: github.repository == 'awakenworks/awaken' && github.ref_protected == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the exact protected tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install release-gate dependencies
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix e2e
      - name: Verify source, documentation, Rust, and Console release gates
        run: |
          scripts/ci/check-all.sh --group static
          scripts/ci/check-all.sh --group docs
          scripts/ci/check-rust.sh --full
          scripts/ci/check-all.sh --group frontend

  binary_packages:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out the exact protected tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Console dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the canonical archive
        shell: bash
        run: python3 scripts/release/package.py --target "${{ matrix.target }}"
      - name: Upload the archive and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: awaken-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sandbox_image:
    needs: quality
    if: github.repository == 'awakenworks/awaken' && github.ref_protected == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image: ${{ steps.provenance.outputs.image }}
      provenance_sha256: ${{ steps.provenance.outputs.sha256 }}
      revision: ${{ steps.source.outputs.revision }}

    steps:
      - name: Check out the exact protected tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate the release source and Open-owned contracts
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_PROTECTED" = "true"
          SOURCE_REVISION="$(git rev-parse "$GITHUB_SHA^{commit}")"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          python3 scripts/release/awaken_sandbox_image_provenance.py self-test
          python3 scripts/ci/check_sandbox_image_release.py --self-test
          python3 scripts/ci/check_sandbox_image_release.py
          python3 scripts/release/awaken_sandbox_image_provenance.py validate-context \
            --revision "$SOURCE_REVISION" \
            --source-ref "$GITHUB_REF" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
          RELEASE_TAG="${IMAGE_REPOSITORY}:${GITHUB_REF_NAME}"
          printf 'revision=%s\n' "$SOURCE_REVISION" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Install the pinned Cosign release
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.0.6

      - name: Reuse a proven release or prove staging before promotion
        id: provenance
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          CERTIFICATE_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/${WORKFLOW_PATH}@${GITHUB_REF}"
          STAGING_TAG="${IMAGE_REPOSITORY}:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VERIFY_IDENTITY_ARGS=(
            --certificate-identity "$CERTIFICATE_IDENTITY"
            --certificate-oidc-issuer "$SIGSTORE_OIDC_ISSUER"
            --certificate-github-workflow-repository "$GITHUB_REPOSITORY"
            --certificate-github-workflow-ref "$GITHUB_REF"
            --certificate-github-workflow-sha "$SOURCE_REVISION"
            --certificate-github-workflow-trigger push
          )

          query_release_signature() {
            local image=$1 prefix=$2 download_exit=0
            local raw="$RUNNER_TEMP/${prefix}-signatures.raw.jsonl"
            local verified="$RUNNER_TEMP/${prefix}-signatures.verified.json"
            local download_error="$RUNNER_TEMP/${prefix}-signatures.stderr"
            if cosign download signature "$image" > "$raw" 2> "$download_error"; then
              cosign verify \
                "${VERIFY_IDENTITY_ARGS[@]}" \
                --output json \
                "$image" > "$verified"
            else
              download_exit=$?
              : > "$verified"
            fi
            SIGNATURE_STATE="$(python3 scripts/release/awaken_sandbox_image_provenance.py \
              publisher-signature-state \
              --image "$image" \
              --download-exit-code "$download_exit" \
              --signatures "$raw" \
              --verified-signatures "$verified" \
              --download-error "$download_error")"
          }

          download_release_attestations() {
            local image=$1 output=$2 download_error="${2}.stderr"
            if ! cosign download attestation \
                --predicate-type "$PREDICATE_TYPE" \
                "$image" > "$output" 2> "$download_error"; then
              if [[ ! -s "$output" ]] && grep -Fqi 'no attestations' "$download_error"; then
                : > "$output"
              else
                cat "$download_error" >&2
                return 1
              fi
            fi
          }

          verify_release_proof() {
            local image=$1 raw_attestations=$2 prefix=$3 raw_sha256 verified_sha256
            test -s "$raw_attestations"
            cosign verify-attestation \
              --type "$PREDICATE_TYPE" \
              "${VERIFY_IDENTITY_ARGS[@]}" \
              --output json \
              "$image" > "$RUNNER_TEMP/${prefix}-verified-attestations.json"
            verified_sha256="$(python3 scripts/release/awaken_sandbox_image_provenance.py \
              validate-attestations \
              --image "$image" \
              --revision "$SOURCE_REVISION" \
              --source-ref "$GITHUB_REF" \
              --attestations "$RUNNER_TEMP/${prefix}-verified-attestations.json" \
              --output "$RUNNER_TEMP/${prefix}-verified-awaken-sandbox-image-provenance.json")"
            raw_sha256="$(python3 scripts/release/awaken_sandbox_image_provenance.py \
              validate-attestations \
              --image "$image" \
              --revision "$SOURCE_REVISION" \
              --source-ref "$GITHUB_REF" \
              --attestations "$raw_attestations" \
              --output "$RUNNER_TEMP/${prefix}-raw-awaken-sandbox-image-provenance.json")"
            test "$raw_sha256" = "$verified_sha256"
            cmp "$RUNNER_TEMP/${prefix}-raw-awaken-sandbox-image-provenance.json" \
              "$RUNNER_TEMP/${prefix}-verified-awaken-sandbox-image-provenance.json"
            cp "$RUNNER_TEMP/${prefix}-verified-awaken-sandbox-image-provenance.json" \
              "$RUNNER_TEMP/awaken-sandbox-image-provenance.json"
            PROVENANCE_SHA256=$verified_sha256
          }

          initial="$(scripts/release/resolve_awaken_sandbox_release_image.sh \
            "$RELEASE_TAG" \
            "$SOURCE_REVISION" \
            "$GITHUB_REF" \
            "$RUNNER_TEMP/initial-awaken-sandbox-release")"
          case "$initial" in
            absent) ;;
            "present ${IMAGE_REPOSITORY}@sha256:"*)
              IMAGE="${initial#present }"
              query_release_signature "$IMAGE" existing
              test "$SIGNATURE_STATE" = reuse
              download_release_attestations "$IMAGE" \
                "$RUNNER_TEMP/existing-awaken-sandbox-image-attestations.raw.json"
              verify_release_proof "$IMAGE" \
                "$RUNNER_TEMP/existing-awaken-sandbox-image-attestations.raw.json" \
                existing
              printf 'mode=reuse\n' >> "$GITHUB_OUTPUT"
              printf 'image=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"
              printf 'sha256=%s\n' "$PROVENANCE_SHA256" >> "$GITHUB_OUTPUT"
              final_existing="$(scripts/release/resolve_awaken_sandbox_release_image.sh \
                "$RELEASE_TAG" \
                "$SOURCE_REVISION" \
                "$GITHUB_REF" \
                "$RUNNER_TEMP/final-existing-awaken-sandbox-release")"
              test "$final_existing" = "present $IMAGE"
              exit 0
              ;;
            *) echo "unexpected Awaken Sandbox release resolution: $initial" >&2; exit 1 ;;
          esac

          AWAKEN_SANDBOX_IMAGE_SOURCE="$SOURCE_REPOSITORY" \
          AWAKEN_SANDBOX_IMAGE_REVISION="$SOURCE_REVISION" \
          AWAKEN_SANDBOX_IMAGE_VERSION="$GITHUB_REF_NAME" \
            deploy/images/sandbox/build.sh "$STAGING_TAG"
          docker push "$STAGING_TAG"
          staging="$(scripts/release/resolve_awaken_sandbox_release_image.sh \
            "$STAGING_TAG" \
            "$SOURCE_REVISION" \
            "$GITHUB_REF" \
            "$RUNNER_TEMP/staging-awaken-sandbox-release")"
          case "$staging" in
            "present ${IMAGE_REPOSITORY}@sha256:"*) IMAGE="${staging#present }" ;;
            *) echo "staging tag did not resolve to exact published bytes" >&2; exit 1 ;;
          esac
          query_release_signature "$IMAGE" staging-initial
          download_release_attestations "$IMAGE" \
            "$RUNNER_TEMP/staging-awaken-sandbox-image-attestations.raw.json"

          if [[ -s "$RUNNER_TEMP/staging-awaken-sandbox-image-attestations.raw.json" ]]; then
            test "$SIGNATURE_STATE" = reuse
            verify_release_proof "$IMAGE" \
              "$RUNNER_TEMP/staging-awaken-sandbox-image-attestations.raw.json" \
              staging-reuse
          else
            EMITTED_PROVENANCE_SHA256="$(python3 scripts/release/awaken_sandbox_image_provenance.py emit \
              --image "$IMAGE" \
              --revision "$SOURCE_REVISION" \
              --source-ref "$GITHUB_REF" \
              --workflow-ref "$GITHUB_WORKFLOW_REF" \
              --run-id "$GITHUB_RUN_ID" \
              --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --output "$RUNNER_TEMP/emitted-awaken-sandbox-image-provenance.json")"
            case "$SIGNATURE_STATE" in
              absent)
                cosign sign --yes "$IMAGE"
                query_release_signature "$IMAGE" staging-after-sign
                test "$SIGNATURE_STATE" = reuse
                ;;
              reuse) ;;
              *) echo "unexpected image-signature state: $SIGNATURE_STATE" >&2; exit 1 ;;
            esac
            cosign attest --yes \
              --type "$PREDICATE_TYPE" \
              --predicate "$RUNNER_TEMP/emitted-awaken-sandbox-image-provenance.json" \
              "$IMAGE"
            download_release_attestations "$IMAGE" \
              "$RUNNER_TEMP/staging-awaken-sandbox-image-attestations.raw.json"
            verify_release_proof "$IMAGE" \
              "$RUNNER_TEMP/staging-awaken-sandbox-image-attestations.raw.json" \
              staging-new
            test "$EMITTED_PROVENANCE_SHA256" = "$PROVENANCE_SHA256"
            cmp "$RUNNER_TEMP/emitted-awaken-sandbox-image-provenance.json" \
              "$RUNNER_TEMP/awaken-sandbox-image-provenance.json"
          fi

          before="$(scripts/release/resolve_awaken_sandbox_release_image.sh \
            "$RELEASE_TAG" \
            "$SOURCE_REVISION" \
            "$GITHUB_REF" \
            "$RUNNER_TEMP/before-awaken-sandbox-promotion")"
          case "$before" in
            absent)
              docker buildx imagetools create \
                --prefer-index=false \
                --tag "$RELEASE_TAG" \
                --metadata-file "$RUNNER_TEMP/awaken-sandbox-promotion-metadata.json" \
                "$IMAGE"
              python3 scripts/release/awaken_sandbox_image_provenance.py \
                validate-promotion \
                --metadata "$RUNNER_TEMP/awaken-sandbox-promotion-metadata.json" \
                --image "$IMAGE"
              ;;
            "present $IMAGE") ;;
            *) echo "release tag changed before promotion: $before" >&2; exit 1 ;;
          esac
          after="$(scripts/release/resolve_awaken_sandbox_release_image.sh \
            "$RELEASE_TAG" \
            "$SOURCE_REVISION" \
            "$GITHUB_REF" \
            "$RUNNER_TEMP/after-awaken-sandbox-promotion")"
          test "$after" = "present $IMAGE"
          printf 'mode=publish\n' >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$PROVENANCE_SHA256" >> "$GITHUB_OUTPUT"

  management_image:
    needs: binary_packages
    if: github.repository == 'awakenworks/awaken' && github.ref_protected == true
    runs-on: ubuntu-22.04
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the exact protected tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download the proven Linux package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: awaken-x86_64-unknown-linux-gnu
          path: dist
      - name: Stage the exact packaged binary
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          checksums=(awaken-v*-x86_64-unknown-linux-gnu.tar.gz.sha256)
          test "${#checksums[@]}" -eq 1
          sha256sum -c "${checksums[0]}"
          archive="${checksums[0]%.sha256}"
          tar -xzf "$archive"
          package_root="${archive%.tar.gz}"
          cp "$package_root/awaken" ../deploy/images/management/.awaken-management.bin
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Install the pinned Cosign release
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.0.6
      - name: Build, verify, and publish the Management image
        id: management
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REVISION="$(git rev-parse "$GITHUB_SHA^{commit}")"
          RELEASE_TAG="${MANAGEMENT_IMAGE_REPOSITORY}:${GITHUB_REF_NAME}"
          STAGING_TAG="${MANAGEMENT_IMAGE_REPOSITORY}:staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CERTIFICATE_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/${WORKFLOW_PATH}@${GITHUB_REF}"

          inspect_error="$RUNNER_TEMP/awaken-management-inspect.stderr"
          if inspect_output="$(docker buildx imagetools inspect "$RELEASE_TAG" 2>"$inspect_error")"; then
            digest="$(printf '%s\n' "$inspect_output" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
            test -n "$digest"
            image="${MANAGEMENT_IMAGE_REPOSITORY}@${digest}"
            cosign verify \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer "$SIGSTORE_OIDC_ISSUER" \
              "$image" > "$RUNNER_TEMP/awaken-management-signature.json"
            docker pull "$image"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image")" = "$SOURCE_REPOSITORY"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$SOURCE_REVISION"
            test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")" = "$GITHUB_REF_NAME"
            container="$(docker create "$image")"
            trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
            docker cp "$container:/usr/local/bin/awaken" "$RUNNER_TEMP/awaken-from-management-image"
            cmp deploy/images/management/.awaken-management.bin "$RUNNER_TEMP/awaken-from-management-image"
            docker rm "$container"
            trap - EXIT
            AWAKEN_MANAGEMENT_IMAGE="$image" scripts/e2e/management_image_e2e.sh
          else
            if ! grep -Eqi 'manifest unknown|name unknown|not found' "$inspect_error"; then
              cat "$inspect_error" >&2
              exit 1
            fi
            docker build \
              --build-arg BIN=.awaken-management.bin \
              --build-arg SOURCE_REPOSITORY="$SOURCE_REPOSITORY" \
              --build-arg SOURCE_REVISION="$SOURCE_REVISION" \
              --build-arg VERSION="$GITHUB_REF_NAME" \
              --tag "$STAGING_TAG" \
              --file deploy/images/management/Dockerfile \
              deploy/images/management
            AWAKEN_MANAGEMENT_IMAGE="$STAGING_TAG" scripts/e2e/management_image_e2e.sh
            push_output="$(docker push "$STAGING_TAG")"
            printf '%s\n' "$push_output"
            digest="$(printf '%s\n' "$push_output" | sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' | tail -n 1)"
            test -n "$digest"
            image="${MANAGEMENT_IMAGE_REPOSITORY}@${digest}"
            cosign sign --yes "$image"
            docker buildx imagetools create --prefer-index=false --tag "$RELEASE_TAG" "$image"
          fi
          final="$(docker buildx imagetools inspect "$RELEASE_TAG" \
            | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          test "$final" = "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the Management image
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ env.MANAGEMENT_IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.management.outputs.digest }}
          push-to-registry: true

  github_release:
    needs: [binary_packages, sandbox_image, management_image]
    if: github.repository == 'awakenworks/awaken' && github.ref_protected == true
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the exact protected tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download every platform archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: awaken-*
          merge-multiple: true
      - name: Attest the release archives
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*
      - name: Create or repair the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
          fi
