# The sole branch/PR quality workflow. Full-gate composition stays in
# check-all.sh; the portability matrix delegates its focused composition to one
# cross-platform script and supplies the operating systems it must prove.
name: awaken-full-quality

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  # The full Kani tier includes the harnesses tagged `tier=nightly`, which a
  # pull request's pr tier leaves out; the nightly run of the full gate below
  # is the scheduled full formal run.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      sdk_qualification:
        description: Explicit SDK package, archive consumer or pre-release source SemVer qualification
        type: choice
        default: none
        options: [none, package, artifact, semver]
      build_benchmark:
        description: Measure representative cold and warm Cargo builds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: awaken-full-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency_fetch:
    # A warm Cargo cache can hide an unpublished locked Git commit. This small
    # tier deliberately restores no cache and blocks expensive qualification.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out the exact candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Begin build observations
        run: python3 scripts/ci/ci_performance.py begin --label dependency_fetch --github
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
      - name: Verify dependency policy and failure cases
        shell: bash
        run: |
          python scripts/ci/check_dependency_sources.py --self-test
          python scripts/ci/check_dependency_sources.py
          python scripts/ci/check_trust_roots.py --self-test
          python scripts/ci/check_trust_roots.py
          python scripts/ci/check_dependency_fetch.py --self-test
          python scripts/ci/install_receive_hooks.py --self-test
      - name: Fetch public locked dependencies with empty Git and Cargo caches
        shell: bash
        run: python scripts/ci/check_dependency_fetch.py --output target/test-timings/dependency-fetch
      - name: Finish build observations
        if: always() && env.AWAKEN_BUILD_RUN_ID != ''
        run: python3 scripts/ci/ci_performance.py finish --conclusion "${{ job.status }}"
      - name: Summarize build observations
        if: always() && env.AWAKEN_BUILD_RUN_ID != ''
        run: python3 scripts/ci/ci_performance.py report --output target/test-timings/performance.json
      - name: Retain cold dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependencies-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.runner }}
          path: target/test-timings/
          if-no-files-found: error

  trusted_host_portability:
    needs: dependency_fetch
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out the exact candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Begin build observations
        run: python3 scripts/ci/ci_performance.py begin --label trusted_host_portability --github
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        id: rust_cache
        with:
          key: trusted-host-${{ runner.os }}
          cache-workspace-crates: false
      - name: Observe restored Cargo footprint
        shell: bash
        run: python3 scripts/ci/ci_performance.py cache --hit "${{ steps.rust_cache.outputs.cache-hit || 'unknown' }}" --output target/test-timings/cache-trusted-host.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.6.0
      - name: Install the existing ACP E2E dependencies
        run: npm ci --prefix e2e
      - name: Verify TrustedHost filesystem and native Sandbox contracts
        # Linux must run the real scoped/Session gates; other matrix platforms
        # keep their native portability gates without requesting Linux support.
        shell: bash
        run: scripts/ci/check-trusted-host-portability.sh ${{ runner.os == 'Linux' && '--linux-supervision' || '' }}
      - name: Verify the independent SDK consumer on the native platform
        shell: bash
        run: python3 scripts/ci/check_sdk_consumer.py
      # Same exact candidate SHA must exercise the Session/MCP crash matrix on
      # native Linux/macOS before merge, independently of tag publication.
      - name: Verify native Session observations and MCP recovery
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/ci/check-reliability.sh --session-observations
      - name: Retain native Session validation evidence
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: session-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.runner }}
          path: target/test-timings/session-observations-*/
          if-no-files-found: error
      - name: Finish build observations
        if: always() && env.AWAKEN_BUILD_RUN_ID != ''
        run: python3 scripts/ci/ci_performance.py finish --conclusion "${{ job.status }}"
      - name: Summarize build observations
        if: always() && env.AWAKEN_BUILD_RUN_ID != ''
        run: python3 scripts/ci/ci_performance.py report --output target/test-timings/performance.json
      - name: Retain native build and cache observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-performance-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.runner }}
          path: |
            target/test-timings/
            target/cargo-timings/
            !target/test-timings/build-benchmark-*/round-*-jobs-*/debug/**
          if-no-files-found: error

  full_quality:
    needs: dependency_fetch
    env:
      AWAKEN_STATIC_JOBS: "4"
    # The strict sandbox group requires Docker, unprivileged user namespaces,
    # /dev/fuse, k3d and kubectl. A named runner contract makes missing
    # substrates a scheduling failure instead of a successful test skip.
    # On the nightly schedule this is the full formal run: every event but a
    # pull request keeps the full Kani tier, nightly harnesses included.
    runs-on: [self-hosted, linux, x64, awaken-full-gate]
    timeout-minutes: 360
    steps:
      - name: Check out the exact candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Begin build observations
        run: python3 scripts/ci/ci_performance.py begin --label full_quality --github
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        id: rust_cache
        with:
          key: full-quality
          cache-workspace-crates: false
      - name: Observe restored Cargo footprint
        run: python3 scripts/ci/ci_performance.py cache --hit "${{ steps.rust_cache.outputs.cache-hit || 'unknown' }}" --output target/test-timings/cache-full-quality.json
      - name: Bind evidence to the exact workflow SHA
        shell: bash
        run: |
          set -euo pipefail
          source_revision="$(git rev-parse "$GITHUB_SHA^{commit}")"
          test "$(git rev-parse HEAD)" = "$source_revision"
          mkdir -p target/test-timings
          printf 'revision=%s\nref=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$source_revision" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > target/test-timings/source.env
      - name: Qualify complete SDK package archives
        if: github.event_name == 'workflow_dispatch' && inputs.sdk_qualification == 'package'
        run: python3 scripts/ci/check_sdk_consumer.py --qualify-package
      - name: Qualify SDK archive consumer tasks
        if: github.event_name == 'workflow_dispatch' && inputs.sdk_qualification == 'artifact'
        run: python3 scripts/ci/check_sdk_consumer.py --qualify-artifact
      - name: Qualify complete SDK pre-release source SemVer
        if: github.event_name == 'workflow_dispatch' && inputs.sdk_qualification == 'semver'
        run: python3 scripts/ci/check_sdk_consumer.py --qualify-semver --baseline-rev 50b3f3e22dbfe1d91dd6ee6fef8ee8dfc8e15940
      - name: Install repository test dependencies
        run: |
          # E2E lock decision table: C1 package.json and package-lock.json agree
          # on the exact official SDK version -> npm ci installs that reviewed
          # tree. C2 either declaration or resolved lock entry drifts -> npm ci
          # fails before any E2E or cluster effect. Never repair C2 with npm
          # install in CI; update the existing lock in the source change.
          pnpm install --frozen-lockfile
          npm ci --prefix e2e
          pnpm -C web exec playwright install chromium
      - name: Narrow a pull request's Kani run to its pr tier
        # A pull request runs the pr tier over the packages its changes can
        # alter; a push, a release call and the schedule keep the full tier,
        # the only formal receipt a release accepts. No merge-base fails the
        # step rather than silently running nothing.
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD "origin/$BASE_REF")"
          printf 'AWAKEN_FORMAL_TIER=pr\nAWAKEN_FORMAL_AFFECTED_BASE=%s\n' "$base" >> "$GITHUB_ENV"
      - name: Run the one complete repository gate
        env:
          AWAKEN_TEST_TIMINGS_FILE: target/test-timings/check-all.tsv
          AWAKEN_RELIABILITY_EVIDENCE_DIR: target/test-timings/reliability
        run: scripts/ci/check-all.sh --full-gate --record
      - name: Compare representative ordinary Cargo builds
        if: github.event_name == 'workflow_dispatch' && inputs.build_benchmark
        shell: bash
        run: |
          set -euo pipefail
          source scripts/ci/_provider_environment.sh
          awaken_append_repo_tools
          awaken_unset_ambient_api_keys
          python3 scripts/ci/benchmark_rust_build.py -p awaken-resource-worker-http --jobs 1 2 --rounds 2 --timeout 1800
      - name: Finish build observations
        if: always() && env.AWAKEN_BUILD_RUN_ID != ''
        run: python3 scripts/ci/ci_performance.py finish --conclusion "${{ job.status }}"
      - name: Summarize gate and build costs
        if: always()
        run: python3 scripts/ci/ci_performance.py report --output target/test-timings/performance.json
      - name: Retain exact-SHA quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/test-timings/
            target/cargo-timings/
            web/test-results/
            scripts/ci/gate_record.json
            !target/test-timings/build-benchmark-*/round-*-jobs-*/debug/**
          if-no-files-found: error

  performance_summary:
    if: always()
    needs: [trusted_host_portability, full_quality]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the exact candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download quality performance observations
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-${{ github.sha }}-${{ github.run_attempt }}
          path: target/performance-input
      - name: Measure completed jobs including post-cache save steps
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/ci_performance.py github --root target/performance-input/target/test-timings --output target/test-timings/workflow-performance.json
      - name: Retain workflow performance observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-${{ github.sha }}-${{ github.run_attempt }}
          path: target/test-timings/workflow-performance.*
          if-no-files-found: error
