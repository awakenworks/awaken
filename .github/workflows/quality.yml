# The sole branch/PR quality workflow. Test composition stays in check-all.sh;
# this workflow only supplies an exact revision and a substrate-capable runner.
name: awaken-full-quality

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: awaken-full-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full_quality:
    # The strict sandbox group requires Docker, unprivileged user namespaces,
    # /dev/fuse, k3d and kubectl. A named runner contract makes missing
    # substrates a scheduling failure instead of a successful test skip.
    runs-on: [self-hosted, linux, x64, awaken-full-gate]
    timeout-minutes: 360
    steps:
      - name: Check out the exact candidate revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.6.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: full-quality
      - name: Bind evidence to the exact workflow SHA
        shell: bash
        run: |
          set -euo pipefail
          source_revision="$(git rev-parse "$GITHUB_SHA^{commit}")"
          test "$(git rev-parse HEAD)" = "$source_revision"
          mkdir -p target/test-timings
          printf 'revision=%s\nref=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$source_revision" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > target/test-timings/source.env
      - name: Install repository test dependencies
        run: |
          pnpm install --frozen-lockfile
          npm ci --prefix e2e
      - name: Run the one complete repository gate
        env:
          AWAKEN_TEST_TIMINGS_FILE: target/test-timings/check-all.tsv
        run: scripts/ci/check-all.sh
      - name: Retain exact-SHA quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-${{ github.sha }}-${{ github.run_attempt }}
          path: target/test-timings/
          if-no-files-found: error
