# Dependency architecture has one source of truth: each crate's
# [package.metadata.awaken] context/layer/authority, interpreted by
# scripts/ci/check_crate_boundaries.py. cargo-deny holds the one rule Cargo's
# graph states directly: which crates may depend on a transport crate.

[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
# Outbound transport construction (L1). Selecting the process-wide rustls
# provider and deciding whether a channel may inherit an ambient `HTTP(S)_PROXY`
# were once obligations remembered at each client site, which is why they were
# honoured in two crates and forgotten in fifteen. `awaken-outbound-http` owns
# both as properties of `InternalHttpClient` / `ExternalHttpClient`, so a crate
# that cannot name `reqwest` or `rustls` cannot express an unguarded client. A
# first-party wrapper below states why that crate must own transport
# construction itself; the third-party wrappers are libraries that build their
# own clients. Bans run with `--exclude-dev`: a `[dev-dependencies]` client is a
# test composition root exercising a real server, not an egress path. A bare
# `reqwest::Client` constructor is refused by check_crate_boundaries.py.
deny = [
    { crate = "reqwest", reason = "build an InternalHttpClient/ExternalHttpClient from awaken-outbound-http", wrappers = [
        # The transport authority: selects the rustls provider and owns the
        # internal/external proxy variants.
        "awaken-outbound-http",
        # Pins reqwest 0.13: the `genai` SDK takes a 0.13 `Client` through
        # `with_reqwest`, a different type from the authority's 0.12 client.
        "awaken-provider-genai",
        # Streams MCP server-sent events off a live `Response` body and mirrors
        # arbitrary server headers; a JSON request/reply pair cannot express it.
        "awaken-ext-mcp",
        # Re-signs and replays one prepared `RequestBuilder` after a credential
        # rotation, so the retry seam is the request builder itself.
        "awaken-inference-endpoint",
        # The Control-owned OAuth Vault refresher sends form-encoded token
        # exchanges with Basic/client-secret authentication, which the JSON-only
        # external client cannot express; construction still uses the
        # authority's rustls builder.
        "awaken-control",
        # The MCP relay is a reverse proxy: it forwards a caller-chosen method,
        # header set and raw body, none of which the JSON client models.
        "awaken-session-mcp",
        # Second transport authority, for the Worker-to-Coordinator plane: owns
        # the signed `RequestBuilder` seam and the private-CA client, and takes
        # its provider selection from awaken-outbound-http.
        "awaken-worker-transport-security",
        # Implements the Worker-to-Coordinator signing seam, whose port is
        # defined over `reqwest::RequestBuilder` by the authority above.
        "awaken-coordinator-client",
        # Third-party and awaken-cloud libraries that build their own clients.
        "awaken-iam-client",
        "awaken-iam-host",
        "awaken-iam-server",
        "genai",
        "object_store",
        "opentelemetry-http",
        "opentelemetry-otlp",
    ] },
    # The GenAI SDK's `Client::default()` reads ambient provider environment
    # variables, and clippy cannot single out a `Default::default` path. A crate
    # that cannot name `genai` cannot build that client, so the adapter's one
    # materialized constructor (`GenaiExecutor::from_materialized_endpoint`) is
    # the only route; `GenaiExecutor` itself has no `Default`/`new`.
    { crate = "genai", reason = "construct a GenaiExecutor from a materialized endpoint (awaken-provider-genai)", wrappers = [
        # The GenAI transport adapter.
        "awaken-provider-genai",
        # A devtools example program that builds its own compatible-gateway
        # client; it is its own process root and is never shipped.
        "awaken-runtime-examples",
    ] },
    { crate = "rustls", reason = "only the transport authority selects the rustls provider", wrappers = [
        "awaken-outbound-http",
        # Third-party TLS clients and connectors.
        "hyper-rustls",
        "kube-client",
        "reqwest",
        "rustls-platform-verifier",
        "sqlx-core",
        "tokio-rustls",
        "ureq",
    ] },
]

# Where a dependency may come from. This is the one allowlist of Git
# repositories: `scripts/ci/check_dependency_sources.py` reads `allow-git` from
# here for the cold fetch tier, which must refuse an unlisted host before any
# network fetch and runs where cargo-deny is not installed. That script keeps the
# two rules cargo-deny cannot state: a full 40-character `rev`, and one revision
# per repository.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-git = [
    "https://github.com/awakenworks/awaken-ui",
    "https://github.com/awakenworks/awaken-foundation",
    "https://github.com/awakenworks/awaken-iam",
    # Official SQLx security revision, shared with Foundation's SQLite driver.
    "https://github.com/launchbadge/sqlx",
]

# The mandatory trust-root guard limits this semver-shim false positive.
[advisories]
ignore = [
    { id = "RUSTSEC-2026-0381", reason = "Immutable webpki-roots 0.26.11 only re-exports v1 certificate data. check_trust_roots.py pins its registry checksum and forwarding edge, rejects actual data below 1.0.10, and refuses this exception once the last shim is removed." },
]
