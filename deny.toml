# Dependency architecture has one source of truth: each crate's
# [package.metadata.awaken] context/layer/authority, interpreted by
# scripts/ci/check_crate_boundaries.py. cargo-deny remains dependency-hygiene
# tooling and deliberately does not duplicate architecture wrapper lists.

[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

# The mandatory trust-root guard limits this semver-shim false positive.
[advisories]
ignore = [
    { id = "RUSTSEC-2026-0381", reason = "Immutable webpki-roots 0.26.11 only re-exports v1 certificate data. check_trust_roots.py pins its registry checksum and forwarding edge, rejects actual data below 1.0.10, and refuses this exception once the last shim is removed." },
]
