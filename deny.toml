[licenses]
version = 2
# Permissive and copyleft-free licenses present in this workspace's dependency
# tree.  Run `cargo deny list` to see the full per-crate breakdown.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Minimum confidence required when inferring a license from its text.
confidence-threshold = 0.8

[bans]
# Allow multiple versions of the same crate (dependency tree is complex).
multiple-versions = "warn"
wildcards = "allow"
highlight = "simplest-path"

[advisories]
version = 2
ignore = [
    # rsa: Marvin Attack timing side-channel; no upstream patch available.
    { id = "RUSTSEC-2023-0071", reason = "no upstream patch; rsa crate is pulled in transiently" },
    # rustls-pemfile: unmaintained; pulled in by reqwest/model-context-protocol v0.11 transient dep.
    { id = "RUSTSEC-2025-0134", reason = "unmaintained; tracked for dep-upgrade separately" },
    # tokio-tar: PAX header parsing bug; pulled in transiently via testcontainers.
    { id = "RUSTSEC-2025-0111", reason = "no patch; transient dep via testcontainers" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
