# Architecture fitness function: crate dependency direction (layering).
#
# Enforces the one-way dependency rule (INVARIANTS G2, G18, G29): contracts are
# the base, the runtime core depends only on contracts, and extensions/host sit
# on top. A reverse edge — a lower layer depending on a higher one — fails the
# build. (Most reverse edges are dependency cycles that cargo itself rejects;
# this check covers the acyclic upward edges cargo allows, e.g. kernel -> ext.)
#
# Layers, low -> high:
#   awaken-agent-contract     base contract; no internal dependencies
#   awaken-runtime-contract   -> agent-contract
#   awaken-runtime            -> the two contracts; the kernel
#   awaken-ext-builtin-tools  -> contract/kernel surface; first-party extensions
#   awaken-provider-genai     -> contracts only; the model-SDK adapter (no kernel dep)
#   awaken-store-schema       -> migrator only; portable commit schema (no driver, no kernel)
#   awaken-store-postgres     -> contracts + schema; durable commit-store adapter (sqlx)
#   awaken-store-sqlite       -> contracts + schema; durable commit-store adapter (rusqlite)
#   awaken-run-ingress        -> kernel + store adapter; the durable run host (ADR-0009)
#   awaken-connection-plan    -> agent-channel only; topology value object (ADR-0045, no kernel)
#   awaken-tool-relay         -> runtime-contract + agent-channel marker; the remote hand (ADR-0044/0045 D6, no kernel/store/model — G33)
#
# Each rule denies a crate, then lists via `wrappers` the ONLY crates allowed to
# depend on it (its legitimate upper layers). A depender not in the list is a
# forbidden upward edge and fails `cargo deny check bans`.
#
# Run: cargo deny --log-level error check bans
#   `--log-level error` hides the benign "unused-wrapper" notes for upper layers
#   that do not exist or do not consume the lower layer yet; real upward edges
#   still fail. Only the `bans` check is in scope; licenses/advisories are not.

[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

# Base contract: only the layers above it may depend on it.
[[bans.deny]]
name = "awaken-agent-contract"
wrappers = [
    "awaken-runtime-host",
    "awaken-runtime-contract",
    "awaken-runtime",
    "awaken-ext-builtin-tools",
    "awaken-ext-skills",
    "awaken-config-store",
    "awaken-runtime-examples",
    "awaken-provider-genai",
    "awaken-store-inmem",
    "awaken-store-fs",
    "awaken-store-conformance",
    "awaken-store-postgres",
    "awaken-store-sqlite",
    "awaken-run-ingress-contract",
    # Public DispatchQueue conformance driver constructs agent-domain fixture ids.
    "awaken-run-ingress-testkit",
    "awaken-run-ingress",
    "awaken-ext-mcp",
    "awaken-ext-state-machine",
    "awaken-ext-compact",
    "awaken-ext-memory",
    "awaken-protocol-transport",
    "awaken-protocol-managed",
    "awaken-protocol-ai-sdk",
    "awaken-protocol-ag-ui",
    "awaken-protocol-a2a",
    "awaken-protocol-mcp",
    "awaken-server",
    # Stage B2: the authoring plane + the composition root.
    "awaken-control",
    "awaken-cli",
    # Stage C: the production database-less worker dev-depends on the contract for the
    # RedactedString its offline model-resolution test authors a credential with.
    "awaken-worker",
    "awaken-credential-vault",
    "awaken-data-subject",
    "awaken-config-resolver",
    "awaken-managed-bridge",
    "awaken-admin-config-api",
    "awaken-run-executor-acp",
    "awaken-run-executor-a2a",
    "awaken-eval",
    # ADR-0048 / S10: the managed webhook bridge speaks the neutral value objects.
    "awaken-webhook-managed",
    # Stage A: the test-only scenario host carries the e2e mocks + fixtures.
    "awaken-scenario-host",
    # The neutral session-runtime ports: agent-domain value objects (RedactedString
    # etc.) appear in the port signatures. A contract/ leaf above the base contract.
    "awaken-session-contract",
]
reason = "base contract; nothing may pull it upward (no downward dep of its own)"

# Contract layer: the base contract must NOT depend upward on it.
[[bans.deny]]
name = "awaken-runtime-contract"
wrappers = [
    "awaken-runtime-host",
    "awaken-runtime",
    "awaken-ext-builtin-tools",
    "awaken-ext-permission",
    "awaken-ext-goal",
    "awaken-ext-mcp",
    "awaken-ext-skills",
    "awaken-ext-state-machine",
    "awaken-ext-compact",
    "awaken-ext-memory",
    "awaken-config-store",
    "awaken-runtime-examples",
    "awaken-provider-genai",
    "awaken-store-postgres",
    "awaken-store-sqlite",
    "awaken-run-ingress-contract",
    # Public DispatchQueue conformance driver constructs a self-contained activation.
    "awaken-run-ingress-testkit",
    "awaken-run-ingress",
    "awaken-sandbox-local",
    # The execution-plane binary's `hand` role (feature-gated) drives ToolCall through
    # the remote executor; dev-dep for its integration test (C5, ADR-0044/0045).
    "awaken-sandbox",
    "awaken-protocol-mcp",
    "awaken-server",
    # The execution-plane composition root implements the public ExecutorProvider
    # SPI in dev-only E2E fixtures; it may depend on runtime-contract value objects.
    "awaken-worker",
    # Stage B2: the authoring plane + the composition root.
    "awaken-control",
    "awaken-cli",
    "awaken-config-resolver",
    "awaken-data-subject",
    "awaken-run-executor-acp",
    "awaken-run-executor-a2a",
    # #2: implements the neutral MetricsRecorder port defined in the contract, so
    # it depends on the contract for that trait only (structure-only metric vocab).
    "awaken-observability",
    # ADR-0044: the remote-hand relay. It depends on the contract for ToolCall/
    # ToolOutput/ToolExecutor/RawTool ONLY. Its absence from the awaken-runtime,
    # awaken-store-*, and awaken-provider-genai wrapper lists is the G33 enforcer:
    # adding a kernel/store/model dep to the hand crate fails `cargo deny check bans`.
    "awaken-tool-relay",
    # #4: the eval harness replays cases through the RunExecutor port.
    "awaken-eval",
    # The config-authoring plane (extracted from runtime-host) + its consumers.
    "awaken-config-service",
    "awaken-admin-assistant",
    "awaken-admin-config-api",
    # Stage A: the test-only scenario host.
    "awaken-scenario-host",
]
reason = "contract layer; agent-contract must not depend on it (no upward edge)"

# Kernel: contracts must NOT depend on the kernel; only extensions/host may.
[[bans.deny]]
name = "awaken-runtime"
wrappers = [
    "awaken-runtime-host",
    "awaken-ext-builtin-tools",
    "awaken-config-store",
    "awaken-runtime-examples",
    "awaken-run-ingress",
    "awaken-ext-mcp",
    "awaken-ext-state-machine",
    "awaken-server",
    # #4: the eval harness runs recorded cases on the real kernel.
    "awaken-eval",
    # Stage A: the test-only scenario host runs cases on the real kernel.
    "awaken-scenario-host",
]
reason = "runtime core; contracts must not depend on the kernel (G2, G18)"

# Extension layer: the runtime core and contracts must NOT depend on it; only the
# host/application layer composes the bundle.
[[bans.deny]]
name = "awaken-ext-builtin-tools"
wrappers = [
    "awaken-runtime-host",
    "awaken-run-ingress",
    "awaken-runtime-examples",
    "awaken-sandbox-local",
    # The execution-plane binary's `hand` role builds the hand's toolset (ADR-0044/0045).
    "awaken-sandbox",
    # Stage A: the test-only scenario host builds the hand's toolset for e2e.
    "awaken-scenario-host",
]
reason = "extensions sit on top; the runtime core must stay extension-agnostic (G2)"

# ── Protocol adapters are LEAVES (Phase 0.2, neutral-core fitness function) ──────
# A `protocol-*` crate is a pure wire translator (DTOs + routes + one neutral→wire
# projection). Nothing may depend on it except a composition root that mounts it, the
# service layer that assembles the managed adapter, or a sibling adapter over a shared
# protocol base. Freezing the depender set here makes the ROOT DISEASE — a neutral port
# living inside a protocol adapter, then consumed workspace-wide — fail the build: a new
# reverse edge onto an adapter forces the port to move inward to a contract/ leaf first.

# The shared transport base other protocol adapters build on (a `ProtocolRuntime` seam),
# plus the composition roots + service layer that mount them.
[[bans.deny]]
name = "awaken-protocol-transport"
wrappers = [
    "awaken-protocol-a2a",
    "awaken-protocol-ag-ui",
    "awaken-protocol-ai-sdk",
    "awaken-runtime-host",
    "awaken-server",
    "awaken-scenario-host",
]
reason = "protocol adapters are leaves; only composition roots + sibling adapters mount the transport base (Phase 0.2 neutral-core)"

# Managed Agents adapter. runtime-host is the service layer that assembles the managed
# host; control mounts its routes + reuses the wire ErrorResponse; cli/server/scenario
# are composition roots.
[[bans.deny]]
name = "awaken-protocol-managed"
wrappers = [
    "awaken-runtime-host",
    "awaken-control",
    "awaken-cli",
    "awaken-server",
    "awaken-scenario-host",
]
reason = "protocol adapters are leaves; a new reverse edge onto the managed adapter means a neutral port must move to a contract/ leaf first (Phase 0.2 neutral-core)"

# A2A adapter. run-executor-a2a implements the neutral RemoteAgent interface over it;
# server/scenario are composition roots. The host itself no longer depends on it.
[[bans.deny]]
name = "awaken-protocol-a2a"
wrappers = [
    "awaken-run-executor-a2a",
    "awaken-server",
    "awaken-scenario-host",
]
reason = "protocol adapters are leaves; the host holds the neutral RemoteAgent interface, not the A2A wire (Phase 0.2 neutral-core)"

# AI SDK v6 adapter — composition roots only.
[[bans.deny]]
name = "awaken-protocol-ai-sdk"
wrappers = [
    "awaken-server",
    "awaken-scenario-host",
]
reason = "protocol adapters are leaves; only composition roots mount the AI SDK adapter (Phase 0.2 neutral-core)"

# AG-UI adapter — composition roots only.
[[bans.deny]]
name = "awaken-protocol-ag-ui"
wrappers = [
    "awaken-server",
    "awaken-scenario-host",
]
reason = "protocol adapters are leaves; only composition roots mount the AG-UI adapter (Phase 0.2 neutral-core)"

# awaken-protocol-mcp has NO depender today (a pure leaf). deny.toml cannot express a
# zero-depender lock on a workspace member (empty `wrappers` bans the member itself), so
# its leaf status — and the categorical `protocol-*` rule for every adapter — is enforced
# by `check_protocol_leaves()` in scripts/ci/check_crate_boundaries.py (the crate-name
# prefix rule), with these deny.toml entries as the cargo-deny-layer defense in depth.
