# migrated <data_dir>/iam.sqlite, seeded roles, and one-time browser setup.
awaken-iam-host = { git = "https://github.com/awakenworks/awaken-iam.git", rev = "cbfe337b305721391641c35aaa51308b51eb5075", version = "=0.1.2-dev" }
