[workspace]
resolver = "2"
members = [
    "crates/awaken-agent-contract",
    "crates/awaken-runtime-contract",
    "crates/awaken-runtime",
    "crates/awaken-ext-builtin-tools",
    "crates/awaken-ext-permission",
    "crates/awaken-config-store",
    "crates/awaken-runtime-examples",
    "crates/awaken-provider-genai",
    "crates/awaken-store-schema",
    "crates/awaken-store-postgres",
    "crates/awaken-store-sqlite",
    "crates/awaken-run-ingress",
    "crates/awaken-protocol-managed",
    "crates/awaken-protocol-ai-sdk",
    "crates/awaken-protocol-ag-ui",
    "crates/awaken-sandbox-local",
    "crates/awaken-ext-goal",
    "crates/awaken-server-local",
]

[workspace.package]
version = "1.0.0-dev"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
awaken-agent-contract = { path = "crates/awaken-agent-contract" }
awaken-runtime-contract = { path = "crates/awaken-runtime-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
genai = "0.6.0-beta.17"

[workspace.lints.rust]
unsafe_code = "forbid"
