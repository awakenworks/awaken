# Authoring / authz plane (Stage B2): the management CRUD surfaces + embedded IAM
# guard, split out of awaken-coordinator. Sibling of the data plane; the two never depend
# on each other — awaken-cli is the composition root that weaves them together.
awaken-control = { path = "crates/control/awaken-control" }
# Foundation contract half (ADR-0043): RFC-9457 ApiError, pagination, and the
# allowlisted ListQuery/QuerySchema the admin config API serves its CRUD on.
awaken-api-contract = { git = "https://github.com/awakenworks/awaken-foundation.git", rev = "247ee33a1d8f56f362217176886c346c87d207d9" }
awaken-scoped-migration = { git = "https://github.com/awakenworks/awaken-foundation.git", rev = "247ee33a1d8f56f362217176886c346c87d207d9" }
# Embedded IAM for the management plane (ADR-0042/0043 P1): bearer ApiToken
# authn (argon2id at rest) + grant-based authz gating /v1/config/* and
# /v1/vaults/* in awaken-coordinator, opt-in via AWAKEN_MGMT_IAM=embedded.
# All IAM crates pin ONE rev so the contract types line up. awaken-iam-server's
# SqlStore/migrations back the embedded authz rows instead of a hand-rolled
# schema; its SQLite driver links the same libsqlite3-sys 0.30 that sqlx links
# (ADR-0087 item 6).
awaken-iam-contract = { git = "https://github.com/awakenworks/awaken-iam.git", rev = "cbfe337b305721391641c35aaa51308b51eb5075", version = "=0.1.2-dev" }
awaken-iam-server = { git = "https://github.com/awakenworks/awaken-iam.git", rev = "cbfe337b305721391641c35aaa51308b51eb5075", version = "=0.1.2-dev" }
awaken-iam-core = { git = "https://github.com/awakenworks/awaken-iam.git", rev = "cbfe337b305721391641c35aaa51308b51eb5075", version = "=0.1.2-dev" }
