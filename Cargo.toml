[workspace]
resolver = "2"
# Product buckets by directory (single workspace):
#   crates/runtime/* → Awaken runtime (Build); a self-contained lower layer.
#   crates/agents/*  → Awaken Agents (Run); may depend on runtime/, never the reverse
#                      (enforced by scripts/ci/check_crate_boundaries.py).
members = [
    "crates/runtime/*",
    "crates/agents/*",
]

[workspace.package]
version = "1.0.0-dev"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
awaken-agent-contract = { path = "crates/runtime/awaken-agent-contract" }
awaken-runtime-contract = { path = "crates/runtime/awaken-runtime-contract" }
awaken-runtime = { path = "crates/runtime/awaken-runtime" }
awaken-tool-pattern = { path = "crates/runtime/awaken-tool-pattern" }
awaken-provider-genai = { path = "crates/runtime/awaken-provider-genai" }
awaken-ext-permission = { path = "crates/runtime/awaken-ext-permission" }
awaken-ext-mcp = { path = "crates/runtime/awaken-ext-mcp" }
awaken-ext-skills = { path = "crates/runtime/awaken-ext-skills" }
awaken-ext-goal = { path = "crates/runtime/awaken-ext-goal" }
awaken-ext-state-machine = { path = "crates/runtime/awaken-ext-state-machine" }
awaken-ext-compact = { path = "crates/runtime/awaken-ext-compact" }
awaken-ext-memory = { path = "crates/runtime/awaken-ext-memory" }
awaken-ext-builtin-tools = { path = "crates/runtime/awaken-ext-builtin-tools" }
awaken-protocol-transport = { path = "crates/runtime/awaken-protocol-transport" }
awaken-protocol-a2a = { path = "crates/runtime/awaken-protocol-a2a" }
awaken-protocol-ag-ui = { path = "crates/runtime/awaken-protocol-ag-ui" }
awaken-protocol-ai-sdk = { path = "crates/runtime/awaken-protocol-ai-sdk" }
awaken-protocol-managed = { path = "crates/agents/awaken-protocol-managed" }
awaken-protocol-acp = { path = "crates/agents/awaken-protocol-acp" }
awaken-store-conformance = { path = "crates/runtime/awaken-store-conformance" }
awaken-store-inmem = { path = "crates/runtime/awaken-store-inmem" }
awaken-store-fs = { path = "crates/runtime/awaken-store-fs" }
awaken-store-schema = { path = "crates/runtime/awaken-store-schema" }
awaken-store-sqlite = { path = "crates/runtime/awaken-store-sqlite" }
awaken-store-postgres = { path = "crates/runtime/awaken-store-postgres" }
awaken-config-store = { path = "crates/runtime/awaken-config-store" }
awaken-provisioning-contract = { path = "crates/runtime/awaken-provisioning-contract" }
awaken-agent-channel = { path = "crates/runtime/awaken-agent-channel" }
awaken-file-store = { path = "crates/runtime/awaken-file-store" }
awaken-sandbox-local = { path = "crates/runtime/awaken-sandbox-local" }
awaken-sandbox-container = { path = "crates/runtime/awaken-sandbox-container" }
awaken-runtime-examples = { path = "crates/runtime/awaken-runtime-examples" }
awaken-run-ingress-contract = { path = "crates/agents/awaken-run-ingress-contract" }
awaken-run-ingress = { path = "crates/agents/awaken-run-ingress" }
awaken-server-local = { path = "crates/agents/awaken-server-local" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
genai = "0.6.0-beta.17"

[workspace.lints.rust]
unsafe_code = "forbid"
