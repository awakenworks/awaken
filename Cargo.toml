[workspace]
resolver = "2"
members = [
    "crates/contract/awaken-agent-contract",
    "crates/contract/awaken-runtime-contract",
    "crates/runtime/awaken-runtime",
    "crates/runtime/awaken-tool-pattern",
    "crates/runtime/awaken-ext-builtin-tools",
    "crates/runtime/awaken-ext-permission",
    "crates/control/awaken-config-store",
    "crates/devtools/awaken-runtime-examples",
    "crates/runtime/awaken-provider-genai",
    "crates/stores/awaken-store-schema",
    "crates/stores/awaken-store-postgres",
    "crates/stores/awaken-store-sqlite",
    "crates/server/awaken-dispatch",
    "crates/server/awaken-protocol-managed",
    "crates/server/awaken-protocol-ai-sdk",
    "crates/server/awaken-protocol-ag-ui",
    "crates/server/awaken-protocol-a2a",
    "crates/worker/awaken-sandbox-local",
    "crates/runtime/awaken-ext-goal",
    "crates/runtime/awaken-ext-mcp",
    "crates/runtime/awaken-ext-skills",
    "crates/server/awaken-server",
]

[workspace.package]
version = "1.0.0-dev"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
awaken-agent-contract = { path = "crates/contract/awaken-agent-contract" }
awaken-runtime-contract = { path = "crates/contract/awaken-runtime-contract" }
awaken-tool-pattern = { path = "crates/runtime/awaken-tool-pattern" }
awaken-ext-skills = { path = "crates/runtime/awaken-ext-skills" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
genai = "0.6.0-beta.17"

[workspace.lints.rust]
unsafe_code = "forbid"
