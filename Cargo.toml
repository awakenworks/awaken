[workspace]
resolver = "2"
# Plane-aligned buckets by directory (single workspace). Shared foundation +
# three deployment planes; dependencies point inward toward contract/kernel:
#   crates/contract/*   → shared vocabulary + ports (agent-contract, tenancy); depends on nothing.
#   crates/runtime/*    → the kernel: agent loop + ext plugins + telemetry + the in-memory default backend; contract only.
#   crates/stores/*     → DURABLE commit/event backends (fs/sqlite/postgres) behind the CommitCoordinator port.
#   crates/resources/*  → mountable agent-resource backends (memory/skill/file).
#   crates/server/*     → resident daemon: Managed + protocol front doors, ingress/dispatch, host, local sandbox, notify.
#   crates/worker/*     → on-demand isolated execution: container/k8s sandbox + channel/relay (links no stores).
#   crates/control/*    → self-hosted config/vault/iam authoring plane (ADR-0043).
#   crates/bin/*        → composed deployables (awaken-cli, server-local) + harnesses.
#                         Boundaries enforced by scripts/ci/check_crate_boundaries.py.
members = [
    "crates/contract/*",
    "crates/runtime/*",
    "crates/stores/*",
    "crates/resources/*",
    "crates/server/*",
    "crates/worker/*",
    "crates/control/*",
    "crates/bin/*",
]

[workspace.package]
version = "1.0.0-dev"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
awaken-agent-contract = { path = "crates/contract/awaken-agent-contract" }
awaken-runtime-contract = { path = "crates/runtime/awaken-runtime-contract" }
awaken-tenancy = { path = "crates/contract/awaken-tenancy" }
awaken-resource-contract = { path = "crates/contract/awaken-resource-contract" }
awaken-observability = { path = "crates/runtime/awaken-observability" }
awaken-memory-store = { path = "crates/resources/awaken-memory-store" }
awaken-skill-store = { path = "crates/resources/awaken-skill-store" }
awaken-runtime = { path = "crates/runtime/awaken-runtime" }
awaken-tool-pattern = { path = "crates/runtime/awaken-tool-pattern" }
awaken-provider-genai = { path = "crates/runtime/awaken-provider-genai" }
awaken-ext-permission = { path = "crates/runtime/awaken-ext-permission" }
awaken-credential = { path = "crates/runtime/awaken-credential" }
awaken-mcp-wire = { path = "crates/runtime/awaken-mcp-wire" }
awaken-ext-mcp = { path = "crates/runtime/awaken-ext-mcp" }
awaken-ext-skills = { path = "crates/runtime/awaken-ext-skills" }
awaken-ext-goal = { path = "crates/runtime/awaken-ext-goal" }
awaken-ext-state-machine = { path = "crates/runtime/awaken-ext-state-machine" }
awaken-ext-compact = { path = "crates/runtime/awaken-ext-compact" }
awaken-ext-memory = { path = "crates/runtime/awaken-ext-memory" }
awaken-ext-builtin-tools = { path = "crates/runtime/awaken-ext-builtin-tools" }
awaken-protocol-transport = { path = "crates/server/awaken-protocol-transport" }
awaken-protocol-a2a = { path = "crates/server/awaken-protocol-a2a" }
awaken-protocol-mcp = { path = "crates/server/awaken-protocol-mcp" }
awaken-protocol-ag-ui = { path = "crates/server/awaken-protocol-ag-ui" }
awaken-protocol-ai-sdk = { path = "crates/server/awaken-protocol-ai-sdk" }
awaken-protocol-managed = { path = "crates/server/awaken-protocol-managed" }
awaken-protocol-acp = { path = "crates/server/awaken-protocol-acp" }
awaken-run-executor-acp = { path = "crates/server/awaken-run-executor-acp" }
awaken-run-executor-a2a = { path = "crates/server/awaken-run-executor-a2a" }
# Management plane (ADR-0043 decomposition) — agents bucket, orthogonal to execution.
awaken-model-catalog = { path = "crates/control/awaken-model-catalog" }
awaken-credential-vault = { path = "crates/control/awaken-credential-vault" }
awaken-data-subject = { path = "crates/control/awaken-data-subject" }
awaken-config-resolver = { path = "crates/control/awaken-config-resolver" }
awaken-admin-config-api = { path = "crates/control/awaken-admin-config-api" }
# Authoring / authz plane (Stage B2): the management CRUD surfaces + embedded IAM
# guard, split out of awaken-server. Sibling of the data plane; the two never depend
# on each other — awaken-cli is the composition root that weaves them together.
awaken-control = { path = "crates/control/awaken-control" }
# Foundation contract half (ADR-0043): RFC-9457 ApiError, pagination, and the
# allowlisted ListQuery/QuerySchema the admin config API serves its CRUD on.
awaken-api-contract = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9" }
# Embedded IAM for the management plane (ADR-0042/0043 P1): bearer ApiToken
# authn (argon2id at rest) + grant-based authz gating /v1/config/* and
# /v1/vaults/* in awaken-server, opt-in via AWAKEN_MGMT_IAM=embedded.
# All four crates pin ONE rev so the contract types line up. awaken-iam-server
# became consumable once iam adopted foundation ADR-0005 (rusqlite as a
# links-safe *range*, >=0.32 <0.41), so its SqlStore/migrations now back the
# embedded authz rows instead of a hand-rolled schema.
awaken-iam-contract = { git = "https://github.com/awakenworks/awaken-iam", rev = "9aa91e1b1c2533acc00cc151aa3fdccc89f0f97f" }
awaken-iam-server = { git = "https://github.com/awakenworks/awaken-iam", rev = "9aa91e1b1c2533acc00cc151aa3fdccc89f0f97f" }
awaken-iam-core = { git = "https://github.com/awakenworks/awaken-iam", rev = "9aa91e1b1c2533acc00cc151aa3fdccc89f0f97f" }
awaken-iam-preset = { git = "https://github.com/awakenworks/awaken-iam", rev = "9aa91e1b1c2533acc00cc151aa3fdccc89f0f97f" }
# The assembly layer (ADR-0048): one IamGate (authn+authz PDP) + auth_layer PEP,
# three modes (Open/Local/Remote). Local mode is the zero-config single-machine
# embed (in-memory SQLite, seeded roles, ephemeral bootstrap admin token).
awaken-iam-host = { git = "https://github.com/awakenworks/awaken-iam", rev = "9aa91e1b1c2533acc00cc151aa3fdccc89f0f97f" }
awaken-managed-bridge = { path = "crates/server/awaken-managed-bridge" }
awaken-store-conformance = { path = "crates/stores/awaken-store-conformance" }
awaken-store-inmem = { path = "crates/runtime/awaken-store-inmem" }
awaken-store-fs = { path = "crates/stores/awaken-store-fs" }
awaken-store-schema = { path = "crates/stores/awaken-store-schema" }
awaken-store-sqlite = { path = "crates/stores/awaken-store-sqlite" }
awaken-store-postgres = { path = "crates/stores/awaken-store-postgres" }
awaken-config-store = { path = "crates/control/awaken-config-store" }
awaken-config-service = { path = "crates/control/awaken-config-service" }
awaken-provisioning-contract = { path = "crates/worker/awaken-provisioning-contract" }
awaken-agent-channel = { path = "crates/worker/awaken-agent-channel" }
awaken-connection-plan = { path = "crates/worker/awaken-connection-plan" }
awaken-tool-relay = { path = "crates/worker/awaken-tool-relay" }
awaken-file-store = { path = "crates/resources/awaken-file-store" }
awaken-sandbox-local = { path = "crates/worker/awaken-sandbox-local" }
awaken-sandbox-memoryd = { path = "crates/worker/awaken-sandbox-memoryd" }
awaken-sandbox-container = { path = "crates/worker/awaken-sandbox-container" }
awaken-runtime-examples = { path = "crates/bin/awaken-runtime-examples" }
awaken-run-ingress-contract = { path = "crates/server/awaken-run-ingress-contract" }
awaken-run-ingress = { path = "crates/server/awaken-run-ingress" }
awaken-runtime-host = { path = "crates/server/awaken-runtime-host" }
awaken-admin-assistant = { path = "crates/control/awaken-admin-assistant" }
awaken-server = { path = "crates/bin/awaken-server" }
awaken-scenario-host = { path = "crates/bin/awaken-scenario-host" }
awaken-cli = { path = "crates/bin/awaken-cli" }
awaken-worker = { path = "crates/bin/awaken-worker" }
awaken-authz-enforce = { path = "crates/control/awaken-authz-enforce" }
awaken-webhook = { path = "crates/server/awaken-webhook" }
awaken-webhook-managed = { path = "crates/server/awaken-webhook-managed" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
genai = "0.6.0-beta.17"
axum = "0.8"
# rusqlite carries the native `links = "sqlite3"` crate libsqlite3-sys, of which a
# binary graph may contain exactly one. Declared as a *range* (not a hard `^0.x`
# pin) so an embedding graph — e.g. awaken-cloud, which resolves rusqlite 0.40 —
# floats every sqlite store here up to the single version it already selected,
# instead of colliding on two `sqlite3`-linking packages. The stores use only API
# stable across the whole range; the `rusqlite-floor` CI job guards the floor.
# Mirrors awaken-foundation ADR-0005 (awaken-scoped-migration-sqlite); move both
# together.
rusqlite = { version = ">=0.32, <0.41", features = ["bundled"] }

[workspace.lints.rust]
unsafe_code = "forbid"
