[workspace]
resolver = "2"
# Product buckets by directory (single workspace), lower→upper:
#   crates/provisioning/* → execution substrate (sandbox, channel); no runtime dep.
#   crates/config/*       → control/authoring plane (catalog, vault, resolver); no runtime dep.
#   crates/resources/*    → agent resource stores (file store); no runtime dep.
#   crates/runtime/*      → Awaken runtime (Build) incl. ACP driver; may depend on the three above.
#   crates/agents/*       → Awaken Agents (Run); may depend on all of the above, never the reverse
#                           (enforced by scripts/ci/check_crate_boundaries.py).
members = [
    "crates/foundation/*",
    "crates/provisioning/*",
    "crates/config/*",
    "crates/resources/*",
    "crates/runtime/*",
    "crates/agents/*",
]

[workspace.package]
version = "1.0.0-dev"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
awaken-agent-contract = { path = "crates/foundation/awaken-agent-contract" }
awaken-runtime-contract = { path = "crates/foundation/awaken-runtime-contract" }
awaken-scope = { path = "crates/foundation/awaken-scope" }
awaken-observability = { path = "crates/foundation/awaken-observability" }
awaken-memory-store = { path = "crates/resources/awaken-memory-store" }
awaken-skill-store = { path = "crates/resources/awaken-skill-store" }
awaken-runtime = { path = "crates/runtime/awaken-runtime" }
awaken-tool-pattern = { path = "crates/runtime/awaken-tool-pattern" }
awaken-provider-genai = { path = "crates/runtime/awaken-provider-genai" }
awaken-ext-permission = { path = "crates/runtime/awaken-ext-permission" }
awaken-credential = { path = "crates/runtime/awaken-credential" }
awaken-mcp-wire = { path = "crates/runtime/awaken-mcp-wire" }
awaken-ext-mcp = { path = "crates/runtime/awaken-ext-mcp" }
awaken-ext-skills = { path = "crates/runtime/awaken-ext-skills" }
awaken-ext-goal = { path = "crates/runtime/awaken-ext-goal" }
awaken-ext-state-machine = { path = "crates/runtime/awaken-ext-state-machine" }
awaken-ext-compact = { path = "crates/runtime/awaken-ext-compact" }
awaken-ext-memory = { path = "crates/runtime/awaken-ext-memory" }
awaken-ext-builtin-tools = { path = "crates/runtime/awaken-ext-builtin-tools" }
awaken-protocol-transport = { path = "crates/runtime/awaken-protocol-transport" }
awaken-protocol-a2a = { path = "crates/runtime/awaken-protocol-a2a" }
awaken-protocol-mcp = { path = "crates/runtime/awaken-protocol-mcp" }
awaken-protocol-ag-ui = { path = "crates/runtime/awaken-protocol-ag-ui" }
awaken-protocol-ai-sdk = { path = "crates/runtime/awaken-protocol-ai-sdk" }
awaken-protocol-managed = { path = "crates/agents/awaken-protocol-managed" }
awaken-protocol-acp = { path = "crates/runtime/awaken-protocol-acp" }
awaken-run-executor-acp = { path = "crates/runtime/awaken-run-executor-acp" }
# Management plane (ADR-0043 decomposition) — agents bucket, orthogonal to execution.
awaken-model-catalog = { path = "crates/config/awaken-model-catalog" }
awaken-credential-vault = { path = "crates/config/awaken-credential-vault" }
awaken-config-resolver = { path = "crates/config/awaken-config-resolver" }
awaken-admin-config-api = { path = "crates/config/awaken-admin-config-api" }
# Foundation contract half (ADR-0043): RFC-9457 ApiError, pagination, and the
# allowlisted ListQuery/QuerySchema the admin config API serves its CRUD on.
awaken-api-contract = { git = "https://github.com/awakenworks/awaken-foundation", rev = "dfa512edd2e5b7e34ad0b05db01b973845f0f9e9" }
# Embedded IAM for the management plane (ADR-0042/0043 P1): bearer ApiToken
# authn (argon2id at rest) + grant-based authz gating /v1/config/* and
# /v1/vaults/* in awaken-server-local, opt-in via AWAKEN_MGMT_IAM=embedded.
# All four crates pin ONE rev so the contract types line up. awaken-iam-server
# became consumable once iam adopted foundation ADR-0005 (rusqlite as a
# links-safe *range*, >=0.32 <0.41), so its SqlStore/migrations now back the
# embedded authz rows instead of a hand-rolled schema.
awaken-iam-contract = { git = "https://github.com/awakenworks/awaken-iam", rev = "6e466668a20011d9394467341fcbdd46eaf2b1c1" }
awaken-iam-server = { git = "https://github.com/awakenworks/awaken-iam", rev = "6e466668a20011d9394467341fcbdd46eaf2b1c1" }
awaken-iam-core = { git = "https://github.com/awakenworks/awaken-iam", rev = "6e466668a20011d9394467341fcbdd46eaf2b1c1" }
awaken-iam-preset = { git = "https://github.com/awakenworks/awaken-iam", rev = "6e466668a20011d9394467341fcbdd46eaf2b1c1" }
awaken-managed-bridge = { path = "crates/agents/awaken-managed-bridge" }
awaken-store-conformance = { path = "crates/runtime/awaken-store-conformance" }
awaken-store-inmem = { path = "crates/runtime/awaken-store-inmem" }
awaken-store-fs = { path = "crates/runtime/awaken-store-fs" }
awaken-store-schema = { path = "crates/runtime/awaken-store-schema" }
awaken-store-sqlite = { path = "crates/runtime/awaken-store-sqlite" }
awaken-store-postgres = { path = "crates/runtime/awaken-store-postgres" }
awaken-config-store = { path = "crates/config/awaken-config-store" }
awaken-provisioning-contract = { path = "crates/provisioning/awaken-provisioning-contract" }
awaken-agent-channel = { path = "crates/provisioning/awaken-agent-channel" }
awaken-file-store = { path = "crates/resources/awaken-file-store" }
awaken-sandbox-local = { path = "crates/runtime/awaken-sandbox-local" }
awaken-sandbox-container = { path = "crates/provisioning/awaken-sandbox-container" }
awaken-runtime-examples = { path = "crates/agents/awaken-runtime-examples" }
awaken-run-ingress-contract = { path = "crates/agents/awaken-run-ingress-contract" }
awaken-run-ingress = { path = "crates/agents/awaken-run-ingress" }
awaken-runtime-host = { path = "crates/agents/awaken-runtime-host" }
awaken-server-local = { path = "crates/agents/awaken-server-local" }
awaken-authz-enforce = { path = "crates/agents/awaken-authz-enforce" }
awaken-standalone = { path = "crates/agents/awaken-standalone" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
genai = "0.6.0-beta.17"
axum = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"
