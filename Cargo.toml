[workspace]
resolver = "2"
# Product buckets by directory (single workspace):
#   crates/runtime/* → Awaken runtime (Build); a self-contained lower layer.
#   crates/agents/*  → Awaken Agents (Run); may depend on runtime/, never the reverse
#                      (enforced by scripts/ci/check_crate_boundaries.py).
members = [
    "crates/runtime/*",
    "crates/agents/*",
]

[workspace.package]
version = "1.0.0-dev"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
awaken-agent-contract = { path = "crates/contract/awaken-agent-contract" }
awaken-runtime-contract = { path = "crates/contract/awaken-runtime-contract" }
awaken-runtime = { path = "crates/runtime/awaken-runtime" }
awaken-tool-pattern = { path = "crates/runtime/awaken-tool-pattern" }
awaken-provider-genai = { path = "crates/runtime/awaken-provider-genai" }
awaken-ext-permission = { path = "crates/runtime/awaken-ext-permission" }
awaken-credential = { path = "crates/runtime/awaken-credential" }
awaken-mcp-wire = { path = "crates/runtime/awaken-mcp-wire" }
awaken-ext-mcp = { path = "crates/runtime/awaken-ext-mcp" }
awaken-ext-skills = { path = "crates/runtime/awaken-ext-skills" }
awaken-ext-goal = { path = "crates/runtime/awaken-ext-goal" }
awaken-ext-state-machine = { path = "crates/runtime/awaken-ext-state-machine" }
awaken-ext-compact = { path = "crates/runtime/awaken-ext-compact" }
awaken-ext-memory = { path = "crates/runtime/awaken-ext-memory" }
awaken-ext-builtin-tools = { path = "crates/runtime/awaken-ext-builtin-tools" }
awaken-protocol-transport = { path = "crates/server/awaken-protocol-transport" }
awaken-protocol-a2a = { path = "crates/server/awaken-protocol-a2a" }
awaken-protocol-mcp = { path = "crates/server/awaken-protocol-mcp" }
awaken-protocol-ag-ui = { path = "crates/server/awaken-protocol-ag-ui" }
awaken-protocol-ai-sdk = { path = "crates/server/awaken-protocol-ai-sdk" }
awaken-protocol-managed = { path = "crates/server/awaken-protocol-managed" }
awaken-protocol-acp = { path = "crates/server/awaken-protocol-acp" }
# Management plane (ADR-0043 decomposition) — agents bucket, orthogonal to execution.
awaken-model-catalog = { path = "crates/control/awaken-model-catalog" }
awaken-credential-vault = { path = "crates/control/awaken-credential-vault" }
awaken-config-resolver = { path = "crates/control/awaken-config-resolver" }
awaken-admin-config-api = { path = "crates/control/awaken-admin-config-api" }
# Foundation contract half (ADR-0043): RFC-9457 ApiError, pagination, and the
# allowlisted ListQuery/QuerySchema the admin config API serves its CRUD on.
awaken-api-contract = { git = "https://github.com/awakenworks/awaken-foundation", rev = "d98b40c90fdac65c329eb279bf5052818906a1de" }
# Embedded IAM for the management plane (ADR-0042/0043 P1): bearer ApiToken
# authn (argon2id at rest) + grant-based authz gating /v1/config/* and
# /v1/vaults/* in awaken-server, opt-in via AWAKEN_MGMT_IAM=embedded.
# All three crates pin ONE rev so the contract types line up. Deliberately NOT
# awaken-iam-server: its mandatory rusqlite 0.40 cannot coexist with
# awaken-scoped-migration's `sqlite` shell (rusqlite ^0.32, every published
# rev) because libsqlite3-sys `links = "sqlite3"` admits a single version per
# graph. The evaluator (`PolicySet`), token directory/minter, and role catalog
# all live in core/preset; server-local persists the tiny token+binding state
# itself over the workspace's rusqlite.
awaken-iam-contract = { git = "https://github.com/awakenworks/awaken-iam", rev = "380d28fb4b48e583ae956c815cc2aa4f35577b01" }
awaken-iam-core = { git = "https://github.com/awakenworks/awaken-iam", rev = "380d28fb4b48e583ae956c815cc2aa4f35577b01" }
awaken-iam-preset = { git = "https://github.com/awakenworks/awaken-iam", rev = "380d28fb4b48e583ae956c815cc2aa4f35577b01" }
awaken-managed-bridge = { path = "crates/server/awaken-managed-bridge" }
awaken-store-conformance = { path = "crates/stores/awaken-store-conformance" }
awaken-store-inmem = { path = "crates/runtime/awaken-store-inmem" }
awaken-store-fs = { path = "crates/stores/awaken-store-fs" }
awaken-store-schema = { path = "crates/stores/awaken-store-schema" }
awaken-store-sqlite = { path = "crates/stores/awaken-store-sqlite" }
awaken-store-postgres = { path = "crates/stores/awaken-store-postgres" }
awaken-config-store = { path = "crates/control/awaken-config-store" }
awaken-provisioning-contract = { path = "crates/contract/awaken-provisioning-contract" }
awaken-agent-channel = { path = "crates/contract/awaken-agent-channel" }
awaken-file-store = { path = "crates/resources/awaken-file-store" }
awaken-sandbox-local = { path = "crates/worker/awaken-sandbox-local" }
awaken-sandbox-container = { path = "crates/worker/awaken-sandbox-container" }
awaken-runtime-examples = { path = "crates/devtools/awaken-runtime-examples" }
awaken-dispatch-contract = { path = "crates/contract/awaken-dispatch-contract" }
awaken-dispatch = { path = "crates/server/awaken-dispatch" }
awaken-server = { path = "crates/server/awaken-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
genai = "0.6.0-beta.17"
axum = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"
