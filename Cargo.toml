# migrated <data_dir>/iam.sqlite, seeded roles, and one-time browser setup.
awaken-iam-host = { git = "https://github.com/awakenworks/awaken-iam.git", rev = "a903f98252908763f0bfad652fbd3935c5e926ba", version = "=0.2.0-dev" }
