[workspace]
resolver = "2"
# SDK crates are grouped by SDK role; Platform crates by bounded context.
# Semantic ownership and dependency direction remain declared in each crate's
# [package.metadata.awaken] and enforced by check_crate_boundaries.py.
members = [
    "crates/sdk/*/*",
    "crates/platform/*/*",
    "crates/apps/*",
    "crates/devtools/*",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"

# The last SDK release: its public-api snapshots and crate versions are the
# SemVer reference for every published SDK crate (docs/design/sdk-versioning.md,
# scripts/ci/check_sdk_semver.py). Move it to the release commit when the SDK
# is published.
[workspace.metadata.awaken]
sdk_semver_baseline = "50b3f3e22dbfe1d91dd6ee6fef8ee8dfc8e15940"

