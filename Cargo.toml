[workspace]
resolver = "2"
# Physical buckets keep the workspace navigable. Semantic ownership and
# dependency direction come only from each crate's [package.metadata.awaken]
# context/layer/authority declaration:
#   crates/contract/*   → foundation authorities commonly shared by several roles.
#                         Contract semantics are declared in package metadata, not inferred
#                         from this directory or from the number of consuming planes.
#   crates/runtime/*    → the kernel: agent loop + ext plugins + telemetry + the in-memory default backend; contract only.
#   crates/stores/*     → DURABLE backend for ANY port (fs/sqlite/postgres commit stores +
#                         domain-specific work-queue/session/env registries); a replaceable
#                         port impl under its conformance suite (ADR-0059 criterion 3).
#   crates/resources/*  → mountable agent-resource backends (memory/skill/file).
#   crates/shared/*     → provider-neutral infrastructure used across bounded contexts.
#   crates/server/*     → Coordinator application/host plus protocol and ingress adapters; package names declare owners.
#   crates/worker/*     → stateless execution components: container/k8s sandbox + channel/relay (links no stores).
#   crates/control/*    → self-hosted config/vault/iam authoring plane (ADR-0043).
#   crates/bin/*        → composed deployables: awaken-cli + the db-less worker daemon + the in-container sandbox bridge.
#   crates/devtools/*   → dev tooling / harnesses / examples (publish=false), composed like bin/.
#                         Boundaries + the neutral-core invariant (ADR-0059) are enforced by
#                         scripts/ci/check_crate_boundaries.py; deny.toml does not duplicate them.
members = [
    "crates/contract/*",
    "crates/runtime/*",
    "crates/stores/*",
    "crates/resources/*",
    "crates/shared/*",
    "crates/server/*",
    "crates/worker/*",
    "crates/control/*",
    "crates/bin/*",
    # Dev tooling / harnesses / teaching examples (publish=false): scenario e2e host,
    # runtime examples, eval. Composed like bin/ (may depend on any plane), kept out of
    # bin/ so the deployables bucket holds the shared CLI/Control/Coordinator
    # source composition plus the independent Worker daemon.
    "crates/devtools/*",
]

