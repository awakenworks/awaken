serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
kube = { version = "4.2.0", default-features = false }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
jsonschema = { version = "0.33", default-features = false }
toml = "0.8"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
yamux = "0.14"
url = "2.5"
# One version/feature choice for Skill ingestion and its test-only ZIP writers.
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
genai = "=0.7.0-rc.8"
axum = "0.8"
# Property-based (lightweight formal) verification: dev-only. Encodes universally-
# quantified invariants (tenant-isolation fence, lease-reclaim monotonicity, archive/
# delete semantics) and checks them over generated inputs (ADR-0059 verification pass).
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
# A crate's surface is what it re-exports. A crate that still has unreachable
# `pub` items carries `#![expect(unreachable_pub)]` in its root, which fails
# once the crate is clean (docs/design/guard-consolidation.md R8).
unreachable_pub = "warn"

# Rules the compiler holds instead of Python guards (plan v5 S1). The
# production pass of scripts/ci/check-rust.sh (`--lib --bins`) denies them; the
# all-targets pass allows the disallowed_* lints and unreachable_pub, so tests
# may use std locks, clocks and the environment. `clippy.toml` lists the paths.
[workspace.lints.clippy]
wildcard_imports = "warn"
disallowed_methods = "warn"
disallowed_types = "warn"

# Ordinary builds retain source locations for failures without generating
# type/variable debug records for every independently linked test executable.
# An interactive debugger can opt back in with CARGO_PROFILE_{DEV,TEST}_DEBUG=2.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
strip = "symbols"
