awaken-iam-client = { git = "https://github.com/awakenworks/awaken-iam.git", rev = "cbfe337b305721391641c35aaa51308b51eb5075", version = "=0.1.2-dev" }
# The assembly layer (ADR-0048): one IamGate (authn+authz PDP) + auth_layer PEP,
