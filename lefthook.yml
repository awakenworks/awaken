# Hooks print nothing when every check passes; a failing check prints its own
# output and name.
output:
  - failure

# Repository guardrails for the runtime design corpus and future Rust/frontend
# engineering workspace.
#
# These hooks keep the runtime docs, wiki facts, ownership index, invariant
# registry, repository shape, and future Rust/frontend checks executable. To
# activate them:
#
#   git init            # if not already a git repo
#   lefthook install    # wires the git hooks
#
# Before git is set up, run everything directly with:
#
#   scripts/ci/check-all.sh
#
# Each check is also safe to run standalone over a file list, e.g.
#   python3 scripts/ci/check_doc_links.py $(find docs -name '*.md' | sort)
#
# Trigger globs are NOT written here. A command that runs a scripts/ci checker
# declaring INPUT_GLOBS carries its `glob:` line between `>>> generated glob`
# markers, rendered by `python3 scripts/ci/generate_hooks.py` from that
# declaration; `--check` refuses a stale or hand-edited one. Everything else on
# this page -- command names, `run:` bodies, these comments, and the globs of
# commands that run shell or Node tools -- stays human-authored.

glob_matcher: doublestar

# Script jobs run independently of a guessed push-file list, including when an
# older worktree just regenerated the shared Git hook. The custom hook below
# owns qualification; its planners select the affected Rust/API work.
source_dir: scripts/ci

pre-commit:
  # Cargo, code generation and workspace formatting share the same resource
  # budget. Keep every check, but avoid concurrent compiler processes during
  # commits; low-memory Windows hosts otherwise fail before a useful diagnosis.
  parallel: false
  commands:
    # 1. Repository-wide hygiene that should never depend on project language.
    repository-hygiene:
      # >>> generated glob from check_repository_hygiene.py INPUT_GLOBS — do not edit
      # no glob: check_repository_hygiene.py reads every staged file, so this command
      # must keep the whole staged set as its trigger.
      # <<< generated glob
      run: python3 scripts/ci/check_repository_hygiene.py --staged

    # Every `glob:` below that sits between generated markers is rendered from
    # the INPUT_GLOBS the invoked checker declares. Editing one by hand is
    # refused by check_test_orchestration.py, because a trigger narrower than
    # the checker's real input set is a gate that never runs when it matters.
    hook-globs:
      # >>> generated glob from _input_closure.py, generate_hooks.py INPUT_GLOBS — do not edit
      glob: "{lefthook.yml,scripts/ci/*.py,scripts/ci/check-rust.sh}"
      # <<< generated glob
      run: python3 scripts/ci/generate_hooks.py --check && python3 scripts/ci/_input_closure.py --self-test

    hook-bootstrap:
      # >>> generated glob from _lefthook_fitness.py INPUT_GLOBS — do not edit
      glob: "{lefthook.yml,scripts/ci/_lefthook_fitness.py,scripts/ci/_native_shell.py,scripts/ci/_native_shell_tests.py,scripts/ci/_windows_job.py,scripts/ci/deadline.py,scripts/ci/pre-push/qualify.sh}"
      # <<< generated glob
      run: python3 scripts/ci/_lefthook_fitness.py --self-test && python3 scripts/ci/_lefthook_fitness.py --integration-test

    # An evidence link replaces its former standalone source classification.
    # Metadata/checker changes must pass the same strict validators as CI:
    # duplicate ownership or missing coverage rejects the commit; no solver is
    # started here. The ledger also asserts that every path an obligation cites
    # still exists, and an obligation may cite any repository path, so this
    # command has no trigger set to narrow and runs on every commit.
    formal-ledger:
      # >>> generated glob from check_formal_coverage.py, formal_ledger.py, formal_plan.py INPUT_GLOBS — do not edit
      # no glob: check_formal_coverage.py, formal_ledger.py, formal_plan.py reads every staged file, so this command
      # must keep the whole staged set as its trigger.
      # <<< generated glob
      run: python3 scripts/ci/formal_ledger.py --self-test && python3 scripts/ci/formal_plan.py --self-test && python3 scripts/ci/check_formal_coverage.py --require-evidence-complete

    # The ledger above proves each obligation carries evidence; this one proves
    # the product still consumes it. An obligation whose prefix no requirement
    # owns reddens every later commit by everyone, so it must fail the commit
    # that introduces it. It reads three JSON files and the paths they cite:
    # 0.05s, no solver, no toolchain.
    formal-product-ledger:
      # >>> generated glob from check_feature_coverage.py INPUT_GLOBS — do not edit
      # no glob: check_feature_coverage.py reads every staged file, so this command
      # must keep the whole staged set as its trigger.
      # <<< generated glob
      run: python3 scripts/ci/check_feature_coverage.py --require-complete

    # Source-surface classification is incremental here: only staged production
    # Rust is lexed, so the trigger can honestly include every crates/**/*.rs
    # file the checker reads. The global coverage ratio still needs the whole
    # walk, which stays on check-rust.sh --push and the formal release group.
    # The existing formal-surface L4 test owns that decision table.
    formal-evidence:
      # >>> generated glob from check_formal_surface.py INPUT_GLOBS — do not edit
      glob: "{crates/**/*.rs,crates/**/Cargo.toml,formal/*.json,formal/coverage.toml,formal/obligations/**/*,scripts/ci/_crate_boundary_workspace.py,scripts/ci/_crate_dependency_fitness.py,scripts/ci/check_file_limits.py,scripts/ci/check_formal_surface.py,scripts/ci/check_repository_hygiene.py,scripts/ci/check_secrets.py,scripts/ci/formal_anchors.py,scripts/ci/formal_ledger.py,scripts/ci/formal_sources.py,web/src/**/*}"
      # <<< generated glob
      run: python3 scripts/ci/check_formal_surface.py --staged {staged_files}

    # A Kani harness that takes a free symbol where production computes the
    # fact, restates its callee's body, or hides a #[cfg(kani)] fork inside a
    # production entrypoint, is green and proves nothing. The justified
    # registry and the `/// @proof-input-debt` tags on harnesses ratchet the
    # ones that already exist; a staged debt HEAD does not carry is refused.
    proof-input-derivation:
      # >>> generated glob from check_proof_input_derivation.py INPUT_GLOBS — do not edit
      glob: "{crates/**/*.rs,crates/**/Cargo.toml,formal/coverage.toml,formal/obligations/**/*,formal/proof-input-exceptions.json,scripts/ci/_crate_boundary_workspace.py,scripts/ci/_crate_dependency_fitness.py,scripts/ci/check_file_limits.py,scripts/ci/check_proof_input_derivation.py,scripts/ci/check_repository_hygiene.py,scripts/ci/check_secrets.py,scripts/ci/formal_anchors.py,scripts/ci/formal_ledger.py,scripts/ci/formal_sources.py,web/src/**/*}"
      # <<< generated glob
      run: python3 scripts/ci/check_proof_input_derivation.py --staged {staged_files}

    # 2. High-signal credential scanner. Generic secret assignments only fail
    #    in source/config files, so design examples can stay readable.
    secrets:
      # >>> generated glob from check_secrets.py INPUT_GLOBS — do not edit
      # no glob: check_secrets.py reads every staged file, so this command
      # must keep the whole staged set as its trigger.
      # <<< generated glob
      run: python3 scripts/ci/check_secrets.py --staged

    # 3. Report file-length diagnostics for source, tests, config and design.
    #    Size findings warn; source selection and input failures remain checked.
    file-limits:
      # >>> generated glob from check_file_limits.py INPUT_GLOBS — do not edit
      # no glob: check_file_limits.py reads every staged file, so this command
      # must keep the whole staged set as its trigger.
      # <<< generated glob
      run: python3 scripts/ci/check_file_limits.py --staged

    # 3b. A test must settle on a value the product committed, never on a
    #     lifecycle signal, a fixture counter, or elapsed time. Two regressions
    #     in main came from that one shape; the ratchet freezes today's debt.
    test-waits:
      # >>> generated glob from check_test_waits.py INPUT_GLOBS — do not edit
      glob: "{crates/**/src/**/*.rs,crates/**/tests/**/*.rs,e2e/**/*.js,e2e/**/*.mjs,e2e/**/*.rs,e2e/**/*.sh,e2e/**/*.ts,lefthook.yml,scripts/ci/*.py,scripts/ci/test_waits_baseline.json,web/e2e/**/*.mjs,web/e2e/**/*.ts}"
      # <<< generated glob
      run: python3 scripts/ci/check_test_waits.py

    # 3b. An SDK public-API change ships only with the crate version bump it
    #     needs against the last SDK release, and a changelog entry for it
    #     (docs/design/sdk-versioning.md). Pure Python over the committed
    #     snapshots; check_public_api.sh proves the snapshots are current.
    sdk-semver:
      # >>> generated glob from check_sdk_semver.py INPUT_GLOBS — do not edit
      glob: "{Cargo.toml,crates/**/CHANGELOG.md,crates/**/Cargo.toml,public-api/*.txt,scripts/ci/_crate_boundary_workspace.py,scripts/ci/_crate_dependency_fitness.py,scripts/ci/check_sdk_semver.py}"
      # <<< generated glob
      run: python3 scripts/ci/check_sdk_semver.py

    # 3b. Dependency direction and ownership rules. It also runs inside the
    #     rust gate; as its own hook it still runs on commits that skip that gate.
    #     It reads no documentation, so a docs-only commit skips it; every run
    #     fails if it reads a path its declared inputs do not cover.
    crate-boundaries:
      # >>> generated glob from check_crate_boundaries.py INPUT_GLOBS — do not edit
      glob: "{.cargo/**,Cargo.lock,Cargo.toml,contracts/anthropic-managed/upstream-oracle.generated.json,crates/**,deploy/**,e2e/**,rust-toolchain.toml,scripts/**,web/src/**}"
      # <<< generated glob
      run: python3 scripts/ci/check_crate_boundaries.py

    # 3b. No Rust test disappears silently. Moving a test between crates or
    #     rewriting its fixtures keeps it (identity is the function name); a
    #     rename or deletion is recorded in the ledger in the same commit.
    test-inventory:
      # >>> generated glob from check_test_inventory.py INPUT_GLOBS — do not edit
      glob: "{crates/**/*.rs,crates/**/Cargo.toml,scripts/ci/*.py,scripts/ci/test_inventory.txt,scripts/ci/test_inventory_ledger.json}"
      # <<< generated glob
      run: python3 scripts/ci/check_test_inventory.py

    # 3b'. A trait default that degrades silently, and a verification gate
    #      that passes because its dependency was absent, are refused at commit
    #      as well as in the full gate.
    degrading-defaults:
      # >>> generated glob from check_degrading_defaults.py INPUT_GLOBS — do not edit
      glob: "{crates/**/*.rs,crates/**/Cargo.toml,scripts/ci/_architecture_ratchet.py,scripts/ci/_contract_map_fitness.py,scripts/ci/_crate_boundary_workspace.py,scripts/ci/_crate_dependency_fitness.py,scripts/ci/_naming_fitness.py,scripts/ci/_single_owner_fitness.py,scripts/ci/check_degrading_defaults.py,scripts/ci/check_fabricated_facts.py}"
      # <<< generated glob
      run: python3 scripts/ci/check_degrading_defaults.py --self-test && python3 scripts/ci/check_degrading_defaults.py

    dependency-gates:
      # >>> generated glob from check_dependency_gates.py INPUT_GLOBS — do not edit
      glob: "{crates/**,e2e/**,scripts/**}"
      # <<< generated glob
      run: python3 scripts/ci/check_dependency_gates.py --self-test && python3 scripts/ci/check_dependency_gates.py

    # The Session acceptance ledger's gate tests drive the real workspace
    # guards, impact planner and ledger validator with injected
    # counter-examples; a change to what they read re-proves the refusals.
    session-acceptance-gates:
      # >>> generated glob from test_session_acceptance.py INPUT_GLOBS — do not edit
      glob: "{.cargo/**,.gitattributes,Cargo.lock,Cargo.toml,crates/**/*.rs,crates/**/Cargo.toml,docs/design/session-execution-test-acceptance/**,e2e/**,examples/**,packages/managed-sdk-oracle/package.json,rust-toolchain.toml,scripts/ci/*.json,scripts/ci/*.py,scripts/ci/*.sh}"
      # <<< generated glob
      run: python3 scripts/ci/test_session_acceptance.py

    formal-native-fixtures:
      # >>> generated glob from test_formal_gate_mutations.py INPUT_GLOBS — do not edit
      glob: "scripts/ci/*.py"
      # <<< generated glob
      run: python3 scripts/ci/test_formal_gate_mutations.py

    # Run the live graph as well as the checker fixtures; fixtures alone
    # cannot reject a newly introduced wait in a production test suite.
    test-orchestration:
      # >>> generated glob from check_test_orchestration.py INPUT_GLOBS — do not edit
      glob: "{.config/**,.github/workflows/*.yml,crates/**,e2e/**,lefthook.yml,pnpm-lock.yaml,scripts/ci/**,scripts/e2e/*.sh}"
      # <<< generated glob
      run: python3 scripts/ci/check_test_orchestration.py --self-test && python3 scripts/ci/check_test_orchestration.py

    affected-rust-plan:
      # >>> generated glob from rust_test_plan.py INPUT_GLOBS — do not edit
      glob: "{.cargo/**,.config/**,Cargo.lock,Cargo.toml,apps/**,crates/**,fuzz/**,lefthook.yml,rust-toolchain.toml,scripts/ci/**,tests/**,xtask/**}"
      # <<< generated glob
      run: python3 scripts/ci/rust_test_plan.py --self-test

    # Fixture-based execution regressions follow their own script/tool inputs.
    # Ordinary Rust edits still run the impact planner and every live gate.
    rust-execution-framework:
      # >>> generated glob from benchmark_rust_build.py, check_rust_test_execution.py INPUT_GLOBS — do not edit
      glob: "{.cargo/**,.config/**,Cargo.lock,Cargo.toml,lefthook.yml,rust-toolchain.toml,scripts/ci/**,scripts/e2e/sandbox_capability_suite.sh}"
      # <<< generated glob
      run: python3 scripts/ci/benchmark_rust_build.py --self-test && python3 scripts/ci/check_rust_test_execution.py --self-test

    # 3b. A failed read of durable state may never become an absence. The
    #     recovery path is derived -- every production module that names a
    #     checkpoint or the tri-state -- so a file joins the rule by doing the
    #     thing the rule is about, and the trigger follows the same declaration.
    observation-collapse:
      # >>> generated glob from check_observation_collapse.py INPUT_GLOBS — do not edit
      glob: "{crates/**/Cargo.toml,crates/**/src/**/*.rs,scripts/ci/_crate_boundary_workspace.py,scripts/ci/_crate_dependency_fitness.py,scripts/ci/check_observation_collapse.py}"
      # <<< generated glob
      run: python3 scripts/ci/check_observation_collapse.py

    # 3b. The principle table (plan v5 S3) is printed by
    #     `python3 scripts/ci/principle_status.py`; it is informational and
    #     never fails on a count. Only its own decision table runs here.
    principle-status:
      # >>> generated glob from principle_status.py INPUT_GLOBS — do not edit
      glob: "{crates/**/*.rs,crates/**/Cargo.toml,scripts/ci/*.py,scripts/ci/*_baseline.json}"
      # <<< generated glob
      run: python3 scripts/ci/principle_status.py --self-test

    # 3c. A guard's scope must be derived from its subject, never written out a
    #     second time by hand. The checkers are themselves the corpus here: a new
    #     literal list of paths among them is refused, and today's are registered
    #     with the reason each cannot be derived.
    scan-scope:
      # >>> generated glob from check_scan_scope.py INPUT_GLOBS — do not edit
      glob: "{scripts/ci/*.py,scripts/ci/*.sh,scripts/ci/scan_scope_registry.json}"
      # <<< generated glob
      run: python3 scripts/ci/check_scan_scope.py

    # The existing release source validator inventories every tracked writer.
    # Its declaration and pre-commit trigger cover that same repository corpus.
    sandbox-release-source:
      # >>> generated glob from check_sandbox_image_release.py INPUT_GLOBS — do not edit
      # no glob: check_sandbox_image_release.py reads every staged file, so this command
      # must keep the whole staged set as its trigger.
      # <<< generated glob
      run: python3 scripts/ci/check_sandbox_image_release.py

    # 3b. The one declaration of every external tool a gate needs. Its self-test
    #    proves each row can still be located by the method it states, so a row
    #    that stopped describing reality fails here rather than inside a proof.
    gate-tools:
      # >>> generated glob from gate_tools.py INPUT_GLOBS — do not edit
      glob: "{e2e/package.json,package.json,pnpm-workspace.yaml,scripts/ci/*.sh,scripts/ci/_native_shell.py,scripts/ci/_native_shell_tests.py,scripts/ci/_native_test_launcher.py,scripts/ci/_windows_job.py,scripts/ci/check_node_dependencies.py,scripts/ci/gate_tools.json,scripts/ci/gate_tools.py,web/package.json}"
      # <<< generated glob
      run: python3 scripts/ci/gate_tools.py --self-test

    # 3c. Build output is derived and grows without bound; a checkout is not and
    #    must never be touched. This proves that distinction still holds before
    #    anyone runs the reclaimer with --apply.
    reclaim-build-space:
      # >>> generated glob from reclaim_build_space.py INPUT_GLOBS — do not edit
      glob: "{scripts/ci/_native_shell.py,scripts/ci/_native_shell_tests.py,scripts/ci/_native_test_launcher.py,scripts/ci/_windows_job.py,scripts/ci/check_node_dependencies.py,scripts/ci/gate_tools.json,scripts/ci/gate_tools.py,scripts/ci/reclaim_build_space.py}"
      # <<< generated glob
      run: python3 scripts/ci/reclaim_build_space.py --self-test

    ci-performance-policy:
      # >>> generated glob from ci_performance.py INPUT_GLOBS — do not edit
      glob: "{.github/workflows/quality.yml,scripts/ci/_build_observation_fixture.py,scripts/ci/_crate_boundary_workspace.py,scripts/ci/_crate_dependency_fitness.py,scripts/ci/_native_shell.py,scripts/ci/_native_shell_tests.py,scripts/ci/_native_test_launcher.py,scripts/ci/_windows_job.py,scripts/ci/check_file_limits.py,scripts/ci/check_repository_hygiene.py,scripts/ci/check_secrets.py,scripts/ci/ci_performance.py,scripts/ci/crate_test.py,scripts/ci/formal_anchors.py,scripts/ci/formal_kani_options.py,scripts/ci/formal_plan.py,scripts/ci/formal_run_evidence.py,scripts/ci/formal_sources.py,scripts/ci/generate_hooks.py,scripts/ci/rust_test_plan.py}"
      # <<< generated glob
      run: python3 scripts/ci/ci_performance.py workflow

    # 3c-bis. A gate entry point that accepts an argument it does not implement
    #    runs something other than what the caller asked for and still exits
    #    zero. check-all.sh invoked `--selftest` for years against a script whose
    #    flag was `--self-test`, so that self-test never once ran. The rule is
    #    over the whole set of entry points, so a new checker inherits it.
    gate-arguments:
      # >>> generated glob from check_gate_arguments.py, guards.py INPUT_GLOBS — do not edit
      glob: "{CONTRIBUTING.md,deploy/images/sandbox/build.sh,deploy/k3d/test_image_contract.py,e2e/*.py,e2e/*.sh,e2e/k3d/*.py,e2e/k3d/*.sh,e2e/k6/*.sh,lefthook.yml,scripts/ci/*.py,scripts/ci/*.sh,scripts/contract/*.py,scripts/contract/*.sh,scripts/e2e/*.sh,scripts/release/*.py,scripts/release/*.sh}"
      # <<< generated glob
      run: python3 scripts/ci/check_gate_arguments.py && python3 scripts/ci/guards.py --self-test

    # 3a'. A shell or YAML gate that hands a crate file path to a tool must name
    #    a file that exists. A refactor moved a UTC codec and the reliability
    #    lane kept mutating the old path; nothing ran until hours later.
    gate-path-references:
      # >>> generated glob from check_gate_path_references.py INPUT_GLOBS — do not edit
      glob: "{.github/**/*.yml,crates/**,deploy/**/*.sh,deploy/**/*.yaml,deploy/**/*.yml,e2e/**/*.sh,lefthook.yml,scripts/**/*.sh,scripts/ci/_crate_boundary_workspace.py,scripts/ci/_crate_dependency_fitness.py,scripts/ci/check_file_limits.py,scripts/ci/check_gate_path_references.py,scripts/ci/check_repository_hygiene.py,scripts/ci/check_secrets.py,scripts/ci/formal_sources.py}"
      # <<< generated glob
      run: python3 scripts/ci/check_gate_path_references.py --self-test && python3 scripts/ci/check_gate_path_references.py

    # 3c-ter. An executable no lane runs still reads as coverage, still gets
    #    cited as evidence, and rots in place. Three k3d runners sat unrun for
    #    months and one of them is named in the formal/obligations ledger as the proof of
    #    a requirement. Every executable is selected or registered with a reason.
    lane-reachability:
      # >>> generated glob from check_lane_reachability.py INPUT_GLOBS — do not edit
      glob: "{.github/workflows/*.yml,contracts/**,crates/**/*.rs,crates/**/Cargo.toml,deploy/**/*,e2e/**/*,formal/coverage.toml,formal/obligations/**/*,lefthook.yml,package.json,packages/**,scripts/**/*,web/scripts/**,web/src/**/*}"
      # <<< generated glob
      run: python3 scripts/ci/check_lane_reachability.py

    # 3d. The record of the last green full gate is evidence, so a commit may not
    #    leave it naming a commit that is gone, off main, or blessed by a partial
    #    run. Staleness is a schedule and is reported by check-all, not here.
    gate-freshness:
      # >>> generated glob from check_gate_freshness.py INPUT_GLOBS — do not edit
      glob: "{scripts/ci/_native_shell.py,scripts/ci/_native_shell_tests.py,scripts/ci/_native_test_launcher.py,scripts/ci/_windows_job.py,scripts/ci/check-all.sh,scripts/ci/check_gate_freshness.py,scripts/ci/check_node_dependencies.py,scripts/ci/gate_record.json,scripts/ci/gate_tools.json,scripts/ci/gate_tools.py}"
      # <<< generated glob
      run: python3 scripts/ci/check_gate_freshness.py --self-test

    # 4. Rust checks are active as soon as a Cargo workspace exists.
    rustfmt:
      glob: "**/*.rs"
      run: rustfmt {staged_files}
      stage_fixed: true

    # One Rust gate owns source and boundary checks. Trigger it for checker
    # edits too; separate hook invocations would execute the same scan twice.
    rust-quick:
      # >>> generated glob from check_sdk_consumer.py, check_trust_roots.py, ci_performance.py, rust_test_plan.py INPUT_GLOBS — do not edit
      glob: "{.cargo/**,.config/**,.github/workflows/quality.yml,Cargo.lock,Cargo.toml,apps/**,crates/**,deny.toml,examples/sdk-consumer/**,fuzz/**,lefthook.yml,rust-toolchain.toml,scripts/ci/**,tests/**,xtask/**}"
      # <<< generated glob
      run: python3 scripts/ci/_native_shell.py scripts/ci/check-rust.sh --quick

    # An observation time is a fact its owner observed, not a value the code
    # chose. No date literal may reach a `*_at`-shaped field outside tests, and
    # the wall clock may be read only where a clock port is declared or the
    # program is composed. Both are ratcheted per file, and each allowance
    # carries the owner and expiry that stop it becoming permanent.
    fabricated-facts:
      # >>> generated glob from check_fabricated_facts.py INPUT_GLOBS — do not edit
      glob: "{crates/**/*.rs,crates/**/Cargo.toml,scripts/ci/_crate_boundary_workspace.py,scripts/ci/_crate_dependency_fitness.py,scripts/ci/check_degrading_defaults.py,scripts/ci/check_fabricated_facts.py,scripts/ci/fabricated_facts_baseline.json}"
      # <<< generated glob
      run: python3 scripts/ci/check_fabricated_facts.py --self-test && python3 scripts/ci/check_fabricated_facts.py

    # Contract structure stays constrained: no cycle, deeper dependency chain,
    # new backend-noun types, catch-all String errors or capability-style Err
    # defaults (ADR-0081). Module line measurements are diagnostic (ADR-0091 D8).
    contract-shape:
      # >>> generated glob from check_contract_shape.py INPUT_GLOBS — do not edit
      glob: "{Cargo.toml,crates/**/*.rs,crates/**/Cargo.toml,scripts/ci/_architecture_ratchet.py,scripts/ci/_contract_map_fitness.py,scripts/ci/_crate_boundary_workspace.py,scripts/ci/_crate_dependency_fitness.py,scripts/ci/_naming_fitness.py,scripts/ci/_single_owner_fitness.py,scripts/ci/check_contract_shape.py,scripts/ci/contract_shape_baseline.json}"
      # <<< generated glob
      # A fall is recorded here, by the tool, and staged with the commit that
      # achieved it; only growth needs a person (--write-baseline --reason).
      run: python3 scripts/ci/check_contract_shape.py --self-test && python3 scripts/ci/check_contract_shape.py --tighten --stage

    # Protocol/credential codec changes must exercise the existing cross-language
    # drift test even when no E2E file changed. Its decision table owns the
    # version-match/mismatch oracle; the full runner remains in check-all static.
    worker-fixture-contract:
      glob: "{lefthook.yml,crates/contract/awaken-worker-contract/src/manifest.rs,crates/contract/awaken-credential-contract/src/realization_capabilities.rs,e2e/fixtures/worker_manifest_fixture.mjs,e2e/worker_manifest_fixture.test.mjs}"
      run: node --test e2e/worker_manifest_fixture.test.mjs

    # 5. Frontend checks are active as soon as package.json exists. The frontend
    #    project must expose lint/typecheck/build scripts.
    frontend-quick:
      glob: "{package.json,pnpm-lock.yaml,package-lock.json,yarn.lock,bun.lockb,apps/**/*.{ts,tsx,js,jsx,mjs,cjs,json,css,html,md,mdx,yml,yaml},packages/**/*.{ts,tsx,js,jsx,mjs,cjs,json,css,html,md,mdx,yml,yaml},web/**/*.{ts,tsx,js,jsx,mjs,cjs,json,css,html,md,mdx,yml,yaml},scripts/ci/_native_shell.py,scripts/ci/_native_shell_tests.py,scripts/ci/_windows_job.py}"
      run: python3 scripts/ci/_native_shell.py scripts/ci/check-frontend.sh --quick

    # The oracle's check reads the E2E manifest and the workspace lockfile as
    # well as its own package: the trigger names every input so a version bump
    # in one place cannot pass by never running the check.
    managed-sdk-oracle:
      glob: "{packages/managed-sdk-oracle/**/*,contracts/anthropic-managed/*,crates/server/awaken-protocol-managed/contracts/*,e2e/package.json,pnpm-lock.yaml}"
      run: pnpm --filter @awaken/managed-sdk-oracle test && pnpm --filter @awaken/managed-sdk-oracle check

    # Every Managed wire type names its SDK counterpart (or says why it has
    # none). Reads the generated oracle's declared-type vocabulary, so it runs
    # when the types, the baseline, or the oracle change.
    managed-wire-naming:
      # >>> generated glob from check_managed_wire_naming.py INPUT_GLOBS — do not edit
      glob: "{contracts/anthropic-managed/upstream-oracle.generated.json,crates/server/awaken-protocol-managed/src/types/**/*.rs,scripts/ci/check_managed_wire_naming.py}"
      # <<< generated glob
      run: python3 scripts/ci/check_managed_wire_naming.py --self-test && python3 scripts/ci/check_managed_wire_naming.py

    # A declared budget checker must use its existing decision-table self-test;
    # leaving it unwired makes the generated hook ownership check fail.
    formal-budget:
      # >>> generated glob from formal_budget.py INPUT_GLOBS — do not edit
      glob: "scripts/ci/formal_budget.py"
      # <<< generated glob
      run: python3 scripts/ci/formal_budget.py --self-test

    # The declared deadline subjects select their existing process tests here;
    # full CI uses the same owner through check-all.sh's static lane.
    command-deadline:
      # >>> generated glob from test_deadline.py INPUT_GLOBS — do not edit
      glob: "{scripts/ci/_deadline.sh,scripts/ci/_native_shell.py,scripts/ci/_native_shell_tests.py,scripts/ci/_strict_unittest.py,scripts/ci/_windows_job.py,scripts/ci/deadline.py,scripts/ci/test_deadline.py}"
