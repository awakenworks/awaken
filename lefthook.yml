# GENERATED from scripts/ci/hooks.yml by python3 scripts/ci/generate_hooks.py -- do not edit.
# Edit scripts/ci/hooks.yml, then regenerate. A rebase conflict in this file is
# resolved by regenerating it from the merged source, never by hand-merging.

# Selected hook workers print concise live progress; full output stays in run logs.
output:
  - failure
  - execution_out
  - summary

# Repository guardrails for the runtime design corpus and future Rust/frontend
# engineering workspace.
#
# These hooks keep the runtime docs, wiki facts, ownership index, invariant
# registry, repository shape, and future Rust/frontend checks executable. To
# activate them:
#
#   git init            # if not already a git repo
#   lefthook install    # wires the git hooks
#
# Before git is set up, run everything directly with:
#
#   scripts/ci/check-all.sh
#
# Each check is also safe to run standalone over a file list, e.g.
#   python3 scripts/ci/check_doc_links.py $(find docs -name '*.md' | sort)
#
# Authored in scripts/ci/hooks.yml; lefthook.yml is rendered from it in full by
# `python3 scripts/ci/generate_hooks.py`, and `--check` refuses any difference.
# The renderer adds the `glob:` line of every command that runs a scripts/ci
# checker declaring INPUT_GLOBS (between `>>> generated glob` markers) and the
# observation wrapper around each run body, folding an authored `timeout:` into
# it. Names, run bodies, tags, groups, serial barriers and the globs of commands
# that run no declaring checker are authored; a glob naming a path that is gone
# is refused at generation.

glob_matcher: doublestar

# Script jobs run independently of a guessed push-file list, including when an
# older worktree just regenerated the shared Git hook. The custom hook below
# owns qualification; its planners select the affected Rust/API work.
source_dir: scripts/ci

# Every generated hook sources this before calling lefthook. It routes the call
# through scripts/ci/lefthook_serial.py, so partially staged pre-commits in two
# worktrees take turns instead of swapping unstaged hunks through the stash and
# info/ patch that lefthook's backup keeps in the shared git dir.
rc: scripts/ci/pre-commit/lefthook-rc.sh

pre-commit:
  follow: true
  scripts:
    observe.sh:
      runner: python3 scripts/ci/_native_shell.py
      args: --observe

# Definition only: observe.sh projects these same jobs to native pre-commit.
# That preserves native glob filtering, stage_fixed and normal local settings.
